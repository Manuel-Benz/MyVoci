      const [mic, setMic] = useState('idle'); // Sprechen: idle | listening | nothing | denied
      const [heard, setHeard] = useState(''); // Sprechen: was verstanden wurde
      const timed = opts.timer > 0 && AUTO_MODES.includes(opts.mode);
      const latest = useRef({}); // aktueller Stand für den Wecker der Blitzrunde
      const [built, setBuilt] = useState([]); // Buchstabensalat: Indizes der gesetzten Kacheln
      const [log, setLog] = useState([]); // { item, ok, input, solution } nur erste Versuche
      const [sketchKey, setSketchKey] = useState(0); // Handschrift: Fläche leeren
      const [padTool, setPadTool] = useState('write'); // Handschrift: Stift oder Radierer ('write' | 'erase')
      const clearPad = () => { setSketchKey((k) => k + 1); setPadTool('write'); setInkNote(''); };
      const myscript = useMemo(myscriptKeys, []); // Handschrift mit Kontrolle: Schlüssel für die Erkennung
      const [inkText, setInkText] = useState(''); // Handschrift: was gewertet wurde
      const [inkFail, setInkFail] = useState(false); // Handschrift: Fläche kam gar nicht → Papier
      const [noErase, setNoErase] = useState(false); // iink ohne die erwarteten Interna → kein Radierer
      const [inkNote, setInkNote] = useState(''); // Handschrift: Meldung zu diesem einen Versuch
      const [inkBusy, setInkBusy] = useState(false); // Handschrift: Erkennung unterwegs (fürs Auge)
      const inkAsking = useRef(false); // dasselbe fürs Sperren — ein Zustand käme zu spät
      const padRef = useRef(null);
      const scored = useRef(-1); // welche Stelle der Warteschlange schon verbucht ist
      const leaves = useRef(0); // Prüfung: wie oft Vollbild/App verlassen
      const watched = useRef(false); // war das Vollbild je aktiv? Sonst überwacht niemand
      const [startedAt] = useState(Date.now);
      const exam = !!opts.exam && AUTO_MODES.includes(opts.mode);
      const [dialog, setDialog] = useState(null);
      const inputRef = useRef(null);

      const item = queue[pos];
      const total = words.length;
      const mode = opts.mode;
      const answerLang = item && langOf(set, item, 'answer');
      const promptLang = item && langOf(set, item, 'prompt');

      // Was diese Aufgabe zeigt und verlangt — pro Modus verschieden
      const task = useMemo(() => {
        if (!item) return null;
        const solution = solutionOf(item);
        if (mode === 'gap') { const gap = gapFor(item.word); return { ...gap, solution: gap.form, prompt: item.word.a }; }
        // Hören bei Wortformen: die Frage (Grundform · Person · Zeit) steht da —
        // sonst liessen sich gleich klingende Formen (mange/manges/mangent)
        // nicht auseinanderhalten
        if (mode === 'listen') return { solution: firstAlt(solution), spoken: firstAlt(solution), prompt: promptOf(item) };
        if (mode === 'choice') return { solution, prompt: promptOf(item), options: shuffleArray([solution, ...distractors(set, item)]) };
        if (mode === 'scramble') return { solution: firstAlt(solution), prompt: promptOf(item), letters: scrambleLetters(firstAlt(solution)) };
        // Bestimmen: die Form zeigen, gesucht sind Zeile und Spalte. Jede Zelle
        // mit derselben Form ist eine richtige Lesart («rosae»: Gen. Sg.,
        // Dat. Sg., Nom. Pl.) — eine genügt, die Lösung nennt alle.
        if (mode === 'parse') {
          const { tab } = item.word, form = firstAlt(solution), want = formKey(solution);
          const readings = [];
          tab.t.forEach((row, i) => row.forEach((cell, j) => {
            if (cell && variants(cell).some((v) => formKey(v) === want)) readings.push([i, j]);
          }));
          const name = ([i, j]) => [tab.rows[i], tab.cols[j]].filter(Boolean).join(' · ');
          return { prompt: form, readings, name, solution: readings.map(name).join(' / ') };
        }
        // Liste ganz verlangt: gewertet beim Schreiben und bei der Handschrift
        // (ein Feld bzw. eine Zeile pro Punkt), bei Karteikarten nur als
        // Vermerk. Sonst genügt ein Punkt (Hören, Sprechen, Buchstabensalat)
        // oder man sieht die ganze Liste ohnehin (Multiple Choice, Zuordnen).
        // Gilt für die gesuchte Seite, egal in welcher Richtung.
        const all = item.word.all && isList(solution) && NEED_ALL_MODES.includes(mode);
        return { solution, prompt: promptOf(item), ...(all ? { need: listEntries(solution) } : {}) };
      }, [item]); // nicht an der Warteschlange: die wächst bei jedem Fehler, die Aufgabe bliebe sonst nicht stehen

      useEffect(() => { if (phase === 'ask' || phase === 'copy') inputRef.current && inputRef.current.focus(); }, [phase, pos]);
      useEffect(() => {
        if (!exam) return;
        // Der Klick auf «Üben starten» liegt nur Millisekunden zurück — das
        // reicht dem Browser als Geste fürs Vollbild.
        if (canFullscreen() && !fsElement()) toggleFullscreen();
        // Ein «nie verlassen» in Grün darf nur stehen, wenn das Vollbild
        // wirklich lief. Sonst hat schlicht niemand hingeschaut.
        const onFs = () => { if (fsElement()) watched.current = true; else if (watched.current) leaves.current++; };
        const onHide = () => { if (document.hidden) leaves.current++; };
        document.addEventListener('fullscreenchange', onFs);
        document.addEventListener('webkitfullscreenchange', onFs);
        document.addEventListener('visibilitychange', onHide);
        return () => {
          document.removeEventListener('fullscreenchange', onFs);
          document.removeEventListener('webkitfullscreenchange', onFs);
          document.removeEventListener('visibilitychange', onHide);
        };
      }, []);
      // Hören: das Wort kommt von selbst, sobald die Aufgabe da ist
      useEffect(() => { if (mode === 'listen' && item) setTimeout(() => speak(task.spoken, answerLang), 300); }, [pos]);

      // Ergebnis verbuchen. Gibt den neuen Stand zurück, weil Karteikarten
      // sofort weiterschalten — dort darf `next` nicht mit dem alten Zustand
      // rechnen (sonst fehlt das letzte Wort in der Bilanz und die
      // Wiederholung fällt weg).
      // `scored` lässt jede Stelle nur einmal zählen: die Handschrift wertet
      // über das Netz, da bleibt der Knopf während des Wartens anklickbar,
      // und fällt die Erkennung mitten in der Rückmeldung aus, stehen auf
      // einmal die Selbstbewertungs-Knöpfe unter einem gewerteten Wort. Beides
      // buchte den Lernstand sonst doppelt.
      const finish = (ok, typed = null, solution = task.solution) => {
        if (item.retry || scored.current === pos) return { nextLog: log, nextQueue: queue };
        scored.current = pos;
        onResult(item.word, ok);
        const nextLog = [...log, { item, ok, input: typed, solution }];
        // In der Prüfung gibt es keine zweite Chance
        const nextQueue = ok || exam ? queue : [...queue, { ...item, retry: true }];
        setLog(nextLog);
        setQueue(nextQueue);
        return { nextLog, nextQueue };
      };
      const settle = (r, typed) => {
        const { nextLog, nextQueue } = finish(r.status !== 'wrong', typed, r.solution);
        if (exam) { next(nextQueue, nextLog); return; } // keine Rückmeldung, gleich weiter
        setResult(r);
        // Abschreiben nur bei einem Feld — eine ganze Liste abzuschreiben ist Strafarbeit
        setPhase(r.status === 'wrong' && opts.copy && TYPED_MODES.includes(mode) && !task.need ? 'copy' : 'feedback');
      };
      // Die übrigen Lösungen dieser Runde: wer eine davon exakt tippt, hat
      // verwechselt, nicht sich vertippt (s. checkAnswer).
      const others = useMemo(() => (item ? words.map((w) => (item.dir === 'ab' ? w.b : w.a)).filter((s) => s !== task.solution) : []), [item]);
      // Bestimmen: fertig gewählt, wenn Zeile und (falls es sie gibt) Spalte stehen
      const parseReady = (p) => p.r != null && (!item.word.tab.cols.length || p.c != null);
      // Eine Stelle fürs Werten — Knopf, Handschrift, Bestimmen und Wecker.
      // `answer` ist Text (bei «alle Punkte» die Felder bzw. Schriftzeilen mit
      // \n getrennt), beim Bestimmen die Wahl { r, c }: jede Lesart zählt.
      const grade = (answer) => {
        if (mode === 'parse') {
          const hit = task.readings.some(([i, j]) => i === answer.r && (!item.word.tab.cols.length || j === answer.c));
          return { status: hit ? 'right' : 'wrong', solution: task.solution };
        }
        const o = { level: opts.level, lang: answerLang, others, forms: !!opts.forms };
        return task.need ? checkAll(answer.split('\n'), task.solution, o) : checkAnswer(answer, task.solution, o);
      };
      // Für Protokoll und Prüfungstabelle einzeilig
      const shown = (answer) => (mode === 'parse'
        ? (parseReady(answer) ? task.name([answer.r, answer.c]) : '')
        : answer.split('\n').map((x) => x.trim()).filter(Boolean).join(' / '));
      const check = () => {
        if (!input.trim()) return;
        settle(grade(input), shown(input));
      };
      // Liste ganz verlangt: Feld i ist Zeile i von `input`
      const fieldValue = (i) => input.split('\n')[i] || '';
      const setField = (i, v) => setInput((cur) => {
        const parts = cur.split('\n');
        while (parts.length <= i) parts.push('');
        parts[i] = v.replace(/\n/g, ' ');
        return parts.join('\n');
      });
      // Handschrift mit Erkennung: einmal erkennen lassen, dann wie getippt
      // werten. Die Sperre ist nötig, weil dazwischen das Netz liegt und der
      // Knopf so lange anklickbar bleibt. Schlägt die Erkennung fehl, wird das
      // gesagt statt heimlich die letzte Erkennung gewertet — aufdecken und
      // selbst bewerten geht daneben immer.
      const checkInk = async () => {
        // Gesperrt wird über die Ref, nicht über den Zustand: zwei Tipper
        // kurz nacheinander lesen sonst beide noch das alte `false` und
        // schicken zwei kostenpflichtige Anfragen los.
        if (inkAsking.current || phase !== 'ask' || !padRef.current) return;
        inkAsking.current = true;
        setInkBusy(true);
        setInkNote('');
        try {
          const out = await padRef.current.export(['text/plain']);
          const typed = ((out && out['text/plain']) || '').trim();
          if (!typed) { setInkNote(t('inkEmpty')); return; }
          setInkText(typed);
          // Liste ganz verlangt: jeder Punkt auf eine eigene Zeile
          settle(grade(typed), shown(typed));
        } catch { setInkNote(t('inkFail')); }
        finally { inkAsking.current = false; setInkBusy(false); }
      };
      const checkCopy = () => {
        if (checkAnswer(copyInput, result.solution, { level: 'strict' }).status === 'wrong') { setCopyMiss(true); return; }
        setPhase('feedback');
      };
      const checkParse = () => {
        if (phase !== 'ask' || !parseReady(parsed)) return;
        settle(grade(parsed), shown(parsed));
      };
      const pick = (option) => {
        if (phase !== 'ask') return;
        setPicked(option);
        settle({ status: option === task.solution ? 'right' : 'wrong', solution: task.solution }, option);
      };
      const addTile = (i) => {
        if (phase !== 'ask' || built.includes(i)) return;
        const next = [...built, i];
        setBuilt(next);
        if (next.length === task.letters.length) {
          const typed = next.map((j) => task.letters[j]).join('');
          settle(checkAnswer(typed, task.solution.replace(/\s+/g, ''), { level: 'strict' }), typed);
        }
      };
      const rate = (ok) => { const { nextLog, nextQueue } = finish(ok); next(nextQueue, nextLog); };
      const next = (q = queue, l = log) => {
        if (pos + 1 >= q.length) {
          if (exam && fsElement()) toggleFullscreen();
          onDone({ log: l, seconds: Math.round((Date.now() - startedAt) / 1000), exam, leaves: leaves.current, watched: watched.current });
          return;
        }
        setPos(pos + 1);
        setPhase('ask');
        setInput('');
        setCopyInput('');
        setCopyMiss(false);
        setResult(null);
        setPicked(null);
        setParsed({});
        setBuilt([]);
        setMic('idle');
        setHeard('');
        setInkText('');
        inkAsking.current = false;
        clearPad();
      };
      // Enter wird nur abgefangen, wo es wirklich etwas auslöst. Sonst nähme
      // das `preventDefault` jedem Knopf die Tastaturbedienung — und in der
      // Kartenphase ('back') schaltete es sogar weiter, ohne zu werten.
      // `e.repeat` hält gedrückt gehaltene Tasten davon ab, die Rückmeldung
      // gleich wieder wegzuklicken.
      // Hängt an der Karte, nicht an der Seite: Enter in den Einstellungen
      // (Schlüsselfelder) oder in der Rückfrage «Beenden?» käme sonst hierher,
      // prüfte die Antwort und nähme dem Knopf dort seine Taste.
      const onKey = (e) => {
        if (e.key !== 'Enter' || e.repeat) return;
        // Mehrere Felder: Enter springt ins nächste, erst im letzten wird geprüft
        const at = e.target.dataset && e.target.dataset.at;
        if (phase === 'ask' && task.need && at !== undefined && +at < task.need.length - 1) {
          e.preventDefault();
          const nextField = e.currentTarget.querySelector(`[data-at="${+at + 1}"]`);
          if (nextField) nextField.focus();
          return;
        }
        if (phase === 'ask' && TYPED_MODES.includes(mode)) { e.preventDefault(); check(); }
        else if (phase === 'ask' && mode === 'parse') {
          // Bestimmen: Enter auf einem noch nicht gewählten Knopf wählt ihn
          // (Tastatur); geprüft wird erst, wenn die Wahl vollständig ist
          const { axis, i } = e.target.dataset || {};
          if (axis !== undefined && parsed[axis] !== +i) return;
          if (!parseReady(parsed)) return;
          e.preventDefault();
          checkParse();
        }
        else if (phase === 'copy') { e.preventDefault(); checkCopy(); }
        else if (phase === 'feedback') { e.preventDefault(); next(); }
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });

      // Sprechen: einmal zuhören, beste Alternative zählt. Nichts verstanden
      // ist kein Fehler — nochmals versuchen.
      const listenUp = async () => {
        if (mic === 'listening' || phase !== 'ask') return;
        setMic('listening');
        try {
          const alts = await recognizeOnce(answerLang);
          // Wortformen auch hier ohne Tippfehler-Toleranz: «amat» für «amant» ist die falsche Person
          const scored = alts.map((a) => ({ a, r: checkAnswer(a, task.solution, { level: 'loose', lang: answerLang, forms: !!opts.forms }) }));
          const best = scored.find((x) => x.r.status !== 'wrong') || scored[0];
          setHeard(best.a);
          setMic('idle');
          settle(best.r, best.a);
        } catch (why) { setMic(why === 'denied' ? 'denied' : 'nothing'); }
      };

      // Blitzrunde: der Wecker liest den Stand aus der Ref — die Closure wäre
      // vom Moment des Stellens. Was schon dasteht, wird noch gewertet.
      latest.current = { input, built, grade, parsed };
      useEffect(() => {
        if (!timed || phase !== 'ask' || !item) return;
        const id = setTimeout(() => {
          const { input, built, grade, parsed } = latest.current;
          const answer = mode === 'scramble' ? built.map((j) => task.letters[j]).join('') : mode === 'parse' ? parsed : input;
          // Bei «alle Punkte» auch leer werten: dann stehen alle Punkte als
          // fehlend da, statt der ganzen Liste in einer Zeile
          const given = mode === 'parse' ? parseReady(answer) : TYPED_MODES.includes(mode) && (answer.trim() || task.need);
          const r = given ? grade(answer) : { status: 'wrong', solution: task.solution };
          settle(r.status === 'wrong' ? { ...r, note: 'timeUp' } : r, shown(answer));
        }, opts.timer * 1000);
        return () => clearTimeout(id);
      }, [pos, phase]);

      if (!item) return null;
      // Hinweise: H: steht immer da, HF:/HA: gehören zu einer Seite — bei der
      // gefragten sofort, bei der gesuchten erst mit der Lösung. Sonst
      // verraten Stammformen oder Genitiv das gesuchte Wort.
      const showHints = opts.hints && !exam;
      const sideHint = (side) => (side === 'a' ? item.word.ha : item.word.hb);
      const hint = showHints && [item.word.h, sideHint(item.dir === 'ab' ? 'a' : 'b')].filter(Boolean).join(' · ');
      const answerHint = showHints && sideHint(item.dir === 'ab' ? 'b' : 'a');
      const answerHintLine = answerHint && <div className="text-sm text-text-2 mt-1">{answerHint}</div>;
      const needNote = task.need && (
        <div className="text-sm font-semibold text-akzent-text mb-2">{t(HAND_MODES.includes(mode) ? 'needAllPen' : 'needAll', task.need.length)}</div>
      );
      const promptLabel = sideName(set, item.dir === 'ab' ? 0 : 1);

      const inputField = (ref, value, onChange, cls = '', at) => (
        <input ref={ref} type="text" value={value} onChange={onChange} placeholder={t('answerPh')} data-at={at} {...answerProps(answerLang)}
          className={`flex-1 min-w-0 ${INPUT} text-2xl py-3 ${cls}`} />
      );

      const feedbackBox = (typed) => (
        <div className={`rounded-lg border-2 p-4 ${STATUS_CLASS[result.status]}`}>
          <div className="font-bold text-lg mb-2">
            {t(result.status)}{result.note && <span className="font-normal text-sm"> · {t(result.note)}</span>}
          </div>
          {result.rows ? (
            <div className="space-y-1 text-lg">
              {result.rows.map((row, i) => {
                const [A, B] = charDiff(baseNorm(row.input), row.r.solution);
                return (
                  <div key={i} className="flex gap-2 items-baseline">
                    <span className="text-text-3 w-7 shrink-0 text-right">{task.need[i].mark}</span>
                    {row.r.status === 'right' ? <b>{row.item}</b>
                      : !row.input ? <span><b>{row.item}</b> <span className="text-sm text-text-2">· {t('noAnswer')}</span></span>
                      : <span><DiffText parts={A} cls="diff-del" /> → <b><DiffText parts={B} cls="diff-ins" /></b></span>}
                  </div>
                );
              })}
            </div>
          ) : result.status !== 'right' && typed !== null ? (() => {
            const [A, B] = charDiff(baseNorm(typed), result.solution);
            return (
              <div className="space-y-1 text-lg">
                <div><span className={`${LABEL} mr-2`}>{t('yourInput')}</span><DiffText parts={A} cls="diff-del" /></div>
                <div><span className={`${LABEL} mr-2`}>{t('solution')}</span><b><DiffText parts={B} cls="diff-ins" /></b> <SpeakButton text={task.solution} lang={answerLang} /></div>
                {isList(task.solution) && <div className="whitespace-pre-line text-base text-text mt-1">{task.solution}</div>}
              </div>
            );
          })() : (
            <div className="text-lg whitespace-pre-line"><b>{task.solution}</b> {mode !== 'parse' && <SpeakButton text={task.solution} lang={answerLang} />}</div>
          )}
          {answerHintLine}
          {mode === 'listen' && <div className="text-text mt-1">{promptLabel}: <b>{inline(task.prompt)}</b></div>}
          {mode !== 'gap' && <Sentences word={item.word} solution={solutionOf(item)} />}
        </div>
      );

      // Aufgedeckt, selbst bewerten — Karteikarten und Handschrift ohne Wertung
      const reveal = (
        <>
          <div className={`${LABEL} mb-1`}>{t('solution')}</div>
          <div className="flex items-start gap-3">
            <div className="flex-1 text-3xl font-bold text-akzent-text break-words whitespace-pre-line">{task.solution}</div>
            <SpeakButton text={task.solution} lang={answerLang} />
          </div>
          {answerHintLine}
          <Sentences word={item.word} solution={task.solution} />
          <div className="flex gap-3 mt-4">
            <button onClick={() => rate(false)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-rot-weich text-rot hover:bg-rot-linie text-lg">{t('knewNot')}</button>
            <button onClick={() => rate(true)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-gruen-weich text-gruen hover:bg-gruen-linie text-lg">{t('knew')}</button>
          </div>
        </>
      );

      const nextButton = phase === 'feedback' && (
        <button autoFocus onClick={() => next()} className={`w-full mt-4 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('next')} →</button>
      );
      const copyBlock = phase === 'copy' && (
        <div className="mt-4">
          <div className="text-sm text-text-2 mb-1">{t('copyPrompt2')}</div>
          <div className="flex gap-2">
            {inputField(inputRef, copyInput, (e) => { setCopyInput(e.target.value); setCopyMiss(false); }, copyMiss ? 'border-rot-linie' : '')}
            <button onClick={checkCopy} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
          </div>
          {copyMiss && <p className="text-sm text-rot mt-1">{t('copyNotYet')}</p>}
        </div>
      );

      // ---- der Aufgabenteil je Modus ----
      let body;
      // Handschrift: ein Zweig, zwei Flächen. Mit Kontrolle kommt «Prüfen»
      // dazu — «Aufdecken» bleibt in beiden Fällen, sonst käme niemand an
      // einem Wort vorbei, das er nicht weiss, und ein falsch gelesenes
      // «Haus» liesse sich nicht richtigstellen. Ob `ink` geht (Schlüssel,
      // Sprache), hat `modeOff` auf der Set-Seite entschieden; hier bleibt nur
      // der Ausfall mitten in der Runde — dann ohne Kontrolle weiter.
      const inkOn = mode === 'ink' && !inkFail;
      if (HAND_MODES.includes(mode)) {
        const note = inkNote || (inkFail && t('inkFail'));
        body = (
          <>
            {note && <p className="text-sm text-orange mb-2">{note}</p>}
            {inkOn
              ? <InkPad lang={IINK_LANG[answerLang]} keys={myscript} penOnly={opts.penOnly}
                  clearKey={sketchKey} tool={padTool} padRef={padRef} onFail={() => setInkFail(true)} onNoErase={() => setNoErase(true)} />
              : <Sketch penOnly={opts.penOnly} clearKey={sketchKey} tool={padTool} />}
            {phase === 'ask' ? (
              <div className="flex flex-wrap gap-3 mt-3">
                {!(inkOn && noErase) && <Choice value={padTool} onChange={setPadTool}
                  options={[['write', <PenIcon />, false, t('padPen')], ['erase', <EraserIcon />, false, t('padErase')]]} />}
                <button onClick={clearPad} className={`px-4 py-3 ${BTN_NEUTRAL}`}>{t('penClear')}</button>
                <button onClick={() => setPhase('back')} className={`flex-1 px-4 py-3 ${inkOn ? BTN_SECONDARY : `${BTN_PRIMARY} text-lg`}`}>{t('reveal')}</button>
                {inkOn && (
                  <button onClick={checkInk} disabled={inkBusy}
                    className={`flex-1 ${BTN_PRIMARY} px-6 py-3 text-lg ${inkBusy ? 'opacity-60' : ''}`}>
                    {inkBusy ? t('inkChecking') : t('check')}
                  </button>
                )}
              </div>
            ) : phase === 'feedback' ? (
              <>
                <div className="mt-4">{feedbackBox(inkText)}</div>
                {nextButton}
              </>
            ) : (
              <div className="mt-4">{reveal}</div>
            )}
          </>
        );
      } else if (mode === 'speak') {
        body = (
          <>
            {phase === 'ask' && (
              <div className="flex flex-col items-center gap-3">
                <button onClick={listenUp} disabled={mic === 'listening'}
                  className={`${BTN_PRIMARY} px-10 py-6 text-xl flex items-center gap-3 ${mic === 'listening' ? 'animate-pulse' : ''}`}>
                  <MicIcon /> {mic === 'listening' ? t('micListening') : t('micStart')}
                </button>
                <div className="text-sm text-text-3">{langName(answerLang)}</div>
                {mic === 'nothing' && <p className="text-sm text-orange">{t('micNothing')}</p>}
                {mic === 'denied' && <p className="text-sm text-rot">{t('micDenied')}</p>}
              </div>
            )}
            {phase === 'feedback' && (
              <>
                <p className="text-sm text-text-2 mb-2">{t('micHeard')}: <b className="text-text">{heard}</b></p>
                {feedbackBox(heard)}
              </>
            )}
            {nextButton}
          </>
        );
      } else if (mode === 'cards') {
        body = phase === 'ask' ? (
          <button onClick={() => setPhase('back')} className={`w-full ${BTN_PRIMARY} px-6 py-6 text-xl`}>{t('flip')}</button>
        ) : reveal;
      } else if (mode === 'choice') {
        body = (
          <>
            <div className="grid sm:grid-cols-2 gap-3">
              {task.options.map((o) => {
                const state = phase === 'ask' ? '' : o === task.solution ? 'bg-gruen-weich border-gruen-linie text-gruen'
                  : o === picked ? 'bg-rot-weich border-rot-linie text-rot' : 'opacity-50';
                return (
                  <button key={o} onClick={() => pick(o)} disabled={phase !== 'ask'}
                    className={`px-4 py-4 rounded-lg border-2 border-linie bg-karte text-lg font-semibold text-text text-left break-words whitespace-pre-line hover:border-akzent hover:bg-akzent-weich transition-all ${state}`}>
                    {o}
                  </button>
                );
              })}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(null)}</div>}
            {nextButton}
          </>
        );
      } else if (mode === 'parse') {
        // Zwei Knopfreihen: Zeilen (Person, Kasus), darunter die Spalten
        // (Tempus, Numerus). Nach dem Prüfen bleibt die eigene Wahl stehen,
        // grün oder rot; die Lösung darunter nennt alle Lesarten.
        const { tab } = item.word;
        const row = (axis, labels) => (
          <div className="flex flex-wrap gap-2">
            {labels.map((l, i) => {
              const on = parsed[axis] === i;
              const state = phase === 'ask'
                ? (on ? 'bg-akzent-weich border-akzent text-akzent-text' : 'bg-karte border-linie text-text hover:border-akzent')
                : on ? (result && result.status === 'right' ? 'bg-gruen-weich border-gruen-linie text-gruen' : 'bg-rot-weich border-rot-linie text-rot')
                : 'bg-karte border-linie text-text-3';
              return (
                <button key={i} disabled={phase !== 'ask'} onClick={() => setParsed((p) => ({ ...p, [axis]: i }))} aria-pressed={on} data-axis={axis} data-i={i}
                  className={`px-4 py-2.5 rounded-lg border-2 font-semibold transition-all ${state}`}>{l}</button>
              );
            })}
          </div>
        );
        const ready = parseReady(parsed);
        body = (
          <>
            <div className="space-y-3">
              {row('r', tab.rows)}
              {tab.cols.length > 0 && row('c', tab.cols)}
            </div>
            {phase === 'ask' && (
              <button onClick={checkParse} disabled={!ready}
                className={`w-full mt-4 px-6 py-3 text-lg ${BTN_PRIMARY}`}>{t('check')}</button>
            )}
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(null)}</div>}
            {nextButton}
          </>
        );
      } else if (mode === 'scramble') {
        body = (
          <>
            <div className="min-h-[3.5rem] flex flex-wrap gap-1 items-center p-2 rounded-lg border-2 border-dashed border-linie mb-3">
              {built.map((j, k) => (
                <button key={k} onClick={() => phase === 'ask' && setBuilt(built.slice(0, k))}
                  className="w-11 h-11 rounded-lg bg-akzent-weich text-akzent-text text-xl font-bold">{task.letters[j]}</button>
              ))}
            </div>
            <div className="flex flex-wrap gap-1">
              {task.letters.map((ch, j) => (
                <button key={j} onClick={() => addTile(j)} disabled={built.includes(j) || phase !== 'ask'}
                  className={`w-11 h-11 rounded-lg text-xl font-bold border border-linie transition-all ${built.includes(j) ? 'bg-hover text-text-3' : 'bg-karte text-text hover:bg-akzent-weich'}`}>
                  {ch}
                </button>
              ))}
              {phase === 'ask' && built.length > 0 && (
                <button onClick={() => setBuilt([])} className={`px-3 text-sm ${BTN_NEUTRAL}`}>{t('clearTiles')}</button>
              )}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(built.map((j) => task.letters[j]).join(''))}</div>}
            {nextButton}
          </>
        );
      } else {
        // Schreiben, Lückentext, Hören: Eingabefeld
        body = (
          <>
            {phase === 'ask' && (task.need ? (
              <div className="space-y-2">
                {task.need.map((e, i) => (
                  <div key={i} className="flex gap-2 items-center">
                    <span className="text-text-3 w-7 shrink-0 text-right">{e.mark}</span>
                    {inputField(i === 0 ? inputRef : null, fieldValue(i), (ev) => setField(i, ev.target.value), '', i)}
                  </div>
                ))}
                <button onClick={check} className={`w-full ${BTN_PRIMARY} px-5 py-3`}>{t('check')}</button>
              </div>
            ) : (
              <div className="flex gap-2">
                {inputField(inputRef, input, (e) => setInput(e.target.value))}
                <button onClick={check} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
              </div>
            ))}
            {(phase === 'feedback' || phase === 'copy') && feedbackBox(input)}
            {copyBlock}
            {nextButton}
          </>
        );
      }

      // ---- Kopf der Karte: Was wird gefragt? ----
      let head;
      if (mode === 'gap') {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{t('sentence')}</div>
            <div className="text-2xl sm:text-3xl font-semibold text-text leading-relaxed mb-3">
              {task.before}<span className="inline-block min-w-[5rem] border-b-4 border-akzent text-akzent-text px-1 text-center">
                {phase === 'ask' ? ' ' : task.solution}</span>{task.after}
            </div>
            <div className="text-text-2"><span className={`${LABEL} mr-2`}>{promptLabel}</span><b className="text-xl">{inline(task.prompt)}</b>{hint && <span className="text-sm text-text-2 ml-2">{hint}</span>}</div>
          </>
        );
      } else if (mode === 'listen') {
        head = (
          <div className="flex flex-col items-center gap-3 py-2">
            <SpeakButton text={task.spoken} lang={answerLang} big />
            {item.word.tab && <div className="text-2xl font-bold text-text text-center break-words">{task.prompt}</div>}
            <div className="text-sm text-text-3">{t('hearAgain')}: {langName(answerLang)}</div>
            {hint && <div className="text-sm text-text-2">{hint}</div>}
          </div>
        );
      } else {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{promptLabel}</div>
            <div className="flex items-start gap-3 mb-1">
              <div className="flex-1 text-3xl sm:text-4xl font-bold text-text break-words whitespace-pre-line">{task.prompt}</div>
              <SpeakButton text={task.prompt} lang={promptLang} />
            </div>
            {mode === 'parse' && <div className="text-text-2 mb-1">{t('parseOf', item.word.tab.lemma, item.word.tab.meaning)}</div>}
            {hint && <div className="text-sm text-text-2 mb-2">{hint}</div>}
            {needNote}
          </>
        );
      }

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <PracticeFrame set={set} pos={pos} queue={queue.length} done={pos + 1} total={total} item={item} onQuit={quit}
            extra={exam && <span className="ml-2 px-1.5 rounded bg-rot-weich text-rot text-xs font-semibold">{t('examTag')}</span>}>
            <div onKeyDown={onKey} className={`${CARD} p-6 sm:p-8 mb-4 relative overflow-hidden ${HAND_MODES.includes(mode) ? 'sketch' : ''}`}>
              {timed && phase === 'ask' && (
                <div key={pos} className="absolute left-0 top-0 h-1.5 bg-orange-voll" style={{ animation: `shrink ${opts.timer}s linear forwards` }} />
              )}
              {head}
              <div className="mt-6">{body}</div>
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Zuordnen ----------
    // Gruppen von bis zu MATCH_GROUP Paaren: links Sprache A, rechts Sprache B
    // gemischt. Ein Wort gilt als gewusst, wenn sein erstes Antippen richtig
    // zugeordnet wurde. Keine Wiederholungsschlange — die Gruppe ist erst
    // fertig, wenn alle Paare stehen.
    const MATCH_GROUP = 6;
    const MatchRound = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [groups] = useState(() => {
        const list = opts.order === 'random' ? shuffleArray(words) : words;
        const out = [];
        for (let i = 0; i < list.length; i += MATCH_GROUP) out.push(list.slice(i, i + MATCH_GROUP));
        // Eine Restgruppe mit einem einzigen Paar wäre keine Aufgabe: ans Ende der vorigen
        if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(...out.pop());
        return out;
      });
      const [g, setG] = useState(0);
      const [right, setRight] = useState(() => shuffleArray(groups[0]));
      const [left, setLeft] = useState(null); // gewähltes Wort links
      const [matched, setMatched] = useState([]); // Wörter (Objekte) dieser Gruppe
      const [flash, setFlash] = useState(null); // { l, r } bei Fehlversuch
      const [errored, setErrored] = useState([]); // Wörter mit Fehlversuch
      const [log, setLog] = useState([]);
      const [startedAt] = useState(Date.now);
      const [dialog, setDialog] = useState(null);
      // Beide Zeitgeber müssen beim Verlassen weg: sonst reisst der Wechsel
      // zur nächsten Gruppe eine schon beendete Runde in die Bilanz.
      const timers = useRef([]);
      const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
      useEffect(() => () => timers.current.forEach(clearTimeout), []);
      const group = groups[g];
      const doneBefore = groups.slice(0, g).reduce((n, gr) => n + gr.length, 0);

      const pickRight = (w) => {
        if (!left || flash || matched.includes(w)) return;
        // Verglichen wird die Übersetzung, nicht das Objekt: zwei Wörter mit
        // derselben Rückseite (Synonyme) sind sonst nicht lösbar.
        if (w === left || w.b === left.b) {
          const ok = !errored.includes(w);
          onResult(w, ok);
          const nextLog = [...log, { item: { word: w, dir: 'ab' }, ok }];
          setLog(nextLog);
          const nextMatched = [...matched, w];
          setMatched(nextMatched);
          setLeft(null);
          if (nextMatched.length === group.length) {
            later(() => {
              if (g + 1 >= groups.length) { onDone({ log: nextLog, seconds: Math.round((Date.now() - startedAt) / 1000) }); return; }
              setG(g + 1);
              setRight(shuffleArray(groups[g + 1]));
              setMatched([]);
              setErrored([]);
            }, 500);
          }
        } else {
          setErrored((e) => (e.includes(left) ? e : [...e, left]));
          setFlash({ l: left, r: w });
          later(() => { setFlash(null); setLeft(null); }, 700);
        }
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });
      const tile = (w, side, i, onClick, active) => {
        const isMatched = matched.includes(w);
        const isFlash = flash && (side === 'l' ? flash.l === w : flash.r === w);
        return (
          <button key={side + i} onClick={onClick} disabled={isMatched}
            className={`w-full px-3 py-3 rounded-lg border-2 text-left font-semibold break-words whitespace-pre-line transition-all ${
              isMatched ? 'bg-gruen-weich border-gruen-linie text-gruen opacity-60'
              : isFlash ? 'bg-rot-weich border-rot-linie text-rot'
              : active ? 'bg-akzent-weich border-akzent text-akzent-text'
              : 'bg-karte border-linie text-text hover:border-akzent'}`}>
            {side === 'l' ? w.a : w.b}
          </button>
        );
      };

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <PracticeFrame set={set} pos={doneBefore + matched.length} queue={words.length} done={doneBefore + matched.length} total={words.length} item={null} onQuit={quit}
            extra={groups.length > 1 && <span className="ml-2 text-xs text-text-3">{t('groupN', g + 1, groups.length)}</span>}>
            <div className={`${CARD} p-4 sm:p-6 mb-4`}>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6 mb-2">
                <div className={LABEL}>{sideName(set, 0)}</div>
                <div className={LABEL}>{sideName(set, 1)}</div>
              </div>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6">
                <div className="space-y-2">{group.map((w, i) => tile(w, 'l', i, () => !flash && !matched.includes(w) && setLeft(left === w ? null : w), left === w))}</div>
                <div className="space-y-2">{right.map((w, i) => tile(w, 'r', i, () => pickRight(w), false))}</div>
              </div>
              {flash && <p className="text-center text-rot font-semibold mt-3">{t('wrongPair')}</p>}
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Tabelle ausfüllen ----------
    // Eine Tabelle nach der anderen. Leer sind die gewählten Formen (alle,
    // nur Fehler, fällig, Bereich — dieselbe Auswahl wie sonst), die übrigen
    // stehen schon da: so übt «nur Fehler» genau die Lücken, im Zusammenhang.
    // «Prüfen» wertet jede leere Zelle für sich (`forms`: ohne Tippfehler-
    // und Artikel-Toleranz); gezählt wird pro Form, wie in den anderen Modi.
    // Enter springt spaltenweise weiter — eine Zeitform von oben nach unten.
    const TableRound = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [tables] = useState(() => {
        const bySrc = new Map();
        for (const w of words) {
          if (!bySrc.has(w.src)) bySrc.set(w.src, { tab: w.tab, ask: [] });
          bySrc.get(w.src).ask.push(w);
        }
        const list = [...bySrc.values()];
        return opts.order === 'random' ? shuffleArray(list) : list;
      });
      const [g, setG] = useState(0);
      const [vals, setVals] = useState({});
      const [results, setResults] = useState(null); // nach dem Prüfen: { 'i,j': Ergebnis }
      const [log, setLog] = useState([]);
      const [startedAt] = useState(Date.now);
      const [dialog, setDialog] = useState(null);
      const rootRef = useRef(null);
      const { tab, ask } = tables[g];
      const lang = set.langs && set.langs[1];
      const key = (i, j) => `${i},${j}`;
      const asked = new Map(ask.map((w) => [key(w.ri, w.ci), w]));
      // Spaltenweise, damit Enter eine Zeitform von oben nach unten füllt
      const order = [];
      tab.t[0].forEach((_, j) => tab.t.forEach((_, i) => { if (asked.has(key(i, j))) order.push(key(i, j)); }));
      const focusCell = (k) => { const el = rootRef.current && rootRef.current.querySelector(`[data-cell="${k}"]`); if (el) el.focus(); };
      useEffect(() => { focusCell(order[0]); }, [g]);

      const check = () => {
        if (results) return;
        const out = {}, entries = [];
        for (const k of order) {
          const w = asked.get(k), typed = (vals[k] || '').trim();
          const r = typed ? checkAnswer(typed, w.b, { level: opts.level, lang, forms: true }) : { status: 'wrong', solution: variants(w.b)[0] };
          out[k] = { ...r, typed };
          const ok = r.status !== 'wrong';
          onResult(w, ok);
          entries.push({ item: { word: w, dir: 'ab' }, ok, input: typed, solution: r.solution });
        }
        setResults(out);
        setLog((l) => [...l, ...entries]);
      };
      const next = () => {
        if (g + 1 >= tables.length) { onDone({ log, seconds: Math.round((Date.now() - startedAt) / 1000) }); return; }
        setG(g + 1);
        setVals({});
        setResults(null);
      };
      // Nur aus einem Tabellenfeld: Enter auf «Beenden», in den Einstellungen
      // oder in der Rückfrage bubbelt sonst hierher und prüfte die ganze
      // Tabelle. Nach dem Prüfen hat «Weiter» den Fokus, Enter drückt ihn selbst.
      const onKey = (e) => {
        if (e.key !== 'Enter' || e.repeat || results) return;
        const at = order.indexOf(e.target.dataset && e.target.dataset.cell);
        if (at < 0) return;
        e.preventDefault();
        if (at < order.length - 1) focusCell(order[at + 1]);
        else check();
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });
      const right = results && Object.values(results).filter((r) => r.status !== 'wrong').length;

      const cell = (form, i, j) => {
        const k = key(i, j);
        if (!asked.has(k)) {
          return <td key={j} className="px-2 py-1.5 text-text-2">{form ? inline(form, ' / ') : <span className="text-text-3">–</span>}</td>;
        }
        const r = results && results[k];
        return (
          <td key={j} className="px-1 py-1 align-top">
            <input type="text" value={vals[k] || ''} data-cell={k} disabled={!!results} {...answerProps(lang)}
              onChange={(e) => setVals((v) => ({ ...v, [k]: e.target.value }))}
              className={`w-full min-w-[7rem] ${INPUT} text-lg py-1.5 ${r ? STATUS_CLASS[r.status] : ''}`} />
            {r && r.status !== 'right' && (
              <div className="text-sm mt-0.5 px-1">
                {r.typed ? <b><DiffText parts={charDiff(baseNorm(r.typed), r.solution)[1]} cls="diff-ins" /></b>
                  : <><b>{r.solution}</b> <span className="text-text-2">· {t('noAnswer')}</span></>}
                {r.note && <span className="text-text-2"> · {t(r.note)}</span>}
              </div>
            )}
          </td>
        );
      };

      return (
        <div className={`${SCREEN} p-4 sm:p-8`} onKeyDown={onKey}>
          <PracticeFrame set={set} pos={g + (results ? 1 : 0)} queue={tables.length} done={g + 1} total={tables.length} item={null} onQuit={quit}
            extra={<span className="ml-2 text-xs text-text-3">· {t('tableN', order.length)}</span>}>
            <div className={`${CARD} p-4 sm:p-6 mb-4`} ref={rootRef}>
              <div className="flex items-baseline gap-3 flex-wrap mb-1">
                <div className="text-3xl font-bold text-text break-words">{tab.lemma}</div>
                <div className="text-text-2">{tab.meaning}</div>
                <SpeakButton text={tab.lemma} lang={lang} />
              </div>
              {opts.hints && tab.h && <div className="text-sm text-text-2 mb-2">{tab.h}</div>}
              <div className="overflow-x-auto mt-4 -mx-1">
                <table className="text-left border-separate border-spacing-0">
                  {(tab.cols.length > 0 || tab.one) && (
                    <thead>
                      <tr>
                        <th />
                        {(tab.cols.length ? tab.cols : [tab.one]).map((c, j) => <th key={j} className={`${LABEL} px-2 pb-1 font-semibold`}>{c}</th>)}
                      </tr>
                    </thead>
                  )}
                  <tbody>
                    {tab.t.map((row, i) => (
                      <tr key={i}>
                        <th className="pr-3 pt-3 text-sm font-semibold text-text-2 whitespace-nowrap align-top">{tab.rows[i]}</th>
                        {row.map((form, j) => cell(form, i, j))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {!results ? (
                <button onClick={check} className={`w-full mt-5 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('check')}</button>
              ) : (
                <>
                  <p className={`mt-5 font-semibold ${right === order.length ? 'text-gruen' : 'text-text'}`}>{t('tableScore', right, order.length)}</p>
                  <button autoFocus onClick={next} className={`w-full mt-3 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('next')} →</button>
                </>
              )}
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Rundenende ----------
    const Summary = ({ set, log, seconds, exam, leaves, watched, onRetry, onAgain, onBack }) => {
      const ok = log.filter((e) => e.ok).length;
      const wrong = log.filter((e) => !e.ok);
      const settingsButton = useSettings();
      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className={COLUMN}>
            <div className="flex items-center gap-2 mb-6">
              <button onClick={onBack} className={`shrink-0 px-4 py-2 ${BTN_NEUTRAL} auf-rand`}>← {t('toSet')}</button>
              <div className="flex-1 min-w-0 text-center text-text-2 truncate">{set.title}</div>
              {settingsButton}
            </div>
            <div className={`${CARD} p-6 sm:p-8 text-center mb-4`}>
              <h2 className="text-3xl font-bold text-text mb-2">{t('done')}</h2>
              <div className="text-5xl font-bold my-4 text-akzent-text">
                {log.length ? Math.round((ok / log.length) * 100) : 0}%
              </div>
              <p className="text-text-2">{t('result', ok, log.length)}</p>
              <p className="text-text-3 text-sm">{t('timeUsed', Math.floor(seconds / 60), seconds % 60)}</p>
              {exam && (
                <p className={`mt-2 font-semibold ${!watched ? 'text-orange' : leaves ? 'text-rot' : 'text-gruen'}`}>
                  {!watched ? t('examUnwatched') : leaves ? t('examLeaves', leaves) : t('examNoLeaves')}
                </p>
              )}
            </div>
            {exam && (
              <div className={`${CARD} p-4 sm:p-6 mb-4 overflow-x-auto`}>
                <h3 className="font-semibold text-text mb-2">{t('examResults')}</h3>
                <table className="w-full text-sm text-left">
                  <thead><tr className={LABEL}><th className="pr-2 py-1">#</th><th className="pr-2">{t('colQuestion')}</th><th className="pr-2">{t('colAnswer')}</th><th className="pr-2">{t('colSolution')}</th><th></th></tr></thead>
                  <tbody>
                    {log.map((e, i) => (
                      <tr key={i} className={`border-t border-linie ${e.ok ? '' : 'bg-rot-weich'}`}>
                        <td className="pr-2 py-1 text-text-3">{i + 1}</td>
                        <td className="pr-2 py-1 font-semibold">{inline(promptOf(e.item))}</td>
                        <td className={`pr-2 py-1 ${e.ok ? 'text-gruen' : 'text-rot'}`}>{e.input || t('noAnswer')}</td>
                        <td className="pr-2 py-1">{inline(e.solution || solutionOf(e.item))}</td>
                        <td className="py-1">{e.ok ? '✓' : '✗'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {wrong.length ? (
              <div className={`${CARD} p-6 mb-4`}>
                <h3 className="font-semibold text-text mb-2">{t('wrongWords')}</h3>
                <ul className="space-y-1 text-text">
                  {wrong.map((e, i) => <li key={i}><b>{inline(promptOf(e.item))}</b> — {inline(solutionOf(e.item))}</li>)}
                </ul>
              </div>
            ) : <p className="text-center text-gruen font-semibold mb-4">{t('allRight')}</p>}
            <div className="flex flex-col sm:flex-row gap-3">
              {wrong.length > 0 && <button onClick={() => onRetry(wrong.map((e) => e.item.word))} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>{t('retryWrong')}</button>}
              <button onClick={onAgain} className={`flex-1 px-4 py-3 ${wrong.length ? BTN_SECONDARY : BTN_PRIMARY}`}>{t('again')}</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Trainer: Set-Seite → Runde → Ende ----------
    const Trainer = ({ set, setKey, progress, onResult, onReset, onBack }) => {
      const [stage, setStage] = useState({ kind: 'setup' });
      const prog = progress[setKey] || {};
      // Einstellungen aus dem Link; «go» zündet nur beim ersten Aufbau der
      // Set-Seite, sonst startete jede beendete Runde von selbst die nächste.
      const [preset] = useState(optsFromHash);
      const goRef = useRef(!!preset.go);
      const go = goRef.current;
      goRef.current = false;
      const startRound = (opts, words) => setStage({ kind: 'run', opts, words, n: Date.now() });
      // Formen: die Runde sieht die Tabellen als Wörter (gedrehte Sprachen, s. formSet)
      const roundSet = stage.opts && stage.opts.forms ? formSet(set) : set;

      if (stage.kind === 'run') {
        const Round = { match: MatchRound, table: TableRound }[stage.opts.mode] || Practice;
        return (
          <Round key={stage.n} set={roundSet} opts={stage.opts} words={stage.words}
            onResult={(word, ok) => onResult(setKey, word, ok)}
            onDone={({ log, seconds, exam, leaves, watched }) => setStage({ kind: 'done', opts: stage.opts, words: stage.words, log, seconds, exam, leaves, watched })}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      if (stage.kind === 'done') {
        return (
          <Summary set={roundSet} log={stage.log} seconds={stage.seconds} exam={stage.exam} leaves={stage.leaves} watched={stage.watched}
            onRetry={(words) => startRound(stage.opts, words)}
            onAgain={() => startRound(stage.opts, stage.words)}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      return <SetPage set={set} prog={prog} preset={preset} go={go} onStart={startRound} onReset={() => onReset(setKey)} onBack={onBack} />;
    };

    // ---------- Set aus der Route laden ----------
    const Open = ({ route, own, progress, onKeep, onResult, onReset, onBack }) => {
      const [set, setSet] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        setSet(null);
        setError(null);
        if (route.type === 'demo') {
          const demo = demoById(route.id);
          demo ? setSet(demo) : setError(t('errNoSuchSet'));
        } else if (route.type === 'local') {
          const s = own.find((m) => m.id === route.id);
          s ? setSet(s) : setError(t('errNotStored'));
        } else {
          // Ein geteiltes Set wird nicht nur angezeigt, sondern übernommen
          // (s. keepLink): die Route wechselt auf `local=`, dieses Open geht.
          decodeSet(route.data)
            .then((s) => (s.words.length ? onKeep(s) : setError(t('errLinkEmpty'))))
            .catch(() => setError(t('errLinkBroken')));
        }
      }, [route.type, route.id, route.data]);

      if (error) {
        return (
          <div className={`${SCREEN} p-8 flex flex-col items-center justify-center gap-4`}>
            <div className="text-xl text-rot font-semibold text-center">{error}</div>
            <button onClick={onBack} className={`${BTN_PRIMARY} px-6 py-3`}>{t('toOverview')}</button>
          </div>
        );
      }
      if (!set) return <div className={`${SCREEN} p-8 text-center text-text-2`}>{t('loading')}</div>;
      // Der Lernstand hängt am Set: eigene über die id, Beispiele über ihren
      // Namen. Geteilte Links laufen über `keepLink` und sind hier eigene.
      const setKey = route.type === 'demo' ? `demo:${set.id}` : set.id;
      return <Trainer set={set} setKey={setKey} progress={progress} onResult={onResult} onReset={onReset} onBack={onBack} />;
    };

    // ---------- App ----------
    const App = () => {
      const [route, setRoute] = useState(getRoute);
      const [store, setStore] = useState(loadStore);
      const [progress, setProgress] = useState(loadProgress);
      const [, redraw] = useState(currentLang);
      // Gleich beim Start, nicht erst in den Einstellungen (s. persistStorage).
      useEffect(() => { persistStorage(); }, []);
      redrawLang = redraw;
      const own = store.sets;
      const folders = allFolders(store);

      useEffect(() => {
        const onHash = () => { applyLang(langFromHash() || loadLang()); setRoute(getRoute()); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const openSet = (set) => { location.hash = toHash(set); };
      const editSet = (set) => { location.hash = withLang('#edit=' + set.id); };
      const newSet = (dir) => { location.hash = withLang('#new=' + encodeURIComponent(dir || '')); };

      // Der Store zum Nachschlagen ausserhalb des Renderns: was aus dem
      // Ordner kommt, wird damit fertig berechnet, statt im setStore-Updater
      // zu rechnen — ein Updater darf mehrfach laufen oder verworfen werden.
      const storeRef = useRef(store);
      storeRef.current = store;
      // Ein Weg, den Store zu ändern: speichern, Ref nachziehen, rendern.
      // Sonst vergisst eine Schreibstelle die Ref, und ein Nachlesen aus dem
      // Ordner rechnet auf einem veralteten Stand weiter.
      const commit = (next) => { saveStore(next); storeRef.current = next; setStore(next); };
      const updateStore = (fn) => commit(fn(storeRef.current));

      // ---- Ordner auf der Platte (s. Abschnitt oben) ----
      const [dir, setDir] = useState({ handle: null, status: dirSupported ? 'none' : 'unsupported' });
      // Der Ordner, der gerade gelten soll. Ein Auftrag, der erst fertig wird,
      // nachdem der Nutzer getrennt oder gewechselt hat, erkennt sich daran
      // als überholt und lässt Store wie Status in Ruhe.
      const wanted = useRef(null);
      // Der Stand, den der Ordner zuletzt gesehen hat: mirrorDir schreibt nur
      // die Differenz dazu. Was vom Ordner kommt, wird darauf gesetzt, statt
      // zurückgeschrieben — sonst bügelte die App jede von Hand geschriebene
      // Datei in ihr eigenes Format.
      const mirrored = useRef(null);
      // Alle Ordner-Zugriffe laufen hintereinander: ein Nachlesen darf nicht
      // in ein halb geschriebenes Set hineinlesen.
      const queue = useRef(Promise.resolve());
      const enqueue = (job) => (queue.current = queue.current.then(job).catch((e) => {
        console.error(e);
        if (wanted.current) setDir((d) => ({ ...d, status: 'error' })); // nach dem Trennen schweigen
      }));
      const takeDisk = (handle, keepAll) => {
        wanted.current = handle;
        return enqueue(async () => {
          const disk = await readDir(handle);
          if (wanted.current !== handle) return;
          const { next, onDisk } = fromDisk(storeRef.current, disk, keepAll);
          mirrored.current = onDisk;
          // Der Fokus-Effekt liest bei jedem Fenster-Wechsel nach; hat sich im
          // Ordner nichts getan, sollen weder localStorage noch die Liste
          // etwas davon merken.
          if (JSON.stringify(next) !== JSON.stringify(storeRef.current)) commit(next);
          setDir((d) => (d.status === 'ok' && d.handle === handle ? d : { handle, status: 'ok' }));
        });
      };
      useEffect(() => {
        if (!dirSupported) return;
        loadDirHandle().then(async (handle) => {
          if (!handle) return;
          const perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') takeDisk(handle, false); else setDir({ handle, status: 'prompt' });
        });
      }, []);
      useEffect(() => {
        if (dir.status !== 'ok' || !mirrored.current || mirrored.current === store) return;
        const base = mirrored.current;
        mirrored.current = store;
        // Nicht geschrieben heisst nicht gespiegelt: bleibt der neue Stand
        // nach einem Fehler stehen, holt ihn kein späterer Lauf mehr nach und
        // «Neu laden» verwürfe die Änderung auch im Browser.
        enqueue(() => (wanted.current !== dir.handle ? null : mirrorDir(dir.handle, base, store))
          .catch((e) => { mirrored.current = base; throw e; }));
      }, [store, dir]);
      // Im Finder abgelegte oder gelöschte Dateien erscheinen beim Wechsel
      // zurück ins Fenster — MyKahoot liest seine Quizzes ebenso live.
      useEffect(() => {
        if (dir.status !== 'ok') return;
        const onFocus = () => takeDisk(dir.handle, false);
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, [dir.status, dir.handle]);
      const connectDir = async () => {
        let handle;
        try { handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'myvoci' }); }
        catch { return; } // abgebrochen
        await saveDirHandle(handle);
        takeDisk(handle, true);
      };
      // Kein `keepAll`: der Ordner ist die Wahrheit. Sets, die nur im Browser
      // entstanden sind, bleiben trotzdem (sie tragen kein `disk`-Merkmal).
      const reconnectDir = async () => {
        try {
          if ((await dir.handle.requestPermission({ mode: 'readwrite' })) === 'granted') takeDisk(dir.handle, false);
        } catch { setDir((d) => ({ ...d, status: 'error' })); }
      };
      const disconnectDir = () => { wanted.current = null; saveDirHandle(null); mirrored.current = null; setDir({ handle: null, status: 'none' }); };
      const dirApi = {
        status: dir.status, name: dir.handle ? dir.handle.name : '',
        connect: connectDir, reconnect: reconnectDir, disconnect: disconnectDir, refresh: () => takeDisk(dir.handle, false),
      };
      const insertSet = (prev, set, dropBy) => ({ ...prev, sets: [...prev.sets.filter(dropBy), set].sort(byTitle) });
      // Dasselbe Set = gleicher Ort (s. samePlace). Nur über den Titel
      // ersetzte ein Import das gleichnamige Set eines anderen Kindes.
      const importSet = (set) => updateStore((prev) => {
        const old = prev.sets.find((s) => sameSlot(s, set));
        return insertSet(prev, old ? { ...old, ...set, id: old.id } : set, (s) => !old || s.id !== old.id);
      });
      // ---- Sicherung: Sets + Ordner + Lernstand in einer Datei ----
      // Einlesen ergänzt: gleicher Titel im gleichen Ordner = dasselbe Set
      // (id des alten Stands bleibt, sein Lernstand wird darauf umgehängt),
      // Lernstand pro Wort gewinnt der neuere Versuch.
      const backup = {
        // `disk`/`file` sind Buchführung des Ordners, kein Inhalt: in einer
        // Sicherung stünde sonst auf einem fremden Gerät «lag schon im Ordner».
        save: () => download('MyVoci-Sicherung.json', JSON.stringify(
          { app: 'myvoci', version: 1, ...store, sets: store.sets.map(({ disk, file, ...s }) => s), progress }, null, 1)),
        restore: (text) => {
          let data;
          try { data = JSON.parse(text); } catch { return null; }
          if (!data || data.app !== 'myvoci' || !Array.isArray(data.sets)) return null;
          if (!Array.isArray(data.folders)) data.folders = [];
          if (!data.progress || typeof data.progress !== 'object') data.progress = {};
          const idMap = {};
          updateStore((prev) => {
            let next = { ...prev, folders: [...new Set([...prev.folders, ...(data.folders || [])])] };
            for (let s of data.sets) {
              if (!s || typeof s.title !== 'string' || !Array.isArray(s.words)) continue;
              s = { ...s, dir: typeof s.dir === 'string' ? s.dir : '', words: s.words.filter((w) => w && typeof w.a === 'string' && typeof w.b === 'string') };
              if (!s.words.length) continue;
              const old = next.sets.find((x) => samePlace(x, s));
              // «Ergänzt, was fehlt» — genau das, was der Hilfetext verspricht:
              // vorhandene Wörter bleiben in ihrer Reihenfolge stehen, neue
              // kommen hinten dazu. Sonst warf eine ältere Sicherung die Arbeit
              // seit dem Herunterladen weg.
              const mergedWords = old ? mergeWords(old.words, s.words) : s.words;
              const merged = old ? { ...old, ...s, words: mergedWords, id: old.id } : { ...s, id: s.id || newId() };
              idMap[s.id] = merged.id;
              next = insertSet(next, merged, (x) => !samePlace(x, s));
            }
            return next;
          });
          updateProgress((prev) => {
            const next = { ...prev };
            for (const [key, words] of Object.entries(data.progress || {})) {
              const target = idMap[key] || key;
              const mine = { ...(next[target] || {}) };
              for (const [wk, rec] of Object.entries(words || {})) {
                // Nur brauchbare Einträge: ein fehlendes `box`/`last` machte
                // aus dem Fortschrittsbalken NaN-Breiten und «nie fällig».
                if (!rec || typeof rec.box !== 'number' || typeof rec.last !== 'number') continue;
                if (!mine[wk] || rec.last > mine[wk].last) mine[wk] = rec;
              }
              next[target] = mine;
            }
            return next;
          });
          return data.sets.length;
        },
      };

      const saveSet = (set) => {
        let saved = set.id ? set : { ...set, id: newId() };
        // Früher benannte die App Dateien mit Umlaut und «–» nach dem Titel;
        // solche Dateien tragen seither `file`. Beim Umbenennen in der App
        // ziehen sie mit und heissen dann nach der neuen Regel — sonst klebte
        // der alte Name fest (s. readDir).
        const old = storeRef.current.sets.find((s) => s.id === saved.id);
        if (old && old.file && old.title !== saved.title && old.file.normalize('NFC') === `${safeName(old.title)}.txt`.normalize('NFC')) {
          const { file, ...rest } = saved;
          saved = rest;
        }
        updateStore((prev) => insertSet(prev, saved, (s) => s.id !== saved.id));
        back();
      };
      const deleteSet = (id) => updateStore((prev) => ({ ...prev, sets: prev.sets.filter((s) => s.id !== id) }));

      const updateProgress = (fn) => setProgress((prev) => { const next = fn(prev); writeLocal(PROGRESS_KEY, next); return next; });
      const recordResult = (setKey, word, ok) => updateProgress((prev) => {
        const p = prev[setKey] || {};
        return { ...prev, [setKey]: { ...p, [wordKey(word)]: applyResult(p[wordKey(word)], ok) } };
      });
      const resetProgress = (setKey) => updateProgress((prev) => { const next = { ...prev }; delete next[setKey]; return next; });

      // Ein gescanntes Set bleibt im Browser: es wird übernommen wie ein
      // Import und dann als eigenes geöffnet (`local=`, Optionen des Links
      // bleiben). Gleicher Ort = dasselbe Set, ein korrigierter Link ersetzt
      // es also. Der Link trägt keinen Ordner, landet darum zuoberst — es sei
      // denn, das Set liegt unverändert schon irgendwo (die Lehrperson öffnet
      // den eigenen Link): dann wird das geöffnet, ohne Zweitkopie. Ein
      // Lernstand aus der Zeit, als Links nur angezeigt wurden (`link:`-
      // Schlüssel), wandert auf die id.
      const keepLink = (set) => {
        const sets = storeRef.current.sets;
        // Der Ort muss derselbe sein, an dem importSet sucht — sonst behielte
        // importSet die id des ersetzten Sets, die Route zeigte auf eine neue.
        const dir = placeFor(set, sets, allFolders(storeRef.current));
        const here = sets.find((s) => sameSlot(s, { ...set, dir }));
        const twins = here ? [] : sets.filter((s) => s.title === set.title);
        const same = twins.length === 1 && JSON.stringify(twins[0].words) === JSON.stringify(set.words) ? twins[0] : null;
        const id = here ? here.id : same ? same.id : newId();
        if (!same) importSet({ ...set, id, dir: here ? here.dir || '' : dir });
        updateProgress((prev) => {
          const linkKey = `link:${set.title}`;
          if (!prev[linkKey] || prev[id]) return prev;
          const next = { ...prev, [id]: prev[linkKey] };
          delete next[linkKey];
          return next;
        });
        const rest = hashParts().filter((x) => x !== routePart());
        history.replaceState(null, '', location.pathname + location.search + '#' + ['local=' + id, ...rest].join('&'));
        setRoute(getRoute());
      };

      // Neue Ordner ohne Sonderzeichen, wie die Dateien (plainName).
      const cleanName = (name) => ((name || '').trim() ? plainName(name.trim()) : '');
      const makeFolder = (parent, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const path = parent ? `${parent}/${name}` : name;
        updateStore((prev) => (prev.folders.includes(path) ? prev : { ...prev, folders: [...prev.folders, path] }));
        return path;
      };
      // `false` heisst «am Ziel liegt schon ein Ordner dieses Namens» — ohne
      // die Prüfung verschmölzen die beiden stillschweigend zu einem, und der
      // Weg zurück fehlt (remapDir schreibt die Pfade um und dedupliziert).
      const folderTaken = (target) => allFolders(store).includes(target);
      const renameFolder = (dir, rawName) => {
        // Vorgabe unverändert bestätigt: nichts tun — sonst würde ein alter
        // Ordner «Französisch» still zu «Franzoesisch» samt allen Dateien.
        if ((rawName || '').trim() === dirName(dir)) return null;
        const name = cleanName(rawName);
        if (!name) return null;
        const target = parentDir(dir) ? `${parentDir(dir)}/${name}` : name;
        if (target === dir) return null;
        if (folderTaken(target)) return false;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const moveFolder = (dir, parent) => {
        const target = parent ? `${parent}/${dirName(dir)}` : dirName(dir);
        if (folderTaken(target)) return false;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const removeFolder = (dir) => updateStore((prev) => ({ ...prev, folders: prev.folders.filter((f) => f !== dir) }));
      const moveSet = (id, dir) => updateStore((prev) => ({ ...prev, sets: prev.sets.map((s) => (s.id === id ? { ...s, dir } : s)) }));
      const folderApi = { makeFolder, renameFolder, moveFolder, removeFolder, moveSet };

      const back = () => {
        history.replaceState(null, '', location.pathname);
        restoreLang();
        setRoute(null);
      };

      if (route && (route.type === 'edit' || route.type === 'new')) {
        const target = route.type === 'new' ? { id: null, title: '', dir: route.dir, words: [] } : own.find((s) => s.id === route.id);
        if (!target) {
          return (
            <div className={`${SCREEN} p-8 text-center text-text-2`}>
              {t('errGone')}
              <button onClick={back} className="block mx-auto mt-4 underline">{t('backToList')}</button>
            </div>
          );
        }
        return (
          <SetEditor key={route.type === 'new' ? 'new' : route.id} set={target} sets={own} folders={folders}
            onSave={saveSet} onCancel={back} onNewFolder={makeFolder} />
        );
      }

      return route
        ? <Open key={JSON.stringify(route)} route={route} own={own} progress={progress} onKeep={keepLink} onResult={recordResult} onReset={resetProgress} onBack={back} />
        : (
          <Selection own={own} folders={folders} onOpen={openSet} onEdit={editSet} onNew={newSet}
            onImport={importSet} onDelete={deleteSet} folderApi={folderApi} backup={backup} dir={dirApi} />
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
