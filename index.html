              <RowTool onClick={(e) => { e.stopPropagation(); dropFolder(dir); }} title={t('deleteFolder')} hover="hover:bg-red-50 hover:text-red-600"><TrashIcon /></RowTool>
            </div>
            {/* Inhalt an einer Linie eingerückt — man sieht, was wohin gehört */}
            {isOpen && <div className="ml-3.5 pl-2.5 my-0.5 border-l-2 border-gray-200 space-y-0.5">{treeOf(dir)}</div>}
          </div>
        );
      };
      const treeOf = (dir) => (
        <>
          {folders.filter((f) => parentDir(f) === dir).map(folderBox)}
          {own.filter((s) => (s.dir || '') === dir).map((s) => row(s, true))}
        </>
      );

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <div className="relative mb-2">
              <h1 className="text-4xl font-bold text-center text-gray-800">MyVoci</h1>
              <div className="absolute right-0 top-1/2 -translate-y-1/2 flex gap-2">
                <IconButton onClick={() => setScan(true)} title={t('scan')}><ScanIcon /></IconButton>
                <IconButton onClick={() => setHelp('all')} title={t('helpTitle')}><HelpIcon /></IconButton>
                {settingsButton}
              </div>
            </div>
            <p className="text-center text-gray-500 mb-8">{t('subtitle')}</p>
            <StorageWarning />
            {(dir.status === 'prompt' || dir.status === 'error') && (
              <div className={`mb-6 rounded-lg border-2 px-4 py-3 text-sm ${dir.status === 'prompt' ? 'border-amber-400 bg-amber-50 text-amber-900' : 'border-red-400 bg-red-50 text-red-900'}`}>
                <p className="mb-2">{dir.status === 'prompt' ? t('dirPrompt', dir.name) : t('dirError', dir.name)}</p>
                {dirButtons}
              </div>
            )}
            {settingsPanel}

            <Collapsible title={t('createTitle')} open={createOpen} onToggle={() => setCreateOpen((v) => !v)}>
              <ol className="list-decimal list-inside text-sm text-gray-600 space-y-1 mb-4">{t('steps')}</ol>
              <button onClick={() => copyText(kiPrompt(), t('promptCopied'))} className={`w-full ${BTN_PRIMARY} px-4 py-2 mb-6`}>
                {t('copyPrompt')}
              </button>
              <div onClick={() => fileInput.current.click()}
                className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center text-gray-500 cursor-pointer hover:border-blue-400 hover:text-gray-700 hover:bg-blue-50 transition-all">
                <span className="flex items-center justify-center gap-2 font-bold"><InboxIcon /> {t('dropTitle')}</span>
                <span className="block text-sm text-gray-400">{t('dropHint')}</span>
              </div>
              <input ref={fileInput} type="file" accept=".txt,.md" multiple className="hidden"
                onChange={(e) => { importFiles(e.target.files); e.target.value = ''; }} />
              <div className={`flex items-center gap-3 my-4 ${LABEL}`}>
                <span className="flex-1 h-px bg-gray-200" /> {t('orPaste')} <span className="flex-1 h-px bg-gray-200" />
              </div>
              <input type="text" value={pastedTitle} onChange={(e) => setPastedTitle(e.target.value)} placeholder={t('pastedTitlePh')}
                className={`w-full mb-2 ${INPUT} text-sm`} />
              <textarea value={pasted} onChange={(e) => setPasted(e.target.value)} rows={6} placeholder={t('pastePh')}
                className={`w-full ${INPUT} text-sm font-mono`} />
              <button onClick={importPasted} disabled={!pasted.trim()}
                className={`w-full mt-2 px-4 py-2 rounded-lg font-semibold transition-all ${pasted.trim() ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                {t('importText')}
              </button>
              <p className="text-xs text-gray-400 mt-3">{t('importHint')}</p>
            </Collapsible>

            <div className="mb-8">
              <div className="flex items-center gap-0.5 mb-1 pl-2.5">
                <h2 className="text-lg font-semibold text-gray-600 flex-1">{t('mySets')}</h2>
                <RowTool onClick={() => onNew('')} title={t('newSet')}><PlusIcon /></RowTool>
                <RowTool onClick={() => newFolder('')} title={t('newFolder')}><FolderIcon /></RowTool>
                <RowTool onClick={exportAll} title={t('exportAll')}><DownloadIcon /></RowTool>
              </div>
              <div {...dropProps('')}
                className={`min-h-[2.5rem] rounded-lg space-y-0.5 transition-colors ${dropDir === '' ? 'outline outline-2 outline-dashed outline-blue-400 outline-offset-4' : ''}`}>
                {own.length || folders.length ? treeOf('') : <p className="text-sm text-gray-400 px-2.5 py-2">{t('emptyList')}</p>}
              </div>
              {/* Bei verbundenem Ordner stimmt «in diesem Browser» nicht mehr:
                  dort liegen die Sets als Dateien, im Browser nur der Lernstand. */}
              {own.length > 0 && (
                <p className="text-xs text-gray-400 mt-1">
                  {dir.status === 'ok' ? t('storedHintDir', dir.name) : t('storedHint')}
                </p>
              )}
              {/* Der Ordner ist ein einmaliger Einrichtungsschritt — in den
                  Einstellungen findet ihn niemand. Nur wo er möglich ist
                  (Chrome/Edge am Computer) und noch keiner hängt; die anderen
                  Zustände melden sich oben von selbst. */}
              {dir.status === 'none' && (
                <p className="text-xs text-gray-400 mt-1">
                  {t('dirOffer')}{' '}
                  <button onClick={dir.connect} className="underline font-semibold hover:text-gray-600">{t('dirChoose')}</button>
                </p>
              )}
            </div>

            {showDemos && (
              <div className="mb-8">
                <h2 className="text-lg font-semibold text-gray-600 mb-1 pl-2.5">{t('examples')}</h2>
                <div className="space-y-0.5">{DEMOS.map((s) => row(s, false))}</div>
              </div>
            )}
          </div>

          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && <QrModal title={qr.title} url={qr.url} onClose={() => setQr(null)} onCopy={() => copyText(qr.url, t('linkCopied'))} />}
          {scan && <Scanner onClose={() => setScan(false)} onCode={onCode} />}
          {help && <Help only={help === 'all' ? null : help} onClose={() => setHelp(null)} />}
          {toastNode}
        </div>
      );
    };

    // ---------- Editor ----------
    const SetEditor = ({ set, sets, folders, onSave, onCancel, onNewFolder }) => {
      const [title, setTitle] = useState(set.title);
      const [dir, setDir] = useState(set.dir || '');
      const [lang, setLang] = useState(set.lang || '');
      const [langA, setLangA] = useState(set.langs ? set.langs[0] : '');
      const [langB, setLangB] = useState(set.langs ? set.langs[1] : '');
      const [words, setWords] = useState(() =>
        set.words.length ? set.words.map((w) => ({ a: w.a, b: w.b, s: (w.s || []).join('\n'), h: w.h || '' })) : [{ a: '', b: '', s: '', h: '' }]);
      const [error, setError] = useState('');
      const [dialog, setDialog] = useState(null);

      // Ein Merkmal statt eines JSON-Vergleichs des ganzen Sets bei jedem
      // Zeichen: gefragt ist nur, ob überhaupt etwas angefasst wurde.
      const [dirty, setDirty] = useState(false);
      // Jede Änderung geht durch `touch` — eine Stelle, die das Merkmal setzt.
      const touch = (fn) => (...args) => { setDirty(true); fn(...args); };
      const editTitle = touch(setTitle), editDir = touch(setDir), editLang = touch(setLang);
      const editLangA = touch(setLangA), editLangB = touch(setLangB);

      const setWord = touch((i, key, value) => setWords((ws) => ws.map((w, j) => (j === i ? { ...w, [key]: value } : w))));
      const addWord = touch(() => setWords((ws) => [...ws, { a: '', b: '', s: '', h: '' }]));
      const removeWord = touch((i) => setWords((ws) => ws.filter((_, j) => j !== i)));
      const moveWord = touch((i, delta) => setWords((ws) => {
        const j = i + delta;
        if (j < 0 || j >= ws.length) return ws;
        const next = [...ws];
        [next[i], next[j]] = [next[j], next[i]];
        return next;
      }));

      const save = () => {
        const clean = words
          .map((w) => ({
            a: w.a.trim(), b: w.b.trim(),
            s: w.s.split('\n').map((x) => x.trim()).filter(Boolean), h: w.h.trim(),
          }))
          .filter((w) => w.a || w.b)
          .map((w) => ({ a: w.a, b: w.b, ...(w.s.length ? { s: w.s } : {}), ...(w.h ? { h: w.h } : {}) }));
        const name = title.trim();
        if (!name) return setError(t('errTitle'));
        // Nur im selben Ordner: seit die Sets in Ordnern liegen, tragen zwei
        // Kinder gut denselben Set-Titel — global geprüft liess sich so ein
        // Set gar nicht mehr speichern.
        if (sets.some((s) => s.id !== set.id && samePlace(s, { dir, title: name }))) return setError(t('errTitleTaken'));
        if (!clean.length) return setError(t('errNoWord'));
        if (clean.some((w) => !w.a || !w.b)) return setError(t('errHalfWord'));
        const a = langCode(langA), b = langCode(langB);
        onSave({ ...set, title: name, dir, words: clean, lang: lang || undefined, langs: a && b ? [a, b] : undefined });
      };
      const cancel = () => {
        if (!dirty) return onCancel();
        setDialog({ kind: 'confirm', ok: t('discard'), text: t('confirmDiscard'), onYes: onCancel });
      };
      const newFolder = () => setDialog({
        kind: 'prompt', ok: t('create'), label: dir ? t('askSubfolder', dirName(dir)) : t('askFolder'),
        onOk: (name) => { const path = onNewFolder(dir, name); if (path) editDir(path); },
      });

      const field = (i, key, label, placeholder) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input type="text" value={words[i][key]} placeholder={placeholder} onChange={(e) => setWord(i, key, e.target.value)}
            className={`w-full mt-1 ${INPUT}`} />
        </label>
      );

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <h1 className="text-2xl font-bold text-gray-800 mb-6">{set.id ? t('editSet') : t('newSet')}</h1>
            <div className={`${CARD} p-6 mb-6`}>
              <label className="block mb-4">
                <span className={LABEL}>{t('titleLabel')}</span>
                <input type="text" value={title} onChange={(e) => editTitle(e.target.value)} placeholder={t('titlePh')} className={`w-full mt-1 ${INPUT}`} />
              </label>
              <span className={LABEL}>{t('folderLabel')}</span>
              <div className="flex gap-2 mt-1 mb-4">
                <select value={dir} onChange={(e) => editDir(e.target.value)} className={`flex-1 min-w-0 ${INPUT}`}>
                  <option value="">{t('rootFolder')}</option>
                  {folders.map((f) => <option key={f} value={f}>{'\u00a0\u00a0'.repeat(f.split('/').length - 1) + dirName(f)}</option>)}
                </select>
                <IconButton onClick={newFolder} title={t('makeFolder')}><FolderIcon /></IconButton>
              </div>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className={LABEL}>{t('langA')}</span>
                  <input type="text" list="langlist" value={langA} onChange={(e) => editLangA(e.target.value)} placeholder={t('langPh')} className={`w-full mt-1 ${INPUT}`} />
                </label>
                <label className="block">
                  <span className={LABEL}>{t('langB')}</span>
                  <input type="text" list="langlist" value={langB} onChange={(e) => editLangB(e.target.value)} placeholder={t('langPh')} className={`w-full mt-1 ${INPUT}`} />
                </label>
                <datalist id="langlist">{Object.keys(LANG_NAMES).map((c) => <option key={c} value={c}>{langName(c)}</option>)}</datalist>
              </div>
              <span className="block mt-1 text-sm text-gray-500">{t('langsHint')}</span>
              <label className="block mt-4">
                <span className={LABEL}>{t('uiLangLabel')}</span>
                <select value={lang} onChange={(e) => editLang(e.target.value)} className={`w-full mt-1 ${INPUT}`}>
                  <option value="">{t('uiLangDefault')}</option>
                  {LANGS.map((entry) => <option key={entry.id} value={entry.id}>{entry.name}</option>)}
                </select>
                <span className="block mt-1 text-sm text-gray-500">{t('uiLangHint')}</span>
              </label>
            </div>

            {words.map((w, i) => (
              <div key={i} className="bg-white rounded-lg shadow p-4 mb-3">
                <div className="flex items-center gap-2 mb-2">
                  <span className="flex-1 text-sm font-semibold text-gray-400">{t('wordN', i + 1)}</span>
                  <IconButton onClick={() => moveWord(i, -1)} title={t('moveUp')}>↑</IconButton>
                  <IconButton onClick={() => moveWord(i, 1)} title={t('moveDown')}>↓</IconButton>
                  <IconButton onClick={() => removeWord(i)} title={t('deleteWord')} hover="hover:bg-red-50"><TrashIcon /></IconButton>
                </div>
                <div className="grid sm:grid-cols-2 gap-3 mb-3">
                  {field(i, 'a', langA ? langName(langCode(langA)) : t('sideA'), t('sideAPh'))}
                  {field(i, 'b', langB ? langName(langCode(langB)) : t('sideB'), t('sideBPh'))}
                </div>
                <label className="block mb-3">
                  <span className={LABEL}>{t('sentences')}</span>
                  <textarea rows={2} value={w.s} placeholder={t('sentencesPh')} onChange={(e) => setWord(i, 's', e.target.value)}
                    className={`w-full mt-1 ${INPUT} text-sm`} />
                </label>
                {field(i, 'h', t('hint'), t('hintPh'))}
              </div>
            ))}

            <button onClick={addWord} className="w-full px-4 py-2 mb-4 bg-white rounded-lg shadow hover:shadow-md font-semibold text-gray-600 flex items-center justify-center gap-2">
              <PlusIcon /> {t('addWord')}
            </button>
            {error && <p className="text-sm text-red-600 mb-2">{error}</p>}
            <div className="flex gap-3">
              <button onClick={cancel} className="flex-1 px-4 py-3 bg-white rounded-lg shadow hover:shadow-md font-semibold text-gray-600">{t('cancel')}</button>
              <button onClick={save} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>{t('save')}</button>
            </div>
            <p className="text-xs text-gray-400 mt-3">{t('editorHint')}</p>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Set-Seite: Einstellungen für die Runde + Lernstand ----------
    const OPTS_KEY = 'myvoci_practice';
    const DEFAULT_OPTS = { mode: 'write', dir: 'ab', sel: 'all', from: 1, to: 20, order: 'random', level: 'normal', hints: true, copy: true, exam: false, penOnly: false, timer: 0 };
    const loadOpts = () => ({ ...DEFAULT_OPTS, ...(readLocal(OPTS_KEY, {}) || {}) });

    const Choice = ({ options, value, onChange }) => (
      <div className="flex flex-wrap gap-2">
        {options.map(([id, label, disabled]) => (
          <button key={id} disabled={disabled} onClick={() => onChange(id)}
            className={`px-3 py-2 text-sm ${value === id ? BTN_PRIMARY : BTN_SECONDARY} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}`}>
            {label}
          </button>
        ))}
      </div>
    );

    // Welche Modi gibt es, und was braucht ein Modus vom Set?
    const MODES = ['write', 'pen', 'cards', 'choice', 'match', 'gap', 'listen', 'speak', 'scramble'];
    const MODE_LABEL = { write: 'modeWrite', pen: 'modePen', cards: 'modeCards', choice: 'modeChoice', match: 'modeMatch', gap: 'modeGap', listen: 'modeListen', speak: 'modeSpeak', scramble: 'modeScramble' };
    // Modi, die der Rechner selber werten kann — Voraussetzung für Blitzrunde
    // und Prüfung (beides braucht ein Urteil ohne Zutun des Übenden).
    const AUTO_MODES = ['write', 'gap', 'listen', 'choice', 'scramble'];
    const TIMER_STEPS = [0, 5, 10, 20];
    const TYPED_MODES = ['write', 'gap', 'listen']; // Eingabefeld + Toleranz + Abschreiben
    // Wer nach Toleranz gewertet wird, muss sie auch einstellen können: die
    // Handschrift hat kein Eingabefeld, wird mit Schlüssel aber genauso
    // gemessen — sonst gälte still, was zuletzt in «Schreiben» gewählt war.
    const usesLevel = (m) => TYPED_MODES.includes(m) || m === 'pen';
    const DIRECTIONLESS = ['gap', 'match']; // Satz ist immer Sprache B, Zuordnen zeigt beide
    // Hören: gehört wird die Antwortseite — bei «gemischt» müssen beide gehen
    const listenLangs = (set, dir) => (set.langs ? (dir === 'ab' ? [set.langs[1]] : dir === 'ba' ? [set.langs[0]] : set.langs) : []);
    const canListen = (set, dir) => { const l = listenLangs(set, dir); return l.length > 0 && l.every(canSpeak); };
    const canSpeakMode = (set, dir) => { const l = listenLangs(set, dir); return l.length > 0 && l.every(canRecognize); };

    const selectWords = (set, opts, prog) => {
      const recs = set.words.map((w) => prog[wordKey(w)]);
      return set.words.filter((w, i) => {
        if (opts.mode === 'gap' && !gapFor(w)) return false;
        if (opts.sel === 'wrong') return isWrong(recs[i]);
        if (opts.sel === 'due') return isDue(recs[i]);
        if (opts.sel === 'range') return i + 1 >= Math.min(opts.from, opts.to) && i + 1 <= Math.max(opts.from, opts.to);
        return true;
      });
    };

    const SetPage = ({ set, prog, preset, go, onStart, onReset, onBack }) => {
      // Ein geteilter Link bringt seine Einstellungen mit (preset) — die gelten
      // für diesen Besuch, gemerkt wird erst, was hier umgestellt wird.
      const [opts, setOpts] = useState(() => ({ ...loadOpts(), ...preset }));
      const [settingsButton, settingsPanel] = useSettings(<MyScriptKeys />);
      const [dialog, setDialog] = useState(null);
      const [listOpen, setListOpen] = useState(false);
      const [shareGo, setShareGo] = useState(false);
      const [qr, setQr] = useState(null);
      const [showToast, toastNode] = useToast();
      const shareLink = async () => (await directLink(set)) + optsToHash(opts, shareGo);
      const copyShare = async () => {
        if (await copyLater(shareLink)) showToast(t('shareCopied'));
        else { showToast(t('copyFailed')); setQr({ title: set.title, url: await shareLink() }); }
      };
      // Gemerkt wird nur, was hier von Hand umgestellt wurde — und zwar auf
      // dem gespeicherten Stand, nicht auf dem eines geteilten Links. Sonst
      // würden Prüfungsmodus und Timer einer fremden Übung zum Standard des
      // Geräts. Der Rückfall auf «Schreiben» merkt sich gar nichts (remember).
      // Geschrieben wird ausserhalb des Updaters: der darf mehrfach laufen.
      const set_ = (patch, remember = true) => {
        if (remember) writeLocal(OPTS_KEY, { ...loadOpts(), ...patch });
        setOpts((o) => ({ ...o, ...patch }));
      };

      const n = set.words.length;
      const recs = set.words.map((w) => prog[wordKey(w)]);
      const wrongN = recs.filter(isWrong).length;
      const dueN = recs.filter((r) => isDue(r)).length;
      const boxes = [0, 0, 0, 0, 0, 0];
      recs.forEach((r) => { boxes[r ? Math.min(r.box, 5) : 0]++; });
      const seen = recs.filter(Boolean).length;
      // `gapFor` zerlegt jeden Satz und baut dabei Ausdrücke — das darf nicht
      // an jedem Tastendruck in den Bereichsfeldern hängen.
      const gapN = useMemo(() => set.words.filter(gapFor).length, [set]);
      // Ein gemerkter Modus, der bei diesem Set nicht geht, fällt auf Schreiben zurück
      // Eine Stelle entscheidet, ob ein Modus geht — sonst können ausgegrauter
      // Knopf und Rückfall auf «Schreiben» auseinanderlaufen.
      const modeOff = (m) => (m === 'gap' && !gapN) || (m === 'listen' && !canListen(set, opts.dir)) || (m === 'speak' && !canSpeakMode(set, opts.dir)) || !MODES.includes(m);
      const modeOk = !modeOff(opts.mode);
      useEffect(() => { if (!modeOk) set_({ mode: 'write' }, false); }, [modeOk]);
      const chosen = useMemo(() => selectWords(set, opts, prog), [set, opts, prog]);
      // «Direkt starten» aus dem Link — nur beim ersten Anzeigen (s. Trainer)
      useEffect(() => { if (go && modeOk && chosen.length) onStart(opts, chosen); }, []);
      const A = sideName(set, 0), B = sideName(set, 1);
      const BOX_COLORS = ['bg-gray-300', 'bg-red-400', 'bg-orange-400', 'bg-yellow-400', 'bg-lime-400', 'bg-green-500'];

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <div className="flex items-center gap-2 mb-6">
              <button onClick={onBack} title={t('toOverview')} className="shrink-0 bg-white px-4 py-2 rounded-lg shadow hover:shadow-md transition-all font-semibold text-gray-700">
                ← {t('overview')}
              </button>
              <h1 className="flex-1 min-w-0 text-xl sm:text-3xl font-bold text-center text-gray-800 break-words">{set.title}</h1>
              {settingsButton}
            </div>
            {settingsPanel}
            <StorageWarning />

            <div className={`${CARD} p-6 mb-6`}>
              <h2 className="text-lg font-semibold text-gray-700 mb-4">{t('practiceTitle')}</h2>
              <div className="space-y-4">
                <div>
                  <div className={`${LABEL} mb-2`}>{t('mode')}</div>
                  <Choice value={opts.mode} onChange={(mode) => set_({ mode })}
                    options={MODES.map((m) => [m, t(MODE_LABEL[m]), modeOff(m)])} />
                  <p className="text-sm text-gray-500 mt-1">{t((MODE_LABEL[opts.mode] || MODE_LABEL.write) + 'Hint')}</p>
                  {!gapN && <p className="text-sm text-gray-400 mt-1">{t('modeGapNone')}</p>}
                  {!canListen(set, opts.dir) && <p className="text-sm text-gray-400 mt-1">{t('modeListenNone')}</p>}
                  {!canSpeakMode(set, opts.dir) && canListen(set, opts.dir) && <p className="text-sm text-gray-400 mt-1">{t('modeSpeakNone')}</p>}
                </div>
                {!DIRECTIONLESS.includes(opts.mode) && (
                  <div>
                    <div className={`${LABEL} mb-2`}>{t('direction')}</div>
                    <Choice value={opts.dir} onChange={(dir) => set_({ dir })}
                      options={[['ab', t('dirAB', A, B)], ['ba', t('dirAB', B, A)], ['mix', t('dirMix')]]} />
                  </div>
                )}
                <div>
                  <div className={`${LABEL} mb-2`}>{t('selection')}</div>
                  <Choice value={opts.sel} onChange={(sel) => set_({ sel })}
                    options={[['all', t('selAll')], ['wrong', t('selWrong', wrongN), !wrongN], ['due', t('selDue', dueN)], ['range', t('selRange')]]} />
                  {opts.sel === 'range' && (
                    <div className="flex items-center gap-2 mt-2 text-sm text-gray-600">
                      {t('rangeFrom')}
                      <input type="number" min={1} max={n} value={opts.from} onChange={(e) => set_({ from: +e.target.value || 1 })} className={`w-20 ${INPUT}`} />
                      {t('rangeTo')}
                      <input type="number" min={1} max={n} value={opts.to} onChange={(e) => set_({ to: +e.target.value || n })} className={`w-20 ${INPUT}`} />
                      <span className="text-gray-400">/ {n}</span>
                    </div>
                  )}
                </div>
                <div>
                  <div className={`${LABEL} mb-2`}>{t('order')}</div>
                  <Choice value={opts.order} onChange={(order) => set_({ order })} options={[['random', t('orderRandom')], ['file', t('orderFile')]]} />
                </div>
                {usesLevel(opts.mode) && (
                  <div>
                    <div className={`${LABEL} mb-2`}>{t('tolerance')}</div>
                    <Choice value={opts.level} onChange={(level) => set_({ level })}
                      options={[['strict', t('tolStrict')], ['normal', t('tolNormal')], ['loose', t('tolLoose')]]} />
                    <p className="text-sm text-gray-500 mt-1">{t('tolHint')}</p>
                  </div>
                )}
                <div className="flex flex-wrap gap-4 text-sm text-gray-600">
                  <label className="flex items-center gap-2"><input type="checkbox" checked={opts.hints} onChange={(e) => set_({ hints: e.target.checked })} /> {t('showHints')}</label>
                  {TYPED_MODES.includes(opts.mode) && !opts.exam && (
                    <label className="flex items-center gap-2"><input type="checkbox" checked={opts.copy} onChange={(e) => set_({ copy: e.target.checked })} /> {t('copyWrong')}</label>
                  )}
                  {opts.mode === 'pen' && (
                    <label className="flex items-center gap-2"><input type="checkbox" checked={opts.penOnly} onChange={(e) => set_({ penOnly: e.target.checked })} /> {t('penOnly')}</label>
                  )}
                </div>
                {AUTO_MODES.includes(opts.mode) && (
                  <div>
                    <div className={`${LABEL} mb-2`}>{t('timerLabel')}</div>
                    <Choice value={opts.timer} onChange={(timer) => set_({ timer })} options={TIMER_STEPS.map((s) => [s, s ? t('timerS', s) : t('timerOff')])} />
                    {opts.timer > 0 && <p className="text-sm text-gray-500 mt-1">{t('timerHint')}</p>}
                  </div>
                )}
                {AUTO_MODES.includes(opts.mode) && (
                  <div className={`rounded-lg border p-3 ${opts.exam ? 'border-red-300 bg-red-50' : 'border-gray-200'}`}>
                    <label className="flex items-center gap-2 font-semibold text-gray-700"><input type="checkbox" checked={opts.exam} onChange={(e) => set_({ exam: e.target.checked })} /> {t('exam')}</label>
                    <p className="text-sm text-gray-500 mt-1">{t('examHint')}</p>
                    {!canFullscreen() && <p className="text-sm text-amber-700 mt-1">{t('examNoFs')}</p>}
                  </div>
                )}
              </div>
              <button onClick={() => onStart(opts, chosen)} disabled={!chosen.length}
                className={`w-full mt-6 px-6 py-3 text-lg ${chosen.length ? BTN_PRIMARY : 'bg-gray-200 text-gray-400 rounded-lg font-semibold cursor-not-allowed'}`}>
                {t('start')} · {t('nWords', chosen.length)}
              </button>
              {!chosen.length && <p className="text-sm text-red-600 mt-2">{t('nothingSelected')}</p>}
            </div>

            <div className={`${CARD} p-6 mb-6`}>
              <h2 className="text-lg font-semibold text-gray-700 mb-1">{t('shareTitle')}</h2>
              <p className="text-sm text-gray-500 mb-3">{t('shareHint')}</p>
              <label className="flex items-center gap-2 text-sm text-gray-600 mb-3"><input type="checkbox" checked={shareGo} onChange={(e) => setShareGo(e.target.checked)} /> {t('shareGo')}</label>
              <div className="flex gap-2">
                <button onClick={copyShare} className={`flex-1 ${BTN_PRIMARY} px-4 py-2 flex items-center justify-center gap-2`}><LinkIcon /> {t('shareCopy')}</button>
                <IconButton onClick={async () => setQr({ title: set.title, url: await shareLink() })} title={t('showQr')}><QrIcon /></IconButton>
              </div>
            </div>

            <div className={`${CARD} p-6 mb-6`}>
              <div className="flex items-center gap-2 mb-3">
                <h2 className="text-lg font-semibold text-gray-700 flex-1">{t('progress')}</h2>
                <span className="text-sm text-gray-500">{t('wrongCount', wrongN)} · {t('dueCount', dueN)}</span>
              </div>
              <div className="flex h-4 rounded-full overflow-hidden bg-gray-200 mb-2">
                {boxes.map((c, i) => c > 0 && <div key={i} className={`${BOX_COLORS[i]}`} style={{ width: `${(c / n) * 100}%` }} title={`${t('boxLabel', i)}: ${c}`} />)}
              </div>
              <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-500 mb-3">
                {boxes.map((c, i) => (
                  <span key={i} className="flex items-center gap-1"><span className={`inline-block w-3 h-3 rounded-sm ${BOX_COLORS[i]}`} />{t('boxLabel', i)}: {c}</span>
                ))}
              </div>
              <p className="text-xs text-gray-400 mb-3">{t('progressHint')}</p>
              {seen > 0 && (
                <button onClick={() => setDialog({ kind: 'confirm', ok: t('resetProgress'), text: t('confirmReset'), onYes: onReset })}
                  className={`px-4 py-2 text-sm ${BTN_SECONDARY}`}>{t('resetProgress')}</button>
              )}
            </div>

            <Collapsible title={`${t('wordList')} (${n})`} open={listOpen} onToggle={() => setListOpen((v) => !v)}>
              <ol className="text-sm text-gray-700 space-y-1">
                {set.words.map((w, i) => {
                  const r = recs[i];
                  return (
                    <li key={i} className="flex items-start gap-2">
                      <span className={`mt-1.5 inline-block w-2.5 h-2.5 rounded-full shrink-0 ${BOX_COLORS[r ? Math.min(r.box, 5) : 0]}`} />
                      <span className="text-gray-400 w-6 shrink-0 text-right">{i + 1}.</span>
                      <span className="flex-1"><b>{w.a}</b> — {w.b}{w.h && <span className="text-gray-400"> ({w.h})</span>}</span>
                    </li>
                  );
                })}
              </ol>
            </Collapsible>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && <QrModal title={qr.title} url={qr.url} onClose={() => setQr(null)} onCopy={copyShare} />}
          {toastNode}
        </div>
      );
    };

    // ---------- Üben ----------
    // Eine Runde ist eine Warteschlange aus {word, dir}. Falsch beantwortete
    // Wörter kommen einmal hinten wieder dran (retry) — der Lernstand zählt nur
    // den ersten Versuch. Zuordnen läuft in Gruppen und hat seine eigene
    // Komponente (MatchRound), alle anderen Modi teilen sich Practice.
    const buildQueue = (words, opts) => {
      const list = opts.order === 'random' ? shuffleArray(words) : words;
      // Richtungslose Modi (Lückentext) fragen immer Sprache B ab — die
      // Richtung wird dort gar nicht angeboten, also darf auch keine alte
      // Einstellung durchschlagen. Sonst zeigte `langOf` die falsche Sprache
      // und `checkAnswer` prüfte mit den Artikeln der anderen Sprache.
      const fixed = DIRECTIONLESS.includes(opts.mode) ? 'ab' : null;
      return list.map((word) => ({
        word, retry: false,
        dir: fixed || (opts.dir === 'mix' ? (Math.random() < 0.5 ? 'ab' : 'ba') : opts.dir),
      }));
    };
    const promptOf = (item) => (item.dir === 'ab' ? item.word.a : item.word.b);
    const solutionOf = (item) => (item.dir === 'ab' ? item.word.b : item.word.a);
    const langOf = (set, item, side) => set.langs && set.langs[(item.dir === 'ab') === (side === 'prompt') ? 0 : 1];
    // Erste Alternative ohne Klammern: was vorgelesen und im Buchstabensalat gezeigt wird
    const firstAlt = (solution) => solution.split(/\s*\/\s*/)[0].replace(/[()]/g, '').replace(/\s+/g, ' ').trim();
    // Drei Ablenker aus demselben Set, gleiche Seite, nie die Lösung selbst
    const distractors = (set, item, n = 3) => {
      const side = item.dir === 'ab' ? 'b' : 'a';
      const pool = [...new Set(set.words.map((w) => w[side]).filter((x) => x !== solutionOf(item)))];
      return shuffleArray(pool).slice(0, n);
    };
    const scrambleLetters = (text) => {
      const letters = [...text.replace(/\s+/g, '')];
      if (letters.length < 2) return letters;
      let out = shuffleArray(letters);
      for (let i = 0; i < 5 && out.join('') === letters.join(''); i++) out = shuffleArray(letters);
      return out;
    };

    // `done` ist die Zahl, die im Kopf steht (erledigt bzw. laufende Aufgabe),
    // `pos`/`queue` füllen den Balken. Die zwei Aufrufer zählen verschieden:
    // Practice arbeitet Aufgabe für Aufgabe, MatchRound Paar für Paar.
    const PracticeFrame = ({ set, pos, queue, done, total, item, onQuit, children, extra }) => {
      const [settingsButton, settingsPanel] = useSettings(<MyScriptKeys />);
      const [, redrawFs] = useState(0);
      useEffect(() => {
        const onFs = () => redrawFs((x) => x + 1);
        document.addEventListener('fullscreenchange', onFs);
        document.addEventListener('webkitfullscreenchange', onFs);
        return () => { document.removeEventListener('fullscreenchange', onFs); document.removeEventListener('webkitfullscreenchange', onFs); };
      }, []);
      return (
        <div className="max-w-2xl mx-auto">
          <div className="flex items-center gap-2 mb-4">
            <button onClick={onQuit} className="shrink-0 bg-white px-4 py-2 rounded-lg shadow hover:shadow-md transition-all font-semibold text-gray-700">← {t('quit')}</button>
            <div className="flex-1 min-w-0 text-center text-gray-500 truncate">{set.title}</div>
            {canFullscreen() && (
              <IconButton onClick={toggleFullscreen} title={fsElement() ? t('exitFullscreen') : t('fullscreen')}><ExpandIcon /></IconButton>
            )}
            {settingsButton}
          </div>
          {settingsPanel}
          <div className="flex items-center gap-3 mb-4 text-sm text-gray-500">
            <div className="flex-1 h-2 rounded-full bg-gray-200 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all" style={{ width: `${(pos / queue) * 100}%` }} />
            </div>
            <span>
              {Math.min(done, total)} / {total}
              {item && item.retry && <span className="ml-2 px-1.5 rounded bg-orange-100 text-orange-700 text-xs font-semibold">{t('retryTag')}</span>}
              {extra}
            </span>
          </div>
          {children}
        </div>
      );
    };

    const STATUS_CLASS = {
      right: 'bg-green-50 border-green-300 text-green-800',
      almost: 'bg-yellow-50 border-yellow-300 text-yellow-800',
      wrong: 'bg-red-50 border-red-300 text-red-800',
    };
    const SpeakButton = ({ text, lang, big }) => canSpeak(lang) && (
      <button onClick={() => speak(text, lang)} title={t('speak')}
        className={big ? `${BTN_PRIMARY} px-8 py-6 flex items-center justify-center gap-3 text-xl` : 'text-gray-400 hover:text-blue-500 align-middle'}>
        <SpeakerIcon />{big && t('hear')}
      </button>
    );
    // Beide Schreibflächen sehen gleich aus — eine Stelle, sonst laufen sie
    // beim ersten Nachjustieren der Höhe auseinander.
    const PAD_FRAME = 'w-full h-48 sm:h-56 bg-white rounded-lg border-2 border-dashed border-gray-300 overflow-hidden relative';
    const PAD_LINE = { backgroundImage: 'linear-gradient(to top, transparent 34%, #e5e7eb 34%, #e5e7eb calc(34% + 1px), transparent calc(34% + 1px))' };
    const POINTER_EVENTS = ['pointerdown', 'pointermove', 'pointerup'];

    // Schreibfläche für den Handschrift-Modus: Pointer-Events, damit Pencil,
    // Finger und Maus gleich behandelt werden; `touch-action: none` hält die
    // Seite beim Schreiben still. Keine Erkennung — verglichen wird mit dem
    // Auge, wie auf Papier. `clearKey` von aussen hochzählen = leeren.
    const Sketch = ({ penOnly, clearKey }) => {
      const canvasRef = useRef(null);
      const drawing = useRef(false);
      const last = useRef(null);
      useEffect(() => {
        const c = canvasRef.current;
        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
          if (c.width === w && c.height === h) return;
          // `canvas.width` zu setzen leert die Fläche. Beim Drehen des iPads
          // wäre sonst die halbe Handschrift weg — also vorher abziehen und
          // hinterher wieder auftragen (skaliert auf die neue Breite).
          const old = c.width && c.height ? (() => { const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; t.getContext('2d').drawImage(c, 0, 0); return t; })() : null;
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#1e3a8a';
          if (old) ctx.drawImage(old, 0, 0, c.clientWidth, c.clientHeight);
        };
        resize();
        const ro = window.ResizeObserver && new ResizeObserver(resize);
        ro && ro.observe(c);
        // React registriert Touch-Listener passiv — preventDefault greift dort
        // nicht. Safari braucht es aber nativ, sonst startet nach einem kurzen
        // Halten die Textauswahl der Seite statt des Strichs.
        const block = (e) => e.preventDefault();
        c.addEventListener('touchstart', block, { passive: false });
        c.addEventListener('touchmove', block, { passive: false });
        return () => { ro && ro.disconnect(); c.removeEventListener('touchstart', block); c.removeEventListener('touchmove', block); };
      }, []);
      useEffect(() => {
        const c = canvasRef.current;
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
      }, [clearKey]);
      const pos = (e) => { const r = canvasRef.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
      const down = (e) => {
        if (penOnly && e.pointerType !== 'pen') return;
        e.preventDefault();
        drawing.current = true;
        last.current = pos(e);
        try { canvasRef.current.setPointerCapture(e.pointerId); } catch {}
      };
      const move = (e) => {
        if (!drawing.current) return;
        const ctx = canvasRef.current.getContext('2d');
        // Zwischenpunkte, die der Browser gebündelt hat, mitzeichnen — sonst wird schnelle Schrift eckig
        const events = e.nativeEvent.getCoalescedEvents ? e.nativeEvent.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = pos(ev);
          ctx.beginPath(); ctx.moveTo(last.current[0], last.current[1]); ctx.lineTo(x, y); ctx.stroke();
          last.current = [x, y];
        }
      };
      // Kein onPointerLeave: mit gefangenem Zeiger darf man über den Rand
      // hinausschreiben und zurückkommen, ohne dass der Strich abreisst.
      const up = (e) => {
        drawing.current = false;
        try { canvasRef.current.releasePointerCapture(e.pointerId); } catch {}
      };
      return (
        <canvas ref={canvasRef} className={`${PAD_FRAME} touch-none cursor-crosshair`} style={PAD_LINE}
          onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onContextMenu={(e) => e.preventDefault()} />
      );
    };

    // Schreibfläche mit Erkennung: MyScript zeichnet und erkennt selbst.
    // `DEMAND` heisst, dass nur auf Verlangen erkannt wird — eine abrechenbare
    // Anfrage pro «Prüfen» statt einer nach jeder Schreibpause (gratis sind
    // 2 000 im Monat; mit Pausen-Erkennung kostete ein Wort ihrer drei bis
    // sieben). Darum lauscht hier auch nichts auf «exported»: den Text holt
    // `checkInk` sich beim Prüfen, und gewertet wird genau der.
    const InkPad = ({ lang, keys, penOnly, clearKey, padRef, onFail }) => {
      const rootRef = useRef(null);
      useEffect(() => {
        let gone = false;
        inkQueue(async () => {
          if (gone) return;
          try {
            const iink = await loadIink();
            // Vor dem Aufbau nochmals prüfen: `Canvas.load` zerstört die
            // vorige Fläche, ein verspäteter Auftrag risse die aktuelle ab.
            if (gone) return;
            padRef.current = await iink.Canvas.load(rootRef.current, 'INK_V2', {
              configuration: {
                server: { scheme: 'https', host: 'cloud.myscript.com', applicationKey: keys.app, hmacKey: keys.hmac },
                recognition: { type: 'TEXT', lang, text: { mimeTypes: ['text/plain'] } },
                triggers: { exportContent: 'DEMAND' },
                rendering: { guides: { enable: false } },
                penStyle: { color: '#1e3a8a', width: 3 },
                ui: { showConnectionState: false },
              },
            });
          } catch { if (!gone) onFail(); }
        });
        return () => {
          gone = true;
          const pad = padRef.current;
          padRef.current = null;
          inkQueue(() => pad && pad.destroy());
        };
      }, [lang]);
      useEffect(() => { padRef.current && padRef.current.clear(); }, [clearKey]);
      // Dasselbe wie bei `Sketch`: `touch-action: none` stoppt nur das
      // Scrollen — die Auswahl-Geste von Safari braucht ein natives,
      // nicht-passives `preventDefault`. Und «Nur Stift annehmen» kennt iink
      // nicht, also fangen wir fremde Zeiger in der Auffangphase ab, bevor
      // die Fläche sie sieht.
      useEffect(() => {
        const el = rootRef.current;
        const stopTouch = (e) => e.preventDefault();
        const notPen = (e) => { if (e.pointerType !== 'pen') { e.stopPropagation(); e.preventDefault(); } };
        el.addEventListener('touchstart', stopTouch, { passive: false });
        el.addEventListener('touchmove', stopTouch, { passive: false });
        if (penOnly) for (const type of POINTER_EVENTS) el.addEventListener(type, notPen, true);
        return () => {
          el.removeEventListener('touchstart', stopTouch);
          el.removeEventListener('touchmove', stopTouch);
          if (penOnly) for (const type of POINTER_EVENTS) el.removeEventListener(type, notPen, true);
        };
      }, [penOnly]);
      // Die Höhe bestimmt der äussere Rahmen: iink setzt seinem Wurzelelement
      // `height: 100%` und wuchs damit bei jedem Rendern mit dem eigenen
      // SVG weiter (1500 px und mehr). Absolut eingepasst bleibt es bei der
      // Fläche, die die Karte vorgibt.
      return (
        <div className={PAD_FRAME} style={PAD_LINE}>
          <div ref={rootRef} className="absolute inset-0 touch-none" />
        </div>
      );
    };

    const Sentences = ({ word, solution }) => (word.s || []).length > 0 && (
      <ul className="mt-3 text-gray-700 space-y-1">{word.s.map((s, i) => <li key={i}>{markWord(s, solution)}</li>)}</ul>
    );

    const Practice = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [queue, setQueue] = useState(() => buildQueue(words, opts));
      const [pos, setPos] = useState(0);
      const [phase, setPhase] = useState('ask'); // ask | feedback | copy | back (Karten)
      const [input, setInput] = useState('');
      const [copyInput, setCopyInput] = useState('');
      const [copyMiss, setCopyMiss] = useState(false);
      const [result, setResult] = useState(null);
      const [picked, setPicked] = useState(null); // Multiple Choice: gewählte Antwort
      const [mic, setMic] = useState('idle'); // Sprechen: idle | listening | nothing | denied
      const [heard, setHeard] = useState(''); // Sprechen: was verstanden wurde
      const timed = opts.timer > 0 && AUTO_MODES.includes(opts.mode);
      const latest = useRef({}); // aktueller Stand für den Wecker der Blitzrunde
      const [built, setBuilt] = useState([]); // Buchstabensalat: Indizes der gesetzten Kacheln
      const [log, setLog] = useState([]); // { item, ok, input, solution } nur erste Versuche
      const [sketchKey, setSketchKey] = useState(0); // Handschrift: Fläche leeren
      const myscript = useMemo(myscriptKeys, []); // Handschrift: Schlüssel für die Erkennung
      const [inkText, setInkText] = useState(''); // Handschrift: was gewertet wurde
      const [inkFail, setInkFail] = useState(false); // Handschrift: Fläche kam gar nicht → Papier
      const [inkNote, setInkNote] = useState(''); // Handschrift: Meldung zu diesem einen Versuch
      const [inkBusy, setInkBusy] = useState(false); // Handschrift: Erkennung unterwegs (fürs Auge)
      const inkAsking = useRef(false); // dasselbe fürs Sperren — ein Zustand käme zu spät
      const padRef = useRef(null);
      const scored = useRef(-1); // welche Stelle der Warteschlange schon verbucht ist
      const leaves = useRef(0); // Prüfung: wie oft Vollbild/App verlassen
      const watched = useRef(false); // war das Vollbild je aktiv? Sonst überwacht niemand
      const [startedAt] = useState(Date.now);
      const exam = !!opts.exam && AUTO_MODES.includes(opts.mode);
      const [dialog, setDialog] = useState(null);
      const inputRef = useRef(null);

      const item = queue[pos];
      const total = words.length;
      const mode = opts.mode;
      const answerLang = item && langOf(set, item, 'answer');
      const promptLang = item && langOf(set, item, 'prompt');

      // Was diese Aufgabe zeigt und verlangt — pro Modus verschieden
      const task = useMemo(() => {
        if (!item) return null;
        const solution = solutionOf(item);
        if (mode === 'gap') { const gap = gapFor(item.word); return { ...gap, solution: gap.form, prompt: item.word.a }; }
        if (mode === 'listen') return { solution: firstAlt(solution), spoken: firstAlt(solution), prompt: promptOf(item) };
        if (mode === 'choice') return { solution, prompt: promptOf(item), options: shuffleArray([solution, ...distractors(set, item)]) };
        if (mode === 'scramble') return { solution: firstAlt(solution), prompt: promptOf(item), letters: scrambleLetters(firstAlt(solution)) };
        return { solution, prompt: promptOf(item) };
      }, [item]); // nicht an der Warteschlange: die wächst bei jedem Fehler, die Aufgabe bliebe sonst nicht stehen

      useEffect(() => { if (phase === 'ask' || phase === 'copy') inputRef.current && inputRef.current.focus(); }, [phase, pos]);
      useEffect(() => {
        if (!exam) return;
        // Der Klick auf «Üben starten» liegt nur Millisekunden zurück — das
        // reicht dem Browser als Geste fürs Vollbild.
        if (canFullscreen() && !fsElement()) toggleFullscreen();
        // Ein «nie verlassen» in Grün darf nur stehen, wenn das Vollbild
        // wirklich lief. Sonst hat schlicht niemand hingeschaut.
        const onFs = () => { if (fsElement()) watched.current = true; else if (watched.current) leaves.current++; };
        const onHide = () => { if (document.hidden) leaves.current++; };
        document.addEventListener('fullscreenchange', onFs);
        document.addEventListener('webkitfullscreenchange', onFs);
        document.addEventListener('visibilitychange', onHide);
        return () => {
          document.removeEventListener('fullscreenchange', onFs);
          document.removeEventListener('webkitfullscreenchange', onFs);
          document.removeEventListener('visibilitychange', onHide);
        };
      }, []);
      // Hören: das Wort kommt von selbst, sobald die Aufgabe da ist
      useEffect(() => { if (mode === 'listen' && item) setTimeout(() => speak(task.spoken, answerLang), 300); }, [pos]);

      // Ergebnis verbuchen. Gibt den neuen Stand zurück, weil Karteikarten
      // sofort weiterschalten — dort darf `next` nicht mit dem alten Zustand
      // rechnen (sonst fehlt das letzte Wort in der Bilanz und die
      // Wiederholung fällt weg).
      // `scored` lässt jede Stelle nur einmal zählen: die Handschrift wertet
      // über das Netz, da bleibt der Knopf während des Wartens anklickbar,
      // und fällt die Erkennung mitten in der Rückmeldung aus, stehen auf
      // einmal die Selbstbewertungs-Knöpfe unter einem gewerteten Wort. Beides
      // buchte den Lernstand sonst doppelt.
      const finish = (ok, typed = null, solution = task.solution) => {
        if (item.retry || scored.current === pos) return { nextLog: log, nextQueue: queue };
        scored.current = pos;
        onResult(item.word, ok);
        const nextLog = [...log, { item, ok, input: typed, solution }];
        // In der Prüfung gibt es keine zweite Chance
        const nextQueue = ok || exam ? queue : [...queue, { ...item, retry: true }];
        setLog(nextLog);
        setQueue(nextQueue);
        return { nextLog, nextQueue };
      };
      const settle = (r, typed) => {
        const { nextLog, nextQueue } = finish(r.status !== 'wrong', typed, r.solution);
        if (exam) { next(nextQueue, nextLog); return; } // keine Rückmeldung, gleich weiter
        setResult(r);
        setPhase(r.status === 'wrong' && opts.copy && TYPED_MODES.includes(mode) ? 'copy' : 'feedback');
      };
      // Die übrigen Lösungen dieser Runde: wer eine davon exakt tippt, hat
      // verwechselt, nicht sich vertippt (s. checkAnswer).
      const others = useMemo(() => (item ? words.map((w) => (item.dir === 'ab' ? w.b : w.a)).filter((s) => s !== task.solution) : []), [item]);
      const check = () => {
        if (!input.trim()) return;
        settle(checkAnswer(input, task.solution, { level: opts.level, lang: answerLang, others }), input);
      };
      // Handschrift mit Erkennung: einmal erkennen lassen, dann wie getippt
      // werten. Die Sperre ist nötig, weil dazwischen das Netz liegt und der
      // Knopf so lange anklickbar bleibt. Schlägt die Erkennung fehl, wird das
      // gesagt statt heimlich die letzte Erkennung gewertet — aufdecken und
      // selbst bewerten geht daneben immer.
      const checkInk = async () => {
        // Gesperrt wird über die Ref, nicht über den Zustand: zwei Tipper
        // kurz nacheinander lesen sonst beide noch das alte `false` und
        // schicken zwei kostenpflichtige Anfragen los.
        if (inkAsking.current || phase !== 'ask' || !padRef.current) return;
        inkAsking.current = true;
        setInkBusy(true);
        setInkNote('');
        try {
          const out = await padRef.current.export(['text/plain']);
          const typed = ((out && out['text/plain']) || '').trim();
          if (!typed) { setInkNote(t('inkEmpty')); return; }
          setInkText(typed);
          settle(checkAnswer(typed, task.solution, { level: opts.level, lang: answerLang, others }), typed);
        } catch { setInkNote(t('inkFail')); }
        finally { inkAsking.current = false; setInkBusy(false); }
      };
      const checkCopy = () => {
        if (checkAnswer(copyInput, result.solution, { level: 'strict' }).status === 'wrong') { setCopyMiss(true); return; }
        setPhase('feedback');
      };
      const pick = (option) => {
        if (phase !== 'ask') return;
        setPicked(option);
        settle({ status: option === task.solution ? 'right' : 'wrong', solution: task.solution }, option);
      };
      const addTile = (i) => {
        if (phase !== 'ask' || built.includes(i)) return;
        const next = [...built, i];
        setBuilt(next);
        if (next.length === task.letters.length) {
          const typed = next.map((j) => task.letters[j]).join('');
          settle(checkAnswer(typed, task.solution.replace(/\s+/g, ''), { level: 'strict' }), typed);
        }
      };
      const rate = (ok) => { const { nextLog, nextQueue } = finish(ok); next(nextQueue, nextLog); };
      const next = (q = queue, l = log) => {
        if (pos + 1 >= q.length) {
          if (exam && fsElement()) toggleFullscreen();
          onDone({ log: l, seconds: Math.round((Date.now() - startedAt) / 1000), exam, leaves: leaves.current, watched: watched.current });
          return;
        }
        setPos(pos + 1);
        setPhase('ask');
        setInput('');
        setCopyInput('');
        setCopyMiss(false);
        setResult(null);
        setPicked(null);
        setBuilt([]);
        setMic('idle');
        setHeard('');
        setInkText('');
        setInkNote('');
        inkAsking.current = false;
        setSketchKey((k) => k + 1);
      };
      // Enter wird nur abgefangen, wo es wirklich etwas auslöst. Sonst nähme
      // das `preventDefault` jedem Knopf die Tastaturbedienung — und in der
      // Kartenphase ('back') schaltete es sogar weiter, ohne zu werten.
      // `e.repeat` hält gedrückt gehaltene Tasten davon ab, die Rückmeldung
      // gleich wieder wegzuklicken.
      const onKey = (e) => {
        if (e.key !== 'Enter' || e.repeat) return;
        if (phase === 'ask' && TYPED_MODES.includes(mode)) { e.preventDefault(); check(); }
        else if (phase === 'copy') { e.preventDefault(); checkCopy(); }
        else if (phase === 'feedback') { e.preventDefault(); next(); }
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });

      // Sprechen: einmal zuhören, beste Alternative zählt. Nichts verstanden
      // ist kein Fehler — nochmals versuchen.
      const listenUp = async () => {
        if (mic === 'listening' || phase !== 'ask') return;
        setMic('listening');
        try {
          const alts = await recognizeOnce(answerLang);
          const scored = alts.map((a) => ({ a, r: checkAnswer(a, task.solution, { level: 'loose', lang: answerLang }) }));
          const best = scored.find((x) => x.r.status !== 'wrong') || scored[0];
          setHeard(best.a);
          setMic('idle');
          settle(best.r, best.a);
        } catch (why) { setMic(why === 'denied' ? 'denied' : 'nothing'); }
      };

      // Blitzrunde: der Wecker liest den Stand aus der Ref — die Closure wäre
      // vom Moment des Stellens. Was schon dasteht, wird noch gewertet.
      latest.current = { input, built, task };
      useEffect(() => {
        if (!timed || phase !== 'ask' || !item) return;
        const id = setTimeout(() => {
          const { input, built, task } = latest.current;
          const typed = mode === 'scramble' ? built.map((j) => task.letters[j]).join('') : input;
          const r = TYPED_MODES.includes(mode) && typed.trim()
            ? checkAnswer(typed, task.solution, { level: opts.level, lang: answerLang })
            : { status: 'wrong', solution: task.solution };
          settle(r.status === 'wrong' ? { ...r, note: 'timeUp' } : r, typed);
        }, opts.timer * 1000);
        return () => clearTimeout(id);
      }, [pos, phase]);

      if (!item) return null;
      const hint = opts.hints && !exam && item.word.h;
      const promptLabel = sideName(set, item.dir === 'ab' ? 0 : 1);

      const inputField = (ref, value, onChange, cls = '') => (
        <input ref={ref} type="text" value={value} onChange={onChange} placeholder={t('answerPh')}
          autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false} lang={TTS_LOCALE[answerLang] || undefined}
          className={`flex-1 min-w-0 ${INPUT} text-2xl py-3 ${cls}`} />
      );

      const feedbackBox = (typed) => (
        <div className={`rounded-lg border-2 p-4 ${STATUS_CLASS[result.status]}`}>
          <div className="font-bold text-lg mb-2">
            {t(result.status)}{result.note && <span className="font-normal text-sm"> · {t(result.note)}</span>}
          </div>
          {result.status !== 'right' && typed !== null ? (() => {
            const [A, B] = charDiff(baseNorm(typed), result.solution);
            return (
              <div className="space-y-1 text-lg">
                <div><span className={`${LABEL} mr-2`}>{t('yourInput')}</span><DiffText parts={A} cls="diff-del" /></div>
                <div><span className={`${LABEL} mr-2`}>{t('solution')}</span><b><DiffText parts={B} cls="diff-ins" /></b> <SpeakButton text={task.solution} lang={answerLang} /></div>
              </div>
            );
          })() : (
            <div className="text-lg"><b>{task.solution}</b> <SpeakButton text={task.solution} lang={answerLang} /></div>
          )}
          {mode === 'listen' && <div className="text-gray-700 mt-1">{promptLabel}: <b>{task.prompt}</b></div>}
          {mode !== 'gap' && <Sentences word={item.word} solution={solutionOf(item)} />}
        </div>
      );

      const nextButton = phase === 'feedback' && (
        <button autoFocus onClick={() => next()} className={`w-full mt-4 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('next')} →</button>
      );
      const copyBlock = phase === 'copy' && (
        <div className="mt-4">
          <div className="text-sm text-gray-600 mb-1">{t('copyPrompt2')}</div>
          <div className="flex gap-2">
            {inputField(inputRef, copyInput, (e) => { setCopyInput(e.target.value); setCopyMiss(false); }, copyMiss ? 'border-red-400' : '')}
            <button onClick={checkCopy} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
          </div>
          {copyMiss && <p className="text-sm text-red-600 mt-1">{t('copyNotYet')}</p>}
        </div>
      );

      // ---- der Aufgabenteil je Modus ----
      let body;
      // Handschrift: ein Zweig, zwei Flächen. Mit Erkennung kommt «Prüfen»
      // dazu — «Aufdecken» bleibt in beiden Fällen, sonst käme niemand an
      // einem Wort vorbei, das er nicht weiss, und ein falsch gelesenes
      // «Haus» liesse sich nicht richtigstellen.
      const inkOn = mode === 'pen' && myscript && IINK_LANG[answerLang] && !inkFail;
      if (mode === 'pen') {
        const note = inkNote || (inkFail && t('inkFail')) || (myscript && !IINK_LANG[answerLang] && t('inkNoLang'));
        body = (
          <>
            {note && <p className="text-sm text-orange-600 mb-2">{note}</p>}
            {inkOn
              ? <InkPad lang={IINK_LANG[answerLang]} keys={myscript} penOnly={opts.penOnly}
                  clearKey={sketchKey} padRef={padRef} onFail={() => setInkFail(true)} />
              : <Sketch penOnly={opts.penOnly} clearKey={sketchKey} />}
            {phase === 'ask' ? (
              <div className="flex flex-wrap gap-3 mt-3">
                <button onClick={() => { setSketchKey((k) => k + 1); setInkNote(''); }} className={`px-4 py-3 ${BTN_SECONDARY}`}>{t('penClear')}</button>
                <button onClick={() => setPhase('back')} className={`flex-1 px-4 py-3 ${inkOn ? BTN_SECONDARY : `${BTN_PRIMARY} text-lg`}`}>{t('reveal')}</button>
                {inkOn && (
                  <button onClick={checkInk} disabled={inkBusy}
                    className={`flex-1 ${BTN_PRIMARY} px-6 py-3 text-lg ${inkBusy ? 'opacity-60' : ''}`}>
                    {inkBusy ? t('inkChecking') : t('check')}
                  </button>
                )}
              </div>
            ) : phase === 'feedback' ? (
              <>
                <div className="mt-4">{feedbackBox(inkText)}</div>
                {nextButton}
              </>
            ) : (
              <div className="mt-4">
                <div className={`${LABEL} mb-1`}>{t('solution')}</div>
                <div className="flex items-start gap-3">
                  <div className="flex-1 text-3xl font-bold text-blue-700 break-words">{task.solution}</div>
                  <SpeakButton text={task.solution} lang={answerLang} />
                </div>
                <Sentences word={item.word} solution={task.solution} />
                <div className="flex gap-3 mt-4">
                  <button onClick={() => rate(false)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-red-100 text-red-700 hover:bg-red-200 text-lg">{t('knewNot')}</button>
                  <button onClick={() => rate(true)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-green-100 text-green-700 hover:bg-green-200 text-lg">{t('knew')}</button>
                </div>
              </div>
            )}
          </>
        );
      } else if (mode === 'speak') {
        body = (
          <>
            {phase === 'ask' && (
              <div className="flex flex-col items-center gap-3">
                <button onClick={listenUp} disabled={mic === 'listening'}
                  className={`${BTN_PRIMARY} px-10 py-6 text-xl flex items-center gap-3 ${mic === 'listening' ? 'animate-pulse' : ''}`}>
                  <MicIcon /> {mic === 'listening' ? t('micListening') : t('micStart')}
                </button>
                <div className="text-sm text-gray-400">{langName(answerLang)}</div>
                {mic === 'nothing' && <p className="text-sm text-orange-600">{t('micNothing')}</p>}
                {mic === 'denied' && <p className="text-sm text-red-600">{t('micDenied')}</p>}
              </div>
            )}
            {phase === 'feedback' && (
              <>
                <p className="text-sm text-gray-500 mb-2">{t('micHeard')}: <b className="text-gray-800">{heard}</b></p>
                {feedbackBox(heard)}
              </>
            )}
            {nextButton}
          </>
        );
      } else if (mode === 'cards') {
        body = phase === 'ask' ? (
          <button onClick={() => setPhase('back')} className={`w-full ${BTN_PRIMARY} px-6 py-6 text-xl`}>{t('flip')}</button>
        ) : (
          <>
            <div className={`${LABEL} mb-1`}>{t('solution')}</div>
            <div className="flex items-start gap-3">
              <div className="flex-1 text-3xl font-bold text-blue-700 break-words">{task.solution}</div>
              <SpeakButton text={task.solution} lang={answerLang} />
            </div>
            <Sentences word={item.word} solution={task.solution} />
            <div className="flex gap-3 mt-6">
              <button onClick={() => rate(false)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-red-100 text-red-700 hover:bg-red-200 text-lg">{t('knewNot')}</button>
              <button onClick={() => rate(true)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-green-100 text-green-700 hover:bg-green-200 text-lg">{t('knew')}</button>
            </div>
          </>
        );
      } else if (mode === 'choice') {
        body = (
          <>
            <div className="grid sm:grid-cols-2 gap-3">
              {task.options.map((o) => {
                const state = phase === 'ask' ? '' : o === task.solution ? 'bg-green-100 border-green-400 text-green-800'
                  : o === picked ? 'bg-red-100 border-red-400 text-red-800' : 'opacity-50';
                return (
                  <button key={o} onClick={() => pick(o)} disabled={phase !== 'ask'}
                    className={`px-4 py-4 rounded-lg border-2 border-gray-200 bg-white text-lg font-semibold text-gray-800 text-left break-words hover:border-blue-400 hover:bg-blue-50 transition-all ${state}`}>
                    {o}
                  </button>
                );
              })}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(null)}</div>}
            {nextButton}
          </>
        );
      } else if (mode === 'scramble') {
        body = (
          <>
            <div className="min-h-[3.5rem] flex flex-wrap gap-1 items-center p-2 rounded-lg border-2 border-dashed border-gray-300 mb-3">
              {built.map((j, k) => (
                <button key={k} onClick={() => phase === 'ask' && setBuilt(built.slice(0, k))}
                  className="w-11 h-11 rounded-lg bg-blue-100 text-blue-800 text-xl font-bold">{task.letters[j]}</button>
              ))}
            </div>
            <div className="flex flex-wrap gap-1">
              {task.letters.map((ch, j) => (
                <button key={j} onClick={() => addTile(j)} disabled={built.includes(j) || phase !== 'ask'}
                  className={`w-11 h-11 rounded-lg text-xl font-bold shadow transition-all ${built.includes(j) ? 'bg-gray-100 text-gray-300' : 'bg-white text-gray-800 hover:bg-blue-50'}`}>
                  {ch}
                </button>
              ))}
              {phase === 'ask' && built.length > 0 && (
                <button onClick={() => setBuilt([])} className={`px-3 text-sm ${BTN_SECONDARY}`}>{t('clearTiles')}</button>
              )}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(built.map((j) => task.letters[j]).join(''))}</div>}
            {nextButton}
          </>
        );
      } else {
        // Schreiben, Lückentext, Hören: Eingabefeld
        body = (
          <>
            {phase === 'ask' && (
              <div className="flex gap-2">
                {inputField(inputRef, input, (e) => setInput(e.target.value))}
                <button onClick={check} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
              </div>
            )}
            {(phase === 'feedback' || phase === 'copy') && feedbackBox(input)}
            {copyBlock}
            {nextButton}
          </>
        );
      }

      // ---- Kopf der Karte: Was wird gefragt? ----
      let head;
      if (mode === 'gap') {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{t('sentence')}</div>
            <div className="text-2xl sm:text-3xl font-semibold text-gray-800 leading-relaxed mb-3">
              {task.before}<span className="inline-block min-w-[5rem] border-b-4 border-blue-400 text-blue-700 px-1 text-center">
                {phase === 'ask' ? ' ' : task.solution}</span>{task.after}
            </div>
            <div className="text-gray-600"><span className={`${LABEL} mr-2`}>{promptLabel}</span><b className="text-xl">{task.prompt}</b>{hint && <span className="text-sm text-gray-500 ml-2">{hint}</span>}</div>
          </>
        );
      } else if (mode === 'listen') {
        head = (
          <div className="flex flex-col items-center gap-3 py-2">
            <SpeakButton text={task.spoken} lang={answerLang} big />
            <div className="text-sm text-gray-400">{t('hearAgain')}: {langName(answerLang)}</div>
            {hint && <div className="text-sm text-gray-500">{hint}</div>}
          </div>
        );
      } else {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{promptLabel}</div>
            <div className="flex items-start gap-3 mb-1">
              <div className="flex-1 text-3xl sm:text-4xl font-bold text-gray-800 break-words">{task.prompt}</div>
              <SpeakButton text={task.prompt} lang={promptLang} />
            </div>
            {hint && <div className="text-sm text-gray-500 mb-2">{hint}</div>}
          </>
        );
      }

      return (
        <div className={`${SCREEN} p-4 sm:p-8`} onKeyDown={onKey}>
          <PracticeFrame set={set} pos={pos} queue={queue.length} done={pos + 1} total={total} item={item} onQuit={quit}
            extra={exam && <span className="ml-2 px-1.5 rounded bg-red-100 text-red-700 text-xs font-semibold">{t('examTag')}</span>}>
            <div className={`${CARD} p-6 sm:p-8 mb-4 relative overflow-hidden ${mode === 'pen' ? 'sketch' : ''}`}>
              {timed && phase === 'ask' && (
                <div key={pos} className="absolute left-0 top-0 h-1.5 bg-orange-400" style={{ animation: `shrink ${opts.timer}s linear forwards` }} />
              )}
              {head}
              <div className="mt-6">{body}</div>
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Zuordnen ----------
    // Gruppen von bis zu MATCH_GROUP Paaren: links Sprache A, rechts Sprache B
    // gemischt. Ein Wort gilt als gewusst, wenn sein erstes Antippen richtig
    // zugeordnet wurde. Keine Wiederholungsschlange — die Gruppe ist erst
    // fertig, wenn alle Paare stehen.
    const MATCH_GROUP = 6;
    const MatchRound = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [groups] = useState(() => {
        const list = opts.order === 'random' ? shuffleArray(words) : words;
        const out = [];
        for (let i = 0; i < list.length; i += MATCH_GROUP) out.push(list.slice(i, i + MATCH_GROUP));
        // Eine Restgruppe mit einem einzigen Paar wäre keine Aufgabe: ans Ende der vorigen
        if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(...out.pop());
        return out;
      });
      const [g, setG] = useState(0);
      const [right, setRight] = useState(() => shuffleArray(groups[0]));
      const [left, setLeft] = useState(null); // gewähltes Wort links
      const [matched, setMatched] = useState([]); // Wörter (Objekte) dieser Gruppe
      const [flash, setFlash] = useState(null); // { l, r } bei Fehlversuch
      const [errored, setErrored] = useState([]); // Wörter mit Fehlversuch
      const [log, setLog] = useState([]);
      const [startedAt] = useState(Date.now);
      const [dialog, setDialog] = useState(null);
      // Beide Zeitgeber müssen beim Verlassen weg: sonst reisst der Wechsel
      // zur nächsten Gruppe eine schon beendete Runde in die Bilanz.
      const timers = useRef([]);
      const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
      useEffect(() => () => timers.current.forEach(clearTimeout), []);
      const group = groups[g];
      const doneBefore = groups.slice(0, g).reduce((n, gr) => n + gr.length, 0);

      const pickRight = (w) => {
        if (!left || flash || matched.includes(w)) return;
        // Verglichen wird die Übersetzung, nicht das Objekt: zwei Wörter mit
        // derselben Rückseite (Synonyme) sind sonst nicht lösbar.
        if (w === left || w.b === left.b) {
          const ok = !errored.includes(w);
          onResult(w, ok);
          const nextLog = [...log, { item: { word: w, dir: 'ab' }, ok }];
          setLog(nextLog);
          const nextMatched = [...matched, w];
          setMatched(nextMatched);
          setLeft(null);
          if (nextMatched.length === group.length) {
            later(() => {
              if (g + 1 >= groups.length) { onDone({ log: nextLog, seconds: Math.round((Date.now() - startedAt) / 1000) }); return; }
              setG(g + 1);
              setRight(shuffleArray(groups[g + 1]));
              setMatched([]);
              setErrored([]);
            }, 500);
          }
        } else {
          setErrored((e) => (e.includes(left) ? e : [...e, left]));
          setFlash({ l: left, r: w });
          later(() => { setFlash(null); setLeft(null); }, 700);
        }
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });
      const tile = (w, side, i, onClick, active) => {
        const isMatched = matched.includes(w);
        const isFlash = flash && (side === 'l' ? flash.l === w : flash.r === w);
        return (
          <button key={side + i} onClick={onClick} disabled={isMatched}
            className={`w-full px-3 py-3 rounded-lg border-2 text-left font-semibold break-words transition-all ${
              isMatched ? 'bg-green-100 border-green-300 text-green-800 opacity-60'
              : isFlash ? 'bg-red-100 border-red-400 text-red-800'
              : active ? 'bg-blue-100 border-blue-500 text-blue-900'
              : 'bg-white border-gray-200 text-gray-800 hover:border-blue-400'}`}>
            {side === 'l' ? w.a : w.b}
          </button>
        );
      };

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <PracticeFrame set={set} pos={doneBefore + matched.length} queue={words.length} done={doneBefore + matched.length} total={words.length} item={null} onQuit={quit}
            extra={groups.length > 1 && <span className="ml-2 text-xs text-gray-400">{t('groupN', g + 1, groups.length)}</span>}>
            <div className={`${CARD} p-4 sm:p-6 mb-4`}>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6 mb-2">
                <div className={LABEL}>{sideName(set, 0)}</div>
                <div className={LABEL}>{sideName(set, 1)}</div>
              </div>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6">
                <div className="space-y-2">{group.map((w, i) => tile(w, 'l', i, () => !flash && !matched.includes(w) && setLeft(left === w ? null : w), left === w))}</div>
                <div className="space-y-2">{right.map((w, i) => tile(w, 'r', i, () => pickRight(w), false))}</div>
              </div>
              {flash && <p className="text-center text-red-600 font-semibold mt-3">{t('wrongPair')}</p>}
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Rundenende ----------
    const Summary = ({ set, log, seconds, exam, leaves, watched, onRetry, onAgain, onBack }) => {
      const ok = log.filter((e) => e.ok).length;
      const wrong = log.filter((e) => !e.ok);
      const [settingsButton, settingsPanel] = useSettings();
      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <div className="flex items-center gap-2 mb-6">
              <button onClick={onBack} className="shrink-0 bg-white px-4 py-2 rounded-lg shadow hover:shadow-md transition-all font-semibold text-gray-700">← {t('toSet')}</button>
              <div className="flex-1 min-w-0 text-center text-gray-500 truncate">{set.title}</div>
              {settingsButton}
            </div>
            {settingsPanel}
            <div className={`${CARD} p-6 sm:p-8 text-center mb-4`}>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{t('done')}</h2>
              <div className="text-5xl font-bold my-4 bg-gradient-to-r from-blue-500 to-emerald-500 bg-clip-text text-transparent">
                {log.length ? Math.round((ok / log.length) * 100) : 0}%
              </div>
              <p className="text-gray-600">{t('result', ok, log.length)}</p>
              <p className="text-gray-400 text-sm">{t('timeUsed', Math.floor(seconds / 60), seconds % 60)}</p>
              {exam && (
                <p className={`mt-2 font-semibold ${!watched ? 'text-amber-700' : leaves ? 'text-red-600' : 'text-green-700'}`}>
                  {!watched ? t('examUnwatched') : leaves ? t('examLeaves', leaves) : t('examNoLeaves')}
                </p>
              )}
            </div>
            {exam && (
              <div className={`${CARD} p-4 sm:p-6 mb-4 overflow-x-auto`}>
                <h3 className="font-semibold text-gray-700 mb-2">{t('examResults')}</h3>
                <table className="w-full text-sm text-left">
                  <thead><tr className={LABEL}><th className="pr-2 py-1">#</th><th className="pr-2">{t('colQuestion')}</th><th className="pr-2">{t('colAnswer')}</th><th className="pr-2">{t('colSolution')}</th><th></th></tr></thead>
                  <tbody>
                    {log.map((e, i) => (
                      <tr key={i} className={`border-t border-gray-100 ${e.ok ? '' : 'bg-red-50'}`}>
                        <td className="pr-2 py-1 text-gray-400">{i + 1}</td>
                        <td className="pr-2 py-1 font-semibold">{promptOf(e.item)}</td>
                        <td className={`pr-2 py-1 ${e.ok ? 'text-green-700' : 'text-red-700'}`}>{e.input || t('noAnswer')}</td>
                        <td className="pr-2 py-1">{e.solution || solutionOf(e.item)}</td>
                        <td className="py-1">{e.ok ? '✓' : '✗'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {wrong.length ? (
              <div className={`${CARD} p-6 mb-4`}>
                <h3 className="font-semibold text-gray-700 mb-2">{t('wrongWords')}</h3>
                <ul className="space-y-1 text-gray-700">
                  {wrong.map((e, i) => <li key={i}><b>{promptOf(e.item)}</b> — {solutionOf(e.item)}</li>)}
                </ul>
              </div>
            ) : <p className="text-center text-green-700 font-semibold mb-4">{t('allRight')}</p>}
            <div className="flex flex-col sm:flex-row gap-3">
              {wrong.length > 0 && <button onClick={() => onRetry(wrong.map((e) => e.item.word))} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>{t('retryWrong')}</button>}
              <button onClick={onAgain} className={`flex-1 px-4 py-3 ${wrong.length ? BTN_SECONDARY : BTN_PRIMARY}`}>{t('again')}</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Trainer: Set-Seite → Runde → Ende ----------
    const Trainer = ({ set, setKey, progress, onResult, onReset, onBack }) => {
      const [stage, setStage] = useState({ kind: 'setup' });
      const prog = progress[setKey] || {};
      // Einstellungen aus dem Link; «go» zündet nur beim ersten Aufbau der
      // Set-Seite, sonst startete jede beendete Runde von selbst die nächste.
      const [preset] = useState(optsFromHash);
      const goRef = useRef(!!preset.go);
      const go = goRef.current;
      goRef.current = false;
      const startRound = (opts, words) => setStage({ kind: 'run', opts, words, n: Date.now() });

      if (stage.kind === 'run') {
        const Round = stage.opts.mode === 'match' ? MatchRound : Practice;
        return (
          <Round key={stage.n} set={set} opts={stage.opts} words={stage.words}
            onResult={(word, ok) => onResult(setKey, word, ok)}
            onDone={({ log, seconds, exam, leaves, watched }) => setStage({ kind: 'done', opts: stage.opts, words: stage.words, log, seconds, exam, leaves, watched })}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      if (stage.kind === 'done') {
        return (
          <Summary set={set} log={stage.log} seconds={stage.seconds} exam={stage.exam} leaves={stage.leaves} watched={stage.watched}
            onRetry={(words) => startRound(stage.opts, words)}
            onAgain={() => startRound(stage.opts, stage.words)}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      return <SetPage set={set} prog={prog} preset={preset} go={go} onStart={startRound} onReset={() => onReset(setKey)} onBack={onBack} />;
    };

    // ---------- Set aus der Route laden ----------
    const Open = ({ route, own, progress, onKeep, onResult, onReset, onBack }) => {
      const [set, setSet] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        setSet(null);
        setError(null);
        if (route.type === 'demo') {
          const demo = demoById(route.id);
          demo ? setSet(demo) : setError(t('errNoSuchSet'));
        } else if (route.type === 'local') {
          const s = own.find((m) => m.id === route.id);
          s ? setSet(s) : setError(t('errNotStored'));
        } else {
          // Ein geteiltes Set wird nicht nur angezeigt, sondern übernommen
          // (s. keepLink): die Route wechselt auf `local=`, dieses Open geht.
          decodeSet(route.data)
            .then((s) => (s.words.length ? onKeep(s) : setError(t('errLinkEmpty'))))
            .catch(() => setError(t('errLinkBroken')));
        }
      }, [route.type, route.id, route.data]);

      if (error) {
        return (
          <div className={`${SCREEN} p-8 flex flex-col items-center justify-center gap-4`}>
            <div className="text-xl text-red-600 font-semibold text-center">{error}</div>
            <button onClick={onBack} className={`${BTN_PRIMARY} px-6 py-3`}>{t('toOverview')}</button>
          </div>
        );
      }
      if (!set) return <div className={`${SCREEN} p-8 text-center text-gray-500`}>{t('loading')}</div>;
      // Der Lernstand hängt am Set: eigene über die id, Beispiele über ihren
      // Namen. Geteilte Links laufen über `keepLink` und sind hier eigene.
