      const setKey = route.type === 'demo' ? `demo:${set.id}` : set.id;
      return <Trainer set={set} setKey={setKey} progress={progress} onResult={onResult} onReset={onReset} onBack={onBack} />;
    };

    // ---------- App ----------
    const App = () => {
      const [route, setRoute] = useState(getRoute);
      const [store, setStore] = useState(loadStore);
      const [progress, setProgress] = useState(loadProgress);
      const [, redraw] = useState(currentLang);
      redrawLang = redraw;
      const own = store.sets;
      const folders = allFolders(store);

      useEffect(() => {
        const onHash = () => { applyLang(langFromHash() || loadLang()); setRoute(getRoute()); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const openSet = (set) => { location.hash = toHash(set); };
      const editSet = (set) => { location.hash = withLang('#edit=' + set.id); };
      const newSet = (dir) => { location.hash = withLang('#new=' + encodeURIComponent(dir || '')); };

      // Der Store zum Nachschlagen ausserhalb des Renderns: was aus dem
      // Ordner kommt, wird damit fertig berechnet, statt im setStore-Updater
      // zu rechnen — ein Updater darf mehrfach laufen oder verworfen werden.
      const storeRef = useRef(store);
      storeRef.current = store;
      // Ein Weg, den Store zu ändern: speichern, Ref nachziehen, rendern.
      // Sonst vergisst eine Schreibstelle die Ref, und ein Nachlesen aus dem
      // Ordner rechnet auf einem veralteten Stand weiter.
      const commit = (next) => { saveStore(next); storeRef.current = next; setStore(next); };
      const updateStore = (fn) => commit(fn(storeRef.current));

      // ---- Ordner auf der Platte (s. Abschnitt oben) ----
      const [dir, setDir] = useState({ handle: null, status: dirSupported ? 'none' : 'unsupported' });
      // Der Ordner, der gerade gelten soll. Ein Auftrag, der erst fertig wird,
      // nachdem der Nutzer getrennt oder gewechselt hat, erkennt sich daran
      // als überholt und lässt Store wie Status in Ruhe.
      const wanted = useRef(null);
      // Der Stand, den der Ordner zuletzt gesehen hat: mirrorDir schreibt nur
      // die Differenz dazu. Was vom Ordner kommt, wird darauf gesetzt, statt
      // zurückgeschrieben — sonst bügelte die App jede von Hand geschriebene
      // Datei in ihr eigenes Format.
      const mirrored = useRef(null);
      // Alle Ordner-Zugriffe laufen hintereinander: ein Nachlesen darf nicht
      // in ein halb geschriebenes Set hineinlesen.
      const queue = useRef(Promise.resolve());
      const enqueue = (job) => (queue.current = queue.current.then(job).catch((e) => {
        console.error(e);
        if (wanted.current) setDir((d) => ({ ...d, status: 'error' })); // nach dem Trennen schweigen
      }));
      const takeDisk = (handle, keepAll) => {
        wanted.current = handle;
        return enqueue(async () => {
          const disk = await readDir(handle);
          if (wanted.current !== handle) return;
          const { next, onDisk } = fromDisk(storeRef.current, disk, keepAll);
          mirrored.current = onDisk;
          // Der Fokus-Effekt liest bei jedem Fenster-Wechsel nach; hat sich im
          // Ordner nichts getan, sollen weder localStorage noch die Liste
          // etwas davon merken.
          if (JSON.stringify(next) !== JSON.stringify(storeRef.current)) commit(next);
          setDir((d) => (d.status === 'ok' && d.handle === handle ? d : { handle, status: 'ok' }));
        });
      };
      useEffect(() => {
        if (!dirSupported) return;
        loadDirHandle().then(async (handle) => {
          if (!handle) return;
          const perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') takeDisk(handle, false); else setDir({ handle, status: 'prompt' });
        });
      }, []);
      useEffect(() => {
        if (dir.status !== 'ok' || !mirrored.current || mirrored.current === store) return;
        const base = mirrored.current;
        mirrored.current = store;
        // Nicht geschrieben heisst nicht gespiegelt: bleibt der neue Stand
        // nach einem Fehler stehen, holt ihn kein späterer Lauf mehr nach und
        // «Neu laden» verwürfe die Änderung auch im Browser.
        enqueue(() => (wanted.current !== dir.handle ? null : mirrorDir(dir.handle, base, store))
          .catch((e) => { mirrored.current = base; throw e; }));
      }, [store, dir]);
      // Im Finder abgelegte oder gelöschte Dateien erscheinen beim Wechsel
      // zurück ins Fenster — MyKahoot liest seine Quizzes ebenso live.
      useEffect(() => {
        if (dir.status !== 'ok') return;
        const onFocus = () => takeDisk(dir.handle, false);
        window.addEventListener('focus', onFocus);
        return () => window.removeEventListener('focus', onFocus);
      }, [dir.status, dir.handle]);
      const connectDir = async () => {
        let handle;
        try { handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'myvoci' }); }
        catch { return; } // abgebrochen
        await saveDirHandle(handle);
        takeDisk(handle, true);
      };
      // Kein `keepAll`: der Ordner ist die Wahrheit. Sets, die nur im Browser
      // entstanden sind, bleiben trotzdem (sie tragen kein `disk`-Merkmal).
      const reconnectDir = async () => {
        try {
          if ((await dir.handle.requestPermission({ mode: 'readwrite' })) === 'granted') takeDisk(dir.handle, false);
        } catch { setDir((d) => ({ ...d, status: 'error' })); }
      };
      const disconnectDir = () => { wanted.current = null; saveDirHandle(null); mirrored.current = null; setDir({ handle: null, status: 'none' }); };
      const dirApi = {
        status: dir.status, name: dir.handle ? dir.handle.name : '',
        connect: connectDir, reconnect: reconnectDir, disconnect: disconnectDir, refresh: () => takeDisk(dir.handle, false),
      };
      const insertSet = (prev, set, dropBy) => ({ ...prev, sets: [...prev.sets.filter(dropBy), set].sort(byTitle) });
      // Dasselbe Set = gleicher Ort (s. samePlace). Nur über den Titel
      // ersetzte ein Import das gleichnamige Set eines anderen Kindes.
      const importSet = (set) => updateStore((prev) => {
        const old = prev.sets.find((s) => samePlace(s, set));
        return insertSet(prev, old ? { ...old, ...set, id: old.id } : set, (s) => !samePlace(s, set));
      });
      // ---- Sicherung: Sets + Ordner + Lernstand in einer Datei ----
      // Einlesen ergänzt: gleicher Titel im gleichen Ordner = dasselbe Set
      // (id des alten Stands bleibt, sein Lernstand wird darauf umgehängt),
      // Lernstand pro Wort gewinnt der neuere Versuch.
      const backup = {
        // `disk`/`file` sind Buchführung des Ordners, kein Inhalt: in einer
        // Sicherung stünde sonst auf einem fremden Gerät «lag schon im Ordner».
        save: () => download('MyVoci-Sicherung.json', JSON.stringify(
          { app: 'myvoci', version: 1, ...store, sets: store.sets.map(({ disk, file, ...s }) => s), progress }, null, 1)),
        restore: (text) => {
          let data;
          try { data = JSON.parse(text); } catch { return null; }
          if (!data || data.app !== 'myvoci' || !Array.isArray(data.sets)) return null;
          if (!Array.isArray(data.folders)) data.folders = [];
          if (!data.progress || typeof data.progress !== 'object') data.progress = {};
          const idMap = {};
          updateStore((prev) => {
            let next = { ...prev, folders: [...new Set([...prev.folders, ...(data.folders || [])])] };
            for (let s of data.sets) {
              if (!s || typeof s.title !== 'string' || !Array.isArray(s.words)) continue;
              s = { ...s, dir: typeof s.dir === 'string' ? s.dir : '', words: s.words.filter((w) => w && typeof w.a === 'string' && typeof w.b === 'string') };
              if (!s.words.length) continue;
              const old = next.sets.find((x) => samePlace(x, s));
              // «Ergänzt, was fehlt» — genau das, was der Hilfetext verspricht:
              // vorhandene Wörter bleiben in ihrer Reihenfolge stehen, neue
              // kommen hinten dazu. Sonst warf eine ältere Sicherung die Arbeit
              // seit dem Herunterladen weg.
              const mergedWords = old ? mergeWords(old.words, s.words) : s.words;
              const merged = old ? { ...old, ...s, words: mergedWords, id: old.id } : { ...s, id: s.id || newId() };
              idMap[s.id] = merged.id;
              next = insertSet(next, merged, (x) => !samePlace(x, s));
            }
            return next;
          });
          updateProgress((prev) => {
            const next = { ...prev };
            for (const [key, words] of Object.entries(data.progress || {})) {
              const target = idMap[key] || key;
              const mine = { ...(next[target] || {}) };
              for (const [wk, rec] of Object.entries(words || {})) {
                // Nur brauchbare Einträge: ein fehlendes `box`/`last` machte
                // aus dem Fortschrittsbalken NaN-Breiten und «nie fällig».
                if (!rec || typeof rec.box !== 'number' || typeof rec.last !== 'number') continue;
                if (!mine[wk] || rec.last > mine[wk].last) mine[wk] = rec;
              }
              next[target] = mine;
            }
            return next;
          });
          return data.sets.length;
        },
      };

      const saveSet = (set) => {
        const saved = set.id ? set : { ...set, id: newId() };
        updateStore((prev) => insertSet(prev, saved, (s) => s.id !== saved.id));
        back();
      };
      const deleteSet = (id) => updateStore((prev) => ({ ...prev, sets: prev.sets.filter((s) => s.id !== id) }));

      const updateProgress = (fn) => setProgress((prev) => { const next = fn(prev); writeLocal(PROGRESS_KEY, next); return next; });
      const recordResult = (setKey, word, ok) => updateProgress((prev) => {
        const p = prev[setKey] || {};
        return { ...prev, [setKey]: { ...p, [wordKey(word)]: applyResult(p[wordKey(word)], ok) } };
      });
      const resetProgress = (setKey) => updateProgress((prev) => { const next = { ...prev }; delete next[setKey]; return next; });

      // Ein gescanntes Set bleibt im Browser: es wird übernommen wie ein
      // Import und dann als eigenes geöffnet (`local=`, Optionen des Links
      // bleiben). Gleicher Ort = dasselbe Set, ein korrigierter Link ersetzt
      // es also. Der Link trägt keinen Ordner, landet darum zuoberst — es sei
      // denn, das Set liegt unverändert schon irgendwo (die Lehrperson öffnet
      // den eigenen Link): dann wird das geöffnet, ohne Zweitkopie. Ein
      // Lernstand aus der Zeit, als Links nur angezeigt wurden (`link:`-
      // Schlüssel), wandert auf die id.
      const keepLink = (set) => {
        const sets = storeRef.current.sets;
        const here = sets.find((s) => samePlace(s, set));
        const twins = here ? [] : sets.filter((s) => s.title === set.title);
        const same = twins.length === 1 && JSON.stringify(twins[0].words) === JSON.stringify(set.words) ? twins[0] : null;
        const id = here ? here.id : same ? same.id : newId();
        if (!same) importSet({ ...set, id, dir: here ? here.dir || '' : '' });
        updateProgress((prev) => {
          const linkKey = `link:${set.title}`;
          if (!prev[linkKey] || prev[id]) return prev;
          const next = { ...prev, [id]: prev[linkKey] };
          delete next[linkKey];
          return next;
        });
        const rest = hashParts().filter((x) => x !== routePart());
        history.replaceState(null, '', location.pathname + location.search + '#' + ['local=' + id, ...rest].join('&'));
        setRoute(getRoute());
      };

      const cleanName = (name) => (name || '').trim().replace(/\//g, '-').replace(/^\.+$/, '-');
      const makeFolder = (parent, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const path = parent ? `${parent}/${name}` : name;
        updateStore((prev) => (prev.folders.includes(path) ? prev : { ...prev, folders: [...prev.folders, path] }));
        return path;
      };
      // `false` heisst «am Ziel liegt schon ein Ordner dieses Namens» — ohne
      // die Prüfung verschmölzen die beiden stillschweigend zu einem, und der
      // Weg zurück fehlt (remapDir schreibt die Pfade um und dedupliziert).
      const folderTaken = (target) => allFolders(store).includes(target);
      const renameFolder = (dir, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const target = parentDir(dir) ? `${parentDir(dir)}/${name}` : name;
        if (target === dir) return null;
        if (folderTaken(target)) return false;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const moveFolder = (dir, parent) => {
        const target = parent ? `${parent}/${dirName(dir)}` : dirName(dir);
        if (folderTaken(target)) return false;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const removeFolder = (dir) => updateStore((prev) => ({ ...prev, folders: prev.folders.filter((f) => f !== dir) }));
      const moveSet = (id, dir) => updateStore((prev) => ({ ...prev, sets: prev.sets.map((s) => (s.id === id ? { ...s, dir } : s)) }));
      const folderApi = { makeFolder, renameFolder, moveFolder, removeFolder, moveSet };

      const back = () => {
        history.replaceState(null, '', location.pathname);
        restoreLang();
        setRoute(null);
      };

      if (route && (route.type === 'edit' || route.type === 'new')) {
        const target = route.type === 'new' ? { id: null, title: '', dir: route.dir, words: [] } : own.find((s) => s.id === route.id);
        if (!target) {
          return (
            <div className={`${SCREEN} p-8 text-center text-gray-500`}>
              {t('errGone')}
              <button onClick={back} className="block mx-auto mt-4 underline">{t('backToList')}</button>
            </div>
          );
        }
        return (
          <SetEditor key={route.type === 'new' ? 'new' : route.id} set={target} sets={own} folders={folders}
            onSave={saveSet} onCancel={back} onNewFolder={makeFolder} />
        );
      }

      return route
        ? <Open key={JSON.stringify(route)} route={route} own={own} progress={progress} onKeep={keepLink} onResult={recordResult} onReset={resetProgress} onBack={back} />
        : (
          <Selection own={own} folders={folders} onOpen={openSet} onEdit={editSet} onNew={newSet}
            onImport={importSet} onDelete={deleteSet} folderApi={folderApi} backup={backup} dir={dirApi} />
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
