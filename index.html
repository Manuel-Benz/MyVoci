        if (mode === 'gap') { const gap = gapFor(item.word); return { ...gap, solution: gap.form, prompt: item.word.a }; }
        if (mode === 'listen') return { solution: firstAlt(solution), spoken: firstAlt(solution), prompt: promptOf(item) };
        if (mode === 'choice') return { solution, prompt: promptOf(item), options: shuffleArray([solution, ...distractors(set, item)]) };
        if (mode === 'scramble') return { solution: firstAlt(solution), prompt: promptOf(item), letters: scrambleLetters(firstAlt(solution)) };
        return { solution, prompt: promptOf(item) };
      }, [item]); // nicht an der Warteschlange: die wächst bei jedem Fehler, die Aufgabe bliebe sonst nicht stehen

      useEffect(() => { if (phase === 'ask' || phase === 'copy') inputRef.current && inputRef.current.focus(); }, [phase, pos]);
      useEffect(() => {
        if (!exam) return;
        // Der Klick auf «Üben starten» liegt nur Millisekunden zurück — das
        // reicht dem Browser als Geste fürs Vollbild.
        if (canFullscreen() && !fsElement()) toggleFullscreen();
        const onFs = () => { if (!fsElement()) leaves.current++; };
        const onHide = () => { if (document.hidden) leaves.current++; };
        document.addEventListener('fullscreenchange', onFs);
        document.addEventListener('webkitfullscreenchange', onFs);
        document.addEventListener('visibilitychange', onHide);
        return () => {
          document.removeEventListener('fullscreenchange', onFs);
          document.removeEventListener('webkitfullscreenchange', onFs);
          document.removeEventListener('visibilitychange', onHide);
        };
      }, []);
      // Hören: das Wort kommt von selbst, sobald die Aufgabe da ist
      useEffect(() => { if (mode === 'listen' && item) setTimeout(() => speak(task.spoken, answerLang), 300); }, [pos]);

      // Ergebnis verbuchen. Gibt den neuen Stand zurück, weil Karteikarten
      // sofort weiterschalten — dort darf `next` nicht mit dem alten Zustand
      // rechnen (sonst fehlt das letzte Wort in der Bilanz und die
      // Wiederholung fällt weg).
      const finish = (ok, typed = null, solution = task.solution) => {
        if (item.retry) return { nextLog: log, nextQueue: queue };
        onResult(item.word, ok);
        const nextLog = [...log, { item, ok, input: typed, solution }];
        // In der Prüfung gibt es keine zweite Chance
        const nextQueue = ok || exam ? queue : [...queue, { ...item, retry: true }];
        setLog(nextLog);
        setQueue(nextQueue);
        return { nextLog, nextQueue };
      };
      const settle = (r, typed) => {
        const { nextLog, nextQueue } = finish(r.status !== 'wrong', typed, r.solution);
        if (exam) { next(nextQueue, nextLog); return; } // keine Rückmeldung, gleich weiter
        setResult(r);
        setPhase(r.status === 'wrong' && opts.copy && TYPED_MODES.includes(mode) ? 'copy' : 'feedback');
      };
      const check = () => {
        if (!input.trim()) return;
        settle(checkAnswer(input, task.solution, { level: opts.level, lang: answerLang }), input);
      };
      const checkCopy = () => {
        if (checkAnswer(copyInput, result.solution, { level: 'strict' }).status === 'wrong') { setCopyMiss(true); return; }
        setPhase('feedback');
      };
      const pick = (option) => {
        if (phase !== 'ask') return;
        setPicked(option);
        settle({ status: option === task.solution ? 'right' : 'wrong', solution: task.solution }, option);
      };
      const addTile = (i) => {
        if (phase !== 'ask' || built.includes(i)) return;
        const next = [...built, i];
        setBuilt(next);
        if (next.length === task.letters.length) {
          const typed = next.map((j) => task.letters[j]).join('');
          settle(checkAnswer(typed, task.solution.replace(/\s+/g, ''), { level: 'strict' }), typed);
        }
      };
      const rate = (ok) => { const { nextLog, nextQueue } = finish(ok); next(nextQueue, nextLog); };
      const next = (q = queue, l = log) => {
        if (pos + 1 >= q.length) {
          if (exam && fsElement()) toggleFullscreen();
          onDone({ log: l, seconds: Math.round((Date.now() - startedAt) / 1000), exam, leaves: leaves.current });
          return;
        }
        setPos(pos + 1);
        setPhase('ask');
        setInput('');
        setCopyInput('');
        setCopyMiss(false);
        setResult(null);
        setPicked(null);
        setBuilt([]);
      };
      const onKey = (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (phase === 'ask') { if (TYPED_MODES.includes(mode)) check(); }
        else if (phase === 'copy') checkCopy();
        else next();
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });

      if (!item) return null;
      const hint = opts.hints && !exam && item.word.h;
      const promptLabel = mode === 'gap' ? sideName(set, 0)
        : (langOf(set, item, 'prompt') ? langName(promptLang) : (item.dir === 'ab' ? t('sideA') : t('sideB')));

      const inputField = (ref, value, onChange, cls = '') => (
        <input ref={ref} type="text" value={value} onChange={onChange} placeholder={t('answerPh')}
          autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck={false} lang={TTS_LOCALE[answerLang] || undefined}
          className={`flex-1 min-w-0 ${INPUT} text-2xl py-3 ${cls}`} />
      );

      const feedbackBox = (typed) => (
        <div className={`rounded-lg border-2 p-4 ${STATUS_CLASS[result.status]}`}>
          <div className="font-bold text-lg mb-2">
            {t(result.status)}{result.note && <span className="font-normal text-sm"> · {t(result.note)}</span>}
          </div>
          {result.status !== 'right' && typed !== null ? (() => {
            const [A, B] = charDiff(baseNorm(typed), result.solution);
            return (
              <div className="space-y-1 text-lg">
                <div><span className={`${LABEL} mr-2`}>{t('yourInput')}</span><DiffText parts={A} cls="diff-del" /></div>
                <div><span className={`${LABEL} mr-2`}>{t('solution')}</span><b><DiffText parts={B} cls="diff-ins" /></b> <SpeakButton text={task.solution} lang={answerLang} /></div>
              </div>
            );
          })() : (
            <div className="text-lg"><b>{task.solution}</b> <SpeakButton text={task.solution} lang={answerLang} /></div>
          )}
          {mode === 'listen' && <div className="text-gray-700 mt-1">{promptLabel}: <b>{task.prompt}</b></div>}
          {mode !== 'gap' && <Sentences word={item.word} solution={solutionOf(item)} />}
        </div>
      );

      const nextButton = phase === 'feedback' && (
        <button autoFocus onClick={() => next()} className={`w-full mt-4 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('next')} →</button>
      );
      const copyBlock = phase === 'copy' && (
        <div className="mt-4">
          <div className="text-sm text-gray-600 mb-1">{t('copyPrompt2')}</div>
          <div className="flex gap-2">
            {inputField(inputRef, copyInput, (e) => { setCopyInput(e.target.value); setCopyMiss(false); }, copyMiss ? 'border-red-400' : '')}
            <button onClick={checkCopy} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
          </div>
          {copyMiss && <p className="text-sm text-red-600 mt-1">{t('copyNotYet')}</p>}
        </div>
      );

      // ---- der Aufgabenteil je Modus ----
      let body;
      if (mode === 'pen') {
        body = (
          <>
            <Sketch penOnly={opts.penOnly} clearKey={sketchKey} />
            {phase === 'ask' ? (
              <div className="flex gap-3 mt-3">
                <button onClick={() => setSketchKey((k) => k + 1)} className={`px-4 py-3 ${BTN_SECONDARY}`}>{t('penClear')}</button>
                <button onClick={() => setPhase('back')} className={`flex-1 ${BTN_PRIMARY} px-6 py-3 text-lg`}>{t('reveal')}</button>
              </div>
            ) : (
              <div className="mt-4">
                <div className={`${LABEL} mb-1`}>{t('solution')}</div>
                <div className="flex items-start gap-3">
                  <div className="flex-1 text-3xl font-bold text-blue-700 break-words">{task.solution}</div>
                  <SpeakButton text={task.solution} lang={answerLang} />
                </div>
                <Sentences word={item.word} solution={task.solution} />
                <div className="flex gap-3 mt-4">
                  <button onClick={() => { setSketchKey((k) => k + 1); rate(false); }} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-red-100 text-red-700 hover:bg-red-200 text-lg">{t('knewNot')}</button>
                  <button onClick={() => { setSketchKey((k) => k + 1); rate(true); }} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-green-100 text-green-700 hover:bg-green-200 text-lg">{t('knew')}</button>
                </div>
              </div>
            )}
          </>
        );
      } else if (mode === 'cards') {
        body = phase === 'ask' ? (
          <button onClick={() => setPhase('back')} className={`w-full ${BTN_PRIMARY} px-6 py-6 text-xl`}>{t('flip')}</button>
        ) : (
          <>
            <div className={`${LABEL} mb-1`}>{t('solution')}</div>
            <div className="flex items-start gap-3">
              <div className="flex-1 text-3xl font-bold text-blue-700 break-words">{task.solution}</div>
              <SpeakButton text={task.solution} lang={answerLang} />
            </div>
            <Sentences word={item.word} solution={task.solution} />
            <div className="flex gap-3 mt-6">
              <button onClick={() => rate(false)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-red-100 text-red-700 hover:bg-red-200 text-lg">{t('knewNot')}</button>
              <button onClick={() => rate(true)} className="flex-1 px-4 py-4 rounded-lg font-semibold bg-green-100 text-green-700 hover:bg-green-200 text-lg">{t('knew')}</button>
            </div>
          </>
        );
      } else if (mode === 'choice') {
        body = (
          <>
            <div className="grid sm:grid-cols-2 gap-3">
              {task.options.map((o) => {
                const state = phase === 'ask' ? '' : o === task.solution ? 'bg-green-100 border-green-400 text-green-800'
                  : o === picked ? 'bg-red-100 border-red-400 text-red-800' : 'opacity-50';
                return (
                  <button key={o} onClick={() => pick(o)} disabled={phase !== 'ask'}
                    className={`px-4 py-4 rounded-lg border-2 border-gray-200 bg-white text-lg font-semibold text-gray-800 text-left break-words hover:border-blue-400 hover:bg-blue-50 transition-all ${state}`}>
                    {o}
                  </button>
                );
              })}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(null)}</div>}
            {nextButton}
          </>
        );
      } else if (mode === 'scramble') {
        body = (
          <>
            <div className="min-h-[3.5rem] flex flex-wrap gap-1 items-center p-2 rounded-lg border-2 border-dashed border-gray-300 mb-3">
              {built.map((j, k) => (
                <button key={k} onClick={() => phase === 'ask' && setBuilt(built.slice(0, k))}
                  className="w-11 h-11 rounded-lg bg-blue-100 text-blue-800 text-xl font-bold">{task.letters[j]}</button>
              ))}
            </div>
            <div className="flex flex-wrap gap-1">
              {task.letters.map((ch, j) => (
                <button key={j} onClick={() => addTile(j)} disabled={built.includes(j) || phase !== 'ask'}
                  className={`w-11 h-11 rounded-lg text-xl font-bold shadow transition-all ${built.includes(j) ? 'bg-gray-100 text-gray-300' : 'bg-white text-gray-800 hover:bg-blue-50'}`}>
                  {ch}
                </button>
              ))}
              {phase === 'ask' && built.length > 0 && (
                <button onClick={() => setBuilt([])} className={`px-3 text-sm ${BTN_SECONDARY}`}>{t('clearTiles')}</button>
              )}
            </div>
            {phase === 'feedback' && <div className="mt-4">{feedbackBox(built.map((j) => task.letters[j]).join(''))}</div>}
            {nextButton}
          </>
        );
      } else {
        // Schreiben, Lückentext, Hören: Eingabefeld
        body = (
          <>
            {phase === 'ask' && (
              <div className="flex gap-2">
                {inputField(inputRef, input, (e) => setInput(e.target.value))}
                <button onClick={check} className={`${BTN_PRIMARY} px-5`}>{t('check')}</button>
              </div>
            )}
            {(phase === 'feedback' || phase === 'copy') && feedbackBox(input)}
            {copyBlock}
            {nextButton}
          </>
        );
      }

      // ---- Kopf der Karte: Was wird gefragt? ----
      let head;
      if (mode === 'gap') {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{t('sentence')}</div>
            <div className="text-2xl sm:text-3xl font-semibold text-gray-800 leading-relaxed mb-3">
              {task.before}<span className="inline-block min-w-[5rem] border-b-4 border-blue-400 text-blue-700 px-1 text-center">
                {phase === 'ask' ? ' ' : task.solution}</span>{task.after}
            </div>
            <div className="text-gray-600"><span className={`${LABEL} mr-2`}>{promptLabel}</span><b className="text-xl">{task.prompt}</b>{hint && <span className="text-sm text-gray-500 ml-2">{hint}</span>}</div>
          </>
        );
      } else if (mode === 'listen') {
        head = (
          <div className="flex flex-col items-center gap-3 py-2">
            <SpeakButton text={task.spoken} lang={answerLang} big />
            <div className="text-sm text-gray-400">{t('hearAgain')}: {langName(answerLang)}</div>
            {hint && <div className="text-sm text-gray-500">{hint}</div>}
          </div>
        );
      } else {
        head = (
          <>
            <div className={`${LABEL} mb-2`}>{promptLabel}</div>
            <div className="flex items-start gap-3 mb-1">
              <div className="flex-1 text-3xl sm:text-4xl font-bold text-gray-800 break-words">{task.prompt}</div>
              <SpeakButton text={task.prompt} lang={promptLang} />
            </div>
            {hint && <div className="text-sm text-gray-500 mb-2">{hint}</div>}
          </>
        );
      }

      return (
        <div className={`${SCREEN} p-4 sm:p-8`} onKeyDown={onKey}>
          <PracticeFrame set={set} pos={pos} queue={queue.length} total={total} item={item} onQuit={quit}
            extra={exam && <span className="ml-2 px-1.5 rounded bg-red-100 text-red-700 text-xs font-semibold">{t('examTag')}</span>}>
            <div className={`${CARD} p-6 sm:p-8 mb-4`}>
              {head}
              <div className="mt-6">{body}</div>
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Zuordnen ----------
    // Gruppen von bis zu MATCH_GROUP Paaren: links Sprache A, rechts Sprache B
    // gemischt. Ein Wort gilt als gewusst, wenn sein erstes Antippen richtig
    // zugeordnet wurde. Keine Wiederholungsschlange — die Gruppe ist erst
    // fertig, wenn alle Paare stehen.
    const MATCH_GROUP = 6;
    const MatchRound = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [groups] = useState(() => {
        const list = opts.order === 'random' ? shuffleArray(words) : words;
        const out = [];
        for (let i = 0; i < list.length; i += MATCH_GROUP) out.push(list.slice(i, i + MATCH_GROUP));
        // Eine Restgruppe mit einem einzigen Paar wäre keine Aufgabe: ans Ende der vorigen
        if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(...out.pop());
        return out;
      });
      const [g, setG] = useState(0);
      const [right, setRight] = useState(() => shuffleArray(groups[0]));
      const [left, setLeft] = useState(null); // gewähltes Wort links
      const [matched, setMatched] = useState([]); // Wörter (Objekte) dieser Gruppe
      const [flash, setFlash] = useState(null); // { l, r } bei Fehlversuch
      const [errored, setErrored] = useState([]); // Wörter mit Fehlversuch
      const [log, setLog] = useState([]);
      const [startedAt] = useState(Date.now);
      const [dialog, setDialog] = useState(null);
      const group = groups[g];
      const doneBefore = groups.slice(0, g).reduce((n, gr) => n + gr.length, 0);

      const pickRight = (w) => {
        if (!left || flash || matched.includes(w)) return;
        if (w === left) {
          const ok = !errored.includes(w);
          onResult(w, ok);
          const nextLog = [...log, { item: { word: w, dir: 'ab' }, ok }];
          setLog(nextLog);
          const nextMatched = [...matched, w];
          setMatched(nextMatched);
          setLeft(null);
          if (nextMatched.length === group.length) {
            setTimeout(() => {
              if (g + 1 >= groups.length) { onDone({ log: nextLog, seconds: Math.round((Date.now() - startedAt) / 1000) }); return; }
              setG(g + 1);
              setRight(shuffleArray(groups[g + 1]));
              setMatched([]);
              setErrored([]);
            }, 500);
          }
        } else {
          setErrored((e) => (e.includes(left) ? e : [...e, left]));
          setFlash({ l: left, r: w });
          setTimeout(() => { setFlash(null); setLeft(null); }, 700);
        }
      };
      const quit = () => setDialog({ kind: 'confirm', ok: t('quit'), text: t('confirmQuit'), onYes: onBack });
      const tile = (w, side, onClick, active) => {
        const isMatched = matched.includes(w);
        const isFlash = flash && (side === 'l' ? flash.l === w : flash.r === w);
        return (
          <button key={wordKey(w) + side} onClick={onClick} disabled={isMatched}
            className={`w-full px-3 py-3 rounded-lg border-2 text-left font-semibold break-words transition-all ${
              isMatched ? 'bg-green-100 border-green-300 text-green-800 opacity-60'
              : isFlash ? 'bg-red-100 border-red-400 text-red-800'
              : active ? 'bg-blue-100 border-blue-500 text-blue-900'
              : 'bg-white border-gray-200 text-gray-800 hover:border-blue-400'}`}>
            {side === 'l' ? w.a : w.b}
          </button>
        );
      };

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <PracticeFrame set={set} pos={doneBefore + matched.length} queue={words.length} total={words.length} item={null} onQuit={quit}
            extra={groups.length > 1 && <span className="ml-2 text-xs text-gray-400">{t('groupN', g + 1, groups.length)}</span>}>
            <div className={`${CARD} p-4 sm:p-6 mb-4`}>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6 mb-2">
                <div className={LABEL}>{sideName(set, 0)}</div>
                <div className={LABEL}>{sideName(set, 1)}</div>
              </div>
              <div className="grid grid-cols-2 gap-x-3 sm:gap-x-6">
                <div className="space-y-2">{group.map((w) => tile(w, 'l', () => !flash && !matched.includes(w) && setLeft(left === w ? null : w), left === w))}</div>
                <div className="space-y-2">{right.map((w) => tile(w, 'r', () => pickRight(w), false))}</div>
              </div>
              {flash && <p className="text-center text-red-600 font-semibold mt-3">{t('wrongPair')}</p>}
            </div>
          </PracticeFrame>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Rundenende ----------
    const Summary = ({ set, log, seconds, exam, leaves, onRetry, onAgain, onBack }) => {
      const ok = log.filter((e) => e.ok).length;
      const wrong = log.filter((e) => !e.ok);
      const [settingsButton, settingsPanel] = useSettings();
      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className="max-w-2xl mx-auto">
            <div className="flex items-center gap-2 mb-6">
              <button onClick={onBack} className="shrink-0 bg-white px-4 py-2 rounded-lg shadow hover:shadow-md transition-all font-semibold text-gray-700">← {t('toSet')}</button>
              <div className="flex-1 min-w-0 text-center text-gray-500 truncate">{set.title}</div>
              {settingsButton}
            </div>
            {settingsPanel}
            <div className={`${CARD} p-6 sm:p-8 text-center mb-4`}>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{t('done')}</h2>
              <div className="text-5xl font-bold my-4 bg-gradient-to-r from-blue-500 to-emerald-500 bg-clip-text text-transparent">
                {log.length ? Math.round((ok / log.length) * 100) : 0}%
              </div>
              <p className="text-gray-600">{t('result', ok, log.length)}</p>
              <p className="text-gray-400 text-sm">{t('timeUsed', Math.floor(seconds / 60), seconds % 60)}</p>
              {exam && (
                <p className={`mt-2 font-semibold ${leaves ? 'text-red-600' : 'text-green-700'}`}>
                  {leaves ? t('examLeaves', leaves) : t('examNoLeaves')}
                </p>
              )}
            </div>
            {exam && (
              <div className={`${CARD} p-4 sm:p-6 mb-4 overflow-x-auto`}>
                <h3 className="font-semibold text-gray-700 mb-2">{t('examResults')}</h3>
                <table className="w-full text-sm text-left">
                  <thead><tr className={LABEL}><th className="pr-2 py-1">#</th><th className="pr-2">{t('colQuestion')}</th><th className="pr-2">{t('colAnswer')}</th><th className="pr-2">{t('colSolution')}</th><th></th></tr></thead>
                  <tbody>
                    {log.map((e, i) => (
                      <tr key={i} className={`border-t border-gray-100 ${e.ok ? '' : 'bg-red-50'}`}>
                        <td className="pr-2 py-1 text-gray-400">{i + 1}</td>
                        <td className="pr-2 py-1 font-semibold">{promptOf(e.item)}</td>
                        <td className={`pr-2 py-1 ${e.ok ? 'text-green-700' : 'text-red-700'}`}>{e.input || t('noAnswer')}</td>
                        <td className="pr-2 py-1">{e.solution || solutionOf(e.item)}</td>
                        <td className="py-1">{e.ok ? '✓' : '✗'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {wrong.length ? (
              <div className={`${CARD} p-6 mb-4`}>
                <h3 className="font-semibold text-gray-700 mb-2">{t('wrongWords')}</h3>
                <ul className="space-y-1 text-gray-700">
                  {wrong.map((e, i) => <li key={i}><b>{promptOf(e.item)}</b> — {solutionOf(e.item)}</li>)}
                </ul>
              </div>
            ) : <p className="text-center text-green-700 font-semibold mb-4">{t('allRight')}</p>}
            <div className="flex flex-col sm:flex-row gap-3">
              {wrong.length > 0 && <button onClick={() => onRetry(wrong.map((e) => e.item.word))} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>{t('retryWrong')}</button>}
              <button onClick={onAgain} className={`flex-1 px-4 py-3 ${wrong.length ? BTN_SECONDARY : BTN_PRIMARY}`}>{t('again')}</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Trainer: Set-Seite → Runde → Ende ----------
    const Trainer = ({ set, setKey, progress, onResult, onReset, onBack }) => {
      const [stage, setStage] = useState({ kind: 'setup' });
      const prog = progress[setKey] || {};
      const startRound = (opts, words) => setStage({ kind: 'run', opts, words, n: Date.now() });

      if (stage.kind === 'run') {
        const Round = stage.opts.mode === 'match' ? MatchRound : Practice;
        return (
          <Round key={stage.n} set={set} opts={stage.opts} words={stage.words}
            onResult={(word, ok) => onResult(setKey, word, ok)}
            onDone={({ log, seconds, exam, leaves }) => setStage({ kind: 'done', opts: stage.opts, words: stage.words, log, seconds, exam, leaves })}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      if (stage.kind === 'done') {
        return (
          <Summary set={set} log={stage.log} seconds={stage.seconds} exam={stage.exam} leaves={stage.leaves}
            onRetry={(words) => startRound(stage.opts, words)}
            onAgain={() => startRound(stage.opts, stage.words)}
            onBack={() => setStage({ kind: 'setup' })} />
        );
      }
      return <SetPage set={set} prog={prog} onStart={startRound} onReset={() => onReset(setKey)} onBack={onBack} />;
    };

    // ---------- Set aus der Route laden ----------
    const Open = ({ route, own, progress, onResult, onReset, onBack }) => {
      const [set, setSet] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        setSet(null);
        setError(null);
        if (route.type === 'demo') {
          const demo = demoById(route.id);
          demo ? setSet(demo) : setError(t('errNoSuchSet'));
        } else if (route.type === 'local') {
          const s = own.find((m) => m.id === route.id);
          s ? setSet(s) : setError(t('errNotStored'));
        } else {
          decodeSet(route.data)
            .then((s) => (s.words.length ? setSet(s) : setError(t('errLinkEmpty'))))
            .catch(() => setError(t('errLinkBroken')));
        }
      }, [route.type, route.id, route.data]);

      if (error) {
        return (
          <div className={`${SCREEN} p-8 flex flex-col items-center justify-center gap-4`}>
            <div className="text-xl text-red-600 font-semibold text-center">{error}</div>
            <button onClick={onBack} className={`${BTN_PRIMARY} px-6 py-3`}>{t('toOverview')}</button>
          </div>
        );
      }
      if (!set) return <div className={`${SCREEN} p-8 text-center text-gray-500`}>{t('loading')}</div>;
      // Der Lernstand hängt am Set: eigene über die id, Beispiele über ihren
      // Namen, geteilte Links über den Titel (der Link selbst ändert bei jeder
      // Korrektur der Lehrperson, der Titel bleibt).
      const setKey = route.type === 'demo' ? `demo:${set.id}` : route.type === 'local' ? set.id : `link:${set.title}`;
      return <Trainer set={set} setKey={setKey} progress={progress} onResult={onResult} onReset={onReset} onBack={onBack} />;
    };

    // ---------- App ----------
    const App = () => {
      const [route, setRoute] = useState(getRoute);
      const [store, setStore] = useState(loadStore);
      const [progress, setProgress] = useState(loadProgress);
      const [, redraw] = useState(currentLang);
      redrawLang = redraw;
      const own = store.sets;
      const folders = allFolders(store);

      useEffect(() => {
        const onHash = () => { applyLang(langFromHash() || loadLang()); setRoute(getRoute()); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const openSet = (set) => { location.hash = toHash(set); };
      const editSet = (set) => { location.hash = withLang('#edit=' + set.id); };
      const newSet = (dir) => { location.hash = withLang('#new=' + encodeURIComponent(dir || '')); };

      const updateStore = (fn) => setStore((prev) => { const next = fn(prev); saveStore(next); return next; });
      const insertSet = (prev, set, dropBy) => ({ ...prev, sets: [...prev.sets.filter(dropBy), set].sort(byTitle) });
      const importSet = (set) => updateStore((prev) => {
        const old = prev.sets.find((s) => s.title === set.title);
        return insertSet(prev, old ? { ...old, ...set, id: old.id } : set, (s) => s.title !== set.title);
      });
      const saveSet = (set) => {
        const saved = set.id ? set : { ...set, id: newId() };
        updateStore((prev) => insertSet(prev, saved, (s) => s.id !== saved.id));
        back();
      };
      const deleteSet = (id) => updateStore((prev) => ({ ...prev, sets: prev.sets.filter((s) => s.id !== id) }));

      const updateProgress = (fn) => setProgress((prev) => { const next = fn(prev); writeLocal(PROGRESS_KEY, next); return next; });
      const recordResult = (setKey, word, ok) => updateProgress((prev) => {
        const p = prev[setKey] || {};
        return { ...prev, [setKey]: { ...p, [wordKey(word)]: applyResult(p[wordKey(word)], ok) } };
      });
      const resetProgress = (setKey) => updateProgress((prev) => { const next = { ...prev }; delete next[setKey]; return next; });

      const cleanName = (name) => (name || '').trim().replace(/\//g, '-').replace(/^\.+$/, '-');
      const makeFolder = (parent, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const path = parent ? `${parent}/${name}` : name;
        updateStore((prev) => (prev.folders.includes(path) ? prev : { ...prev, folders: [...prev.folders, path] }));
        return path;
      };
      const renameFolder = (dir, rawName) => {
        const name = cleanName(rawName);
        if (!name) return null;
        const target = parentDir(dir) ? `${parentDir(dir)}/${name}` : name;
        if (target === dir) return null;
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const moveFolder = (dir, parent) => {
        const target = parent ? `${parent}/${dirName(dir)}` : dirName(dir);
        updateStore((prev) => remapDir(prev, dir, target));
        return target;
      };
      const removeFolder = (dir) => updateStore((prev) => ({ ...prev, folders: prev.folders.filter((f) => f !== dir) }));
      const moveSet = (id, dir) => updateStore((prev) => ({ ...prev, sets: prev.sets.map((s) => (s.id === id ? { ...s, dir } : s)) }));
      const folderApi = { makeFolder, renameFolder, moveFolder, removeFolder, moveSet };

      const back = () => {
        history.replaceState(null, '', location.pathname);
        restoreLang();
        setRoute(null);
      };

      if (route && (route.type === 'edit' || route.type === 'new')) {
        const target = route.type === 'new' ? { id: null, title: '', dir: route.dir, words: [] } : own.find((s) => s.id === route.id);
        if (!target) {
          return (
            <div className={`${SCREEN} p-8 text-center text-gray-500`}>
              {t('errGone')}
              <button onClick={back} className="block mx-auto mt-4 underline">{t('backToList')}</button>
            </div>
          );
        }
        return (
          <SetEditor key={route.type === 'new' ? 'new' : route.id} set={target} sets={own} folders={folders}
            onSave={saveSet} onCancel={back} onNewFolder={makeFolder} />
        );
      }

      return route
        ? <Open key={JSON.stringify(route)} route={route} own={own} progress={progress} onResult={recordResult} onReset={resetProgress} onBack={back} />
        : (
          <Selection own={own} folders={folders} onOpen={openSet} onEdit={editSet} onNew={newSet}
            onImport={importSet} onDelete={deleteSet} folderApi={folderApi} />
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
