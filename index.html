    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- Browser-Speicher ----------
    // Der Browser darf jederzeit nein sagen (privates Fenster, voller Speicher) —
    // dann gilt der Standardwert. Alle Zugriffe laufen über diese zwei Zeilen.
    const readLocal = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    // Schlägt das Schreiben fehl (privates Fenster, volles Kontingent), darf
    // die Oberfläche nicht weiter «gespeichert» melden: das Merkmal steht hier
    // und wird als Warnstreifen angezeigt (s. StorageWarning).
    let storageBroken = false;
    const writeLocal = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { storageBroken = true; return false; }
    };

    // ---------- Sprache der Oberfläche (wie in MyMemory) ----------
    const LANGS = [{ id: 'de', name: 'Deutsch' }, { id: 'en', name: 'English' }];
    const LANG_KEY = 'myvoci_lang';
    const loadLang = () => (readLocal(LANG_KEY) === 'en' ? 'en' : 'de');
    const hashParts = (hash = location.hash) => hash.slice(1).split('&').filter(Boolean);
    const langFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('l=') && LANGS.some((l) => l.id === x.slice(2)));
      return part && part.slice(2);
    };
    let currentLang = langFromHash() || loadLang();
    document.documentElement.lang = currentLang;
    let redrawLang = () => {};

    const code = (x) => <code className="bg-gray-100 px-1 rounded">{x}</code>;

    const t = (key, ...args) => {
      const value = I18N[currentLang][key];
      return typeof value === 'function' ? value(...args) : value;
    };

    // ---------- Sprachen der Voci ----------
    // Ein Set kennt seine zwei Sprachen als Codes (`langs: ['de', 'fr']`). Die
    // steuern das Vorlesen und die Artikel-Toleranz; fehlen sie, heisst es
    // schlicht «Sprache A / B». Namen aus der Datei werden zu Codes.
    const LANG_NAMES = {
      de: { de: 'Deutsch', en: 'German' }, fr: { de: 'Französisch', en: 'French' },
      en: { de: 'Englisch', en: 'English' }, it: { de: 'Italienisch', en: 'Italian' },
      es: { de: 'Spanisch', en: 'Spanish' }, la: { de: 'Latein', en: 'Latin' },
      pt: { de: 'Portugiesisch', en: 'Portuguese' }, rm: { de: 'Rätoromanisch', en: 'Romansh' },
    };
    const NAME_TO_CODE = {
      deutsch: 'de', german: 'de', französisch: 'fr', franzoesisch: 'fr', french: 'fr', français: 'fr', francais: 'fr',
      englisch: 'en', english: 'en', italienisch: 'it', italian: 'it', italiano: 'it', spanisch: 'es', spanish: 'es',
      español: 'es', espanol: 'es', latein: 'la', latin: 'la', portugiesisch: 'pt', portuguese: 'pt',
      rätoromanisch: 'rm', romansh: 'rm', romantsch: 'rm',
    };
    const langCode = (raw) => {
      const w = (raw || '').trim().toLowerCase();
      if (!w) return '';
      return LANG_NAMES[w] ? w : (NAME_TO_CODE[w] || w.slice(0, 12));
    };
    const langName = (code) => (code ? (LANG_NAMES[code] ? LANG_NAMES[code][currentLang] : code) : '');
    const sideName = (set, side) => (set.langs && set.langs[side] ? langName(set.langs[side]) : t(side === 0 ? 'sideA' : 'sideB'));
    const TTS_LOCALE = { de: 'de-DE', fr: 'fr-FR', en: 'en-GB', it: 'it-IT', es: 'es-ES', pt: 'pt-PT' };

    // Eine Bibliothek erst holen, wenn jemand sie braucht. `get` liefert das
    // Global; kommt trotz `onload` keins an (Captive Portal, Werbeblocker,
    // Fehlerseite mit Status 200), gilt das als Fehlschlag — sonst bliebe die
    // gemerkte Promise für die ganze Sitzung auf `undefined` stehen und kein
    // späterer Versuch lüde je nach.
    const scriptCache = {};
    const loadScript = (url, get) => {
      const there = get();
      if (there) return Promise.resolve(there);
      if (!scriptCache[url]) scriptCache[url] = new Promise((ok, fail) => {
        const el = document.createElement('script');
        el.src = url;
        const giveUp = () => { scriptCache[url] = null; el.remove(); fail(new Error(url)); };
        el.onload = () => { const lib = get(); lib ? ok(lib) : giveUp(); };
        el.onerror = giveUp;
        document.head.appendChild(el);
      });
      return scriptCache[url];
    };

    // ---------- Handschrift-Erkennung (MyScript iink, Cloud) ----------
    // Optional: mit den zwei Schlüsseln aus developer.myscript.com erkennt der
    // Handschrift-Modus das Geschriebene und korrigiert wie beim Schreiben.
    // Die Schlüssel liegen nur in diesem Browser (localStorage), nie im Code
    // und nie im Link. Ohne Schlüssel, ohne Netz oder bei einer Sprache ohne
    // Paket bleibt es beim Papier: aufdecken, selbst bewerten.
    const MYSCRIPT_KEY = 'myvoci_myscript';
    const IINK_LANG = { de: 'de_DE', fr: 'fr_FR', en: 'en_US', it: 'it_IT', es: 'es_ES', pt: 'pt_PT' };
    const IINK_URL = 'https://cdn.jsdelivr.net/npm/iink-ts@4.1.0/dist/iink.min.js';
    const myscriptKeys = () => { const k = readLocal(MYSCRIPT_KEY, null); return k && k.app && k.hmac ? k : null; };
    // Weitergabe an ein zweites Gerät der Familie: ein Link, der nur die
    // Schlüssel trägt (`#k=`), einmal gescannt, dann gespeichert und aus der
    // Adresse gestrichen (s. takeKeysFromHash). Nie im Set-Link.
    const keysLink = (keys) => `${location.origin}${location.pathname}#k=${b64urlEncode(new TextEncoder().encode(`${keys.app}\n${keys.hmac}`))}`;
    let keysArrived = false; // eben per Link gekommen → einmalige Meldung
    // Die Bibliothek (600 KB) wird erst geholt, wenn jemand sie wirklich
    // braucht — Beispiele und Übersicht bleiben davon unberührt.
    const loadIink = () => loadScript(IINK_URL, () => window.iink);
    // Alle Zugriffe auf die Fläche laufen über eine Kette (wie beim Ordner,
    // s. `enqueue`): `Canvas.load` ist statisch und zerstört die Vorgängerin
    // selbst — ein nebenher laufendes `destroy()` träfe sonst die eben erst
    // aufgebaute Fläche, und übrig bliebe eine, die zeichnet, aber nichts
    // mehr erkennt.
    let inkChain = Promise.resolve();
    const inkQueue = (fn) => (inkChain = inkChain.then(fn, fn));

      "Schicke ich Material mit, nimm die Wörter NUR daraus, in der Reihenfolge des",
      "Materials, mit genau den Bedeutungen, die dort stehen. Sonst nimmst du dein",
      "eigenes Wissen zum angegebenen Thema.",
      "",
      "SO GIBST DU ES AUS — daran scheitert es sonst:",
      "- Gib beides aus, in dieser Reihenfolge:",
      "  1. eine Datei zum Herunterladen, Endung .txt (kein .docx, kein PDF). Der",
      "     Dateiname beginnt mit «Voci_», danach folgt der Titel des Sets —",
      "     kurz und passend, Wörter mit «_» getrennt: Voci_Unite_3_La_maison.txt",
      "  2. denselben Inhalt nochmals in EINEM Code-Block (```), zum Kopieren.",
      "- Kannst du keine Dateien erzeugen, reicht der Code-Block allein.",
      "- Kein Wort davor oder danach: keine Einleitung, keine Erklärung, keine Rückfrage.",
      "",
      "FORMAT (genau so):",
      "",
      "# Unité 3 – La maison",
      "Sprachen: de → fr",
      "",
      "F: das Haus",
      "A: la maison",
      "S: J'habite dans une grande maison.",
      "H: f.",
      "---",
      "F: gehen",
      "A: aller / marcher",
      "S: Je vais à l'école à pied.",
      "---",
      "",
      "REGELN:",
      "- Erste Zeile «# Titel», zweite Zeile «Sprachen: <Code A> → <Code B>» mit",
      "  Sprachcodes (de, fr, en, it, es, la).",
      "- «F: » ist das Wort in Sprache A, «A: » in Sprache B, «---» trennt die Wörter.",
      "  Nach jedem Wort eine Zeile «---», auch nach dem letzten.",
      "- Mehrere richtige Antworten mit « / » trennen: «A: aller / marcher».",
      "  Optionales in Klammern: «A: (la) maison». Nomen MIT Artikel, Verben im Infinitiv",
      "  (Englisch mit «to»).",
      "- «S: » ist ein kurzer Anwendungssatz in Sprache B, in dem das Wort genau so",
      "  vorkommt (bei Verben darf es konjugiert sein). Ein Satz pro Wort, nur wenn",
      "  oben «Anwendungssätze: ja» steht. Niveau der Klasse, nur bekannte Wörter.",
      "  Weicht die Form im Satz stark vom Wort ab (je *vais* zu aller, *went* zu go),",
      "  setze sie zwischen Sternchen — so wird die Lücke im Lückentext gefunden.",
      "- «H: » ist ein optionaler Hinweis: Genus (m./f.), Wortart, «unregelmässig».",
      "  Weglassen, wenn es nichts zu sagen gibt.",
      "- Jedes Wort nur einmal. Keine Nummerierung, keine Fettschrift, keine Erklärungen.",
      "",
      "ZUM SCHLUSS: geh die Liste nochmals durch und bessere STILL aus, was hier nicht",
      "stimmt — am Ende nur das fertige Set ausgeben, keine Liste der Änderungen.",
      "- Stimmen Rechtschreibung und Akzente in Sprache B genau? Sie werden Buchstabe",
      "  für Buchstabe geprüft.",
      "- Kommt das Wort im Satz wirklich vor?",
      "- Stimmt das Format überall: «F: », «A: », «S: », «H: », «---»?",
    ].join("\n");

    const KI_PROMPT_EN = [
      "You create vocabulary lists for school. Create a vocabulary set from my input.",
      "",
      "===== FILL IN THIS PART ONLY (leave the rest unchanged) =====",
      "Topic or material: [topic in one sentence — or: see attached book page/file/list]",
      "Language A (front): [German]",
      "Language B (back): [English]",
      "For whom: [e.g. grade 7]",
      "Number of words: [e.g. 20]",
      "Example sentences: [yes / no]",
      "Special notes: [optional, e.g. verbs only, same order as the book]",
      "============================================================",
      "",
      "If I attach material, take the words ONLY from it, in the order of the",
      "material, with exactly the meanings given there. Otherwise use your own",
      "knowledge of the topic given above.",
      "",
      "HOW TO OUTPUT IT — this is where it usually goes wrong:",
      "- Give both, in this order:",
      "  1. a file to download, extension .txt (no .docx, no PDF). The file name",
      "     starts with «Voci_», followed by the title of the set — short and",
      "     fitting, words separated by «_»: Voci_Unit_3_At_home.txt",
      "  2. the same content again in ONE code block (```), to copy.",
      "- If you cannot produce files, the code block alone is enough.",
      "- Not a word before or after: no introduction, no explanation, no follow-up question.",
      "",
      "FORMAT (exactly like this):",
      "",
      "# Unit 3 – At home",
      "Languages: de → en",
      "",
      "F: das Haus",
      "A: the house",
      "S: I live in a big house.",
      "---",
      "F: gehen",
      "A: to go / to walk",
      "S: I walk to school.",
      "H: irregular: went, gone",
      "---",
      "",
      "RULES:",
      "- First line «# Title», second line «Languages: <code A> → <code B>» with",
      "  language codes (de, fr, en, it, es, la).",
      "- «F: » is the word in language A, «A: » in language B, «---» separates words.",
      "  A line «---» after every word, including the last one.",
      "- Several correct answers separated by « / »: «A: to go / to walk».",
      "  Optional parts in brackets: «A: (the) house». Nouns WITH article, verbs in",
      "  the infinitive (English with «to»).",
      "- «S: » is a short example sentence in language B containing the word exactly",
      "  (verbs may be conjugated). One sentence per word, only if «Example",
      "  sentences: yes» above. Level of the class, known words only.",
      "  If the form in the sentence differs a lot from the word (*went* for go,",
      "  je *vais* for aller), put it between asterisks — that marks the gap.",
      "- «H: » is an optional hint: gender (m./f.), part of speech, «irregular».",
      "  Omit it when there is nothing to say.",
      "- Every word once. No numbering, no bold, no explanations.",
      "",
      "FINALLY: go through the list again and QUIETLY fix whatever does not match",
      "the rules — output only the finished set, no list of changes.",
      "- Are spelling and accents in language B exactly right? They are checked",
      "  letter by letter.",
      "- Does the word really appear in the sentence?",
      "- Is the format right everywhere: «F: », «A: », «S: », «H: », «---»?",
    ].join("\n");

    const kiPrompt = () => (currentLang === 'en' ? KI_PROMPT_EN : KI_PROMPT_DE);

    // ---------- Dateien parsen ----------
    // F: Sprache A, A: Sprache B, S: Satz (mehrere Zeilen oder mit | getrennt),
    // H: Hinweis, --- Trenner. Ein neues F: schliesst das vorige Wort auch ohne ---.
    const parseFA = (text) => {
      const words = [];
      let cur = null;
      const flush = () => { if (cur && cur.a && cur.b) words.push(cur); cur = null; };
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (/^-{3,}$/.test(line)) { flush(); continue; }
        const m = line.match(/^([FQASH]):\s*(.*)$/i);
        if (!m) continue;
        const key = m[1].toUpperCase(), val = m[2].trim();
        if (key === 'F' || key === 'Q') { flush(); cur = { a: val, b: '' }; continue; }
        if (!cur) continue;
        if (key === 'A') cur.b = cur.b ? `${cur.b} / ${val}` : val;
        else if (key === 'S' && val) cur.s = [...(cur.s || []), ...val.split('|').map((x) => x.trim()).filter(Boolean)];
        else if (key === 'H' && val) cur.h = cur.h ? `${cur.h} ${val}` : val;
      }
      flush();
      return words;
    };

    // «Sprachen: de → fr» / «Languages: German - French» / «de, fr»
    const langsInFile = (text) => {
      const m = text.match(/^(?:sprachen|languages)\s*:\s*(.+)$/im);
      if (!m) return undefined;
      const parts = m[1].split(/\s*(?:→|->|=>|—|–|-|,|;|>|\/)\s*/).map(langCode).filter(Boolean);
      return parts.length >= 2 ? [parts[0], parts[1]] : undefined;
    };

    // «Sprache: en» (Einzahl!) ist wie in MyMemory die Sprache der Oberfläche.
    const langInFile = (text) => {
      const m = text.match(/^(?:sprache|language)\s*:\s*([a-z]+)/im);
      const word = m && m[1].toLowerCase();
      if (!word) return undefined;
      if (word.startsWith('de') || word.startsWith('ge')) return 'de';
      if (word.startsWith('en')) return 'en';
      return undefined;
    };

    const parseFile = (text, filename) => {
      // Der KI-Prompt verlangt «Voci_Thema.txt»: Präfix weg, nur mit Unterstrich.
      const fromName = filename.replace(/\.(txt|md)$/i, '').replace(/^(voci|memory)_+(?=.)/i, '').replace(/_/g, ' ').trim();
      const inFile = text.match(/^#\s+(.+)$/m);
      const lang = langInFile(text);
      const langs = langsInFile(text);
      return {
        title: (inFile && inFile[1].trim()) || fromName,
        words: parseFA(text),
        ...(lang ? { lang } : {}), ...(langs ? { langs } : {}),
      };
    };

    // ---------- Dateien schreiben (Export) ----------
    const toFile = (set) =>
      `# ${set.title}\n` +
      (set.langs ? `${currentLang === 'en' ? 'Languages' : 'Sprachen'}: ${set.langs[0]} → ${set.langs[1]}\n` : '') +
      (set.lang ? `${set.lang === 'en' ? 'Language' : 'Sprache'}: ${set.lang}\n` : '') + '\n' +
      set.words.map((w) =>
        `F: ${w.a}\nA: ${w.b}\n` + (w.s || []).map((s) => `S: ${s}\n`).join('') + (w.h ? `H: ${w.h}\n` : '') + '---'
      ).join('\n') + '\n';

    const safeName = (title) => title.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'Voci';
    const safeDir = (dir) => dir.split('/').map(safeName).join('/');

    const loadJsZip = () => loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js', () => window.JSZip);

    const zipBlob = async (sets, folders) => {
      const JSZipLib = await loadJsZip();
      const zip = new JSZipLib();
      const used = new Set();
      for (const folder of folders) zip.folder(safeDir(folder));
      for (const set of sets) {
        const base = `${set.dir ? safeDir(set.dir) + '/' : ''}${safeName(set.title)}`;
        let name = `${base}.txt`;
        for (let i = 2; used.has(name); i++) name = `${base} (${i}).txt`;
        used.add(name);
        zip.file(name, toFile(set));
      }
      return zip.generateAsync({ type: 'blob' });
    };

    const download = (name, data) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // ---------- Eigene Sets im Browser ----------
    const STORAGE_KEY = 'myvoci';
    const loadStore = () => {
      const raw = readLocal(STORAGE_KEY, {}) || {};
      return { sets: (raw.sets || []).map((s) => ({ dir: '', ...s })), folders: raw.folders || [] };
    };
    const saveStore = (store) => writeLocal(STORAGE_KEY, store);

    // ---------- Ordner (wie MyMemory) ----------
    const dirName = (dir) => dir.split('/').pop();
    const parentDir = (dir) => (dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '');
    const inside = (dir, ancestor) => dir === ancestor || dir.startsWith(ancestor + '/');
    const byTitle = (a, b) => a.title.localeCompare(b.title, 'de');
    // Dasselbe Set heisst: gleicher Titel im gleichen Ordner. Zwei Kinder
    // haben dieselben Set-Titel, der Titel allein taugt also nicht als
    // Schlüssel — Editor, Import, Sicherung und Ordner fragen hier nach.
    const setPlace = (s) => `${s.dir || ''}\u0001${s.title}`;
    const samePlace = (a, b) => setPlace(a) === setPlace(b);
    const allFolders = ({ sets, folders }) => {
      const all = new Set(folders);
      for (const s of sets) for (let d = s.dir || ''; d; d = parentDir(d)) all.add(d);
      return [...all].sort((a, b) => a.localeCompare(b, 'de'));
    };
    const remapDir = (store, from, to) => {
      const move = (d) => (inside(d, from) ? to + d.slice(from.length) : d);
      return { sets: store.sets.map((s) => ({ ...s, dir: move(s.dir || '') })), folders: [...new Set(store.folders.map(move))] };
    };
    const OPEN_KEY = 'myvoci_open_dirs';
    // Die Beispiele bleiben für neue Nutzer der Einstieg; wer eigene Sets hat,
    // blendet sie hier aus (Gerät für Gerät, wie die Sprache).
    const DEMOS_KEY = 'myvoci_demos';
    const loadShowDemos = () => readLocal(DEMOS_KEY, true) !== false;
    const loadOpen = () => readLocal(OPEN_KEY, []) || [];
    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

    // ---------- Ordner auf der Platte (wie die Quizzes in MyKahoot) ----------
    // Chrome/Edge am Computer öffnen über die File System Access API einen
    // Ordner; dann liegen die Sets dort als .txt (Unterordner = Ordner), und
    // localStorage ist nur noch Zwischenspeicher — die Liste steht sofort,
    // auch bevor der Browser den Zugriff wieder freigegeben hat. Der
    // Ordner-Handle überlebt nur in IndexedDB, nicht in localStorage.
    const dirSupported = typeof window.showDirectoryPicker === 'function';
    const openDb = () => new Promise((resolve, reject) => {
      const req = indexedDB.open('myvoci', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    const dbRun = async (mode, act) => {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const req = act(db.transaction('kv', mode).objectStore('kv'));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };
    const loadDirHandle = () => dbRun('readonly', (kv) => kv.get('dir')).catch(() => undefined);
    const saveDirHandle = (h) => dbRun('readwrite', (kv) => (h ? kv.put(h, 'dir') : kv.delete('dir'))).catch(() => {});

    const isVociFile = (name) => /\.(txt|md)$/i.test(name) && !name.startsWith('.');
    // Liest den ganzen Ordner: Sets noch ohne id (die vergibt fromDisk),
    // Ordnerpfade wie im Store («Unité 3/Verben»).
    const readDir = async (root) => {
      const files = [], folders = [];
      // Erst den Baum ablaufen, dann alle Dateien auf einmal lesen: einzeln
      // abgewartet kostet jede Datei eine eigene Runde ins Dateisystem.
      // Promise.all erhält die Reihenfolge, auf die sich fromDisk verlässt.
      const walk = async (handle, dir) => {
        for await (const [name, entry] of handle.entries()) {
          if (name.startsWith('.')) continue;
          if (entry.kind === 'directory') {
            const path = dir ? `${dir}/${name}` : name;
            folders.push(path);
            await walk(entry, path);
          } else if (isVociFile(name)) files.push({ name, dir, entry });
        }
      };
      await walk(root, '');
      const read = await Promise.all(files.map(async ({ name, dir, entry }) => {
        const parsed = parseFile(await (await entry.getFile()).text(), name);
        // `file` merkt sich den echten Dateinamen — aber nur, wenn er vom
        // Titel abweicht (von Hand angelegt, «Fremd.txt» mit «# Von Hand»):
        // dann schreibt die App weiter dorthin, statt eine zweite anzulegen.
        // Heisst die Datei wie der Titel, bleibt `file` leer, damit ein
        // Umbenennen in der App die Datei mitnimmt statt Name und Titel
        // auseinanderlaufen zu lassen. `disk` heisst «lag schon einmal im
        // Ordner» — daran hängt, ob ein Set, das dort fehlt, im Finder
        // gelöscht wurde oder nur noch nie geschrieben werden konnte.
        return { ...parsed, dir, disk: true, ...(name === fileName(parsed) ? {} : { file: name }) };
      }));
      return { sets: read.filter((s) => s.words.length), folders };
    };

    const fileName = (set) => set.file || `${safeName(set.title)}.txt`;
    const setPath = (set) => `${set.dir ? safeDir(set.dir) + '/' : ''}${fileName(set)}`;
    const dirOf = async (root, path, create) => {
      let h = root;
      for (const part of path.split('/').filter(Boolean)) h = await h.getDirectoryHandle(part, { create });
      return h;
    };
    const splitPath = (path) => [parentDir(path), dirName(path)];
    const writeFile = async (root, path, text) => {
      const [dir, name] = splitPath(path);
      const fh = await (await dirOf(root, dir, true)).getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
    };
    const removeFile = async (root, path) => {
      const [dir, name] = splitPath(path);
      try { await (await dirOf(root, dir, false)).removeEntry(name); } catch {}
    };
    const removeEmptyDir = async (root, path) => {
      try {
        for await (const _ of (await dirOf(root, path, false)).keys()) return; // nicht leer → bleibt stehen
        const [dir, name] = splitPath(path);
        await (await dirOf(root, dir, false)).removeEntry(name);
      } catch {}
    };

    // Schreibt nur, was sich geändert hat: Diff über die id, verglichen werden
    // Pfad und Dateiinhalt. Gelöscht → Datei weg; umbenannt/verschoben → alte
    // Datei weg, neue hin; leer gewordene Ordner werden mitgeräumt.
    const mirrorDir = async (root, prev, next) => {
      const before = new Map(prev.sets.map((s) => [s.id, s]));
      const after = new Set(next.sets.map((s) => s.id));
      const prevFolders = allFolders(prev), nextFolders = allFolders(next);
      for (const f of nextFolders) if (!prevFolders.includes(f)) await dirOf(root, safeDir(f), true);
      // Ein Set pro Auftrag (alte Datei weg, dann die neue hin), die Aufträge
      // nebeneinander: beim Verbinden oder beim Verschieben eines Ordners
      // sind das sonst Dutzende Schreibvorgänge streng nacheinander.
      const jobs = [];
      for (const s of next.sets) {
        const old = before.get(s.id);
        if (old === s) continue; // unverändert — spart das Serialisieren
        const path = setPath(s), text = toFile(s);
        if (old && setPath(old) === path && toFile(old) === text) continue;
        jobs.push((async () => {
          if (old && setPath(old) !== path) await removeFile(root, setPath(old));
          await writeFile(root, path, text);
        })());
      }
      for (const s of prev.sets) if (!after.has(s.id)) jobs.push(removeFile(root, setPath(s)));
      await Promise.all(jobs);
      // Ordner erst danach und von innen nach aussen: ein Ordner ist nur leer,
      // wenn seine Dateien schon weg sind.
      const gone = prevFolders.filter((f) => !nextFolders.includes(f)).sort((a, b) => b.length - a.length);
      for (const f of gone) await removeEmptyDir(root, safeDir(f));
    };

    // Vom Ordner in den Store. Die id trägt den Lernstand, sie soll also am
    // richtigen Set kleben bleiben. `keepAll` gilt nur beim ausdrücklichen
    // Verbinden: dann bleibt auch mit, was schon einmal auf der Platte lag
    // (Ordnerwechsel). Sonst bleiben nur Sets ohne `disk`-Merkmal — was dort
    // fehlt und dort schon lag, wurde im Finder gelöscht.
    // Zurück kommt neben dem neuen Stand auch `onDisk`: der reine Inhalt des
    // Ordners, gegen den mirrorDir seine Differenz bildet.
    const fromDisk = (prev, disk, keepAll) => {
      const byPlace = new Map(prev.sets.map((s) => [setPlace(s), s]));
      const used = new Set();
      const take = (d, old) => {
        used.add(old.id);
        // Beim Verbinden darf die Datei die im Browser bearbeitete Fassung
        // nicht verschlucken: fehlende Wörter kommen hinten dazu, wie beim
        // Einlesen einer Sicherung. Beim Nachlesen gilt die Datei.
        return { ...d, id: old.id, ...(keepAll ? { words: mergeWords(d.words, old.words) } : {}) };
      };
      // Erst der sichere Treffer: gleicher Ordner, gleicher Titel.
      const first = disk.sets.map((d) => {
        const old = byPlace.get(setPlace(d));
        return old && !used.has(old.id) ? take(d, old) : { ...d, id: null };
      });
      // Dann verschoben oder umbenannt. Dafür kommen nur Sets in Frage, die
      // schon einmal im Ordner lagen (`disk`) und deren Titel auf beiden
      // Seiten genau einmal vorkommt: sonst erbte die Datei des einen Kindes
      // den Lernstand des gleichnamigen Sets des anderen, das nur im Browser
      // liegt — und verschwände damit aus der Liste.
      const free = new Map();
      for (const s of prev.sets) if (!used.has(s.id) && s.disk) free.set(s.title, free.has(s.title) ? null : s);
      const want = {};
      for (const d of first) if (!d.id) want[d.title] = (want[d.title] || 0) + 1;
      const sets = first.map((d) => {
        // `free` enthält nur unbenutzte Sets und jeder Titel wird höchstens
        // einmal beansprucht — ein zweiter Zugriff kann hier nicht auftreten.
        const old = d.id ? null : want[d.title] === 1 ? free.get(d.title) : null;
        return d.id ? d : old ? take(d, old) : { ...d, id: newId() };
      });
      // Was mirrorDir im Ordner vorfindet: die Dateien, mit den ids, die wir
      // eben vergeben haben. Bewusst nicht aus `sets` abgeleitet — dort
      // stecken beim Verbinden schon die ergänzten Wörter, und die soll
      // mirrorDir ja gerade noch schreiben.
      const onDisk = { sets: disk.sets.map((d, i) => ({ ...d, id: sets[i].id })).sort(byTitle), folders: disk.folders };
      const local = prev.sets.filter((s) => !used.has(s.id) && (keepAll || !s.disk));
      const next = {
        sets: [...sets, ...local].sort(byTitle),
        // Beim Nachlesen gilt der Ordner: Ordner mit Inhalt stehen ohnehin in
        // den `dir`-Feldern (allFolders), leere legt mirrorDir dort an.
        folders: [...new Set([...disk.folders, ...(keepAll ? prev.folders : [])])],
      };
      return { next, onDisk };
    };

    // ---------- Lernstand ----------
    // Pro Set und Wort: richtig/falsch-Zähler, Leitner-Fach 1–5, letzter Versuch,
    // ob der letzte Versuch sass. Bleibt im Browser, steckt nie im Link.
    const PROGRESS_KEY = 'myvoci_progress';
    const loadProgress = () => readLocal(PROGRESS_KEY, {}) || {};
    const wordKey = (w) => `${w.a}\u0001${w.b}`;
    // «Ergänzt, was fehlt»: vorhandene bleiben in ihrer Reihenfolge stehen,
    // neue kommen hinten dazu. Das Verbinden mit einem Ordner und das
    // Einlesen einer Sicherung teilen sich diese Regel.
    const mergeWords = (a, b) => {
      const has = new Set(a.map(wordKey));
      return [...a, ...b.filter((w) => !has.has(wordKey(w)))];
    };
    const BOX_DAYS = [0, 1, 3, 7, 14];
    const isDue = (rec, now = Date.now()) =>
      !rec || !rec.box || now - rec.last >= BOX_DAYS[Math.min(rec.box, 5) - 1] * 864e5;
    const isWrong = (rec) => !!rec && rec.lastOk === false;
    const applyResult = (rec, ok) => ({
      ok: (rec?.ok || 0) + (ok ? 1 : 0),
      bad: (rec?.bad || 0) + (ok ? 0 : 1),
      box: ok ? Math.min(5, (rec?.box || 0) + 1) : 1,
      last: Date.now(),
      lastOk: ok,
    });

    // ---------- Direktlinks: Set komprimiert im URL-Fragment ----------
    const b64urlEncode = (bytes) => {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const b64urlDecode = (str) =>
      Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

    const encodeSet = async (set) => {
      const json = new TextEncoder().encode(JSON.stringify([
        set.title, set.langs || 0, set.words.map((w) => [w.a, w.b, w.s && w.s.length ? w.s : 0, w.h || 0]),
      ]));
      if (window.CompressionStream) {
        const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        return '1.' + b64urlEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
      }
      return '0.' + b64urlEncode(json);
    };

    const decodeSet = async (data) => {
      const bytes = b64urlDecode(data.slice(2));
      const json = data.slice(0, 1) === '1'
        ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
        : new TextDecoder().decode(bytes);
      const [title, langs, words] = JSON.parse(json);
      return {
        title, ...(langs ? { langs } : {}),
        words: words.map(([a, b, s, h]) => ({ a, b, ...(s ? { s } : {}), ...(h ? { h } : {}) })),
      };
    };

    const demoById = (id) => DEMOS.find((d) => d.id === id);

    // ---------- Routing über das URL-Fragment ----------
    const withLang = (hash, lang = currentLang) => `${hash}${hash.endsWith('#') ? '' : '&'}l=${lang || currentLang}`;
    // Ein geteilter Übungs-Link trägt die Einstellungen als eigene Teile
    // (…&mode=write&dir=ab…); die Route ist der erste Teil, der weder Sprache
    // noch Option ist. `go=1` startet die Übung ohne Einstellungsseite.
    const OPT_KEYS = ['mode', 'dir', 'sel', 'from', 'to', 'order', 'level', 'hints', 'copy', 'exam', 'penOnly', 'timer', 'go'];
    const isOptPart = (x) => OPT_KEYS.includes(x.split('=')[0]);
    const routePart = () => hashParts().find((x) => !x.startsWith('l=') && !isOptPart(x)) || '';
    const OPT_NUM = ['from', 'to', 'timer'], OPT_BOOL = ['hints', 'copy', 'exam', 'penOnly', 'go'];
    const optsFromHash = () => {
      const out = {};
      for (const part of hashParts().filter(isOptPart)) {
        const [k, v = ''] = part.split('=');
        out[k] = OPT_NUM.includes(k) ? +v || 0 : OPT_BOOL.includes(k) ? v === '1' : v;
      }
      return out;
    };
    const optsToHash = (opts, go) => {
      const keep = ['mode', 'dir', 'sel', 'order', 'level', 'hints', 'copy', 'exam', 'penOnly', 'timer', ...(opts.sel === 'range' ? ['from', 'to'] : [])];
      return keep.map((k) => `&${k}=${typeof opts[k] === 'boolean' ? (opts[k] ? 1 : 0) : opts[k]}`).join('') + (go ? '&go=1' : '');
    };
    const applyLang = (id) => {
      if (id === currentLang) return;
      currentLang = id;
      document.documentElement.lang = id;
      redrawLang(id);
    };
    const restoreLang = () => applyLang(loadLang());
    const changeLang = (id) => {
      writeLocal(LANG_KEY, id);
      applyLang(id);
      if (langFromHash()) {
        try { history.replaceState(null, '', location.pathname + location.search + withLang('#' + routePart())); } catch {}
      }
    };
    const toHash = (set) => withLang(demoById(set.id) ? '#demo=' + set.id : '#local=' + set.id, set.lang);
    const directLink = async (set) => {
      const base = location.origin + location.pathname;
      return demoById(set.id) ? base + toHash(set) : withLang(`${base}#v=${await encodeSet(set)}`, set.lang);
    };
    const safeDecode = (raw) => { try { return decodeURIComponent(raw); } catch { return raw; } };
    // Welche Präfixe eine Route sind, steht an einer Stelle: `getRoute` liest
    // daraus, und der Scanner prüft daran, ob ein fremder Code (jede Adresse
    // hat ein Fragment: `#section`) überhaupt für diese App gedacht ist.
    const ROUTE_KEYS = ['v', 'demo', 'local', 'edit', 'new'];
    const isRoutePart = (x) => ROUTE_KEYS.includes(x.split('=')[0]);
    const getRoute = () => {
      const hash = routePart();
      if (hash.startsWith('v=')) return { type: 'data', data: hash.slice(2) };
      if (hash.startsWith('demo=')) return { type: 'demo', id: hash.slice(5) };
      if (hash.startsWith('local=')) return { type: 'local', id: hash.slice(6) };
      if (hash.startsWith('edit=')) return { type: 'edit', id: hash.slice(5) };
      if (hash.startsWith('new=')) return { type: 'new', dir: safeDecode(hash.slice(4)) };
      return null;
    };

    // Schlüssel aus einem Weitergabe-Link (`#k=`, s. keysLink) übernehmen —
    // beim Laden, bevor die App die Route liest, und sofort wieder aus der
    // Adresse streichen: sie sollen im Verlauf nicht stehen bleiben.
    const takeKeys = (part) => {
      try {
        const [app, hmac] = new TextDecoder().decode(b64urlDecode(part.slice(2))).split('\n');
        return !!(app && hmac) && writeLocal(MYSCRIPT_KEY, { app, hmac });
      } catch { return false; }
    };
    const takeKeysFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('k='));
      if (!part) return;
      keysArrived = takeKeys(part);
      const rest = hashParts().filter((x) => x !== part);
      try { history.replaceState(null, '', location.pathname + location.search + (rest.length ? '#' + rest.join('&') : '')); } catch {}
    };
    takeKeysFromHash();

    const shuffleArray = (array) => {
      const out = [...array];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };

    // ---------- Automatische Korrektur ----------
    // Kein Modell, nur Regeln: normalisieren, Alternativen und Klammern
    // durchprobieren, dann abgestuft vergleichen. Zurück kommt
    // { status: 'right'|'almost'|'wrong', solution, note }.
    const ARTICLES = {
      de: ['der', 'die', 'das', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines', 'dem', 'den', 'des'],
      fr: ['le', 'la', 'les', "l'", 'un', 'une', 'des', 'du', 'de la', "de l'"],
      en: ['the', 'a', 'an', 'to'],
      it: ['il', 'lo', 'la', 'i', 'gli', 'le', "l'", 'un', 'una', 'uno', "un'"],
      es: ['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas'],
      pt: ['o', 'a', 'os', 'as', 'um', 'uma'],
    };
    const stripAccents = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    // Zeichengleich (gleiche Länge): darf auch dort laufen, wo hinterher noch
    // Positionen im Originaltext gebraucht werden — s. splitSentence.
    const straightQuotes = (s) => s.replace(/[’‘`´]/g, "'");
    const baseNorm = (s) => straightQuotes(s)
      .replace(/ß/g, 'ss').replace(/\s*'\s*/g, "'")
      .replace(/\s+/g, ' ').replace(/[.!?…]+$/, '').trim();
    const stripArticle = (s, lang) => {
      for (const art of ARTICLES[lang] || []) {
        if (s === art) continue;
        if (art.endsWith("'") ? s.startsWith(art) : s.startsWith(art + ' ')) return s.slice(art.length).trim();
      }
      return s;
    };
    // «aller / marcher» → zwei Lösungen; «(la) maison» → mit und ohne Klammerteil.
    const variants = (solution) => {
      const out = [];
      for (const alt of solution.split(/\s*\/\s*/)) {
        if (!alt.trim()) continue;
        let forms = [alt];
        while (forms.some((f) => /\([^()]*\)/.test(f))) {
          forms = forms.flatMap((f) => (/\([^()]*\)/.test(f)
            ? [f.replace(/\(([^()]*)\)/, '$1'), f.replace(/\s*\([^()]*\)\s*/, ' ')] : [f]));
        }
        for (const f of forms) { const v = baseNorm(f); if (v && !out.includes(v)) out.push(v); }
      }
      return out.length ? out : [baseNorm(solution)];
    };
    const levenshtein = (a, b) => {
      if (a === b) return 0;
      if (!a.length || !b.length) return Math.max(a.length, b.length);
      let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i];
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[b.length];
    };

    const checkAnswer = (input, solution, { level = 'normal', lang, others = [] } = {}) => {
      const inp = baseNorm(input || '');
      const vars = variants(solution);
      const wrong = () => {
        let best = vars[0], bestD = Infinity;
        for (const v of vars) {
          const d = levenshtein(inp.toLowerCase(), v.toLowerCase());
          if (d < bestD) { best = v; bestD = d; }
        }
        return { status: 'wrong', solution: best };
      };
      if (!inp) return wrong();
      for (const v of vars) if (inp === v) return { status: 'right', solution: v };
      for (const v of vars) if (inp.toLowerCase() === v.toLowerCase()) {
        return level === 'strict' ? { status: 'almost', solution: v, note: 'noteCase' } : { status: 'right', solution: v };
      }
      if (level === 'strict') return wrong();
      const lo = inp.toLowerCase();
      for (const v of vars) if (stripAccents(lo) === stripAccents(v.toLowerCase())) {
        return level === 'loose' ? { status: 'right', solution: v } : { status: 'almost', solution: v, note: 'noteAccent' };
      }
      if (level === 'loose') {
        for (const v of vars) {
          if (stripArticle(stripAccents(lo), lang) === stripArticle(stripAccents(v.toLowerCase()), lang)) return { status: 'right', solution: v };
        }
      } else {
        for (const v of vars) {
          if (stripArticle(lo, lang) === stripArticle(v.toLowerCase(), lang)) return { status: 'almost', solution: v, note: 'noteArticle' };
        }
      }
      // Ein Tippfehler bei Wörtern ab vier Zeichen: fast richtig. Wer aber
      // exakt ein ANDERES Wort desselben Sets tippt, hat sich nicht vertippt,
      // sondern verwechselt (vous/nous, kein/sein) — das darf nicht durchgehen.
      if (others.some((o) => variants(o).some((v) => v.toLowerCase() === lo))) return wrong();
      for (const v of vars) {
        const a = level === 'loose' ? stripArticle(stripAccents(lo), lang) : lo;
        const b = level === 'loose' ? stripArticle(stripAccents(v.toLowerCase()), lang) : v.toLowerCase();
        if (b.length >= 4 && levenshtein(a, b) <= 1) return { status: 'almost', solution: v, note: 'noteTypo' };
      }
      return wrong();
    };

    // Zeichenweiser Vergleich (längste gemeinsame Teilfolge): was in der Eingabe
    // zu viel ist, wird rot durchgestrichen, was in der Lösung fehlt, grün.
    const charDiff = (a, b) => {
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i].toLowerCase() === b[j].toLowerCase() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
      const A = [], B = [];
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (a[i].toLowerCase() === b[j].toLowerCase()) { A.push([a[i], true]); B.push([b[j], true]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) A.push([a[i++], false]);
        else B.push([b[j++], false]);
      }
      while (i < n) A.push([a[i++], false]);
      while (j < m) B.push([b[j++], false]);
      return [A, B];
    };
    const DiffText = ({ parts, cls }) => (
      <span>{parts.map(([ch, same], i) => (same ? <span key={i}>{ch}</span> : <span key={i} className={cls}>{ch}</span>))}</span>
    );

    // Das Wort im Satz hervorheben (Wortstamm reicht: «marchons» zu «marcher»)
    // Gesucht wird der Wortstamm ohne Artikel und ohne typische Endung, am
    // Wortanfang; zurück kommt die Form im Satz («marchons»). Vollständige
    // Treffer gewinnen vor Stamm-Treffern («la maison» vor «mais…»).
    const stripAnyArticle = (s) => Object.keys(ARTICLES).reduce((acc, l) => stripArticle(acc, l), s);
    // Zerlegt einen Satz in {before, form, after}. Steht im Satz eine Markierung
    // «*vais*», gilt genau die (für Formen, die kein Stamm findet); sonst wird
    // gesucht. Ohne Treffer null — der Satz wird dann nur angezeigt.
    const splitSentence = (sentence, word) => {
      const star = sentence.match(/\*([^*]+)\*/);
      if (star) {
        const clean = sentence.replace(/\*/g, '');
        return { before: clean.slice(0, star.index), form: star[1], after: clean.slice(star.index + star[1].length) };
      }
      const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const forms = variants(word).map((v) => stripAnyArticle(v.toLowerCase())).filter((v) => v.length >= 2);
      const stems = forms.map((v) => v.replace(/(er|ir|re|en|e|s)$/i, '')).filter((v) => v.length >= 3);
      // Gesucht wird in einer Fassung mit geraden Apostrophen — genau wie das
      // Wort, das durch `variants` schon normalisiert ist. Der Ersatz ist
      // zeichengleich, die gefundenen Stellen passen also auf das Original.
      const hay = straightQuotes(sentence);
      for (const list of [forms, stems]) {
        if (!list.length) continue;
        // Kein Lookbehind: das Zeichen davor wird mitgelesen und wieder
        // abgezogen — Safari kennt `(?<!…)` erst ab 16.4 und wirft sonst beim
        // Bauen des Ausdrucks, mitten im Aufbau der Set-Seite.
        const m = hay.match(new RegExp(`(^|[^\\p{L}])(${list.map(esc).join('|')})[\\p{L}]*`, 'iu'));
        if (!m) continue;
        const at = m.index + m[1].length, form = m[0].slice(m[1].length);
        return { before: sentence.slice(0, at), form: sentence.substr(at, form.length), after: sentence.slice(at + form.length) };
      }
      return null;
    };
    const markWord = (sentence, word) => {
      const m = splitSentence(sentence, word);
      if (!m) return sentence.replace(/\*/g, '');
      return <>{m.before}<b>{m.form}</b>{m.after}</>;
    };
    // Lückentext: der erste Satz, in dem das Wort (Sprache B) vorkommt
    const gapFor = (word) => {
      for (const s of word.s || []) {
        const m = splitSentence(s, word.b);
        if (m) return m;
      }
      return null;
    };

    // ---------- Vorlesen ----------
    const canSpeak = (lang) => !!(window.speechSynthesis && TTS_LOCALE[lang]);
    const speak = (text, lang) => {
      if (!canSpeak(lang)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/\s*\/.*$/, '').replace(/[()]/g, ''));
        u.lang = TTS_LOCALE[lang];
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch {}
    };

    // ---------- Spracherkennung (Modus Sprechen) ----------
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const canRecognize = (lang) => !!(SpeechRec && TTS_LOCALE[lang]);
    // Hört einmal zu und liefert die Alternativen (beste zuerst) — oder wirft
    // 'denied' / 'nothing'. Einmalig, kein Dauerlauschen.
    const recognizeOnce = (lang) => new Promise((resolve, reject) => {
      const rec = new SpeechRec();
      rec.lang = TTS_LOCALE[lang];
      rec.maxAlternatives = 5;
      rec.interimResults = false;
      let done = false;
      // Ein offener Mikrofon-Dialog oder ein hängender Dienst melden nichts —
      // nach zehn Sekunden brechen wir selber ab, sonst bliebe der Knopf grau.
      const timer = setTimeout(() => { try { rec.abort(); } catch {} }, 10000);
      const finish = (fn) => { if (done) return; done = true; clearTimeout(timer); fn(); };
      rec.onresult = (e) => finish(() => resolve([...e.results[0]].map((r) => r.transcript)));
      rec.onerror = (e) => finish(() => reject(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied' : 'nothing'));
      rec.onend = () => finish(() => reject('nothing'));
      try { rec.start(); } catch { finish(() => reject('nothing')); }
    });

    // ---------- Vollbild ----------
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const canFullscreen = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    const toggleFullscreen = () => {
      const el = document.documentElement;
      // Beides darf scheitern (kein Vollbild auf dem iPhone, keine Geste) —
      // auch als abgelehntes Promise, darum beide Fänge.
      try {
        const r = fsElement()
          ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
          : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (r && r.catch) r.catch(() => {});
      } catch {}
    };

    // ---------- Gemeinsame Bausteine ----------
    const SCREEN = 'min-h-screen bg-gradient-to-br from-blue-50 to-emerald-50';
    const BTN_PRIMARY = 'bg-gradient-to-r from-blue-500 to-emerald-500 text-white rounded-lg font-semibold hover:from-blue-600 hover:to-emerald-600 transition-all shadow-lg';
    const BTN_SECONDARY = 'bg-gray-100 text-gray-600 rounded-lg font-semibold hover:bg-gray-200 transition-all';
    const CARD = 'bg-white rounded-lg shadow-lg';
    const LABEL = 'text-xs uppercase tracking-wide text-gray-400';
    const INPUT = 'px-3 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:border-blue-400';

    // Safari lässt `writeText` nur in derselben Aufgabe wie der Tap zu — nach
    // einem `await` (der Link wird ja erst komprimiert) lehnt es jedes Mal ab.
    // Der dokumentierte Ausweg ist `ClipboardItem` mit einem Versprechen als
    // Wert: der Zugriff wird sofort beantragt, der Inhalt kommt nach.
    const copyLater = async (makeText) => {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        try {
          await navigator.clipboard.write([new ClipboardItem({
            'text/plain': Promise.resolve(makeText()).then((s) => new Blob([s], { type: 'text/plain' })),
          })]);
          return true;
        } catch {}
      }
      try { await navigator.clipboard.writeText(await makeText()); return true; } catch { return false; }
    };

    // `max-h`/`overflow` für alle: die Anleitung ist länger als ein iPhone hoch,
    // und auch der Scanner passte auf kleinen Schirmen knapp nicht.
    const Modal = ({ children, onClose, wide }) => (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
        <div className={`bg-white rounded-2xl p-6 sm:p-8 ${wide ? 'max-w-2xl' : 'max-w-md'} w-full max-h-[85vh] overflow-y-auto shadow-2xl`} onClick={(e) => e.stopPropagation()}>
          {children}
        </div>
      </div>
    );

    const AskModal = ({ dialog, onClose }) => {
      const [value, setValue] = useState(dialog.preset || '');
      const isPrompt = dialog.kind === 'prompt';
      const submit = () => {
        if (isPrompt) { if (!value.trim()) return; dialog.onOk(value.trim()); }
        else dialog.onYes();
        onClose();
      };
      return (
        <Modal onClose={onClose}>
          <p className="text-gray-700 mb-4">{isPrompt ? dialog.label : dialog.text}</p>
          {isPrompt && (
            <input
              autoFocus type="text" value={value}
              onChange={(e) => setValue(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
              className={`w-full mb-4 ${INPUT}`}
            />
          )}
          <div className="flex gap-3">
            <button onClick={onClose} className={`flex-1 px-4 py-2 ${BTN_SECONDARY}`}>{t('cancel')}</button>
            <button onClick={submit} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>{dialog.ok || 'OK'}</button>
          </div>
        </Modal>
      );
    };

    const IconButton = ({ onClick, title, hover = 'hover:bg-blue-50', extra = '', children }) => (
      <button onClick={onClick} title={title}
        className={`px-3 py-3 bg-white rounded-lg shadow hover:shadow-md transition-all text-gray-500 ${hover} ${extra}`}>
        {children}
      </button>
    );

    // Schlanke Symbolknöpfe der Listenzeilen (wie .row-tool in MyKahoot):
    // transparent, nur Hover getönt — eine Zeile bleibt eine Zeile, keine
    // Reihe weisser Kacheln pro Set.
    const RowTool = ({ onClick, title, hover = 'hover:bg-white hover:text-gray-800', extra = '', children }) => (
      <button onClick={onClick} title={title}
        className={`shrink-0 w-8 h-8 inline-flex items-center justify-center rounded-lg text-gray-400 transition-colors ${hover} ${extra}`}>
        {children}
      </button>
    );

    const Icon = ({ children }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
    );
    const LinkIcon = () => (
      <Icon>
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </Icon>
    );
    const QrIcon = () => (
      <Icon>
        <rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14.5h3.5V18H14z" /><path d="M18.5 18.5H21V21h-2.5z" />
      </Icon>
    );
    const PenIcon = () => <Icon><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>;
    // Sucher-Rahmen, nicht Kamera: der Knopf nimmt einen Code auf (gescannt
    // oder eingefügt) — eine Kamera verspräche ein Foto und liesse das
    // Einfügen aussen vor. `QrIcon` bleibt fürs Zeigen eines Codes.
    const ScanIcon = () => (
      <Icon>
        <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9" /><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9" />
        <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15" /><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" />
        <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
      </Icon>
    );
    const HelpIcon = () => (

    );
    const InboxIcon = () => (
      <Icon><path d="M12 3v9" /><path d="M8 8.5 12 12.5l4-4" /><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" /></Icon>
    );
    const DownloadIcon = () => <Icon><path d="M12 3v12" /><path d="M7.5 10.5 12 15l4.5-4.5" /><path d="M4 20h16" /></Icon>;
    const PlusIcon = () => <Icon><path d="M12 5v14" /><path d="M5 12h14" /></Icon>;
    const FolderIcon = () => <Icon><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></Icon>;
    const TrashIcon = () => (

    );

      <Icon><path d="M4 9V4h5" /><path d="M20 9V4h-5" /><path d="M4 15v5h5" /><path d="M20 15v5h-5" /></Icon>
    );

    const QrModal = ({ title, hint, url, onClose, onCopy }) => {
      const svg = useMemo(() => {
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
        } catch { return null; }
      }, [url]);
      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4 text-gray-800">{title}</h2>
          {hint && <p className="text-sm text-gray-500 text-center mb-4">{hint}</p>}
          {svg ? (
            <div className="flex justify-center mb-4 [&>svg]:w-56 [&>svg]:h-56" dangerouslySetInnerHTML={{ __html: svg }} />
          ) : <div className="text-center text-red-600 mb-4">{t('qrTooBig')}</div>}
          <div className="text-xs text-gray-400 break-all max-h-16 overflow-y-auto mb-4">{url}</div>
          <div className="flex gap-2">
            <button onClick={onCopy} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>{t('copyLinkBtn')}</button>
            <button onClick={onClose} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('close')}</button>
          </div>
        </Modal>
      );
    };

    // ---------- QR-Code in der App scannen ----------
    // Ein mit der Kamera-App gescannter Code öffnet auf dem iPad immer Safari.
    // Die Home-Screen-Webapp hat aber einen eigenen Speicher und bekäme so
    // weder Set noch Schlüssel. Darum liest die App den Code selbst: Kamera
    // per getUserMedia, Bild für Bild durch jsQR (bei Bedarf nachgeladen).
    const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    const scanSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    // Was ein gescannter Code für die App bedeutet: nur das Fragment zählt,
    // die Adresse davor darf eine andere Fassung der App sein (localhost,
    // Pages). Zurück kommt der Schlüsselteil und die Route mit ihren Optionen.
    const scanned = (text) => {
      const i = text.indexOf('#');
      if (i < 0) return null;
      const parts = hashParts(text.slice(i));
      const keyPart = parts.find((x) => x.startsWith('k='));
      const rest = parts.filter((x) => x !== keyPart);
      // Nur eine Route, die `getRoute` auch kennt — sonst schluckte der
      // Scanner jeden Anker-Link und täte danach still gar nichts.
      const route = rest.some(isRoutePart);
      if (!keyPart && !route) return null;
      return { keyPart, hash: route ? rest.join('&') : '' };
    };
    const Scanner = ({ onClose, onCode }) => {
      const videoRef = useRef(null);
      const [error, setError] = useState(null);
      const [pasted, setPasted] = useState(''); // ohne Kamera: Link von Hand einfügen
      const openPasted = () => { if (pasted.trim()) onCode(pasted.trim()); };
      // Fehlt die Kamera ganz, sagt das dasselbe wie ein gescheiterter Zugriff
      const note = error || (!scanSupported && t('scanNoCam'));
      useEffect(() => {
        if (!scanSupported) return;
        let stream = null, stop = false, timer = 0;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const stopCam = () => stream && stream.getTracks().forEach((track) => track.stop());
        (async () => {
          let jsQR;
          try { jsQR = await loadScript(JSQR_URL, () => window.jsQR); }
          catch { setError(t('scanNoLib')); return; }
          // Die Bibliothek ist 257 KB; wer in der Zeit schliesst, soll nicht
          // hinterher noch nach der Kamera gefragt werden.
          if (stop) return;
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
          catch { setError(t('scanNoCam')); return; }
          if (stop) { stopCam(); return; }
          const video = videoRef.current;
          video.srcObject = stream;
          try { await video.play(); } catch {}
          // Auf 640 px verkleinert reicht für einen QR-Code und schont das iPad
          const tick = () => {
            if (stop) return;
            if (video.readyState >= 2 && video.videoWidth) {
              // Zuweisen an `width` verwirft den Bildspeicher — nur bei
              // echter Änderung, sonst siebenmal pro Sekunde umsonst.
              const k = Math.min(1, 640 / video.videoWidth);
              const w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
              if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
              ctx.drawImage(video, 0, 0, w, h);
              const img = ctx.getImageData(0, 0, w, h);
              const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (code && code.data) { stop = true; stopCam(); onCode(code.data); return; }
            }
            timer = setTimeout(tick, 150);
          };
          tick();
        })();
        return () => { stop = true; clearTimeout(timer); stopCam(); };
      }, []);
      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4 text-gray-800">{t('scan')}</h2>
          <p className="text-sm text-gray-500 text-center mb-4">{t('scanHint')}</p>
          {scanSupported && (
            <div className="rounded-lg overflow-hidden bg-black aspect-square mb-4">
              <video ref={videoRef} playsInline muted autoPlay className="w-full h-full object-cover" />
            </div>
          )}
          {note && <p className="text-sm text-orange-600 text-center mb-4">{note}</p>}
          <p className="text-sm text-gray-500 mb-2">{t('scanPaste')}</p>
          <div className="flex gap-2 mb-4">
            <input type="text" value={pasted} placeholder={t('scanPastePh')} autoCapitalize="none" autoCorrect="off" spellCheck={false}
              onChange={(e) => setPasted(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') openPasted(); }}
              className={`flex-1 min-w-0 ${INPUT}`} />
            <button onClick={openPasted} disabled={!pasted.trim()} className={`px-4 py-2 ${BTN_PRIMARY} ${pasted.trim() ? '' : 'opacity-50'}`}>{t('scanOpen')}</button>
          </div>
          <button onClick={onClose} className={`w-full px-4 py-2 ${BTN_SECONDARY}`}>{t('close')}</button>
        </Modal>
      );
    };

    // ---------- Anleitung ----------
    // Die langen Erklärtexte standen verstreut: Handschrift und Ordner in den
    // Einstellungen, «Üben auf dem iPad» als Kasten zuunterst. Hier stehen sie
    // zusammen, hinter dem ?-Knopf; in den Einstellungen bleiben die
    // Bedienelemente und eine Zeile mit Verweis hierher.
    // `only` zeigt einen einzelnen Abschnitt: die Schlüsselfelder stehen auf
    // jeder Seite, von der aus geübt wird (auch nach einem geteilten Link),
    // die Übersicht mit dem ?-Knopf sieht dort aber niemand.
    const HELP_SECTIONS = ['ipad', 'ink', 'dir', 'scan'];
    const HELP_TITLE = { ipad: 'ipadTitle', ink: 'helpInkTitle', dir: 'dirTitle', scan: 'scan' };
    const HELP_STEPS = { ipad: 'ipadSteps', ink: 'helpInkSteps', dir: 'helpDirSteps', scan: 'helpScanSteps' };
    const Help = ({ only, onClose }) => (
      <Modal wide onClose={onClose}>
        <h2 className="text-xl font-bold text-gray-800 mb-4">{only ? t(HELP_TITLE[only]) : t('helpTitle')}</h2>
        {(only ? [only] : HELP_SECTIONS).map((id) => (
          <div key={id} className="mb-6">
            {!only && <h3 className="font-semibold text-gray-700 mb-2">{t(HELP_TITLE[id])}</h3>}
            <ol className="list-decimal list-outside pl-5 text-sm text-gray-600 space-y-2">{t(HELP_STEPS[id])}</ol>
          </div>
        ))}
        <button onClick={onClose} className={`w-full px-4 py-2 ${BTN_SECONDARY}`}>{t('close')}</button>
      </Modal>
    );
    // Verweis von einem Einstellungs-Kasten in den passenden Abschnitt
    const HelpLink = ({ onClick }) => (
      <button onClick={onClick} className="underline font-semibold hover:text-gray-700">{t('guide')} →</button>
    );

    const useSettings = (extra) => {
      const [open, setOpen] = useState(false);
      const button = <IconButton onClick={() => setOpen((v) => !v)} title={t('settings')}><SettingsIcon /></IconButton>;
      const panel = open && (
        <div className={`${CARD} p-6 mb-8`}>
          <h2 className="text-lg font-semibold text-gray-700 mb-3">{t('settings')}</h2>
          <div className="rounded-lg border border-gray-200 p-4">
            <div className={`${LABEL} mb-2`}>{t('language')}</div>
            <div className="flex gap-2">
              {LANGS.map((entry) => (
                <button key={entry.id} onClick={() => changeLang(entry.id)}
                  className={`px-4 py-2 ${entry.id === currentLang ? BTN_PRIMARY : BTN_SECONDARY}`}>{entry.name}</button>
              ))}
            </div>
          </div>
          {extra}
        </div>
      );
      return [button, panel];
    };

    // Kurzmeldung unten am Rand. Zwei Seiten brauchen sie (Übersicht und
    // Set-Seite) — eine Stelle bestimmt Dauer und Aussehen.
    const useToast = () => {
      const [toast, setToast] = useState(null);
      const timer = useRef(0);
      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(timer.current); // sonst räumt der Timer der ersten Meldung die zweite ab
        timer.current = setTimeout(() => setToast(null), 2500);
      };
      useEffect(() => () => clearTimeout(timer.current), []);
      const node = toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50">{toast}</div>
      );
      return [showToast, node];
    };

    // Die zwei MyScript-Schlüssel. Stehen in den Einstellungen jeder Seite,
    // von der aus geübt wird — der Hinweis unter der Moduswahl zeigt dorthin,
    // und wer über einen geteilten Link kommt, sieht die Übersicht nie.
    // Geschrieben wird beim Verlassen des Feldes, nicht bei jedem Zeichen.
    const MyScriptKeys = () => {
      const [keys, setKeys] = useState(() => readLocal(MYSCRIPT_KEY, null) || { app: '', hmac: '' });
      const [qr, setQr] = useState(false);
      const [help, setHelp] = useState(false);
      const [showToast, toastNode] = useToast();
      const filled = !!(keys.app.trim() && keys.hmac.trim());
      const link = filled ? keysLink({ app: keys.app.trim(), hmac: keys.hmac.trim() }) : '';
      const copy = async () => showToast(t((await copyLater(() => link)) ? 'linkCopied' : 'copyFailed'));
      const field = (part, label) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input type="text" value={keys[part]} autoCapitalize="none" autoCorrect="off" spellCheck={false}
            onChange={(e) => setKeys({ ...keys, [part]: e.target.value })}
            onBlur={() => writeLocal(MYSCRIPT_KEY, { app: keys.app.trim(), hmac: keys.hmac.trim() })}
            className={`w-full mt-1 ${INPUT}`} />
        </label>
      );
      return (
        <div className="rounded-lg border border-gray-200 p-4 mt-4">
          <div className={`${LABEL} mb-2`}>{t('myscriptTitle')}</div>
          <p className="text-sm text-gray-500 mb-3">{t('myscriptShort')} <HelpLink onClick={() => setHelp(true)} /></p>
          <div className="grid sm:grid-cols-2 gap-3">
            {field('app', t('myscriptApp'))}
            {field('hmac', t('myscriptHmac'))}
          </div>
          {filled && (
            <div className="flex flex-wrap items-center gap-3 mt-3">
              <p className="text-sm text-emerald-700">{t('myscriptOn')}</p>
              <button onClick={() => setQr(true)} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('myscriptShare')}</button>
            </div>
          )}
          {qr && <QrModal title={t('myscriptShareTitle')} hint={t('myscriptShareHint')} url={link} onClose={() => setQr(false)} onCopy={copy} />}
          {help && <Help only="ink" onClose={() => setHelp(false)} />}
          {toastNode}
        </div>
      );
    };

    // Sichtbarer Hinweis statt stiller Datenverlust (s. writeLocal).
    const StorageWarning = () => storageBroken && (
      <div className="mb-6 rounded-lg border-2 border-amber-400 bg-amber-50 px-4 py-3 text-sm text-amber-900">{t('storageBroken')}</div>
    );

    const Collapsible = ({ title, open, onToggle, children }) => (
      <div className={`${CARD} mb-8`}>
        <button onClick={onToggle} className="w-full flex items-center justify-between gap-2 px-6 py-4 text-left">
          <h2 className="text-lg font-semibold text-gray-700">{title}</h2>
          <span className={`text-gray-400 transition-transform ${open ? 'rotate-90' : ''}`}>▶</span>
        </button>
        {open && <div className="px-6 pb-6">{children}</div>}
      </div>
    );

    // Doppelpfeil: geübt wird in beide Richtungen (pro Runde wählbar) — der
    // einfache Pfeil versprach eine Festlegung, die es nicht gibt. Die
    // Reihenfolge bleibt sichtbar, denn sie sagt, welche Seite `a` ist
    // (Vorlesen, Tastatur, Artikel-Toleranz hängen daran).
    const langBadge = (set) => set.langs && (
      <span className="ml-2 px-1.5 rounded bg-gray-100 text-xs font-semibold text-gray-500 uppercase align-middle">
        {set.langs[0]}↔{set.langs[1]}
      </span>
    );

    // ---------- Auswahlseite ----------
    const Selection = ({ own, folders, onOpen, onEdit, onNew, onImport, onDelete, folderApi, backup, dir }) => {
      const [showToast, toastNode] = useToast();
      const backupInput = useRef(null);
      // Der Datei-Listener am Fenster wird nur einmal angehängt (s. unten) und
      // hielte sonst für immer die Liste vom ersten Rendern fest — genau die
      // braucht aber die Rückfrage «gibt es schon».
      const ownRef = useRef(own);
      ownRef.current = own;
      // Schlüssel per Weitergabe-Link gekommen (s. takeKeysFromHash): einmal sagen
      useEffect(() => { if (keysArrived) { keysArrived = false; showToast(t('myscriptTaken')); } }, []);
      // In der App gescannt (s. Scanner): Schlüssel gleich übernehmen, ein Set
      // über seine Route öffnen — der Rest läuft wie bei einem geöffneten Link.
      const [scan, setScan] = useState(false);
      // Schlüssel und Set stehen nebeneinander: ein kaputter Schlüsselteil
      // darf das mitgelieferte Set nicht verwerfen, und die Meldung wird hier
      // gezeigt statt über `keysArrived` — beim Öffnen eines Sets rendert
      // `Open`, und nur die Übersicht räumt das Merkmal ab.
      const onCode = (text) => {
        setScan(false);
        const got = scanned(text);
        if (!got) { showToast(t('scanNotOurs')); return; }
        const keysOk = got.keyPart ? takeKeys(got.keyPart) : null;
        // Wird gleich ein Set geöffnet, rendert `Open` und diese Meldung wäre
        // mit der Übersicht weg — dann übernimmt `keysArrived`, das die
        // Übersicht beim Zurückkommen abräumt.
        if (got.hash) { keysArrived = keysOk === true; location.hash = got.hash; }
        else if (keysOk !== null) showToast(keysOk ? t('myscriptTaken') : t('scanBadKeys'));
      };
      const importBackupText = (text) => {
        const n = backup.restore(text);
        showToast(n === null ? t('backupBad') : t('backupDone', n));
      };
      const dirButtons = (
        <div className="flex flex-wrap gap-2">
          {dir.status === 'none' && <button onClick={dir.connect} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('dirChoose')}</button>}
          {dir.status === 'prompt' && <button onClick={dir.reconnect} className={`px-4 py-2 ${BTN_PRIMARY}`}>{t('dirReconnect')}</button>}
          {(dir.status === 'ok' || dir.status === 'error') && <button onClick={dir.refresh} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('dirReload')}</button>}
          {dir.status !== 'none' && dir.status !== 'unsupported' && <button onClick={dir.disconnect} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('dirDisconnect')}</button>}
        </div>
      );
      // Muss VOR `useSettings` stehen: das Panel ist ein Argument, sein JSX wird
      // also vorher ausgewertet. Babel macht aus `const` ein `var` — eine später
      // deklarierte Variable wäre hier still `undefined` statt eines Fehlers
      // (der Haken blieb leer, obwohl die Beispiele standen).
      // Dasselbe gilt für die Anleitung: der Ordner-Kasten im Panel verweist
      // darauf. `null` | 'all' | Abschnitt.
      const [showDemos, setShowDemos] = useState(loadShowDemos);
      const [help, setHelp] = useState(null);
      const [settingsButton, settingsPanel] = useSettings(
        <>
        <MyScriptKeys />
        <div className="rounded-lg border border-gray-200 p-4 mt-4">
          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={showDemos} className="mt-1 h-4 w-4 accent-blue-500"
              onChange={(e) => { setShowDemos(e.target.checked); writeLocal(DEMOS_KEY, e.target.checked); }} />
            <span>
              <span className="font-semibold text-gray-700">{t('showExamples')}</span>
              <span className="block text-sm text-gray-500">{t('showExamplesHint')}</span>
            </span>
          </label>
        </div>
        <div className="rounded-lg border border-gray-200 p-4 mt-4">
          <div className={`${LABEL} mb-2`}>{t('dirTitle')}</div>
          <p className="text-sm text-gray-500 mb-3">
            {dir.status === 'unsupported' ? t('dirUnsupported') : t('dirShort')} <HelpLink onClick={() => setHelp('dir')} />
          </p>
          {dir.status === 'ok' && <p className="text-sm text-emerald-700 mb-3">{t('dirConnected', dir.name, own.length)}</p>}
          {/* «Freigeben» und «nicht erreichbar» stehen schon als Streifen über
              der Liste — hier nur die Knöpfe, sonst liest man beides doppelt. */}
          {dirButtons}
        </div>
        <div className="rounded-lg border border-gray-200 p-4 mt-4">
          <div className={`${LABEL} mb-2`}>{t('backupTitle')}</div>
          <p className="text-sm text-gray-500 mb-3">{t('backupHint')}</p>
          <div className="flex flex-wrap gap-2">
            <button onClick={backup.save} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('backupExport')}</button>
            <button onClick={() => backupInput.current.click()} className={`px-4 py-2 ${BTN_SECONDARY}`}>{t('backupImport')}</button>
            <input ref={backupInput} type="file" accept=".json,application/json" className="hidden"
              onChange={(e) => { for (const f of e.target.files) f.text().then(importBackupText); e.target.value = ''; }} />
          </div>
        </div>
        </>
      );
      const [qr, setQr] = useState(null);
      const [createOpen, setCreateOpen] = useState(false);
      const [openDirs, setOpenDirs] = useState(loadOpen);
      const [dropDir, setDropDir] = useState(null);
      const dragged = useRef(null);
      const [dialog, setDialog] = useState(null);
      const [pasted, setPasted] = useState('');
      const [pastedTitle, setPastedTitle] = useState('');
      const fileInput = useRef(null);

      const copyText = async (text, msg) => {
        if (await copyLater(() => text)) showToast(msg); else showToast(t('copyFailed'));
      };
      // Klappt das Kopieren nicht (Safari, kein HTTPS), steht der Link
      // wenigstens im QR-Fenster zum Abschreiben — statt einer Sackgasse.
      const copyLink = async (set) => {
        if (await copyLater(() => directLink(set))) showToast(t('linkCopied'));
        else { showToast(t('copyFailed')); setQr({ title: set.title, url: await directLink(set) }); }
      };
      const showQr = async (set) => setQr({ title: set.title, url: await directLink(set) });
      const exportOne = (set) => { download(`${safeName(set.title)}.txt`, toFile(set)); showToast(t('downloadedOne', set.title)); };
      const exportAll = async () => {
        if (!own.length) { showToast(t('noOwnSets')); return; }
        try { download('MyVoci.zip', await zipBlob(own, folders)); }
        catch { showToast(t('zipFailed')); return; }
        showToast(t('downloadedAll', own.length));
      };

      const addImported = (text, name, dir, complain) => {
        const parsed = parseFile(text, name);
        if (!parsed.words.length) { showToast(complain); return false; }
        const put = () => {
          onImport({ id: newId(), ...parsed, ...(dir === undefined ? {} : { dir }) });
          showToast(t('imported', parsed.title, parsed.words.length));
        };
        // Gleicher Titel im gleichen Ordner heisst «neue Fassung desselben
        // Sets» — die alten Wörter sind danach weg. Das ist einen Klick wert,
        // es gibt kein Zurück.
        if (ownRef.current.some((s) => samePlace(s, { dir, title: parsed.title }))) {
          setDialog({ kind: 'confirm', ok: t('replace'), text: t('confirmReplace', parsed.title), onYes: put });
        } else put();
        return true;
      };
      const importFiles = (fileList, dir) => {
        for (const file of fileList) {
          if (/\.json$/i.test(file.name)) { file.text().then(importBackupText); continue; } // Sicherung aufs Fenster gezogen
          file.text().then((text) => addImported(text, file.name, dir, t('noWordsInFile', file.name)));
        }
      };
      const importPasted = () => {
        if (!addImported(pasted, pastedTitle.trim() || 'Voci', undefined, t('noWordsFound'))) return;
        setPasted('');
        setPastedTitle('');
      };

      useEffect(() => {
        const over = (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
        const drop = (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); importFiles(e.dataTransfer.files); };
        window.addEventListener('dragover', over);
        window.addEventListener('drop', drop);
        return () => { window.removeEventListener('dragover', over); window.removeEventListener('drop', drop); };
      }, []);

      const rememberOpen = (dirs) => { setOpenDirs(dirs); writeLocal(OPEN_KEY, dirs); };
      const toggleDir = (dir) => rememberOpen(openDirs.includes(dir) ? openDirs.filter((d) => d !== dir) : [...openDirs, dir]);

      const canDrop = (dir) => {
        const d = dragged.current;
        if (!d) return false;
        if (d.kind === 'set') return d.dir !== dir;
        return !inside(dir, d.id) && parentDir(d.id) !== dir;
      };
      const dragProps = (item) => ({
        draggable: true,
        onDragStart: (e) => { dragged.current = item; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.id); },
        onDragEnd: () => { dragged.current = null; setDropDir(null); },
      });
      const dropProps = (dir) => ({
        onDragOver: (e) => {
          e.stopPropagation();
          if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); setDropDir(dir); return; }
          if (!canDrop(dir)) { setDropDir(null); return; }
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          setDropDir(dir);
        },
        onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDropDir((cur) => (cur === dir ? null : cur)); },
        onDrop: (e) => {
          e.stopPropagation();
          if (e.dataTransfer.files.length) { e.preventDefault(); setDropDir(null); importFiles(e.dataTransfer.files, dir); return; }
          const item = dragged.current;
          if (!item || !canDrop(dir)) return;
          e.preventDefault();
          dragged.current = null;
          setDropDir(null);
          if (item.kind === 'set') folderApi.moveSet(item.id, dir);
          else {
            const target = folderApi.moveFolder(item.id, dir);
            if (target === false) { showToast(t('folderExists', dirName(item.id))); return; }
            rememberOpen(openDirs.map((d) => (inside(d, item.id) ? target + d.slice(item.id.length) : d)));
          }
        },
      });

      const newFolder = (parent) => setDialog({
        kind: 'prompt', ok: t('create'), label: parent ? t('askSubfolder', dirName(parent)) : t('askFolder'),
        onOk: (name) => {
          const path = folderApi.makeFolder(parent, name);
          if (path) rememberOpen([...new Set([...openDirs, parent, path].filter(Boolean))]);
        },
      });
      const renameFolder = (dir) => setDialog({
        kind: 'prompt', ok: t('rename'), label: t('askRename'), preset: dirName(dir),
        onOk: (name) => {
          const target = folderApi.renameFolder(dir, name);
          if (target === false) { showToast(t('folderExists', name)); return; }
          if (target) rememberOpen(openDirs.map((d) => (inside(d, dir) ? target + d.slice(dir.length) : d)));
        },
      });
      const dropFolder = (dir) => {
        if (own.some((s) => inside(s.dir || '', dir)) || folders.some((f) => f !== dir && inside(f, dir))) { showToast(t('folderNotEmpty')); return; }
        setDialog({
          kind: 'confirm', ok: t('del'), text: t('confirmDeleteFolder', dirName(dir)),
          onYes: () => { folderApi.removeFolder(dir); rememberOpen(openDirs.filter((d) => d !== dir)); },
        });
      };

      // Zeile wie in der Quiz-Auswahl von MyKahoot: schlanker Namens-Knopf,
      // Titel in fester Spalte (kürzt bei Bedarf), Wortzahl dahinter in einer
      // Flucht, rechts die Symbolknöpfe spaltenweise untereinander.
      const row = (set, deletable) => (
        <div key={set.id} className="flex items-center gap-0.5"
          {...(deletable ? dragProps({ kind: 'set', id: set.id, dir: set.dir || '' }) : {})}>
          <button onClick={() => onOpen(set)}
            className="flex-1 min-w-0 flex items-baseline text-left px-2.5 py-1.5 rounded-lg hover:bg-white transition-colors font-semibold text-gray-800">
            <span className="min-w-0 truncate" style={{ flex: '0 1 17rem' }}>{set.title}</span>
            <span className="ml-3 shrink-0 text-sm font-normal text-gray-400">{t('nWords', set.words.length)}</span>
            {langBadge(set)}
          </button>
          <RowTool onClick={() => exportOne(set)} title={t('exportOne')} extra="hidden sm:inline-flex"><DownloadIcon /></RowTool>
          <RowTool onClick={() => copyLink(set)} title={t('copyLink')}><LinkIcon /></RowTool>
          <RowTool onClick={() => showQr(set)} title={t('showQr')}><QrIcon /></RowTool>
          {deletable && (
            <>
              <RowTool onClick={() => onEdit(set)} title={t('edit')}><PenIcon /></RowTool>
              <RowTool title={t('del')} hover="hover:bg-red-50 hover:text-red-600"
                onClick={() => setDialog({ kind: 'confirm', ok: t('del'), text: t('confirmDeleteSet', set.title), onYes: () => onDelete(set.id) })}>
                <TrashIcon />
              </RowTool>
            </>
          )}
        </div>
      );

      const folderBox = (dir) => {
        const isOpen = openDirs.includes(dir);
        return (
          <div key={dir} {...dropProps(dir)}
            className={`rounded-lg transition-colors ${dropDir === dir ? 'outline outline-2 outline-dashed outline-blue-400' : ''}`}>
            <div {...dragProps({ kind: 'dir', id: dir })} onClick={() => toggleDir(dir)}
              className="flex items-center gap-0.5 pl-2.5 py-1.5 rounded-lg hover:bg-white transition-colors cursor-pointer select-none">
              <span className="w-3 text-xs text-gray-400">{isOpen ? '▾' : '▸'}</span>
              <span className="shrink-0 text-gray-400 mr-1.5"><FolderIcon /></span>
              <span className="flex-1 min-w-0 truncate font-semibold text-gray-700">{dirName(dir)}</span>
              <RowTool onClick={(e) => { e.stopPropagation(); onNew(dir); }} title={t('newSetHere')}><PlusIcon /></RowTool>
              <RowTool onClick={(e) => { e.stopPropagation(); newFolder(dir); }} title={t('newSubfolder')}><FolderIcon /></RowTool>
              <RowTool onClick={(e) => { e.stopPropagation(); renameFolder(dir); }} title={t('renameFolder')}><PenIcon /></RowTool>
