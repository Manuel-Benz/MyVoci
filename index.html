        <button onClick={onToggle} className="w-full flex items-center justify-between gap-2 px-5 py-4 text-left">
          <h2 className="text-lg font-bold">{title}</h2>
          <span className={`text-text-3 transition-transform ${open ? 'rotate-90' : ''}`}><ChevronIcon /></span>
        </button>
        {open && <div className="px-5 pb-5">{children}</div>}
      </div>
    );

    // Ordnerwahl mit eingerückten Unterordnern — Editor und «Voci-Set erstellen»
    const FolderSelect = ({ value, onChange, folders, className = '', rootLabel = t('rootFolder') }) => (
      <select value={value} onChange={(e) => onChange(e.target.value)} className={`flex-1 min-w-0 ${INPUT} ${className}`}>
        <option value="">{rootLabel}</option>
        {folders.map((f) => <option key={f} value={f}>{'\u00a0\u00a0'.repeat(f.split('/').length - 1) + dirName(f)}</option>)}
      </select>
    );
    const OrDivider = ({ children }) => (
      <div className={`flex items-center gap-3 my-4 ${LABEL}`}>
        <span className="flex-1 h-px bg-linie" /> {children} <span className="flex-1 h-px bg-linie" />
      </div>
    );

    // Doppelpfeil: geübt wird in beide Richtungen (pro Runde wählbar) — der
    // einfache Pfeil versprach eine Festlegung, die es nicht gibt. Die
    // Reihenfolge bleibt sichtbar, denn sie sagt, welche Seite `a` ist
    // (Vorlesen, Tastatur, Artikel-Toleranz hängen daran).
    const langBadge = (set) => set.langs && (
      <span className="kuerzel ml-2 align-[1px]">
        {set.langs[0]}↔{set.langs[1]}
      </span>
    );

    // ---------- Rand oben ----------
    // Das Markup steht fest im <body> (tools/make-hintergrund.py), damit die
    // Masken nicht erst nach Babel laden. Die Übersicht schaltet ihn nur ein —
    // beim Üben lenkte er neben der Karte ab.
    const useRand = () => useEffect(() => {
      document.documentElement.dataset.rand = '';
      return () => { delete document.documentElement.dataset.rand; };
    }, []);

    // ---------- Auswahlseite ----------
    const Selection = ({ own, folders, onOpen, onEdit, onNew, onImport, onDelete, folderApi, backup, dir }) => {
      useRand();
      const [showToast, toastNode] = useToast();
      const backupInput = useRef(null);
      // Der Datei-Listener am Fenster wird nur einmal angehängt (s. unten) und
      // hielte sonst für immer die Liste vom ersten Rendern fest — genau die
      // braucht aber die Rückfrage «gibt es schon».
      const ownRef = useRef(own);
      ownRef.current = own;
      const foldersRef = useRef(folders);
      foldersRef.current = folders;
      // Schlüssel per Weitergabe-Link gekommen (s. takeKeysFromHash): einmal sagen
      useEffect(() => { if (keysArrived) { keysArrived = false; showToast(t('myscriptTaken')); } }, []);
      // In der App gescannt (s. Scanner): Schlüssel gleich übernehmen, ein Set
      // über seine Route öffnen — der Rest läuft wie bei einem geöffneten Link.
      const [scan, setScan] = useState(false);
      // Schlüssel und Set stehen nebeneinander: ein kaputter Schlüsselteil
      // darf das mitgelieferte Set nicht verwerfen, und die Meldung wird hier
      // gezeigt statt über `keysArrived` — beim Öffnen eines Sets rendert
      // `Open`, und nur die Übersicht räumt das Merkmal ab.
      const onCode = (text) => {
        setScan(false);
        const got = scanned(text);
        if (!got) { showToast(t('scanNotOurs')); return; }
        const keysOk = got.keyPart ? takeKeys(got.keyPart) : null;
        // Wird gleich ein Set geöffnet, rendert `Open` und diese Meldung wäre
        // mit der Übersicht weg — dann übernimmt `keysArrived`, das die
        // Übersicht beim Zurückkommen abräumt.
        if (got.hash) { keysArrived = keysOk === true; location.hash = got.hash; }
        else if (keysOk !== null) showToast(keysOk ? t('myscriptTaken') : t('scanBadKeys'));
      };
      const importBackupText = (text) => {
        const n = backup.restore(text);
        showToast(n === null ? t('backupBad') : t('backupDone', n));
      };
      const dirButtons = (
        <div className="flex flex-wrap gap-2">
          {dir.status === 'none' && <button onClick={dir.connect} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('dirChoose')}</button>}
          {dir.status === 'prompt' && <button onClick={dir.reconnect} className={`px-4 py-2 ${BTN_PRIMARY}`}>{t('dirReconnect')}</button>}
          {(dir.status === 'ok' || dir.status === 'error') && <button onClick={dir.refresh} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('dirReload')}</button>}
          {dir.status !== 'none' && dir.status !== 'unsupported' && <button onClick={dir.disconnect} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('dirDisconnect')}</button>}
        </div>
      );
      // Muss VOR `useSettings` stehen: das Panel ist ein Argument, sein JSX wird
      // also vorher ausgewertet. Babel macht aus `const` ein `var` — eine später
      // deklarierte Variable wäre hier still `undefined` statt eines Fehlers
      // (der Haken blieb leer, obwohl die Beispiele standen).
      // Dasselbe gilt für die Anleitung: der Ordner-Kasten im Panel verweist
      // darauf. `null` | 'all' | Abschnitt.
      const [showDemos, setShowDemos] = useState(loadShowDemos);
      const [help, setHelp] = useState(null);
      const settingsButton = useSettings(
        <>
        <MyScriptKeys />
        <div>
          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={showDemos} className="mt-1 h-4 w-4 accent-akzent"
              onChange={(e) => { setShowDemos(e.target.checked); writeLocal(DEMOS_KEY, e.target.checked); }} />
            <span>
              <span className="font-semibold text-text">{t('showExamples')}</span>
              <span className="block text-sm text-text-2">{t('showExamplesHint')}</span>
            </span>
          </label>
        </div>
        <div>
          <div className={`${LABEL} mb-2`}>{t('dirTitle')}</div>
          <p className="text-sm text-text-2 mb-3">
            {dir.status === 'unsupported' ? t('dirUnsupported') : t('dirShort')} <HelpLink onClick={() => setHelp('dir')} />
          </p>
          {dir.status === 'ok' && <p className="text-sm text-akzent-text mb-3">{t('dirConnected', dir.name, own.length)}</p>}
          {/* «Freigeben» und «nicht erreichbar» stehen schon als Streifen über
              der Liste — hier nur die Knöpfe, sonst liest man beides doppelt. */}
          {dirButtons}
        </div>
        <div>
          <div className={`${LABEL} mb-2`}>{t('backupTitle')}</div>
          <p className="text-sm text-text-2 mb-3">{t('backupHint')} <HelpLink onClick={() => setHelp('move')} /></p>
          <StorageState count={own.length} folder={dir.status === 'ok' ? dir.name : null} />
          <div className="flex flex-wrap gap-2">
            <button onClick={backup.save} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('backupExport')}</button>
            <button onClick={() => backupInput.current.click()} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('backupImport')}</button>
            <input ref={backupInput} type="file" accept=".json,application/json" className="hidden"
              onChange={(e) => { for (const f of e.target.files) f.text().then(importBackupText); e.target.value = ''; }} />
          </div>
        </div>
        </>
      );
      const [qr, setQr] = useState(null);
      const [createOpen, setCreateOpen] = useState(false);
      // Wohin «Voci-Set erstellen» ablegt. Das `+` an einem Ordner öffnet
      // denselben Kasten mit diesem Ordner vorgewählt — sonst gäbe es dort nur
      // den Weg von Hand und oben nur die Hauptebene. Ein inzwischen
      // umbenannter oder gelöschter Ordner fällt auf die Hauptebene zurück.
      const [target, setTarget] = useState('');
      const into = folders.includes(target) ? target : '';
      const create = (dir) => {
        setTarget(dir);
        setCreateOpen(true);
        // Die Karte steht immer, nur ihr Inhalt klappt auf — scrollen geht sofort.
        document.getElementById('create').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      const [openDirs, setOpenDirs] = useState(loadOpen);
      const [dropDir, setDropDir] = useState(null);
      const dragged = useRef(null);
      const [dialog, setDialog] = useState(null);
      const [pasted, setPasted] = useState('');
      const [pastedTitle, setPastedTitle] = useState('');
      const fileInput = useRef(null);

      const copyText = async (text, msg) => {
        if (await copyLater(() => text)) showToast(msg); else showToast(t('copyFailed'));
      };
      // Klappt das Kopieren nicht (Safari, kein HTTPS), steht der Link
      // wenigstens im QR-Fenster zum Abschreiben — statt einer Sackgasse.
      const copyLink = async (set) => {
        if (await copyLater(() => directLink(set))) showToast(t('linkCopied'));
        else { showToast(t('copyFailed')); setQr({ title: set.title, url: await directLink(set) }); }
      };
      const showQr = async (set) => setQr({ title: set.title, url: await directLink(set) });
      const exportOne = (set) => { download(`${plainName(set.title)}.txt`, toFile(set)); showToast(t('downloadedOne', set.title)); };
      const exportAll = async () => {
        if (!own.length) { showToast(t('noOwnSets')); return; }
        try { download('MyVoci.zip', await zipBlob(own, folders)); }
        catch { showToast(t('zipFailed')); return; }
        showToast(t('downloadedAll', own.length));
      };

      // Ohne gewählten Ordner (Kasten auf «automatisch», aufs Fenster gezogen)
      // legt placeFor ab; `foldersRef`, weil der Fenster-Listener nur einmal
      // entsteht.
      const addImported = (text, name, chosen, complain) => {
        const parsed = parseFile(text, name);
        if (!parsed.words.length) { showToast(complain); return false; }
        const dir = chosen || placeFor(parsed, ownRef.current, foldersRef.current);
        const put = () => {
          onImport({ id: newId(), ...parsed, ...(dir ? { dir } : {}) });
          openTo(dir);
          showToast(t('imported', parsed.title, parsed.words.length));
        };
        // Gleicher Titel im gleichen Ordner heisst «neue Fassung desselben
        // Sets» — die alten Wörter sind danach weg. Das ist einen Klick wert,
        // es gibt kein Zurück.
        if (ownRef.current.some((s) => sameSlot(s, { dir, title: parsed.title }))) {
          setDialog({ kind: 'confirm', ok: t('replace'), text: t('confirmReplace', parsed.title), onYes: put });
        } else put();
        return true;
      };
      const importFiles = (fileList, dir) => {
        for (const file of fileList) {
          if (/\.json$/i.test(file.name)) { file.text().then(importBackupText); continue; } // Sicherung aufs Fenster gezogen
          file.text().then((text) => addImported(text, file.name, dir, t('noWordsInFile', file.name)));
        }
      };
      const importPasted = () => {
        if (!addImported(pasted, pastedTitle.trim() || 'Voci', into, t('noWordsFound'))) return;
        setPasted('');
        setPastedTitle('');
      };

      // Alles, was im Kasten ankommt (Auswahl, Ablage-Fläche), geht in dessen
      // Ordner. Die Fläche braucht ein eigenes onDrop: sonst fiele die Datei zum
      // Fenster-Listener durch, und der kennt nur die Hauptebene.
      const importHere = (fileList) => importFiles(fileList, into);
      const hereDrop = {
        onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); },
        onDrop: (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); e.stopPropagation(); importHere(e.dataTransfer.files); },
      };

      useEffect(() => {
        const over = (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
        const drop = (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); importFiles(e.dataTransfer.files); };
        window.addEventListener('dragover', over);
        window.addEventListener('drop', drop);
        return () => { window.removeEventListener('dragover', over); window.removeEventListener('drop', drop); };
      }, []);

      const rememberOpen = (dirs) => { setOpenDirs(dirs); writeLocal(OPEN_KEY, dirs); };
      // Ein Import in einen zugeklappten Ordner wäre sonst unsichtbar — die
      // Meldung sagt «importiert», die Liste zeigt nichts. Funktional, weil
      // `put` auch erst nach der Rückfrage «ersetzen?» laufen kann.
      const openTo = (dir) => setOpenDirs((cur) => {
        const add = [];
        for (let d = dir || ''; d; d = parentDir(d)) if (!cur.includes(d)) add.push(d);
        if (!add.length) return cur;
        const next = [...cur, ...add];
        writeLocal(OPEN_KEY, next);
        return next;
      });
      // Umbenannt oder verschoben: aufgeklappte Ordner und die Ordnerwahl im
      // Kasten wandern mit, sonst fiele die Wahl still auf die Hauptebene.
      const followMove = (from, to) => {
        const move = (d) => (inside(d, from) ? to + d.slice(from.length) : d);
        rememberOpen(openDirs.map(move));
        setTarget(move);
      };
      const toggleDir = (dir) => rememberOpen(openDirs.includes(dir) ? openDirs.filter((d) => d !== dir) : [...openDirs, dir]);

      const canDrop = (dir) => {
        const d = dragged.current;
        if (!d) return false;
        if (d.kind === 'set') return d.dir !== dir;
        return !inside(dir, d.id) && parentDir(d.id) !== dir;
      };
      const dragProps = (item) => ({
        draggable: true,
        onDragStart: (e) => { dragged.current = item; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.id); },
        onDragEnd: () => { dragged.current = null; setDropDir(null); },
      });
      const dropProps = (dir) => ({
        onDragOver: (e) => {
          e.stopPropagation();
          if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); setDropDir(dir); return; }
          if (!canDrop(dir)) { setDropDir(null); return; }
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          setDropDir(dir);
        },
        onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDropDir((cur) => (cur === dir ? null : cur)); },
        onDrop: (e) => {
          e.stopPropagation();
          if (e.dataTransfer.files.length) { e.preventDefault(); setDropDir(null); importFiles(e.dataTransfer.files, dir); return; }
          const item = dragged.current;
          if (!item || !canDrop(dir)) return;
          e.preventDefault();
          dragged.current = null;
          setDropDir(null);
          if (item.kind === 'set') folderApi.moveSet(item.id, dir);
          else {
            const target = folderApi.moveFolder(item.id, dir);
            if (target === false) { showToast(t('folderExists', dirName(item.id))); return; }
            followMove(item.id, target);
          }
        },
      });

      const newFolder = (parent) => setDialog({
        kind: 'prompt', ok: t('create'), label: parent ? t('askSubfolder', dirName(parent)) : t('askFolder'),
        onOk: (name) => {
          const path = folderApi.makeFolder(parent, name);
          if (path) rememberOpen([...new Set([...openDirs, parent, path].filter(Boolean))]);
        },
      });
      const renameFolder = (dir) => setDialog({
        kind: 'prompt', ok: t('rename'), label: t('askRename'), preset: dirName(dir),
        onOk: (name) => {
          const target = folderApi.renameFolder(dir, name);
          if (target === false) { showToast(t('folderExists', name)); return; }
          if (target) followMove(dir, target);
        },
      });
      const dropFolder = (dir) => {
        if (own.some((s) => inside(s.dir || '', dir)) || folders.some((f) => f !== dir && inside(f, dir))) { showToast(t('folderNotEmpty')); return; }
        setDialog({
          kind: 'confirm', ok: t('del'), text: t('confirmDeleteFolder', dirName(dir)),
          onYes: () => { folderApi.removeFolder(dir); rememberOpen(openDirs.filter((d) => d !== dir)); },
        });
      };

      // Kompakte Liste (DESIGN.md, wie MyMemory): Titel in fester Spalte
      // (kürzt bei Bedarf), Wortzahl dahinter in einer Flucht, rechts die
      // Symbolknöpfe spaltenweise untereinander. Die ganze Zeile öffnet das Set.
      const row = (set, deletable) => (
        <div key={set.id} onClick={() => onOpen(set)} className="liste-zeile cursor-pointer"
          {...(deletable ? dragProps({ kind: 'set', id: set.id, dir: set.dir || '' }) : {})}>
          <button className="liste-name">{set.title}</button>
          <span className="liste-zahl">{t('nWords', set.words.length)}{langBadge(set)}</span>
          <RowTool onClick={() => exportOne(set)} title={t('exportOne')} extra="hidden sm:inline-flex"><DownloadIcon /></RowTool>
          <RowTool onClick={() => copyLink(set)} title={t('copyLink')}><LinkIcon /></RowTool>
          <RowTool onClick={() => showQr(set)} title={t('showQr')}><QrIcon /></RowTool>
          {deletable && (
            <>
              <RowTool onClick={() => onEdit(set)} title={t('edit')}><PenIcon /></RowTool>
              <RowTool title={t('del')} hover="gefahr"
                onClick={() => setDialog({ kind: 'confirm', ok: t('del'), text: t('confirmDeleteSet', set.title), onYes: () => onDelete(set.id) })}>
                <TrashIcon />
              </RowTool>
            </>
          )}
        </div>
      );

      const folderBox = (dir) => {
        const isOpen = openDirs.includes(dir);
        return (
          <div key={dir} {...dropProps(dir)} className={`ablage ${dropDir === dir ? 'ziel' : ''}`}>
            <div {...dragProps({ kind: 'dir', id: dir })} onClick={() => toggleDir(dir)}
              className="liste-zeile cursor-pointer select-none">
              <span className={`shrink-0 text-text-3 transition-transform ${isOpen ? 'rotate-90' : ''}`}><ChevronIcon /></span>
              <span className="shrink-0 text-text-3 mx-1.5"><FolderIcon /></span>
              <span className="flex-1 min-w-0 truncate font-semibold">{dirName(dir)}</span>
              <RowTool onClick={() => create(dir)} title={t('newSetHere')}><PlusIcon /></RowTool>
              <RowTool onClick={() => newFolder(dir)} title={t('newSubfolder')}><FolderIcon /></RowTool>
              <RowTool onClick={() => renameFolder(dir)} title={t('renameFolder')}><PenIcon /></RowTool>
              <RowTool onClick={() => dropFolder(dir)} title={t('deleteFolder')} hover="gefahr"><TrashIcon /></RowTool>
            </div>
            {/* Inhalt an einer Linie eingerückt — man sieht, was wohin gehört */}
            {isOpen && <div className="liste-ordner">{treeOf(dir)}</div>}
          </div>
        );
      };
      const treeOf = (dir) => (
        <>
          {folders.filter((f) => parentDir(f) === dir).map(folderBox)}
          {own.filter((s) => (s.dir || '') === dir).map((s) => row(s, true))}
        </>
      );

      return (
        <div className={PAGE}>
          <div className={COLUMN}>
            {/* Keine Kopfleiste (wie MyMemory/MyKahoot): die Startseite trägt den Markenzug */}
            <div className="flex items-center gap-1 mb-1">
              <div className="flex-1 flex items-center gap-3 text-3xl sm:text-4xl">
                <h1 className="font-bold frei">MyVoci</h1>
                <span className="logo" role="img" aria-label={t('logoLabel')} />
              </div>
              <IconButton onClick={() => setScan(true)} title={t('scan')}><ScanIcon /></IconButton>
              <IconButton onClick={() => setHelp('all')} title={t('helpTitle')}><HelpIcon /></IconButton>
              {settingsButton}
            </div>
            <p className="text-text-2 mb-6 frei">{t('subtitle')}</p>
            <StorageWarning />
            {(dir.status === 'prompt' || dir.status === 'error') && (
              <div className={`mb-6 rounded-lg border-2 px-4 py-3 text-sm ${dir.status === 'prompt' ? 'border-orange-linie bg-orange-weich text-orange' : 'border-rot-linie bg-rot-weich text-rot'}`}>
                <p className="mb-2">{dir.status === 'prompt' ? t('dirPrompt', dir.name) : t('dirError', dir.name)}</p>
                {dirButtons}
              </div>
            )}

            <Collapsible id="create" title={t('createTitle')} open={createOpen}
              onToggle={() => { setTarget(''); setCreateOpen((v) => !v); }}>
              {folders.length > 0 && (
                <label className="flex items-center gap-3 mb-4">
                  <span className={LABEL}>{t('createIn')}</span>
                  <FolderSelect value={into} onChange={setTarget} folders={folders} className="text-sm" rootLabel={t('autoFolder')} />
                </label>
              )}
              <ol className="list-decimal list-inside text-sm text-text-2 space-y-1 mb-4">{t('steps')}</ol>
              <button onClick={() => copyText(kiPrompt(), t('promptCopied'))} className={`w-full ${BTN_PRIMARY} px-4 py-2 mb-6`}>
                {t('copyPrompt')}
              </button>
              <div onClick={() => fileInput.current.click()} {...hereDrop}
                className="border-2 border-dashed border-linie rounded-lg p-6 text-center text-text-2 cursor-pointer hover:border-akzent hover:text-text hover:bg-akzent-weich transition-all">
                <span className="flex items-center justify-center gap-2 font-bold"><InboxIcon /> {t('dropTitle')}</span>
                <span className="block text-sm text-text-3">{t('dropHint')}</span>
              </div>
              <input ref={fileInput} type="file" accept=".txt,.md" multiple className="hidden"
                onChange={(e) => { importHere(e.target.files); e.target.value = ''; }} />
              <OrDivider>{t('orPaste')}</OrDivider>
              <input type="text" value={pastedTitle} onChange={(e) => setPastedTitle(e.target.value)} placeholder={t('pastedTitlePh')}
                className={`w-full mb-2 ${INPUT} text-sm`} />
              <textarea value={pasted} onChange={(e) => setPasted(e.target.value)} rows={6} placeholder={t('pastePh')}
                className={`w-full ${INPUT} text-sm font-mono`} />
              <button onClick={importPasted} disabled={!pasted.trim()}
                className={`w-full mt-2 px-4 py-2 ${BTN_PRIMARY}`}>
                {t('importText')}
              </button>
              <OrDivider>{t('orByHand')}</OrDivider>
              <button onClick={() => onNew(into)} className={`w-full ${BTN_NEUTRAL} px-4 py-2 flex items-center justify-center gap-2`}>
                <PenIcon /> {t('byHand')}
              </button>
              <p className="text-xs text-text-3 mt-3">{dir.status === 'ok' ? t('importHintDir', dir.name) : t('importHint')}</p>
            </Collapsible>

            <div className={`${CARD} p-3 sm:p-4 mb-6`}>
              <div className="flex items-center gap-0.5 mb-2 pl-2.5">
                <h2 className={`${LABEL} flex-1`}>{t('mySets')}</h2>
                <RowTool onClick={() => create('')} title={t('newSet')}><PlusIcon /></RowTool>
                <RowTool onClick={() => newFolder('')} title={t('newFolder')}><FolderIcon /></RowTool>
                <RowTool onClick={exportAll} title={t('exportAll')}><DownloadIcon /></RowTool>
              </div>
              {/* Die Liste selbst ist die Hauptebene: was hierher gezogen wird, liegt in keinem Ordner */}
              <div {...dropProps('')} className={`ablage min-h-[3rem] ${dropDir === '' ? 'ziel' : ''}`}>
                {own.length || folders.length ? treeOf('') : (
                  <div className="flex flex-col items-center text-center gap-3 px-4 py-6 text-text-3">
                    <img src="design/icons/creme/voci.svg?v=4" alt="" className="w-[52px] h-[52px] rounded-xl" />
                    <p className="text-sm max-w-xs">{t('emptyList')}</p>
                  </div>
                )}
              </div>
              {/* Bei verbundenem Ordner stimmt «in diesem Browser» nicht mehr:
                  dort liegen die Sets als Dateien, im Browser nur der Lernstand. */}
              {own.length > 0 && (
                <p className="text-sm text-text-3 mt-2 px-2.5">
                  {dir.status === 'ok' ? t('storedHintDir', dir.name) : t('storedHint')}
                </p>
              )}
              {/* Der Ordner ist ein einmaliger Einrichtungsschritt — in den
                  Einstellungen findet ihn niemand. Nur wo er möglich ist
                  (Chrome/Edge am Computer) und noch keiner hängt; die anderen
                  Zustände melden sich oben von selbst. */}
              {dir.status === 'none' && (
                <p className="text-sm text-text-3 mt-2 px-2.5">
                  {t('dirOffer')}{' '}
                  <button onClick={dir.connect} className="underline font-semibold hover:text-text-2">{t('dirChoose')}</button>
                </p>
              )}
            </div>

            {showDemos && (
              <div className={`${CARD} p-3 sm:p-4 mb-8`}>
                <h2 className={`${LABEL} mb-2 pl-2.5 leading-[34px]`}>{t('examples')}</h2>
                {DEMOS.map((s) => row(s, false))}
              </div>
            )}
          </div>

          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && <QrModal title={qr.title} url={qr.url} onClose={() => setQr(null)} onCopy={() => copyText(qr.url, t('linkCopied'))} />}
          {scan && <Scanner onClose={() => setScan(false)} onCode={onCode} />}
          {help && <Help only={help === 'all' ? null : help} onClose={() => setHelp(null)} />}
          {toastNode}
        </div>
      );
    };

    // ---------- Editor ----------
    const EMPTY_WORD = { a: '', b: '', s: '', h: '', ha: '', hb: '', all: false, ft: '' };
    // Wortformen im Editor: ein Textfeld in derselben Schreibweise wie die
    // Datei (Zeilen:/Spalten:/T:), gelesen mit demselben Zeilenleser
    // (readTableLine). Andere Zeilen (auch F:, ---) werden übergangen — und
    // genau das meldet formIssues, statt still die ganze Tabelle zu verlieren.
    const formText = (f) => formLines(f).trimEnd();
    // Was nicht zusammenpasst, sagen statt schlucken: fehlende oder
    // überzählige Beschriftungen, Zeilen mit anderer Zellenzahl
    const formIssues = (text) => {
      const out = text.split('\n').map((x) => x.trim())
        .filter((x) => x && !readTableLine(x))
        .map((x) => t('formsIssueLine', x));
      const f = parseTable(text);
      if (!f) return out;
      if (f.r.length && f.r.length !== f.t.length) out.push(t('formsIssueRows', f.t.length, f.r.length));
      const width = f.c.length || Math.max(...f.t.map((row) => row.length));
      const odd = f.t.map((row, i) => (row.length !== width ? i + 1 : 0)).filter(Boolean);
      if (odd.length) out.push(t('formsIssueCells', odd.join(', '), width));
      return out;
    };
    const SetEditor = ({ set, sets, folders, onSave, onCancel, onNewFolder }) => {
      const [title, setTitle] = useState(set.title);
      const [dir, setDir] = useState(set.dir || '');
      const [lang, setLang] = useState(set.lang || '');
      const [langA, setLangA] = useState(set.langs ? set.langs[0] : '');
      const [langB, setLangB] = useState(set.langs ? set.langs[1] : '');
      const [words, setWords] = useState(() =>
        set.words.length
          ? set.words.map((w) => ({ ...EMPTY_WORD, ...w, s: (w.s || []).join('\n'), all: !!w.all, ft: w.f ? formText(w.f) : '' }))
          : [{ ...EMPTY_WORD }]);
      const [error, setError] = useState('');
      const [dialog, setDialog] = useState(null);

      // Ein Merkmal statt eines JSON-Vergleichs des ganzen Sets bei jedem
      // Zeichen: gefragt ist nur, ob überhaupt etwas angefasst wurde.
      const [dirty, setDirty] = useState(false);
      // Jede Änderung geht durch `touch` — eine Stelle, die das Merkmal setzt.
      const touch = (fn) => (...args) => { setDirty(true); fn(...args); };
      const editTitle = touch(setTitle), editDir = touch(setDir), editLang = touch(setLang);
      const editLangA = touch(setLangA), editLangB = touch(setLangB);

      const setWord = touch((i, key, value) => setWords((ws) => ws.map((w, j) => (j === i ? { ...w, [key]: value } : w))));
      const addWord = touch(() => setWords((ws) => [...ws, { ...EMPTY_WORD }]));
      const removeWord = touch((i) => setWords((ws) => ws.filter((_, j) => j !== i)));
      const moveWord = touch((i, delta) => setWords((ws) => {
        const j = i + delta;
        if (j < 0 || j >= ws.length) return ws;
        const next = [...ws];
        [next[i], next[j]] = [next[j], next[i]];
        return next;
      }));

      const save = () => {
        const clean = words
          .map((w) => ({
            a: joinAnswer(w.a.split('\n')), b: joinAnswer(w.b.split('\n')),
            s: w.s.split('\n').map((x) => x.trim()).filter(Boolean), h: w.h.trim(), ha: w.ha.trim(), hb: w.hb.trim(), all: w.all,
            f: parseTable(w.ft),
          }))
          .filter((w) => w.a || w.b)
          .map(cleanWord);
        const name = title.trim();
        if (!name) return setError(t('errTitle'));
        // Nur im selben Ordner: seit die Sets in Ordnern liegen, tragen zwei
        // Kinder gut denselben Set-Titel — global geprüft liess sich so ein
        // Set gar nicht mehr speichern.
        if (sets.some((s) => s.id !== set.id && sameSlot(s, { dir, title: name }))) return setError(t('errTitleTaken'));
        if (!clean.length) return setError(t('errNoWord'));
        if (clean.some((w) => !w.a || !w.b)) return setError(t('errHalfWord'));
        const a = langCode(langA), b = langCode(langB);
        onSave({ ...set, title: name, dir, words: clean, lang: lang || undefined, langs: a && b ? [a, b] : undefined });
      };
      const cancel = () => {
        if (!dirty) return onCancel();
        setDialog({ kind: 'confirm', ok: t('discard'), text: t('confirmDiscard'), onYes: onCancel });
      };
      const newFolder = () => setDialog({
        kind: 'prompt', ok: t('create'), label: dir ? t('askSubfolder', dirName(dir)) : t('askFolder'),
        onOk: (name) => { const path = onNewFolder(dir, name); if (path) editDir(path); },
      });

      const nameA = langA ? langName(langCode(langA)) : t('sideA');
      const nameB = langB ? langName(langCode(langB)) : t('sideB');
      // Beide Seiten mehrzeilig: eine Zeile pro Listenpunkt («1. …», «- …»)
      const side = (i, key, label, placeholder) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <textarea rows={Math.max(1, words[i][key].split('\n').length)} value={words[i][key]} placeholder={placeholder}
            onChange={(e) => setWord(i, key, e.target.value)} className={`w-full mt-1 ${INPUT} resize-y`} />
        </label>
      );
      const field = (i, key, label, placeholder) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input type="text" value={words[i][key]} placeholder={placeholder} onChange={(e) => setWord(i, key, e.target.value)}
            className={`w-full mt-1 ${INPUT}`} />
        </label>
      );

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className={COLUMN}>
            <h1 className="text-2xl font-bold text-text mb-6">{set.id ? t('editSet') : t('newSet')}</h1>
            <div className={`${CARD} p-6 mb-6`}>
              <label className="block mb-4">
                <span className={LABEL}>{t('titleLabel')}</span>
                <input type="text" value={title} onChange={(e) => editTitle(e.target.value)} placeholder={t('titlePh')} className={`w-full mt-1 ${INPUT}`} />
              </label>
              <span className={LABEL}>{t('folderLabel')}</span>
              <div className="flex gap-2 mt-1 mb-4">
                <FolderSelect value={dir} onChange={editDir} folders={folders} />
                <IconButton onClick={newFolder} title={t('makeFolder')}><FolderIcon /></IconButton>
              </div>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className={LABEL}>{t('langA')}</span>
                  <input type="text" list="langlist" value={langA} onChange={(e) => editLangA(e.target.value)} placeholder={t('langPh')} className={`w-full mt-1 ${INPUT}`} />
                </label>
                <label className="block">
                  <span className={LABEL}>{t('langB')}</span>
                  <input type="text" list="langlist" value={langB} onChange={(e) => editLangB(e.target.value)} placeholder={t('langPh')} className={`w-full mt-1 ${INPUT}`} />
                </label>
                <datalist id="langlist">{Object.keys(LANG_NAMES).map((c) => <option key={c} value={c}>{langName(c)}</option>)}</datalist>
              </div>
              <span className="block mt-1 text-sm text-text-2">{t('langsHint')}</span>
              <label className="block mt-4">
                <span className={LABEL}>{t('uiLangLabel')}</span>
                <select value={lang} onChange={(e) => editLang(e.target.value)} className={`w-full mt-1 ${INPUT}`}>
                  <option value="">{t('uiLangDefault')}</option>
                  {LANGS.map((entry) => <option key={entry.id} value={entry.id}>{entry.name}</option>)}
                </select>
                <span className="block mt-1 text-sm text-text-2">{t('uiLangHint')}</span>
              </label>
            </div>

            {words.map((w, i) => (
              <div key={i} className="kachel p-4 mb-3">
                <div className="flex items-center gap-2 mb-2">
                  <span className="flex-1 text-sm font-semibold text-text-3">{t('wordN', i + 1)}</span>
                  <IconButton onClick={() => moveWord(i, -1)} title={t('moveUp')}>↑</IconButton>
                  <IconButton onClick={() => moveWord(i, 1)} title={t('moveDown')}>↓</IconButton>
                  <IconButton onClick={() => removeWord(i)} title={t('deleteWord')} hover="hover:bg-rot-weich"><TrashIcon /></IconButton>
                </div>
                <div className="grid sm:grid-cols-2 gap-3 mb-3">
                  {side(i, 'a', nameA, t('sideAPh'))}
                  {side(i, 'b', nameB, t('sideBPh'))}
                </div>
                {/* Dieselbe Prüfung wie beim Speichern (cleanWord), sonst ginge ein Haken verloren */}
                {[w.a, w.b].some((x) => isList(joinAnswer(x.split('\n')))) && (
                  <label className="flex items-center gap-2 -mt-1 mb-3 text-sm text-text-2">
                    <input type="checkbox" checked={w.all} onChange={(e) => setWord(i, 'all', e.target.checked)} /> {t('allNeeded')}
                  </label>
                )}
                <label className="block mb-3">
                  <span className={LABEL}>{t('sentences')}</span>
                  <textarea rows={2} value={w.s} placeholder={t('sentencesPh')} onChange={(e) => setWord(i, 's', e.target.value)}
                    className={`w-full mt-1 ${INPUT} text-sm`} />
                </label>
                {field(i, 'h', t('hint'), t('hintPh'))}
                <div className="grid sm:grid-cols-2 gap-3 mt-3">
                  {field(i, 'ha', t('hintSide', nameA), t('hintSidePh'))}
                  {field(i, 'hb', t('hintSide', nameB), t('hintSidePh'))}
                </div>
                {/* Wortformen: zugeklappt, solange das Wort keine hat — die
                    meisten Wörter brauchen keine Tabelle */}
                {w.ft || w.fOpen ? (
                  <label className="block mt-3">
                    <span className={LABEL}>{t('formsLabel')}</span>
                    <textarea rows={Math.max(4, w.ft.split('\n').length)} value={w.ft} placeholder={t('formsPh')}
                      onChange={(e) => setWord(i, 'ft', e.target.value)} spellCheck={false}
                      className={`w-full mt-1 ${INPUT} text-sm font-mono`} />
                    {formIssues(w.ft).map((x, k) => <span key={k} className="block text-xs text-orange mt-1">{x}</span>)}
                  </label>
                ) : (
                  <button type="button" onClick={() => setWords((ws) => ws.map((x, j) => (j === i ? { ...x, fOpen: true } : x)))}
                    className="mt-3 text-sm font-semibold text-akzent-text hover:underline">+ {t('formsAdd')}</button>
                )}
              </div>
            ))}

            <button onClick={addWord} className={`w-full px-4 py-2 mb-4 ${BTN_NEUTRAL} bg-karte flex items-center justify-center gap-2`}>
              <PlusIcon /> {t('addWord')}
            </button>
            {error && <p className="text-sm text-rot mb-2">{error}</p>}
            <div className="flex gap-3">
              <button onClick={cancel} className={`flex-1 px-4 py-3 ${BTN_NEUTRAL} bg-karte`}>{t('cancel')}</button>
              <button onClick={save} className={`flex-1 ${BTN_PRIMARY} px-4 py-3`}>{t('save')}</button>
            </div>
            <p className="text-xs text-text-3 mt-3">{t('editorHint')}</p>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
        </div>
      );
    };

    // ---------- Set-Seite: Einstellungen für die Runde + Lernstand ----------
    const OPTS_KEY = 'myvoci_practice';
    const DEFAULT_OPTS = { mode: 'write', input: 'write', forms: false, dir: 'ab', sel: 'all', from: 1, to: 20, order: 'random', level: 'normal', hints: true, copy: true, exam: false, penOnly: false, timer: 0 };
    const loadOpts = () => ({ ...DEFAULT_OPTS, ...(readLocal(OPTS_KEY, {}) || {}) });

    // Bausteine der Set-Seite: Segment-Schalter für kleine Wahlen, Schalter
    // für Ja/Nein, eine Zeile «Beschriftung links, Wahl rechts» (auf dem
    // Handy untereinander). Keine Trennlinien — gegliedert wird über Abstand.
    // `even`: gleich breite (und damit gleich hohe) Felder, auch wenn eines
    // auf dem Handy umbricht — für Wahlen mit Icon wie die Eingabe.
    const Seg = ({ options, value, onChange, even }) => (
      <div className={`${even ? 'inline-grid' : 'inline-flex flex-wrap'} gap-0.5 p-[3px] rounded-lg border border-linie`}
        style={even ? { gridTemplateColumns: `repeat(${options.length}, minmax(0, 1fr))` } : undefined}>
        {options.map(([id, label, disabled, title]) => (
          <button key={id} disabled={disabled} onClick={() => onChange(id)} title={title} aria-pressed={value === id}
            className={`px-3 py-1.5 rounded-md text-sm font-semibold flex items-center justify-center gap-1.5 text-center leading-tight transition-colors ${value === id ? 'bg-akzent-weich text-akzent-text' : `text-text-2 ${disabled ? '' : 'hover:bg-hover'}`} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}`}>
            {label}
          </button>
        ))}
      </div>
    );
    const Switch = ({ checked, onChange, hint, children }) => (
      <label className="flex items-start gap-3 cursor-pointer">
        <button type="button" role="switch" aria-checked={checked} onClick={() => onChange(!checked)}
          className={`mt-0.5 relative w-10 h-6 shrink-0 rounded-full transition-colors ${checked ? 'bg-akzent' : 'bg-linie'}`}>
          <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform ${checked ? 'translate-x-4' : ''}`} />
        </button>
        <span className="text-sm text-text">{children}{hint && <span className="block text-xs text-text-3">{hint}</span>}</span>
      </label>
    );
    const OptRow = ({ label, children }) => (
      <div className="sm:flex sm:items-start sm:gap-4">
        <div className="sm:w-28 shrink-0 text-sm text-text-2 mb-1.5 sm:mb-0 sm:pt-1.5">{label}</div>
        <div className="flex-1 min-w-0">{children}</div>
      </div>
    );
    const NOTE = 'text-xs text-text-3 mt-1.5';
    const TOL_LABEL = { strict: 'tolStrict', normal: 'tolNormal', loose: 'tolLoose' }; // dazu je `…Hint`
    // Linien-Icons der Modi und Eingaben, eine Farbe (currentColor)
    const MODE_ICON = {
      write: <><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z" /><path d="M14 7l3 3" /></>,
      cards: <><rect x="8" y="3.5" width="12" height="15" rx="2" /><path d="M5 7v11a2.5 2.5 0 0 0 2.5 2.5H15" /></>,
      choice: <><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /><path d="M15.5 17l1.5 1.5 2.5-3" /></>,
      match: <><circle cx="5" cy="6" r="1.8" /><circle cx="5" cy="18" r="1.8" /><circle cx="19" cy="6" r="1.8" /><circle cx="19" cy="18" r="1.8" /><path d="M6.8 6.8l10.4 10.4M6.8 17.2L17.2 6.8" /></>,
      gap: <><path d="M3 7h18M3 17h4M17 17h4" /><rect x="9" y="13.5" width="6" height="7" rx="1" strokeDasharray="2 2" /></>,
      listen: <><path d="M4 15v-3a8 8 0 0 1 16 0v3" /><rect x="3" y="14" width="4" height="6.5" rx="1.5" /><rect x="17" y="14" width="4" height="6.5" rx="1.5" /></>,
      speak: <><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></>,
      scramble: <><path d="M3 7h3c3.5 0 5.5 10 9 10h5M17.5 14l2.5 3-2.5 3M3 17h3c1.4 0 2.5-1.6 3.5-3.4M14 9.5C15 8 15.8 7 17 7h3M17.5 4l2.5 3-2.5 3" /></>,
      parse: <><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8.5-8.5 8.5z" /><circle cx="8" cy="8" r="1.5" /></>,
      table: <><rect x="3.5" y="4" width="17" height="16" rx="2" /><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4v16" /></>,
    };
    const INPUT_ICON = {
      write: <><rect x="2.5" y="6" width="19" height="12" rx="2" /><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8" /></>,
      pen: <><path d="M3 16c2-6 3.5-9 5-9s.5 6 2.5 6 2.5-6 4-6 1 6 3 6 2.5-2 3.5-3" /><path d="M3 20.5h18" /></>,
      ink: <><path d="M3 14c2-5 3.5-7.5 5-7.5s.5 5 2.5 5 2.5-5 4-5 1 4 3 4" /><path d="M13.5 19l2.5 2.5 5-5.5" /></>,
    };

    const Choice = ({ options, value, onChange }) => (
      <div className="flex flex-wrap gap-2">
        {options.map(([id, label, disabled, title]) => (
          <button key={id} disabled={disabled} onClick={() => onChange(id)} title={title} aria-label={title} aria-pressed={value === id}
            className={`px-3 py-2 text-sm ${value === id ? BTN_SECONDARY : BTN_NEUTRAL}`}>
            {label}
          </button>
        ))}
      </div>
    );

    // Welche Modi gibt es, und was braucht ein Modus vom Set?
    const MODES = ['write', 'pen', 'ink', 'cards', 'choice', 'match', 'gap', 'listen', 'speak', 'scramble', 'parse', 'table'];
    // Nur mit Wortformen (`opts.forms`): Bestimmen (Form → Zeile/Spalte) und
    // Tabelle ausfüllen. Ohne Wortformen fehlen die Kacheln ganz — bei den
    // meisten Sets wären sie sonst dauerhaft grau, und am Set liesse sich das
    // nicht beheben.
    const FORM_MODES = ['parse', 'table'];
    // «Schreiben» hat drei Eingaben. Intern sind es eigene Modi — daran hängen
    // Link (`&mode=`), `modeOff` und die Listen hier —, gezeigt wird ein Knopf
    // mit einer Zeile «Eingabe» darunter. `pen` erkennt nie, `ink` immer: die
    // Wahl hängt nicht mehr still daran, ob Schlüssel im Browser liegen.
    const WRITE_INPUTS = ['write', 'pen', 'ink'];
    const INPUT_LABEL = { write: 'inputKeys', pen: 'inputPen', ink: 'inputInk' }; // voller Name
    // Set-Seite: kurzer Name und wer prüft — auch die Tastatur prüft, die zwei
    // Handschriften unterscheiden sich nur darin
    const INPUT_SHORT = { write: 'inputKeys', pen: 'handwriting', ink: 'handwriting' };
    const INPUT_CHECK = { write: 'checkAuto', pen: 'checkSelf', ink: 'checkAuto' };
    const MODE_GROUP = { pen: 'write', ink: 'write' }; // kein eigener Knopf, eine Eingabe von
    const HAND_MODES = ['pen', 'ink']; // Schreibfläche statt Eingabefeld
    // Gleichwertiger Ersatz, wenn ein Modus bei diesem Set nicht geht (sonst «Schreiben»)
    const MODE_FALLBACK = { ink: 'pen' };
    const MODE_LABEL = { write: 'modeWrite', cards: 'modeCards', choice: 'modeChoice', match: 'modeMatch', gap: 'modeGap', listen: 'modeListen', speak: 'modeSpeak', scramble: 'modeScramble', parse: 'modeParse', table: 'modeTable' };
    // Modi, die der Rechner selber werten kann — Voraussetzung für Blitzrunde
    // und Prüfung (beides braucht ein Urteil ohne Zutun des Übenden).
    const AUTO_MODES = ['write', 'gap', 'listen', 'choice', 'scramble', 'parse'];
    const TIMER_STEPS = [0, 5, 10, 20];
    const TYPED_MODES = ['write', 'gap', 'listen']; // Eingabefeld + Toleranz + Abschreiben
    // Wer nach Toleranz gewertet wird, muss sie auch einstellen können: die
    // Handschrift mit Kontrolle hat kein Eingabefeld, wird aber genauso
    // gemessen — sonst gälte still, was zuletzt bei der Tastatur gewählt war.
    const LEVEL_MODES = [...TYPED_MODES, 'ink', 'table'];
    // Liste ganz verlangt (`W: alle`): gewertet beim Schreiben, von Hand oder
    // getippt, bei Karteikarten nur als Vermerk
    const NEED_ALL_MODES = [...WRITE_INPUTS, 'cards'];
    const DIRECTIONLESS = ['gap', 'match']; // Satz ist immer Sprache B, Zuordnen zeigt beide
    // Steht die Richtung fest? EINE Stelle für Runde (buildQueue) und Set-Seite
    // (Richtungswahl, Sprachprüfung in modeOff): richtungslose Modi und alles
    // mit Wortformen (gefragt ist immer die Form zur Grundform; Bestimmen und
    // Tabelle gibt es nur dort).
    const fixedDir = (opts) => DIRECTIONLESS.includes(opts.mode) || !!opts.forms;
    // Hören: gehört wird die Antwortseite — bei «gemischt» müssen beide gehen
    const listenLangs = (set, dir) => (set.langs ? (dir === 'ab' ? [set.langs[1]] : dir === 'ba' ? [set.langs[0]] : set.langs) : []);
    const canListen = (set, dir) => { const l = listenLangs(set, dir); return l.length > 0 && l.every(canSpeak); };
    const canSpeakMode = (set, dir) => { const l = listenLangs(set, dir); return l.length > 0 && l.every(canRecognize); };
    // Handschrift mit Kontrolle: erkannt wird die Antwortseite, wie beim Hören
    const canInk = (set, dir) => { const l = listenLangs(set, dir); return l.length > 0 && l.every((x) => IINK_LANG[x]); };

    const selectWords = (set, opts, prog) => {
      const recs = set.words.map((w) => prog[wordKey(w)]);
      // Bestimmen: «rosae» steht dreimal in der Tabelle, gefragt wird es
      // einmal — jede Lesart zählt (s. task in Practice)
      const seen = new Set();
      const once = (w) => {
        if (opts.mode !== 'parse') return true;
        const k = `${w.src}\u0001${formKey(w.b)}`;
        return !seen.has(k) && seen.add(k);
      };
      return set.words.filter((w, i) => (() => {
        if (opts.mode === 'gap' && !gapFor(w)) return false;
        if (opts.sel === 'wrong') return isWrong(recs[i]);
        if (opts.sel === 'due') return isDue(recs[i]);
        if (opts.sel === 'range') return i + 1 >= Math.min(opts.from, opts.to) && i + 1 <= Math.max(opts.from, opts.to);
        return true;
      })() && once(w)); // erst die Auswahl, dann einmal: sonst verdrängte eine
                        // nicht gewählte Lesart die gewählte (nur Fehler)
    };

    const SetPage = ({ set, prog, preset, go, onStart, onReset, onBack }) => {
      // Ein geteilter Link bringt seine Einstellungen mit (preset) — die gelten
      // für diesen Besuch, gemerkt wird erst, was hier umgestellt wird.
      // `wanted` ist die Wahl, `opts` (unten) das, was bei diesem Set geht
      const [wanted, setWanted] = useState(() => ({ ...loadOpts(), ...preset }));
      // Neu eingetragene Schlüssel sollen «mit Kontrolle» sofort freigeben —
      // vor `useSettings`, das JSX des Panels wird vorher ausgewertet
      const [inkKeys, setInkKeys] = useState(() => !!myscriptKeys());
      const settingsButton = useSettings(<MyScriptKeys onSaved={() => setInkKeys(!!myscriptKeys())} />);
      const [help, setHelp] = useState(false); // Anleitung: false oder der Abschnitt ('ink', 'forms')
      const [dialog, setDialog] = useState(null);
      const [listOpen, setListOpen] = useState(false);
      const [shareGo, setShareGo] = useState(false);
      const [qr, setQr] = useState(null);
      const [showToast, toastNode] = useToast();
      const shareLink = async () => (await directLink(set)) + optsToHash(opts, shareGo);
      const copyShare = async () => {
        if (await copyLater(shareLink)) showToast(t('shareCopied'));
        else { showToast(t('copyFailed')); setQr({ title: set.title, url: await shareLink() }); }
      };
      // Gemerkt wird nur, was hier von Hand umgestellt wurde — und zwar auf
      // dem gespeicherten Stand, nicht auf dem eines geteilten Links. Sonst
      // würden Prüfungsmodus und Timer einer fremden Übung zum Standard des
      // Geräts. Der Rückfall eines Modus steht nie im Zustand (s. `opts`).
      // Geschrieben wird ausserhalb des Updaters: der darf mehrfach laufen.
      const set_ = (patch) => {
        writeLocal(OPTS_KEY, { ...loadOpts(), ...patch });
        setWanted((o) => ({ ...o, ...patch }));
      };

      // Formen: jede Zelle der Tabellen wird ein eigenes Wort (formSet). Ab
      // hier rechnet die Seite mit `pool` — Zähler, Auswahl, Lernstand und
      // welche Modi gehen, gelten dann für die Formen.
      const formsOk = useMemo(() => hasForms(set), [set]);
      const forms = formsOk && !!wanted.forms;
      const pool = forms ? formSet(set) : set;
      const dir = fixedDir({ mode: wanted.mode, forms }) ? 'ab' : wanted.dir;
      const n = pool.words.length;
      const recs = pool.words.map((w) => prog[wordKey(w)]);
      const wrongN = recs.filter(isWrong).length;
      const dueN = recs.filter((r) => isDue(r)).length;
      const boxes = [0, 0, 0, 0, 0, 0];
      recs.forEach((r) => { boxes[r ? Math.min(r.box, 5) : 0]++; });
      const seen = recs.filter(Boolean).length;
      // `gapFor` zerlegt jeden Satz und baut dabei Ausdrücke — das darf nicht
      // an jedem Tastendruck in den Bereichsfeldern hängen.
      const gapN = useMemo(() => pool.words.filter(gapFor).length, [pool]);
      // Eine Stelle entscheidet, ob ein Modus geht, und warum nicht (der
      // I18N-Schlüssel des Grundes, sonst null) — sonst können ausgegrauter
      // Knopf, angezeigter Grund und Rückfall auseinanderlaufen.
      const modeOff = (m) => {
        if (!MODES.includes(m)) return 'modeUnknown';
        if (FORM_MODES.includes(m) && !forms) return 'modeFormsOnly';
        if (m === 'gap' && !gapN) return 'modeGapOff';
        if (m === 'ink' && !inkKeys) return 'inkOffKeys';
        // Hören, Sprechen und die Erkennung hängen an den Sprachen des Sets —
        // fehlen die, liegt es am Set, nicht am Browser
        const langDep = { listen: canListen, speak: canSpeakMode, ink: canInk }[m];
        if (!langDep || langDep(pool, dir)) return null;
        if (!listenLangs(pool, dir).length) return 'modeNoLangs';
        return { listen: 'modeListenOff', speak: SpeechRec ? 'modeSpeakLang' : 'modeSpeakOff', ink: 'inkOffLang' }[m];
      };
      // Ein Modus, der bei diesem Set nicht geht, fällt zurück — berechnet,
      // nicht per Effekt nachgetragen: sonst sähe «Direkt starten» beim
      // ersten Aufbau noch den ungültigen Modus und startete nie.
      const mode = modeOff(wanted.mode) ? MODE_FALLBACK[wanted.mode] || 'write' : wanted.mode;
      const opts = useMemo(() => (mode === wanted.mode && forms === wanted.forms ? wanted : { ...wanted, mode, forms }), [wanted, mode, forms]);
      const group = MODE_GROUP[opts.mode] || opts.mode; // die Kachel dazu
      const writing = group === 'write';
      const chosen = useMemo(() => selectWords(pool, opts, prog), [pool, opts, prog]);
      // «Direkt starten» aus dem Link — nur beim ersten Anzeigen (s. Trainer).
      // Ein gleichwertiger Ersatz (MODE_FALLBACK) startet auch, «Schreiben»
      // statt Lückentext nicht: das wäre eine andere Übung.
      useEffect(() => { if (go && (mode === wanted.mode || MODE_FALLBACK[wanted.mode]) && chosen.length) onStart(opts, chosen); }, []);
      const A = sideName(set, 0), B = sideName(set, 1);
      const BOX_COLORS = ['bg-fach-0', 'bg-fach-1', 'bg-fach-2', 'bg-fach-3', 'bg-fach-4', 'bg-fach-5'];

      return (
        <div className={`${SCREEN} p-4 sm:p-8`}>
          <div className={COLUMN}>
            <div className="flex items-center gap-2 mb-6">
              <button onClick={onBack} title={t('toOverview')} className={`shrink-0 px-4 py-2 ${BTN_NEUTRAL} auf-rand`}>
                ← {t('overview')}
              </button>
              <h1 className="flex-1 min-w-0 text-xl sm:text-3xl font-bold text-center text-text break-words">{set.title}</h1>
              {settingsButton}
            </div>
            <StorageWarning />

            <div className={`${CARD} p-5 sm:p-6 mb-6`}>
              {/* Nur bei Sets mit Formentabellen: vor dem Wie das Was. Die
                  Modi darunter laufen dann auf den einzelnen Formen. */}
              {formsOk && (
                <div className="mb-6">
                  <h2 className="text-lg font-semibold text-text mb-3">{t('whatHow')}</h2>
                  <Seg even value={forms ? 'forms' : 'words'} onChange={(v) => set_({ forms: v === 'forms' })}
                    options={[['words', t('whatWords', set.words.length)], ['forms', t('whatForms', formSet(set).words.length)]]} />
                  <p className={NOTE}>{t(forms ? 'formsHint' : 'wordsHint')} <HelpLink onClick={() => setHelp('forms')} /></p>
                </div>
              )}
              <h2 className="text-lg font-semibold text-text mb-3">{t('modeHow')}</h2>
              {/* Der Modus ist die eigentliche Wahl: Kacheln mit Icon und einer
                  Zeile. Geht ein Modus bei diesem Set nicht, steht der Grund
                  statt der Beschreibung auf der Kachel — ein Tooltip käme auf
                  dem iPad nie an. Zurück zu «Schreiben» holt die zuletzt
                  gewählte Eingabe (`input`). */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {MODES.filter((m) => !MODE_GROUP[m] && (forms || !FORM_MODES.includes(m))).map((m) => {
                  const on = group === m, off = modeOff(m);
                  return (
                    <button key={m} disabled={!!off} aria-pressed={on}
                      onClick={() => { if (m !== 'write') set_({ mode: m }); else if (!writing) set_({ mode: opts.input }); }}
                      className={`flex flex-col items-start text-left p-3 rounded-xl transition-all ${on ? 'bg-akzent-weich ring-2 ring-akzent' : 'bg-hover hover:bg-linie'} ${off ? 'opacity-40 cursor-not-allowed' : ''}`}>
                      <span className={on ? 'text-akzent-text' : 'text-text-3'}><Icon size={24}>{MODE_ICON[m]}</Icon></span>
                      <span className="mt-2 text-sm font-semibold text-text break-words hyphens-auto" lang={currentLang}>{t(MODE_LABEL[m])}</span>
                      <span className="text-xs text-text-2 leading-snug">{t(off || MODE_LABEL[m] + 'Short')}</span>
                    </button>
                  );
                })}
              </div>

              <div className="space-y-4 mt-6">
                {writing && (
                  <OptRow label={t('input')}>
                    <Seg even value={opts.mode} onChange={(m) => set_({ mode: m, input: m })}
                      options={WRITE_INPUTS.map((m) => [m, (
                        <span className="flex flex-col items-center py-0.5">
                          <span className="flex items-center gap-1.5"><Icon size={16}>{INPUT_ICON[m]}</Icon>{t(INPUT_SHORT[m])}</span>
                          <span className="text-xs font-normal opacity-75">{t(INPUT_CHECK[m])}</span>
                        </span>
                      ), !!modeOff(m), t(INPUT_LABEL[m])])} />
                    {/* Nur wer von Hand schreibt, bekommt den Weg zur Erkennung
                        gezeigt — wer tippt (etwa jede Klasse über einen
                        geteilten Link), braucht keine MyScript-Einrichtung */}
                    {modeOff('ink') && HAND_MODES.includes(opts.mode) && (
                      <p className={NOTE}>
                        {t(modeOff('ink'))} {!inkKeys && <HelpLink onClick={() => setHelp('ink')} />}
                      </p>
                    )}
                  </OptRow>
                )}
                {!fixedDir(opts) && (
                  <OptRow label={t('direction')}>
                    <Seg value={opts.dir} onChange={(dir) => set_({ dir })}
                      options={[['ab', t('dirAB', A, B)], ['ba', t('dirAB', B, A)], ['mix', t('dirMix')]]} />
                  </OptRow>
                )}
                <OptRow label={t(forms ? 'formList' : 'rowWords')}>
                  <Seg value={opts.sel} onChange={(sel) => set_({ sel })}
                    options={[['all', t('selAllN', n)], ['wrong', t('selWrongN', wrongN), !wrongN], ['due', t('selDueN', dueN)], ['range', t('selRange')]]} />
                  {opts.sel === 'range' && (
                    <div className="flex items-center gap-2 mt-2 text-sm text-text-2">
                      {t('rangeFrom')}
                      <input type="number" min={1} max={n} value={opts.from} onChange={(e) => set_({ from: +e.target.value || 1 })} className={`w-20 ${INPUT}`} />
                      {t('rangeTo')}
                      <input type="number" min={1} max={n} value={opts.to} onChange={(e) => set_({ to: +e.target.value || n })} className={`w-20 ${INPUT}`} />
                      <span className="text-text-3">/ {n}</span>
                    </div>
                  )}
                  {opts.mode === 'table' && <p className={NOTE}>{t('tableSelHint')}</p>}
                </OptRow>
                <OptRow label={t('order')}>
                  <Seg value={opts.order} onChange={(order) => set_({ order })} options={[['random', t('orderRandom')], ['file', t('orderFile')]]} />
                </OptRow>
                {LEVEL_MODES.includes(opts.mode) && (
                  <OptRow label={t('tolerance')}>
                    <Seg value={opts.level} onChange={(level) => set_({ level })} options={Object.entries(TOL_LABEL).map(([id, key]) => [id, t(key)])} />
                    <p className={NOTE}>{t(forms ? 'tolFormsHint' : TOL_LABEL[opts.level] + 'Hint')}</p>
                  </OptRow>
                )}
                {AUTO_MODES.includes(opts.mode) && (
                  <OptRow label={t('timerLabel')}>
                    <Seg value={opts.timer} onChange={(timer) => set_({ timer })} options={TIMER_STEPS.map((s) => [s, s ? t('timerS', s) : t('timerOff')])} />
                    {opts.timer > 0 && <p className={NOTE}>{t('timerHint')}</p>}
                  </OptRow>
                )}
                <OptRow label={t('rowExtras')}>
                  <div className="space-y-3">
                    <Switch checked={opts.hints} onChange={(hints) => set_({ hints })}>{t('showHints')}</Switch>
                    {TYPED_MODES.includes(opts.mode) && !opts.exam && (
                      <Switch checked={opts.copy} onChange={(copy) => set_({ copy })}>{t('copyWrong')}</Switch>
                    )}
                    {HAND_MODES.includes(opts.mode) && (
                      <Switch checked={opts.penOnly} onChange={(penOnly) => set_({ penOnly })}>{t('penOnly')}</Switch>
                    )}
                    {AUTO_MODES.includes(opts.mode) && (
                      <Switch checked={opts.exam} onChange={(exam) => set_({ exam })} hint={opts.exam ? t('examHint') : t('examShort')}>
                        <b>{t('exam')}</b>
                        {opts.exam && !canFullscreen() && <span className="block text-xs text-orange">{t('examNoFs')}</span>}
                      </Switch>
                    )}
                  </div>
                </OptRow>
              </div>
              <button onClick={() => onStart(opts, chosen)} disabled={!chosen.length}
                className={`w-full mt-6 px-6 py-3 text-lg ${BTN_PRIMARY}`}>
                {t('start')} · {t(forms ? 'nForms' : 'nWords', chosen.length)}
              </button>
              {!chosen.length && <p className="text-sm text-rot mt-2">{t('nothingSelected')}</p>}
            </div>

            <div className={`${CARD} p-6 mb-6`}>
              <h2 className="text-lg font-semibold text-text mb-1">{t('shareTitle')}</h2>
              <p className="text-sm text-text-2 mb-3">{t('shareHint')}</p>
              <div className="mb-3"><Switch checked={shareGo} onChange={setShareGo}>{t('shareGo')}</Switch></div>
              <div className="flex gap-2">
                <button onClick={copyShare} className={`flex-1 ${BTN_PRIMARY} px-4 py-2 flex items-center justify-center gap-2`}><LinkIcon /> {t('shareCopy')}</button>
                <IconButton onClick={async () => setQr({ title: set.title, url: await shareLink() })} title={t('showQr')}><QrIcon /></IconButton>
              </div>
            </div>

            <div className={`${CARD} p-6 mb-6`}>
              <div className="flex items-center gap-2 mb-3">
                <h2 className="text-lg font-semibold text-text flex-1">{t('progress')}</h2>
                <span className="text-sm text-text-2">{t('wrongCount', wrongN)} · {t('dueCount', dueN)}</span>
              </div>
              <div className="flex h-4 rounded-full overflow-hidden bg-linie mb-2">
                {boxes.map((c, i) => c > 0 && <div key={i} className={`${BOX_COLORS[i]}`} style={{ width: `${(c / n) * 100}%` }} title={`${t('boxLabel', i)}: ${c}`} />)}
              </div>
              <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-text-2 mb-3">
                {boxes.map((c, i) => (
                  <span key={i} className="flex items-center gap-1"><span className={`inline-block w-3 h-3 rounded-sm ${BOX_COLORS[i]}`} />{t('boxLabel', i)}: {c}</span>
                ))}
              </div>
              <p className="text-xs text-text-3 mb-3">{t('progressHint')}</p>
              {seen > 0 && (
                <button onClick={() => setDialog({ kind: 'confirm', ok: t('resetProgress'), text: t('confirmReset'), onYes: onReset })}
                  className={`px-4 py-2 text-sm ${BTN_NEUTRAL}`}>{t('resetProgress')}</button>
              )}
            </div>

            <Collapsible title={`${t(forms ? 'formList' : 'wordList')} (${n})`} open={listOpen} onToggle={() => setListOpen((v) => !v)}>
              <ol className="text-sm text-text space-y-1">
                {pool.words.map((w, i) => {
                  const r = recs[i];
                  return (
                    <li key={i} className="flex items-start gap-2">
                      <span className={`mt-1.5 inline-block w-2.5 h-2.5 rounded-full shrink-0 ${BOX_COLORS[r ? Math.min(r.box, 5) : 0]}`} />
                      <span className="text-text-3 w-6 shrink-0 text-right">{i + 1}.</span>
                      <span className="flex-1"><b>{inline(w.a)}</b> — {inline(w.b)}{(w.h || w.ha || w.hb) && <span className="text-text-3"> ({[w.h, w.ha, w.hb].filter(Boolean).join(' · ')})</span>}</span>
                    </li>
                  );
                })}
              </ol>
            </Collapsible>
          </div>
          {dialog && <AskModal dialog={dialog} onClose={() => setDialog(null)} />}
          {qr && <QrModal title={qr.title} url={qr.url} onClose={() => setQr(null)} onCopy={copyShare} />}
          {help && <Help only={help} onClose={() => setHelp(false)} />}
          {toastNode}
        </div>
      );
    };

    // ---------- Üben ----------
    // Eine Runde ist eine Warteschlange aus {word, dir}. Falsch beantwortete
    // Wörter kommen einmal hinten wieder dran (retry) — der Lernstand zählt nur
    // den ersten Versuch. Zuordnen läuft in Gruppen und hat seine eigene
    // Komponente (MatchRound), alle anderen Modi teilen sich Practice.
    const buildQueue = (words, opts) => {
      const list = opts.order === 'random' ? shuffleArray(words) : words;
      // Richtungslose Modi (Lückentext) fragen immer Sprache B ab — die
      // Richtung wird dort gar nicht angeboten, also darf auch keine alte
      // Einstellung durchschlagen. Sonst zeigte `langOf` die falsche Sprache
      // und `checkAnswer` prüfte mit den Artikeln der anderen Sprache.
      // Wortformen ebenso (fixedDir).
      const fixed = fixedDir(opts) ? 'ab' : null;
      return list.map((word) => ({
        word, retry: false,
        dir: fixed || (opts.dir === 'mix' ? (Math.random() < 0.5 ? 'ab' : 'ba') : opts.dir),
      }));
    };
    const promptOf = (item) => (item.dir === 'ab' ? item.word.a : item.word.b);
    const solutionOf = (item) => (item.dir === 'ab' ? item.word.b : item.word.a);
    const langOf = (set, item, side) => set.langs && set.langs[(item.dir === 'ab') === (side === 'prompt') ? 0 : 1];
    // Erste Alternative ohne Klammern: was vorgelesen und im Buchstabensalat gezeigt wird
    const firstAlt = (solution) => (listItems(solution)[0] || '').split(/\s*\/\s*/)[0].replace(/[()]/g, '').replace(/\s+/g, ' ').trim();
    // Drei Ablenker aus demselben Set, gleiche Seite, nie die Lösung selbst.
    // Bei Formen zuerst aus derselben Tabelle (`src`): «amas» gegen «amat»
    // prüft die Endung, «amas» gegen «rosarum» nichts.
    const distractors = (set, item, n = 3) => {
      const side = item.dir === 'ab' ? 'b' : 'a';
      const from = (ws) => shuffleArray([...new Set(ws.map((w) => w[side]).filter((x) => x !== solutionOf(item)))]);
      const src = item.word.src;
      const near = src == null ? [] : from(set.words.filter((w) => w.src === src));
      return [...new Set([...near, ...from(set.words)])].slice(0, n);
    };
    const scrambleLetters = (text) => {
      const letters = [...text.replace(/\s+/g, '')];
      if (letters.length < 2) return letters;
      let out = shuffleArray(letters);
      for (let i = 0; i < 5 && out.join('') === letters.join(''); i++) out = shuffleArray(letters);
      return out;
    };

    // `done` ist die Zahl, die im Kopf steht (erledigt bzw. laufende Aufgabe),
    // `pos`/`queue` füllen den Balken. Die zwei Aufrufer zählen verschieden:
    // Practice arbeitet Aufgabe für Aufgabe, MatchRound Paar für Paar.
    const PracticeFrame = ({ set, pos, queue, done, total, item, onQuit, children, extra }) => {
      const settingsButton = useSettings(<MyScriptKeys />);
      const [, redrawFs] = useState(0);
      useEffect(() => {
        const onFs = () => redrawFs((x) => x + 1);
        document.addEventListener('fullscreenchange', onFs);
        document.addEventListener('webkitfullscreenchange', onFs);
        return () => { document.removeEventListener('fullscreenchange', onFs); document.removeEventListener('webkitfullscreenchange', onFs); };
      }, []);
      return (
        <div className={COLUMN}>
          <div className="flex items-center gap-2 mb-4">
            <button onClick={onQuit} className={`shrink-0 px-4 py-2 ${BTN_NEUTRAL} auf-rand`}>← {t('quit')}</button>
            <div className="flex-1 min-w-0 text-center text-text-2 truncate">{set.title}</div>
            {canFullscreen() && (
              <IconButton onClick={toggleFullscreen} title={fsElement() ? t('exitFullscreen') : t('fullscreen')}><ExpandIcon /></IconButton>
            )}
            {settingsButton}
          </div>
          <div className="flex items-center gap-3 mb-4 text-sm text-text-2">
            <div className="flex-1 h-2 rounded-full bg-linie overflow-hidden">
              <div className="h-full bg-akzent transition-all" style={{ width: `${(pos / queue) * 100}%` }} />
            </div>
            <span>
              {Math.min(done, total)} / {total}
              {item && item.retry && <span className="ml-2 px-1.5 rounded bg-orange-weich text-orange text-xs font-semibold">{t('retryTag')}</span>}
              {extra}
            </span>
          </div>
          {children}
        </div>
      );
    };

    // Antwortfelder: keine Autokorrektur, keine Grossschreibung, Sprache der
    // Antwort — geprüft wird Buchstabe für Buchstabe (Practice und Tabelle)
    const answerProps = (lang) => ({ autoCapitalize: 'none', autoCorrect: 'off', autoComplete: 'off', spellCheck: false, lang: TTS_LOCALE[lang] || undefined });
    const STATUS_CLASS = {
      right: 'bg-gruen-weich border-gruen-linie text-gruen',
      almost: 'bg-orange-weich border-orange-linie text-orange',
      wrong: 'bg-rot-weich border-rot-linie text-rot',
    };
    const SpeakButton = ({ text, lang, big }) => canSpeak(lang) && (
      <button onClick={() => speak(text, lang)} title={t('speak')}
        className={big ? `${BTN_PRIMARY} px-8 py-6 flex items-center justify-center gap-3 text-xl` : 'text-text-3 hover:text-akzent-text align-middle'}>
        <SpeakerIcon />{big && t('hear')}
      </button>
    );
    // Beide Schreibflächen sehen gleich aus — eine Stelle, sonst laufen sie
    // beim ersten Nachjustieren der Höhe auseinander. Die Fläche bleibt auch
    // im dunklen Modus weiss (echtes `bg-white`, nicht `bg-karte`): ein Blatt
    // Papier, und die Tinte von iink ist dunkel.
    const PAD_FRAME = 'w-full h-48 sm:h-56 bg-white rounded-lg border-2 border-dashed border-linie overflow-hidden relative';
    const PAD_LINE = { backgroundImage: 'linear-gradient(to top, transparent 34%, #e5e7eb 34%, #e5e7eb calc(34% + 1px), transparent calc(34% + 1px))' };
    const POINTER_EVENTS = ['pointerdown', 'pointermove', 'pointerup'];
    // Strichbreiten beider Flächen — der Radierer breit genug für den Finger.
    const PEN_WIDTH = 3, ERASER_WIDTH = 24;

    // Schreibfläche für den Handschrift-Modus: Pointer-Events, damit Pencil,
    // Finger und Maus gleich behandelt werden; `touch-action: none` hält die
    // Seite beim Schreiben still. Keine Erkennung — verglichen wird mit dem
    // Auge, wie auf Papier. `clearKey` von aussen hochzählen = leeren.
    // `tool` = 'write' | 'erase' (die Werte von iink): der Radierer malt mit `destination-out`
    // Löcher in die Fläche; die Grundlinie ist Hintergrund und bleibt.
    const Sketch = ({ penOnly, clearKey, tool }) => {
      const canvasRef = useRef(null);
      const drawing = useRef(false);
      const last = useRef(null);
      useEffect(() => {
        const c = canvasRef.current;
        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
          if (c.width === w && c.height === h) return;
          // `canvas.width` zu setzen leert die Fläche. Beim Drehen des iPads
          // wäre sonst die halbe Handschrift weg — also vorher abziehen und
          // hinterher wieder auftragen (skaliert auf die neue Breite).
          const old = c.width && c.height ? (() => { const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; t.getContext('2d').drawImage(c, 0, 0); return t; })() : null;
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1e3a8a';
          if (old) ctx.drawImage(old, 0, 0, c.clientWidth, c.clientHeight);
        };
        resize();
        const ro = window.ResizeObserver && new ResizeObserver(resize);
        ro && ro.observe(c);
        // React registriert Touch-Listener passiv — preventDefault greift dort
        // nicht. Safari braucht es aber nativ, sonst startet nach einem kurzen
        // Halten die Textauswahl der Seite statt des Strichs.
        const block = (e) => e.preventDefault();
        c.addEventListener('touchstart', block, { passive: false });
        c.addEventListener('touchmove', block, { passive: false });
        return () => { ro && ro.disconnect(); c.removeEventListener('touchstart', block); c.removeEventListener('touchmove', block); };
      }, []);
      useEffect(() => {
        const c = canvasRef.current;
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
      }, [clearKey]);
      const pos = (e) => { const r = canvasRef.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
      const down = (e) => {
        if (penOnly && e.pointerType !== 'pen') return;
        e.preventDefault();
        drawing.current = true;
        last.current = pos(e);
        const ctx = canvasRef.current.getContext('2d');
        const erase = tool === 'erase';
        ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
        ctx.lineWidth = erase ? ERASER_WIDTH : PEN_WIDTH;
        try { canvasRef.current.setPointerCapture(e.pointerId); } catch {}
      };
      const move = (e) => {
        if (!drawing.current) return;
        const ctx = canvasRef.current.getContext('2d');
        // Zwischenpunkte, die der Browser gebündelt hat, mitzeichnen — sonst wird schnelle Schrift eckig
        const events = e.nativeEvent.getCoalescedEvents ? e.nativeEvent.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = pos(ev);
          ctx.beginPath(); ctx.moveTo(last.current[0], last.current[1]); ctx.lineTo(x, y); ctx.stroke();
          last.current = [x, y];
        }
      };
      // Kein onPointerLeave: mit gefangenem Zeiger darf man über den Rand
      // hinausschreiben und zurückkommen, ohne dass der Strich abreisst.
      const up = (e) => {
        drawing.current = false;
        try { canvasRef.current.releasePointerCapture(e.pointerId); } catch {}
      };
      return (
        <canvas ref={canvasRef} className={`${PAD_FRAME} touch-none cursor-crosshair`} style={PAD_LINE}
          onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onContextMenu={(e) => e.preventDefault()} />
      );
    };

    // Schreibfläche mit Erkennung: MyScript zeichnet und erkennt selbst.
    // `DEMAND` heisst, dass nur auf Verlangen erkannt wird — eine abrechenbare
    // Anfrage pro «Prüfen» statt einer nach jeder Schreibpause (gratis sind
    // 2 000 im Monat; mit Pausen-Erkennung kostete ein Wort ihrer drei bis
    // sieben). Darum lauscht hier auch nichts auf «exported»: den Text holt
    // `checkInk` sich beim Prüfen, und gewertet wird genau der.
    // `tool` schaltet das eingebaute Werkzeug von iink um: der Radierer
    // nimmt ganze Striche weg, und «Prüfen» erkennt nur, was übrig bleibt.
    const InkPad = ({ lang, keys, penOnly, clearKey, tool, padRef, onFail, onNoErase }) => {
      const rootRef = useRef(null);
      const toolRef = useRef(tool);
      toolRef.current = tool;
      useEffect(() => {
        let gone = false;
        inkQueue(async () => {
          if (gone) return;
          try {
            const iink = await loadIink();
            // Vor dem Aufbau nochmals prüfen: `Canvas.load` zerstört die
            // vorige Fläche, ein verspäteter Auftrag risse die aktuelle ab.
            if (gone) return;
            padRef.current = await iink.Canvas.load(rootRef.current, 'INK_V2', {
              configuration: {
                server: { scheme: 'https', host: 'cloud.myscript.com', applicationKey: keys.app, hmacKey: keys.hmac },
                recognition: { type: 'TEXT', lang, text: { mimeTypes: ['text/plain'] } },
                triggers: { exportContent: 'DEMAND' },
                rendering: { guides: { enable: false } },
                penStyle: { color: '#1e3a8a', width: PEN_WIDTH },
                ui: { showConnectionState: false },
              },
            });
            // Der Radierer von iink schickt beim Absetzen `removeStrokes`, und
            // das fragt den Server — eine abrechenbare Anfrage pro Radierstrich,
            // am `DEMAND` vorbei. Dazu ruft er `Iterator.toArray` auf, das
            // Safari erst ab 18.4 kennt. Also das Ende selber machen: Striche
            // nur aus Modell und Bild nehmen, erkannt wird beim «Prüfen».
            // Muss vor dem Umschalten stehen, `attach` bindet `end`.
            const pad = padRef.current, eraser = pad.eraser;
            // Fehlt eine der Interna (anderes iink), bleibt der Radierer
            // unberührt und wird ausgeblendet: lieber kein Radierer als eine
            // Anfrage pro Strich.
            if (!eraser || typeof eraser.continue !== 'function' || !eraser.deletingIds
                || !eraser.renderer || typeof eraser.renderer.removeSymbol !== 'function'
                || typeof pad.model.removeStroke !== 'function') {
              if (!gone) onNoErase();
              return;
            }
            eraser.eraserWidth = ERASER_WIDTH; // Vorgabe 5 px: mit dem Finger trifft man den Strich kaum
            eraser.end = function (info) {
              if (!this.currentEraser) return;
              this.continue(info);
              this.renderer.removeSymbol(this.currentEraser.id);
              for (const id of this.deletingIds) { this.renderer.removeSymbol(id); pad.model.removeStroke(id); }
              this.deletingIds.clear();
              this.currentEraser = undefined;
            };
            // Wer schon vor dem Laden umgeschaltet hat, behält seine Wahl.
            pad.tool = toolRef.current;
          } catch { if (!gone) onFail(); }
        });
        return () => {
          gone = true;
          const pad = padRef.current;
          padRef.current = null;
          inkQueue(() => pad && pad.destroy());
        };
      }, [lang]);
      useEffect(() => { padRef.current && padRef.current.clear(); }, [clearKey]);
      useEffect(() => { if (padRef.current) padRef.current.tool = tool; }, [tool]);
      // Dasselbe wie bei `Sketch`: `touch-action: none` stoppt nur das
      // Scrollen — die Auswahl-Geste von Safari braucht ein natives,
      // nicht-passives `preventDefault`. Und «Nur Stift annehmen» kennt iink
      // nicht, also fangen wir fremde Zeiger in der Auffangphase ab, bevor
      // die Fläche sie sieht.
      useEffect(() => {
        const el = rootRef.current;
        const stopTouch = (e) => e.preventDefault();
        const notPen = (e) => { if (e.pointerType !== 'pen') { e.stopPropagation(); e.preventDefault(); } };
        el.addEventListener('touchstart', stopTouch, { passive: false });
        el.addEventListener('touchmove', stopTouch, { passive: false });
        if (penOnly) for (const type of POINTER_EVENTS) el.addEventListener(type, notPen, true);
        return () => {
          el.removeEventListener('touchstart', stopTouch);
          el.removeEventListener('touchmove', stopTouch);
          if (penOnly) for (const type of POINTER_EVENTS) el.removeEventListener(type, notPen, true);
        };
      }, [penOnly]);
      // Die Höhe bestimmt der äussere Rahmen: iink setzt seinem Wurzelelement
      // `height: 100%` und wuchs damit bei jedem Rendern mit dem eigenen
      // SVG weiter (1500 px und mehr). Absolut eingepasst bleibt es bei der
      // Fläche, die die Karte vorgibt.
      return (
        <div className={PAD_FRAME} style={PAD_LINE}>
          <div ref={rootRef} className="absolute inset-0 touch-none" />
        </div>
      );
    };

    const Sentences = ({ word, solution }) => (word.s || []).length > 0 && (
      <ul className="mt-3 text-text space-y-1">{word.s.map((s, i) => <li key={i}>{markWord(s, solution)}</li>)}</ul>
    );

    const Practice = ({ set, opts, words, onDone, onBack, onResult }) => {
      const [queue, setQueue] = useState(() => buildQueue(words, opts));
      const [pos, setPos] = useState(0);
      const [phase, setPhase] = useState('ask'); // ask | feedback | copy | back (Karten)
      const [input, setInput] = useState('');
      const [copyInput, setCopyInput] = useState('');
      const [copyMiss, setCopyMiss] = useState(false);
      const [result, setResult] = useState(null);
      const [picked, setPicked] = useState(null); // Multiple Choice: gewählte Antwort
      const [parsed, setParsed] = useState({}); // Bestimmen: gewählte Zeile `r` und Spalte `c`
