  <!-- My-Designsystem: Kopie aus ~/MySuite (design/HERKUNFT.txt), hier nie ändern -->
  <link rel="stylesheet" href="design/css/my-tokens.css" />
  <link rel="stylesheet" href="design/css/my-schemen.css" />
  <script>
    // ---------- Farbschema und Hell/Dunkel (My-Designsystem) ----------
    // Schema, Ton und Hell/Dunkel stehen als data-schema/data-ton/data-modus am
    // <html>, bevor irgendetwas gezeichnet wird — sonst blitzt das
    // Standardschema bzw. die helle Seite auf. Gespeichert und angewendet wird
    // nur hier; die Einstellungen rufen `myLook`/`setLook`/`myModus`/`setModus`.
    (() => {
      const LOOK_KEY = 'myvoci_look';
      const MODUS_KEY = 'myvoci_modus';
      const DEFAULT_LOOK = { schema: 'moonrise', ton: 7 }; // Navy
      const SCHEMES = ['fox', 'budapest', 'moonrise', 'zissou', 'isle'];
      const read = (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
      const write = (key, v) => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} };
      const html = document.documentElement;
      const dark = matchMedia('(prefers-color-scheme: dark)');
      // Grundfarbe aus my-tokens.css, auch für die Statusleiste
      const GRUND = { hell: '#F6F4F1', dunkel: '#121213' };
      const bar = () => {
        const mode = html.dataset.modus || (dark.matches ? 'dunkel' : 'hell');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = GRUND[mode];
        // Home-Screen-Webapp auf iOS: dort gilt nicht theme-color, sondern
        // dieser Wert, gelesen beim Start — sonst bleibt die Statusleiste
        // über der dunklen Seite weiss
        const ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (ios) ios.content = mode === 'dunkel' ? 'black' : 'default';
      };
      // Die Wahrheit steht am <html>: so zeigen die Einstellungen immer, was
      // gilt — auch wenn der Browser das Speichern verweigert (privates Fenster).
      window.myLook = () => ({ schema: html.dataset.schema, ton: Number(html.dataset.ton) || null });
      const applyLook = (look) => {
        html.dataset.schema = look.schema;
        if (look.ton) html.dataset.ton = look.ton; else delete html.dataset.ton;
      };
      window.setLook = (look) => { write(LOOK_KEY, look); applyLook(look); };
      window.myModus = () => html.dataset.modus || 'system';
      const applyModus = (modus) => {
        if (modus === 'hell' || modus === 'dunkel') html.dataset.modus = modus; else delete html.dataset.modus;
        bar();
      };
      window.setModus = (modus) => { write(MODUS_KEY, modus); applyModus(modus); };
      window.DEFAULT_LOOK = DEFAULT_LOOK;

      const look = read(LOOK_KEY);
      applyLook(look && SCHEMES.includes(look.schema) ? look : DEFAULT_LOOK);
      // Alte Wahl aus der Zeit von Sonne/Nacht (`myvoci_theme`) übernehmen
      let modus = read(MODUS_KEY);
      if (modus == null) modus = { light: 'hell', dark: 'dunkel' }[read('myvoci_theme')] || 'system';
      applyModus(modus);
      // Safari vor 14 kennt am matchMedia-Objekt nur das alte `addListener`
      if (dark.addEventListener) dark.addEventListener('change', bar); else dark.addListener(bar);

      // Rand oben nur auf der Übersicht, also ohne Route im Hash (Schlüssel wie
      // ROUTE_KEYS im App-Skript) — sonst blitzte er bei einem geteilten Link
      // auf, bis React die Seite kennt. Danach hält `useRand` ihn nach.
      const ROUTE = ['v', 'demo', 'local', 'edit', 'new'];
      if (!location.hash.slice(1).split('&').some((x) => ROUTE.includes(x.split('=')[0]))) {
        html.dataset.rand = '';
        // Masken vorladen: die CDN-Skripte unten blockieren den Parser, der
        // <body> mit dem Rand käme sonst erst nach Babel dran. Nur der Satz des
        // aktuellen Modus; Dateien und Version schreibt make-hintergrund.py.
        // <rand-preload>
        const RAND = { v: '6a1985b8', n: 5, hell: 'feder', dunkel: 'zeichen' };
        // </rand-preload>
        const modus = html.dataset.modus || (dark.matches ? 'dunkel' : 'hell');
        for (let i = 0; i < RAND.n; i++) {
          const link = document.createElement('link');
          link.rel = 'preload'; link.as = 'image'; link.crossOrigin = 'anonymous';
          link.href = `hintergrund/${RAND[modus]}-${i}.svg?v=${RAND.v}`;
          document.head.appendChild(link);
        }
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind kennt nur die Farben des Designsystems (wie MyMemory): eine
    // vergessene Klasse wie `text-red-600` erzeugt gar keinen Stil statt
    // einer festen Farbe. Signalfarben je dreifach: Schrift (`text-rot`),
    // getönte Fläche (`bg-rot-weich`), Rand (`border-rot-linie`), deckend
    // (`bg-rot-voll`). Ohne Tailwind (CDN nicht erreichbar) trotzdem weiter.
    const signal = (n) => ({ DEFAULT: `var(--${n}-text)`, voll: `var(--${n})`, weich: `var(--${n}-weich)`, linie: `var(--${n}-linie)` });
    if (window.tailwind) tailwind.config = {
      theme: {
        colors: {
          transparent: 'transparent',
          current: 'currentColor',
          // Echtes Weiss nur, wo es weiss bleiben soll: Schreibfläche, Schalter-Knopf
          white: '#FFFFFF',
          black: '#000000',
          grund: 'var(--grund)',
          karte: 'var(--karte)',
          linie: 'var(--linie)',
          hover: 'var(--hover)',
          zeile: 'var(--zeile)',
          text: { DEFAULT: 'var(--text)', 2: 'var(--text-2)', 3: 'var(--text-3)' },
          akzent: { DEFAULT: 'var(--akzent)', weich: 'var(--akzent-weich)', text: 'var(--akzent-text)', ink: 'var(--akzent-ink)' },
          rot: signal('rot'),
          gruen: signal('gruen'),
          orange: signal('orange'),
          // Leitner-Fächer 0–5: von «neu» über rot nach grün (Werte unten in :root)
          fach: Object.fromEntries([0, 1, 2, 3, 4, 5].map((i) => [i, `var(--fach-${i})`])),
        },
        borderRadius: {
          none: '0',
          sm: 'var(--radius-s)',
          DEFAULT: 'var(--radius)',
          md: 'var(--radius)',
          lg: 'var(--radius)',
          xl: 'var(--radius-l)',
          full: 'var(--radius-pille)',
        },
      },
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <style type="text/tailwindcss">
    /* Über Tailwind verarbeitet, sonst läge dessen Preflight (button { background:
       transparent }) hinter diesen Regeln und gewönne. Komponenten in @layer
       components, damit Tailwind-Klassen sie im Einzelfall noch übersteuern.
       Bausteine wie in MyMemory (dieselben Namen). */
    @layer base {
    /* Eigene Werte heissen bewusst anders als die Tokens (--akzent, --karte, --radius …):
       gleichnamig neu definiert, würden sie das Schema still überschreiben.
       Abgeleitete Flächen mischen mit var(--karte) — so machen sie Hell/Dunkel mit. */
    :root:not([data-modus]) { color-scheme: light dark; }
    :root {
      /* Signalfarben als Schrift: Orange/Grün erreichen auf Weiss nur ~3:1 */
      --rot-text: color-mix(in oklab, var(--rot) 80%, var(--text));
      --gruen-text: color-mix(in oklab, var(--gruen) 70%, var(--text));
      --orange-text: color-mix(in oklab, var(--orange) 60%, var(--text));
      --rot-weich: color-mix(in oklab, var(--rot) 14%, var(--karte));
      --gruen-weich: color-mix(in oklab, var(--gruen) 16%, var(--karte));
      --orange-weich: color-mix(in oklab, var(--orange) 16%, var(--karte));
      --rot-linie: color-mix(in oklab, var(--rot) 45%, var(--karte));
      --gruen-linie: color-mix(in oklab, var(--gruen) 45%, var(--karte));
      --orange-linie: color-mix(in oklab, var(--orange) 50%, var(--karte));
      --fach-0: var(--linie);
      --fach-1: var(--rot);
      --fach-2: var(--orange);
      --fach-3: color-mix(in oklab, var(--orange) 50%, var(--gruen));
      --fach-4: color-mix(in oklab, var(--orange) 20%, var(--gruen));
      --fach-5: var(--gruen);
      --schleier: color-mix(in srgb, var(--leiste) 55%, transparent);
    }
    /* Ohne color-mix (Safari < 16.2, Chrome < 111) wären die Flächen sonst
       ungültig und durchsichtig: dann deckende Ersatzwerte. */
    @supports not (color: color-mix(in oklab, red, blue)) {
      :root {
        --rot-text: var(--rot); --gruen-text: var(--gruen); --orange-text: var(--orange);
        --rot-weich: var(--zeile); --gruen-weich: var(--zeile); --orange-weich: var(--zeile);
        --rot-linie: var(--rot); --gruen-linie: var(--gruen); --orange-linie: var(--orange);
        --fach-3: var(--orange); --fach-4: var(--gruen);
        --schleier: rgba(32, 32, 34, .55);
        /* dieselben Rollen aus my-tokens.css: ohne Ersatz bliebe jede gewählte Fläche
           (Knopf, Umschalter, Moduskachel) durchsichtig und der Akzent-Text farblos */
        --akzent-weich: var(--hover); --akzent-text: var(--text);
      }
    }
    body {
      background: var(--grund); color: var(--text);
      font-family: var(--schrift); font-size: 16px; line-height: 1.55;
    }
    h1, h2 { letter-spacing: -0.02em; }
    /* iOS zoomt in Eingabefelder unter 16 px hinein — hier nie */
    input, textarea, select { font-size: max(16px, 1em); }
    code { background: var(--hover); padding: 0 4px; border-radius: var(--radius-s); }
    }
    @layer components {
    .kopf { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
    .kachel { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius-l); }
    /* Was über dem Inhalt schwebt (Fenster, Einstellungen, Meldung). Als Klasse statt
       `shadow-[var(--schatten)]`: Tailwind liest das als Schattenfarbe und setzt gar keinen Schatten. */
    .schatten { box-shadow: var(--schatten); }

    /* Knöpfe (DESIGN.md): primär, sekundär, neutral */
    .knopf { border-radius: var(--radius); font-weight: 600; transition: background .15s, border-color .15s, opacity .15s; }
    .knopf-1 { background: var(--akzent); color: var(--akzent-ink); }
    .knopf-1:hover { background: color-mix(in oklab, var(--akzent) 88%, var(--text)); }
    .knopf-2 { background: var(--akzent-weich); color: var(--akzent-text); }
    .knopf-2:hover { background: color-mix(in oklab, var(--akzent) 24%, var(--karte)); }
    .knopf-n { background: transparent; color: var(--text); border: 1px solid var(--linie); }
    .knopf-n:hover { background: var(--hover); }
    .knopf:disabled { opacity: .45; cursor: not-allowed; }
    /* Markenzug wie in MyMemory/MyKahoot: Papagei rechts vom Titel, ohne Kachel, als
       Maske in currentColor — dunkel auf Hell, hell auf Dunkel. Datei aus tools/make-logo.py */
    .logo {
      display: inline-block; height: 1.15em;
      aspect-ratio: 682 / 642; /* logo-seiten (tools/make-logo.py) */
      background: currentColor;
      -webkit-mask: url("logo-papagei.svg?v=b717af37") center / contain no-repeat;
      mask: url("logo-papagei.svg?v=b717af37") center / contain no-repeat;
    }
    /* Quadratische Symbolknöpfe, ruhig bis zum Darüberfahren */
    .symbol { flex: none; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius); color: var(--text-2); background: transparent; transition: background .15s, color .15s; }
    .symbol:hover { background: var(--hover); color: var(--text); }
    .symbol.gefahr:hover { color: var(--rot-text); }
    /* Knöpfe, die auf dem Rand stehen: deckende Fläche, sonst scheint er durch. Das
       durchsichtige --hover legt sich beim Darüberfahren als Schleier darüber. */
    .auf-rand { background-color: var(--karte); }
    .auf-rand:hover { background-color: var(--karte); background-image: linear-gradient(var(--hover), var(--hover)); }
    /* Umschalter (Sprache, Darstellung, kleine Wahlen) */
    .umschalter { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--linie); border-radius: var(--radius); }
    .umschalter button { padding: 4px 12px; border-radius: 7px; color: var(--text-2); font-size: 15px; }
    .umschalter button:hover:not(:disabled) { background: var(--hover); }
    .umschalter button[aria-pressed="true"] { background: var(--akzent-weich); color: var(--akzent-text); font-weight: 600; }
    .umschalter button:disabled { opacity: .4; cursor: not-allowed; }
    .farbtupfer { width: 26px; height: 26px; border-radius: var(--radius-pille); background: var(--tupfer);
      outline-offset: 2px; transition: transform .1s; }
    .farbtupfer:hover { transform: scale(1.12); }
    .farbtupfer[aria-pressed="true"] { outline: 2px solid var(--text); }
    .punkt { display: inline-block; width: 10px; height: 10px; border-radius: var(--radius-pille); flex: none; }
    .feld { padding: 8px 12px; border: 1px solid var(--linie); border-radius: var(--radius); background: var(--karte); color: var(--text); }
    .feld:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }
    .feld::placeholder { color: var(--text-3); }
    .kuerzel { padding: 0 6px; border-radius: var(--radius-s); background: var(--hover); color: var(--text-2);
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    /* Kompakte Liste (DESIGN.md, Listen): keine Fläche, nur Hover */
    .liste-zeile { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 10px; margin-bottom: 2px;
      border-radius: var(--radius); transition: background .15s; }
    .liste-zeile:hover { background: var(--hover); }
    .liste-name { flex: 0 1 19rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; text-align: left; }
    /* Die Zahl kürzt nie, der Name gibt nach — nur auf dem Handy dreht es sich um (s. unten) */
    .liste-zahl { flex: 1 0 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; color: var(--text-3); white-space: nowrap; }
    .liste-ordner { margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--linie); }
    /* Handy: der Name behält eine Mindestbreite, dafür gibt die Zahl nach, das Sprachkürzel
       entfällt und die Ordner rücken weniger ein — sonst verschwindet der Titel ab Ebene 2 */
    @media (max-width: 640px) {
      .symbol { width: 30px; height: 30px; }
      .liste-name { min-width: 4.5rem; }
      .liste-zahl { flex-shrink: 1; padding: 0 4px; font-size: 14px; }
      .liste-zahl .kuerzel { display: none; }
      .liste-ordner { margin-left: 6px; padding-left: 6px; }
    }
    .ablage { border-radius: var(--radius); outline: 2px dashed transparent; outline-offset: -2px; transition: background .15s, outline-color .15s; }
    .ablage.ziel { background: var(--akzent-weich); outline-color: var(--akzent); }
    /* Rand oben auf der Übersicht, der nach unten ausdünnt (wie Dschungel/Blut in
       MyKahoot, Pixel/Neuronen in MyMemory): Hell = Gefieder, Dunkel = Buchstaben als
       Sternbild. Jede Farbschicht ist eine Maske aus hintergrund/
       (tools/make-hintergrund.py), gefüllt mit einem Token des Schemas — so macht der
       Rand jedes Farbschema mit. Hinter allem (z-index −1), fest am Fenster.
       Das Markup steht fest im <body>, nicht in React: so laden die Masken schon,
       während Babel noch übersetzt. Sichtbar nur mit data-rand am <html> (setzt
       das Skript im <head> nach dem Hash, danach `useRand` in der Übersicht). */
    .rand { display: none; position: fixed; inset: 0 0 auto 0; height: var(--h); z-index: -1; pointer-events: none; }
    .rand > i { position: absolute; inset: 0; background: var(--c);
      -webkit-mask: var(--m) left top / var(--w) auto repeat-x; mask: var(--m) left top / var(--w) auto repeat-x; }
    .rand-dunkel {
      background: radial-gradient(ellipse 60% 70% at 50% 0%, color-mix(in srgb, var(--akzent) 16%, transparent), transparent 70%); }
    :root[data-rand] .rand-hell { display: block; }
    :root[data-rand][data-modus="dunkel"] .rand-dunkel { display: block; }
    :root[data-rand][data-modus="dunkel"] .rand-hell { display: none; }
    @media (prefers-color-scheme: dark) {
      :root[data-rand]:not([data-modus="hell"]) .rand-dunkel { display: block; }
      :root[data-rand]:not([data-modus="hell"]) .rand-hell { display: none; }
    }
    /* Was frei auf dem Rand steht (Titel, Untertitel), bekommt einen Hof in der Grundfarbe */
    .frei { text-shadow: 0 0 12px var(--grund), 0 0 5px var(--grund), 0 0 2px var(--grund); }
    }

    .diff-del { background: var(--rot-linie); text-decoration: line-through; border-radius: 2px; }
    .diff-ins { background: var(--gruen-linie); border-radius: 2px; }
    @keyframes shrink { from { width: 100%; } to { width: 0; } }
    /* Handschrift: iPadOS deutet Striche neben Text sonst als Auswahl-Geste
       (Wort wird markiert, Lupe erscheint, Strich reisst ab) */
    .sketch, .sketch * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <!-- <rand-html> (tools/make-hintergrund.py) -->
  <div class="rand rand-hell" aria-hidden="true" style="--h: 300px; --w: 1200px"><i style="--c: var(--akzent); --m: url(hintergrund/feder-0.svg?v=6a1985b8)"></i><i style="--c: var(--rad-1); --m: url(hintergrund/feder-1.svg?v=6a1985b8)"></i><i style="--c: var(--rad-3); --m: url(hintergrund/feder-2.svg?v=6a1985b8)"></i><i style="--c: var(--rad-5); --m: url(hintergrund/feder-3.svg?v=6a1985b8)"></i><i style="--c: var(--rad-7); --m: url(hintergrund/feder-4.svg?v=6a1985b8)"></i></div>
  <div class="rand rand-dunkel" aria-hidden="true" style="--h: 320px; --w: 1200px"><i style="--c: var(--akzent); --m: url(hintergrund/zeichen-0.svg?v=6a1985b8)"></i><i style="--c: var(--rad-1); --m: url(hintergrund/zeichen-1.svg?v=6a1985b8)"></i><i style="--c: var(--rad-3); --m: url(hintergrund/zeichen-2.svg?v=6a1985b8)"></i><i style="--c: var(--rad-5); --m: url(hintergrund/zeichen-3.svg?v=6a1985b8)"></i><i style="--c: var(--spiel-3); --m: url(hintergrund/zeichen-4.svg?v=6a1985b8)"></i></div>
  <!-- </rand-html> -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------- Browser-Speicher ----------
    // Der Browser darf jederzeit nein sagen (privates Fenster, voller Speicher) —
    // dann gilt der Standardwert. Alle Zugriffe laufen über diese zwei Zeilen.
    const readLocal = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    // Schlägt das Schreiben fehl (privates Fenster, volles Kontingent), darf
    // die Oberfläche nicht weiter «gespeichert» melden: das Merkmal steht hier
    // und wird als Warnstreifen angezeigt (s. StorageWarning).
    let storageBroken = false;
    const writeLocal = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { storageBroken = true; return false; }
    };

    // ---------- Sprache der Oberfläche (wie in MyMemory) ----------
    const LANGS = [{ id: 'de', name: 'Deutsch' }, { id: 'en', name: 'English' }];
    const LANG_KEY = 'myvoci_lang';
    const loadLang = () => (readLocal(LANG_KEY) === 'en' ? 'en' : 'de');
    const hashParts = (hash = location.hash) => hash.slice(1).split('&').filter(Boolean);
    const langFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('l=') && LANGS.some((l) => l.id === x.slice(2)));
      return part && part.slice(2);
    };
    let currentLang = langFromHash() || loadLang();
    document.documentElement.lang = currentLang;
    let redrawLang = () => {};

    const code = (x) => <code className="bg-hover px-1 rounded">{x}</code>;

    const I18N = {
      de: {
        subtitle: 'Voci üben — Tastatur oder Stift, in beide Richtungen.',
        logoLabel: 'MyVoci-Papagei',
        settings: 'Einstellungen',
        language: 'Sprache',
        theme: 'Darstellung',
        modi: { system: 'Wie das Gerät', hell: 'Hell', dunkel: 'Dunkel' },
        scheme: 'Farbschema',
        tone: 'Akzentfarbe',
        toneDefault: 'Akzent des Schemas',
        tones: {
          fox: ['Azid-Himmelblau', 'Dunkles Petrol', 'Moos-Oliv', 'Kürbis', 'Rost-Karmin', 'Schokolade', 'Pflaume', 'Altrosa', 'Bronze-Senf'],
          budapest: ['Indigoblau', 'Lobby-Violett', 'Aubergine', 'Orchidee', 'Magenta', 'Mauve-Taupe', "Mendl's Zuckerrosa", 'Himbeere', 'Messing-Gold'],

    // gemerkte Promise für die ganze Sitzung auf `undefined` stehen und kein
    // späterer Versuch lüde je nach.
    const scriptCache = {};
    const loadScript = (url, get) => {
      const there = get();
      if (there) return Promise.resolve(there);
      if (!scriptCache[url]) scriptCache[url] = new Promise((ok, fail) => {
        const el = document.createElement('script');
        el.src = url;
        const giveUp = () => { scriptCache[url] = null; el.remove(); fail(new Error(url)); };
        el.onload = () => { const lib = get(); lib ? ok(lib) : giveUp(); };
        el.onerror = giveUp;
        document.head.appendChild(el);
      });
      return scriptCache[url];
