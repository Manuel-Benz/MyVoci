      "- «H: » is an optional hint: gender (m./f.), part of speech, «irregular».",
      "  Omit it when there is nothing to say. If the hint gives away the word in",
      "  language B (principal parts, genitive, plural), write it as «HA: » — it then",
      "  only appears with the solution. «HF: » likewise for language A.",
      "- If a word has clearly different meanings, «F: » or «A: » may be a list, on ONE",
      "  line separated by « | »: «A: 1. … | 2. …». If all must be known, add «W: all».",
      "- Every word once. No numbering of the words, no bold, no explanations.",
      "",
      "FORMS (conjugate, decline):",
      "- You decide yourself whether a word gets a table of forms: yes if forms are asked",
      "  for above or the material shows them (conjugation or declension tables); no for",
      "  «Forms: no». If the material simply lists words (verbs too) without their forms",
      "  and nothing is asked above: no table, and do not ask. Only some words of a set",
      "  may have a table — the others stay ordinary words.",
      "- Ask back only if forms are asked for or shown in the material, but it stays",
      "  open which ones (e.g. several tenses in the material, none named above): BEFORE",
      "  the set, one short question with your suggestion, e.g. «Only the present, or",
      "  the past as well?». No set until the answer.",
      "- The table belongs to the word in the foreign language (with «de → en» the word",
      "  on «A: ») and comes at the end of the word, before «---»:",
      "",
      "F: sein",
      "A: to be",
      "Rows: I | you | he/she/it | we | you (pl.) | they",
      "Columns: present | past",
      "T: am | was",
      "T: are | were",
      "T: is | was",
      "T: are | were",
      "T: are | were",
      "T: are | were",
      "---",
      "",
      "- «Rows: » and «Columns: » label the table, «T: » is one row, cells separated by",
      "  « | », in the order of the columns. Without «Columns: » the table has one",
      "  column. If many words share the same labels, you may write them once before",
      "  the first «F: »; they then apply to every word without its own.",
      "- At most two axes, e.g. person × tense or case × number. A third feature",
      "  (gender of adjectives) becomes a word of its own, one per gender.",
      "- Short labels: «1st sg», «nom», «present». Personal pronouns go in the label, not",
      "  in the cell; the cell holds only what is to be written (German nouns with",
      "  article: «des Hundes»).",
      "- Several correct forms separated by « / ». If a form does not exist: «–».",
      "- Forms are checked letter by letter, without tolerance. If you are not sure of",
      "  a form, leave out that word's table rather than guess.",
      "",
      "FINALLY: go through the list again and QUIETLY fix whatever does not match",
      "the rules — output only the finished set, no list of changes.",
      "- Are spelling and accents in language B exactly right? They are checked",
      "  letter by letter.",
      "- Does the word really appear in the sentence?",
      "- Is every form in the tables right, and does every «T: » row have as many cells",
      "  as «Columns: » names?",
      "- Is the format right everywhere: «F: », «A: », «S: », «H: »/«HF: »/«HA: »,",
      "  «Rows: »/«Columns: »/«T: », «---»?",
    ].join("\n");

    const kiPrompt = () => (currentLang === 'en' ? KI_PROMPT_EN : KI_PROMPT_DE);

    // ---------- Listen (beide Seiten) ----------
    // Mehrere Punkte mit «1.», «2)», «-» oder «•» vorne sind eine Liste
    // (Bedeutungen): die Seite hält sie zeilenweise samt Zeichen, damit
    // Anzeige, Datei und Direktlink sie unverändert weitertragen. In der Datei
    // steht eine Liste auf EINER Zeile, Punkte mit « | » getrennt
    // («A: 1. petere | 2. appetere») — so sieht MyMemory, das nur die erste
    // A:-Zeile liest, alle Punkte, und F: kann auch eine Liste sein. Mehrere
    // A:-Zeilen mit Zeichen werden ebenfalls als Liste gelesen; ohne Zeichen
    // bleiben sie Alternativen mit « / », wie bisher.
    // Gewertet wird wie bei « / »: ein Punkt genügt. `all` an der Karte
    // (Datei: «W: alle») verlangt alle Punkte der gesuchten Seite — beim
    // Schreiben und bei der Handschrift-Erkennung, s. `task.need` in Practice.
    const LIST_MARK = /^(?:\d+[.)]|[-–•])\s+/;
    const isListLine = (line) => LIST_MARK.test(line);
    const isList = (text) => text.includes('\n');
    // Punkte samt Zeichen, in einem Durchgang — Feld, Zeichen und Wertung
    // müssen Punkt für Punkt zusammenpassen. Eine einzelne Zeile ist keine
    // Liste: «1. August» bleibt «1. August».
    const listEntries = (text) => (isList(text)
      ? text.split('\n').map((x) => {
        const m = x.trim().match(/^(?:\d+[.)]|[-–•])(?:\s+|$)/); // auch ein leerer Punkt «2.»
        return { mark: m ? m[0].trim() : '•', item: x.trim().slice(m ? m[0].length : 0).trim() };
      }).filter((e) => e.item)
      : [{ mark: '', item: text.trim() }].filter((e) => e.item));
    const listItems = (text) => listEntries(text).map((e) => e.item);
    const joinAnswer = (lines) => {
      const ls = lines.map((x) => x.trim()).filter(Boolean);
      return ls.some(isListLine) ? ls.join('\n') : ls.join(' / ');
    };
    // Eine Dateizeile: «1. petere | 2. appetere» zerfällt nur, wenn Listenzeichen drinstehen
    const splitLine = (val) => {
      const parts = val.split(/\s*\|\s*/);
      return parts.length > 1 && parts.some(isListLine) ? parts : [val];
    };
    // Einzeilig für Listen, Tabellen und die Datei
    const inline = (text, sep = '  ') => text.split('\n').join(sep);
    const fileSide = (text) => inline(text, ' | ');

    // Ein Wort in fester Gestalt: gleiche Schlüssel in gleicher Reihenfolge,
    // egal ob es aus der Datei, dem Link oder dem Editor kommt. `keepLink`
    // vergleicht Sets per JSON — eine andere Reihenfolge hiesse «anderes Set».
    const cleanWord = (w) => {
      const f = cleanForms(w.f);
      return {
        a: w.a, b: w.b,
        ...(w.s && w.s.length ? { s: w.s } : {}), ...(w.h ? { h: w.h } : {}),
        ...(w.ha ? { ha: w.ha } : {}), ...(w.hb ? { hb: w.hb } : {}),
        ...(w.all && (isList(w.a) || isList(w.b)) ? { all: true } : {}),
        ...(f ? { f } : {}),
      };
    };

    // ---------- Formen (Deklinieren, Konjugieren) ----------
    // Ein Wort kann eine Formentabelle tragen: `f = { r, c, t }` — Zeilen-
    // und Spaltenbeschriftungen, Zellen zeilenweise. Höchstens zwei Achsen
    // (Kasus × Numerus, Person × Tempus); ohne Spalten hat die Tabelle eine.
    // Die Tabelle gehört zur Fremdsprache (`formSide`), egal ob die auf F:
    // oder A: steht. Eine leere Zelle («–» in der Datei) gibt es nicht und
    // wird nicht abgefragt. Datei:
    //   Zeilen: 1. Sg | 2. Sg | …     (vor einem F: für alle folgenden,
    //   Spalten: Präsens | Perfekt     nach einem F: nur für dieses Wort)
    //   T: amo | amavi                 (eine Zeile, Zellen mit « | »)
    const NO_FORM = /^[-–—]?$/;
    const cleanForms = (f) => {
      if (!f || !Array.isArray(f.t)) return null;
      const t = f.t.map((row) => (row || []).map((x) => (NO_FORM.test((x || '').trim()) ? '' : x.trim())));
      if (!t.some((row) => row.some(Boolean))) return null;
      return { r: (f.r || []).map((x) => x.trim()), c: (f.c || []).map((x) => x.trim()), t };
    };
    const hasForms = (set) => set.words.some((w) => w.f);
    // «Dieselbe Form» — eine Regel fürs Bestimmen: einmal fragen
    // (selectWords) und alle Lesarten finden (task in Practice)
    const formKey = (form) => baseNorm(firstAlt(form)).toLowerCase();
    // Welche Seite trägt die Tabelle? Zuerst fragen die Formen selbst: die
    // Seite, mit deren Grundform mehr Formen anfangen (amare/amo, manger/
    // mange, der Hund/des Hundes — Artikel zählen nicht). So stimmt es auch
    // bei «fr → de» (deutsche Deklination) oder ohne Deutsch. Erst wenn das
    // nichts sagt (aller/vais), gilt die Fremdsprache: bei «la → de» F:, bei
    // «de → fr» A:; ohne Sprachen B, wie im KI-Prompt.
    const formSide = (set) => {
      const stem = (x) => stripAnyArticle(formKey(x)).slice(0, 2);
      let a = 0, b = 0;
      for (const w of set.words) {
        if (!w.f) continue;
        const sa = stem(w.a), sb = stem(w.b);
        for (const row of w.f.t) for (const cell of row) {
          if (!cell) continue;
          const c = stem(cell);
          if (c === sa) a++;
          if (c === sb) b++;
        }
      }
      if (a !== b) return a > b ? 'a' : 'b';
      const f = foreignLang(set);
      return set.langs && set.langs[0] === f && set.langs[1] !== f ? 'a' : 'b';
    };
    // Jede Zelle als eigenes Wort: vorne Grundform und Beschriftungen, hinten
    // die Form. So laufen alle Modi darauf, der Lernstand gilt pro Form
    // (`wordKey` wie bei jedem Wort), und Multiple Choice holt seine Ablenker
    // aus derselben Tabelle (`src`). `tab` (die Tabelle mit fertigen
    // Beschriftungen, eine pro Wort) und `ri`/`ci` (die Zelle) brauchen
    // Bestimmen und Tabelle ausfüllen; `wordKey` sieht sie nicht. Beide Seiten sind Fremdsprache — vorne
    // steht die Grundform, hinten die Form (Stimme, Artikel, Erkennung).
    const formCache = new WeakMap();
    const formSet = (set) => {
      if (formCache.has(set)) return formCache.get(set);
      const side = formSide(set);
      const words = [];
      set.words.forEach((w, src) => {
        if (!w.f) return;
        const lemma = inline(w[side], ' / ');
        const n = Math.max(w.f.c.length, ...w.f.t.map((row) => row.length));
        // Eine Spalte: keine Spaltenwahl beim Bestimmen, die Beschriftung
        // (falls da) steht trotzdem in der Frage
        const tab = {
          lemma, meaning: inline(w[side === 'a' ? 'b' : 'a'], ' / '), h: w.h,
          rows: w.f.t.map((_, i) => w.f.r[i] || String(i + 1)),
          cols: n > 1 ? Array.from({ length: n }, (_, j) => w.f.c[j] || String(j + 1)) : [],
          one: n > 1 ? '' : w.f.c[0] || '',
          t: w.f.t.map((row) => Array.from({ length: n }, (_, j) => row[j] || '')),
        };
        tab.t.forEach((row, i) => row.forEach((form, j) => {
          if (!form) return;
          words.push({ a: [lemma, tab.rows[i], tab.cols[j] || tab.one].filter(Boolean).join(' · '), b: form, ...(w.h ? { h: w.h } : {}), src, tab, ri: i, ci: j });
        }));
      });
      const lang = set.langs && set.langs[side === 'a' ? 0 : 1];
      const langs = lang && [lang, lang];
      const out = { ...set, ...(langs ? { langs } : {}), words };
      formCache.set(set, out);
      return out;
    };

    // ---------- Dateien parsen ----------
    // F: Sprache A, A: Sprache B (beide auch als Liste, s. oben), S: Satz
    // (mehrere Zeilen oder mit | getrennt), H: Hinweis, HF:/HA: Hinweis zu
    // Sprache A bzw. B (erscheint nur bei dieser Seite: gefragt sofort, gesucht
    // erst mit der Lösung), W: alle (Liste ganz verlangt), --- Trenner. Ein
    // neues F: schliesst das vorige Wort auch ohne ---.
    // Formen: «Zeilen:»/«Spalten:» und «T:», s. Abschnitt Formen. Die
    // Schlüsselwörter stehen an EINER Stelle (TABLE_KEY zum Lesen, TABLE_WORD
    // zum Schreiben): Datei, Editor, Warnungen und Export verstehen dieselben.
    // Ein Leerzeichen vor dem Doppelpunkt ist erlaubt («T : vais») — sonst
    // fiele die Zeile still weg.
    const TABLE_KEY = { zeilen: 'r', rows: 'r', spalten: 'c', columns: 'c', t: 't' };
    const TABLE_WORD = { r: ['Zeilen', 'Rows'], c: ['Spalten', 'Columns'] };
    const TABLE_LINE = new RegExp(`^(${Object.keys(TABLE_KEY).join('|')})\\s*:\\s*(.*)$`, 'i');
    const tableCells = (val) => val.split('|').map((x) => x.trim());
    // { key: 'r' | 'c' | 't', cells } oder null. Leere Beschriftungen fallen
    // weg; eine Tabellenzeile ganz ohne Form hat `cells: null`.
    const readTableLine = (line) => {
      const m = line.match(TABLE_LINE);
      if (!m) return null;
      const key = TABLE_KEY[m[1].toLowerCase()], cells = tableCells(m[2]);
      return { key, cells: key !== 't' ? cells.filter(Boolean) : cells.some(Boolean) ? cells : null };
    };
    // Nur Tabellenzeilen (Editor): alles andere wird übergangen, auch F:/---
    const parseTable = (text) => {
      const f = { r: [], c: [], t: [] };
      for (const raw of text.split(/\r?\n/)) {
        const x = readTableLine(raw.trim());
        if (!x) continue;
        if (x.key !== 't') f[x.key] = x.cells;
        else if (x.cells) f.t.push(x.cells);
      }
      return cleanForms(f) || undefined;
    };
    const parseFA = (text) => {
      const words = [];
      let cur = null, answer = [], table = [];
      const head = { r: [], c: [] }; // Beschriftungen ausserhalb eines Worts: gelten ab da
      const flush = () => {
        if (cur) {
          cur.b = joinAnswer(answer);
          if (table.length) cur.f = { r: cur.r || head.r, c: cur.c || head.c, t: table };
        }
        if (cur && cur.a && cur.b) words.push(cleanWord(cur));
        cur = null; answer = []; table = [];
      };
      const addHint = (key, val) => { if (val) cur[key] = cur[key] ? `${cur[key]} ${val}` : val; };
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (/^-{3,}$/.test(line)) { flush(); continue; }
        const tl = readTableLine(line);
        if (tl) {
          if (tl.key !== 't') (cur || head)[tl.key] = tl.cells;
          else if (cur && tl.cells) table.push(tl.cells);
          continue;
        }
        const m = line.match(/^(HF|HA|[FQASHW]):\s*(.*)$/i);
        if (!m) continue;
        const key = m[1].toUpperCase(), val = m[2].trim();
        if (key === 'F' || key === 'Q') { flush(); cur = { a: joinAnswer(splitLine(val)), b: '' }; continue; }
        if (!cur) continue;
        if (key === 'A') answer.push(...splitLine(val));
        else if (key === 'S' && val) cur.s = [...(cur.s || []), ...val.split('|').map((x) => x.trim()).filter(Boolean)];
        else if (key === 'H') addHint('h', val);
        else if (key === 'HF') addHint('ha', val);
        else if (key === 'HA') addHint('hb', val);
        else if (key === 'W' && /^(alle|all)$/i.test(val)) cur.all = true;
      }
      flush();
      return words;
    };

    // «Sprachen: de → fr» / «Languages: German - French» / «de, fr»
    const langsInFile = (text) => {
      const m = text.match(/^(?:sprachen|languages)\s*:\s*(.+)$/im);
      if (!m) return undefined;
      const parts = m[1].split(/\s*(?:→|->|=>|—|–|-|,|;|>|\/)\s*/).map(langCode).filter(Boolean);
      return parts.length >= 2 ? [parts[0], parts[1]] : undefined;
    };

    // «Sprache: en» (Einzahl!) ist wie in MyMemory die Sprache der Oberfläche.
    const langInFile = (text) => {
      const m = text.match(/^(?:sprache|language)\s*:\s*([a-z]+)/im);
      const word = m && m[1].toLowerCase();
      if (!word) return undefined;
      if (word.startsWith('de') || word.startsWith('ge')) return 'de';
      if (word.startsWith('en')) return 'en';
      return undefined;
    };

    const parseFile = (text, filename) => {
      // Frühere KI-Prompts verlangten «Voci_Thema.txt»: Präfix weg, «_» zu Leerzeichen.
      const fromName = filename.replace(/\.(txt|md)$/i, '').replace(/^(voci|memory)_+(?=.)/i, '').replace(/_/g, ' ').trim();
      const inFile = text.match(/^#\s+(.+)$/m);
      const lang = langInFile(text);
      const langs = langsInFile(text);
      return {
        title: (inFile && inFile[1].trim()) || fromName,
        words: parseFA(text),
        ...(lang ? { lang } : {}), ...(langs ? { langs } : {}),
      };
    };

    // ---------- Dateien schreiben (Export) ----------
    // Beschriftungen pro Wort: so bleibt jedes Wort für sich richtig, auch
    // wenn Verben und Nomen im selben Set stehen. Leere Zelle = «–».
    const tableWord = (key) => TABLE_WORD[key][currentLang === 'en' ? 1 : 0];
    const formLines = (f) => (f
      ? (f.r.length ? `${tableWord('r')}: ${f.r.join(' | ')}\n` : '') +
        (f.c.length ? `${tableWord('c')}: ${f.c.join(' | ')}\n` : '') +
        f.t.map((row) => `T: ${row.map((x) => x || '–').join(' | ')}\n`).join('')
      : '');
    const toFile = (set) =>
      `# ${set.title}\n` +
      (set.langs ? `${currentLang === 'en' ? 'Languages' : 'Sprachen'}: ${set.langs[0]} → ${set.langs[1]}\n` : '') +
      (set.lang ? `${set.lang === 'en' ? 'Language' : 'Sprache'}: ${set.lang}\n` : '') + '\n' +
      set.words.map((w) =>
        `F: ${fileSide(w.a)}\nA: ${fileSide(w.b)}\n` + (w.s || []).map((s) => `S: ${s}\n`).join('') +
        (w.h ? `H: ${w.h}\n` : '') + (w.ha ? `HF: ${w.ha}\n` : '') + (w.hb ? `HA: ${w.hb}\n` : '') +
        (w.all ? 'W: alle\n' : '') + formLines(w.f) + '---'
      ).join('\n') + '\n';

    const safeName = (title) => title.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'Voci';
    const safeDir = (dir) => dir.split('/').map(safeName).join('/');
    // Neue Datei- und Ordnernamen ohne Sonderzeichen: Umlaute ausgeschrieben,
    // Akzente weg, alles andere ausser Buchstaben, Ziffern, Leerzeichen und
    // ( ) , . ' - wird zu «-» (auch der Halbgeviertstrich im Titel). Der Titel
    // in der Datei bleibt, wie er ist. Bestehende Ordner laufen weiter über
    // safeDir — sonst schriebe mirrorDir in einen zweiten Ordner daneben.
    const UMLAUT = { ä: 'ae', ö: 'oe', ü: 'ue', Ä: 'Ae', Ö: 'Oe', Ü: 'Ue', ß: 'ss', æ: 'ae', œ: 'oe', Æ: 'Ae', Œ: 'Oe' };
    const plainName = (title) => {
      const ascii = title.normalize('NFC').replace(/[äöüÄÖÜßæœÆŒ]/g, (c) => UMLAUT[c])
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Za-z0-9 (),.'-]+/g, '-').replace(/\s+/g, ' ').replace(/-+/g, '-')
        .replace(/^[\s.-]+|[\s.-]+$/g, '');
      // Ganz ohne lateinische Buchstaben (griechischer Titel) bliebe nur «Voci»
      // oder eine Ziffer übrig — und zwei solche Sets teilten sich eine Datei.
      return /[A-Za-z]/.test(ascii) ? ascii : safeName(title);
    };

    const loadJsZip = () => loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js', () => window.JSZip);

    const zipBlob = async (sets, folders) => {
      const JSZipLib = await loadJsZip();
      const zip = new JSZipLib();
      const used = new Set();
      for (const folder of folders) zip.folder(safeDir(folder));
      for (const set of sets) {
        const base = `${set.dir ? safeDir(set.dir) + '/' : ''}${plainName(set.title)}`;
        let name = `${base}.txt`;
        for (let i = 2; used.has(name); i++) name = `${base} (${i}).txt`;
        used.add(name);
        zip.file(name, toFile(set));
      }
      return zip.generateAsync({ type: 'blob' });
    };

    const download = (name, data) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // ---------- Eigene Sets im Browser ----------
    const STORAGE_KEY = 'myvoci';
    const loadStore = () => {
      const raw = readLocal(STORAGE_KEY, {}) || {};
      return { sets: (raw.sets || []).map((s) => ({ dir: '', ...s })), folders: raw.folders || [] };
    };
    const saveStore = (store) => writeLocal(STORAGE_KEY, store);

    // ---------- Ordner (wie MyMemory) ----------
    const dirName = (dir) => dir.split('/').pop();
    const parentDir = (dir) => (dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '');
    const inside = (dir, ancestor) => dir === ancestor || dir.startsWith(ancestor + '/');
    const byTitle = (a, b) => a.title.localeCompare(b.title, 'de');
    // Dasselbe Set heisst: gleicher Titel im gleichen Ordner. Zwei Kinder
    // haben dieselben Set-Titel, der Titel allein taugt also nicht als
    // Schlüssel — Editor, Import, Sicherung und Ordner fragen hier nach.
    const setPlace = (s) => `${s.dir || ''}\u0001${s.title}`;
    const samePlace = (a, b) => setPlace(a) === setPlace(b);
    // Gleiche Datei: «Unité 3» und «Unite 3» (oder nur in Gross/Klein
    // verschieden) landen im selben Ordner in derselben Datei — mirrorDir
    // schriebe beide dorthin, und beim Nachlesen fiele eines weg. Darum gilt
    // das beim Anlegen als besetzt und beim Import als dasselbe Set.
    const samePath = (a, b) => (a.dir || '') === (b.dir || '') && fileName(a).toLowerCase() === fileName(b).toLowerCase();
    const sameSlot = (a, b) => samePlace(a, b) || samePath(a, b);
    const allFolders = ({ sets, folders }) => {
      const all = new Set(folders);
      for (const s of sets) for (let d = s.dir || ''; d; d = parentDir(d)) all.add(d);
      return [...all].sort((a, b) => a.localeCompare(b, 'de'));
    };
    const remapDir = (store, from, to) => {
      const move = (d) => (inside(d, from) ? to + d.slice(from.length) : d);
      return { sets: store.sets.map((s) => ({ ...s, dir: move(s.dir || '') })), folders: [...new Set(store.folders.map(move))] };
    };
    const OPEN_KEY = 'myvoci_open_dirs';
    // Die Beispiele bleiben für neue Nutzer der Einstieg; wer eigene Sets hat,
    // blendet sie hier aus (Gerät für Gerät, wie die Sprache).
    const DEMOS_KEY = 'myvoci_demos';
    const loadShowDemos = () => readLocal(DEMOS_KEY, true) !== false;
    const loadOpen = () => readLocal(OPEN_KEY, []) || [];

    // Ablage ohne Ordnerwahl: ein Set kommt in den Ordner seiner Fremdsprache
    // (die Seite, die nicht Deutsch ist; aus `Sprachen: de → fr`), dort in den
    // höchsten Klassenordner («Klasse 3» nach «Klasse 2», natürlich sortiert).
    // Eine feste Regel statt «zuletzt benutzt»: gleich auf jedem Gerät, nichts
    // zu merken, und Umbenennen oder Bearbeiten verstellt nichts. Einmal im
    // Jahr den neuen Klassenordner anlegen genügt. Ein schon vorhandener
    // Ordner der Sprache wird genommen, wie er auch heisst (Französisch,
    // Franzoesisch, French), sonst entsteht einer ohne Umlaut. Ohne
    // Sprachangabe bleibt das Set zuoberst.
    const foreignLang = (set) => {
      const langs = set.langs || [];
      return langs.find((c) => c && c !== 'de') || langs[1] || '';
    };
    const CLASS_DIR = /^(klasse|class)\b/i;
    const autoDir = (set, folders) => {
      const code = foreignLang(set);
      if (!code) return '';
      const root = folders.find((f) => !f.includes('/') && langCode(f) === code)
        || plainName(LANG_NAMES[code] ? langName(code) : code.charAt(0).toUpperCase() + code.slice(1));
      const classes = folders.filter((f) => parentDir(f) === root && CLASS_DIR.test(dirName(f)))
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      return classes.length ? classes[classes.length - 1] : root;
    };
    // Wohin ein Set ohne gewählten Ordner kommt: liegt schon genau ein Set mit
    // gleichem Titel und gleicher Fremdsprache irgendwo, ist es eine neue
    // Fassung davon und gehört dorthin (auch zuoberst, aus der Zeit vor der
    // Ablage nach Sprache, oder in der Klasse vom letzten Jahr) — so fragt der
    // Import «ersetzen?» statt still eine Zweitkopie anzulegen. Sonst autoDir.
    const placeFor = (set, sets, folders) => {
      const twins = sets.filter((s) => s.title === set.title && foreignLang(s) === foreignLang(set));
      return twins.length === 1 ? twins[0].dir || '' : autoDir(set, folders);
    };
    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

    // ---------- Ordner auf der Platte (wie die Quizzes in MyKahoot) ----------
    // Chrome/Edge am Computer öffnen über die File System Access API einen
    // Ordner; dann liegen die Sets dort als .txt (Unterordner = Ordner), und
    // localStorage ist nur noch Zwischenspeicher — die Liste steht sofort,
    // auch bevor der Browser den Zugriff wieder freigegeben hat. Der
    // Ordner-Handle überlebt nur in IndexedDB, nicht in localStorage.
    const dirSupported = typeof window.showDirectoryPicker === 'function';
    const openDb = () => new Promise((resolve, reject) => {
      const req = indexedDB.open('myvoci', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    const dbRun = async (mode, act) => {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const req = act(db.transaction('kv', mode).objectStore('kv'));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };
    const loadDirHandle = () => dbRun('readonly', (kv) => kv.get('dir')).catch(() => undefined);
    const saveDirHandle = (h) => dbRun('readwrite', (kv) => (h ? kv.put(h, 'dir') : kv.delete('dir'))).catch(() => {});

    const isVociFile = (name) => /\.(txt|md)$/i.test(name) && !name.startsWith('.');
    // Liest den ganzen Ordner: Sets noch ohne id (die vergibt fromDisk),
    // Ordnerpfade wie im Store («Unité 3/Verben»).
    const readDir = async (root) => {
      const files = [], folders = [];
      // Erst den Baum ablaufen, dann alle Dateien auf einmal lesen: einzeln
      // abgewartet kostet jede Datei eine eigene Runde ins Dateisystem.
      // Promise.all erhält die Reihenfolge, auf die sich fromDisk verlässt.
      const walk = async (handle, dir) => {
        for await (const [name, entry] of handle.entries()) {
          if (name.startsWith('.')) continue;
          if (entry.kind === 'directory') {
            const path = dir ? `${dir}/${name}` : name;
            folders.push(path);
            await walk(entry, path);
          } else if (isVociFile(name)) files.push({ name, dir, entry });
        }
      };
      await walk(root, '');
      const read = await Promise.all(files.map(async ({ name, dir, entry }) => {
        const parsed = parseFile(await (await entry.getFile()).text(), name);
        // `file` merkt sich den echten Dateinamen — aber nur, wenn er vom
        // Titel abweicht (von Hand angelegt, «Fremd.txt» mit «# Von Hand»):
        // dann schreibt die App weiter dorthin, statt eine zweite anzulegen.
        // Heisst die Datei wie der Titel, bleibt `file` leer, damit ein
        // Umbenennen in der App die Datei mitnimmt statt Name und Titel
        // auseinanderlaufen zu lassen. `disk` heisst «lag schon einmal im
        // Ordner» — daran hängt, ob ein Set, das dort fehlt, im Finder
        // gelöscht wurde oder nur noch nie geschrieben werden konnte.
        return { ...parsed, dir, disk: true, ...(name === fileName(parsed) ? {} : { file: name }) };
      }));
      return { sets: read.filter((s) => s.words.length), folders };
    };

    const fileName = (set) => set.file || `${plainName(set.title)}.txt`;
    const setPath = (set) => `${set.dir ? safeDir(set.dir) + '/' : ''}${fileName(set)}`;
    const dirOf = async (root, path, create) => {
      let h = root;
      for (const part of path.split('/').filter(Boolean)) h = await h.getDirectoryHandle(part, { create });
      return h;
    };
    const splitPath = (path) => [parentDir(path), dirName(path)];
    const writeFile = async (root, path, text) => {
      const [dir, name] = splitPath(path);
      const fh = await (await dirOf(root, dir, true)).getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
    };
    const removeFile = async (root, path) => {
      const [dir, name] = splitPath(path);
      try { await (await dirOf(root, dir, false)).removeEntry(name); } catch {}
    };
    const removeEmptyDir = async (root, path) => {
      try {
        for await (const _ of (await dirOf(root, path, false)).keys()) return; // nicht leer → bleibt stehen
        const [dir, name] = splitPath(path);
        await (await dirOf(root, dir, false)).removeEntry(name);
      } catch {}
    };

    // Schreibt nur, was sich geändert hat: Diff über die id, verglichen werden
    // Pfad und Dateiinhalt. Gelöscht → Datei weg; umbenannt/verschoben → alte
    // Datei weg, neue hin; leer gewordene Ordner werden mitgeräumt.
    const mirrorDir = async (root, prev, next) => {
      const before = new Map(prev.sets.map((s) => [s.id, s]));
      const after = new Set(next.sets.map((s) => s.id));
      const prevFolders = allFolders(prev), nextFolders = allFolders(next);
      for (const f of nextFolders) if (!prevFolders.includes(f)) await dirOf(root, safeDir(f), true);
      // Ein Set pro Auftrag (alte Datei weg, dann die neue hin), die Aufträge
      // nebeneinander: beim Verbinden oder beim Verschieben eines Ordners
      // sind das sonst Dutzende Schreibvorgänge streng nacheinander.
      const jobs = [];
      for (const s of next.sets) {
        const old = before.get(s.id);
        if (old === s) continue; // unverändert — spart das Serialisieren
        const path = setPath(s), text = toFile(s);
        if (old && setPath(old) === path && toFile(old) === text) continue;
        jobs.push((async () => {
          if (old && setPath(old) !== path) await removeFile(root, setPath(old));
          await writeFile(root, path, text);
        })());
      }
      for (const s of prev.sets) if (!after.has(s.id)) jobs.push(removeFile(root, setPath(s)));
      await Promise.all(jobs);
      // Ordner erst danach und von innen nach aussen: ein Ordner ist nur leer,
      // wenn seine Dateien schon weg sind.
      const gone = prevFolders.filter((f) => !nextFolders.includes(f)).sort((a, b) => b.length - a.length);
      for (const f of gone) await removeEmptyDir(root, safeDir(f));
    };

    // Vom Ordner in den Store. Die id trägt den Lernstand, sie soll also am
    // richtigen Set kleben bleiben. `keepAll` gilt nur beim ausdrücklichen
    // Verbinden: dann bleibt auch mit, was schon einmal auf der Platte lag
    // (Ordnerwechsel). Sonst bleiben nur Sets ohne `disk`-Merkmal — was dort
    // fehlt und dort schon lag, wurde im Finder gelöscht.
    // Zurück kommt neben dem neuen Stand auch `onDisk`: der reine Inhalt des
    // Ordners, gegen den mirrorDir seine Differenz bildet.
    const fromDisk = (prev, disk, keepAll) => {
      const byPlace = new Map(prev.sets.map((s) => [setPlace(s), s]));
      const used = new Set();
      const take = (d, old) => {
        used.add(old.id);
        // Beim Verbinden darf die Datei die im Browser bearbeitete Fassung
        // nicht verschlucken: fehlende Wörter kommen hinten dazu, wie beim
        // Einlesen einer Sicherung. Beim Nachlesen gilt die Datei.
        return { ...d, id: old.id, ...(keepAll ? { words: mergeWords(d.words, old.words) } : {}) };
      };
      // Erst der sichere Treffer: gleicher Ordner, gleicher Titel.
      const first = disk.sets.map((d) => {
        const old = byPlace.get(setPlace(d));
        return old && !used.has(old.id) ? take(d, old) : { ...d, id: null };
      });
      // Dann verschoben oder umbenannt. Dafür kommen nur Sets in Frage, die
      // schon einmal im Ordner lagen (`disk`) und deren Titel auf beiden
      // Seiten genau einmal vorkommt: sonst erbte die Datei des einen Kindes
      // den Lernstand des gleichnamigen Sets des anderen, das nur im Browser
      // liegt — und verschwände damit aus der Liste.
      const free = new Map();
      for (const s of prev.sets) if (!used.has(s.id) && s.disk) free.set(s.title, free.has(s.title) ? null : s);
      const want = {};
      for (const d of first) if (!d.id) want[d.title] = (want[d.title] || 0) + 1;
      const sets = first.map((d) => {
        // `free` enthält nur unbenutzte Sets und jeder Titel wird höchstens
        // einmal beansprucht — ein zweiter Zugriff kann hier nicht auftreten.
        const old = d.id ? null : want[d.title] === 1 ? free.get(d.title) : null;
        return d.id ? d : old ? take(d, old) : { ...d, id: newId() };
      });
      // Was mirrorDir im Ordner vorfindet: die Dateien, mit den ids, die wir
      // eben vergeben haben. Bewusst nicht aus `sets` abgeleitet — dort
      // stecken beim Verbinden schon die ergänzten Wörter, und die soll
      // mirrorDir ja gerade noch schreiben.
      const onDisk = { sets: disk.sets.map((d, i) => ({ ...d, id: sets[i].id })).sort(byTitle), folders: disk.folders };
      const local = prev.sets.filter((s) => !used.has(s.id) && (keepAll || !s.disk));
      const next = {
        sets: [...sets, ...local].sort(byTitle),
        // Beim Nachlesen gilt der Ordner: Ordner mit Inhalt stehen ohnehin in
        // den `dir`-Feldern (allFolders), leere legt mirrorDir dort an.
        folders: [...new Set([...disk.folders, ...(keepAll ? prev.folders : [])])],
      };
      return { next, onDisk };
    };

    // ---------- Lernstand ----------
    // Pro Set und Wort: richtig/falsch-Zähler, Leitner-Fach 1–5, letzter Versuch,
    // ob der letzte Versuch sass. Bleibt im Browser, steckt nie im Link.
    const PROGRESS_KEY = 'myvoci_progress';
    const loadProgress = () => readLocal(PROGRESS_KEY, {}) || {};
    const wordKey = (w) => `${w.a}\u0001${w.b}`;
    // «Ergänzt, was fehlt»: vorhandene bleiben in ihrer Reihenfolge stehen,
    // neue kommen hinten dazu. Das Verbinden mit einem Ordner und das
    // Einlesen einer Sicherung teilen sich diese Regel.
    const mergeWords = (a, b) => {
      const has = new Set(a.map(wordKey));
      return [...a, ...b.filter((w) => !has.has(wordKey(w)))];
    };
    const BOX_DAYS = [0, 1, 3, 7, 14];
    const isDue = (rec, now = Date.now()) =>
      !rec || !rec.box || now - rec.last >= BOX_DAYS[Math.min(rec.box, 5) - 1] * 864e5;
    const isWrong = (rec) => !!rec && rec.lastOk === false;
    const applyResult = (rec, ok) => ({
      ok: (rec?.ok || 0) + (ok ? 1 : 0),
      bad: (rec?.bad || 0) + (ok ? 0 : 1),
      box: ok ? Math.min(5, (rec?.box || 0) + 1) : 1,
      last: Date.now(),
      lastOk: ok,
    });

    // ---------- Direktlinks: Set komprimiert im URL-Fragment ----------
    const b64urlEncode = (bytes) => {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const b64urlDecode = (str) =>
      Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

    const encodeSet = async (set) => {
      const json = new TextEncoder().encode(JSON.stringify([
        set.title, set.langs || 0, set.words.map((w) => {
          // Neue Felder hinten; was fehlt, fällt weg — alte Links bleiben gültig und kurz
          const row = [w.a, w.b, w.s && w.s.length ? w.s : 0, w.h || 0, w.ha || 0, w.hb || 0, w.all ? 1 : 0, w.f ? [w.f.r, w.f.c, w.f.t] : 0];
          while (row.length > 2 && !row[row.length - 1]) row.pop();
          return row;
        }),
      ]));
      if (window.CompressionStream) {
        const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        return '1.' + b64urlEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
      }
      return '0.' + b64urlEncode(json);
    };

    const decodeSet = async (data) => {
      const bytes = b64urlDecode(data.slice(2));
      const json = data.slice(0, 1) === '1'
        ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
        : new TextDecoder().decode(bytes);
      const [title, langs, words] = JSON.parse(json);
      return {
        title, ...(langs ? { langs } : {}),
        words: words.map(([a, b, s, h, ha, hb, all, f]) => cleanWord({ a, b, s: s || [], h, ha, hb, all, f: f && { r: f[0], c: f[1], t: f[2] } })),
      };
    };

    const demoById = (id) => DEMOS.find((d) => d.id === id);

    // ---------- Routing über das URL-Fragment ----------
    const withLang = (hash, lang = currentLang) => `${hash}${hash.endsWith('#') ? '' : '&'}l=${lang || currentLang}`;
    // Ein geteilter Übungs-Link trägt die Einstellungen als eigene Teile
    // (…&mode=write&dir=ab…); die Route ist der erste Teil, der weder Sprache
    // noch Option ist. `go=1` startet die Übung ohne Einstellungsseite.
    const OPT_KEYS = ['mode', 'forms', 'dir', 'sel', 'from', 'to', 'order', 'level', 'hints', 'copy', 'exam', 'penOnly', 'timer', 'go'];
    const isOptPart = (x) => OPT_KEYS.includes(x.split('=')[0]);
    const routePart = () => hashParts().find((x) => !x.startsWith('l=') && !isOptPart(x)) || '';
    const OPT_NUM = ['from', 'to', 'timer'], OPT_BOOL = ['forms', 'hints', 'copy', 'exam', 'penOnly', 'go'];
    const optsFromHash = () => {
      const out = {};
      for (const part of hashParts().filter(isOptPart)) {
        const [k, v = ''] = part.split('=');
        out[k] = OPT_NUM.includes(k) ? +v || 0 : OPT_BOOL.includes(k) ? v === '1' : v;
      }
      return out;
    };
    // `forms` steht immer drin, auch als 0 — sonst gälte beim Empfänger seine
    // eigene letzte Wahl, und eine Wörter-Übung (samt `go=1`) liefe dort als
    // Wortformen. Bei einem Set ohne Tabellen tut `forms=0` nichts.
    const optsToHash = (opts, go) => {
      const keep = ['mode', 'forms', 'dir', 'sel', 'order', 'level', 'hints', 'copy', 'exam', 'penOnly', 'timer', ...(opts.sel === 'range' ? ['from', 'to'] : [])];
      return keep.map((k) => `&${k}=${typeof opts[k] === 'boolean' ? (opts[k] ? 1 : 0) : opts[k]}`).join('') + (go ? '&go=1' : '');
    };
    const applyLang = (id) => {
      if (id === currentLang) return;
      currentLang = id;
      document.documentElement.lang = id;
      redrawLang(id);
    };
    const restoreLang = () => applyLang(loadLang());
    const changeLang = (id) => {
      writeLocal(LANG_KEY, id);
      applyLang(id);
      if (langFromHash()) {
        try { history.replaceState(null, '', location.pathname + location.search + withLang('#' + routePart())); } catch {}
      }
    };
    const toHash = (set) => withLang(demoById(set.id) ? '#demo=' + set.id : '#local=' + set.id, set.lang);
    const directLink = async (set) => {
      const base = location.origin + location.pathname;
      return demoById(set.id) ? base + toHash(set) : withLang(`${base}#v=${await encodeSet(set)}`, set.lang);
    };
    const safeDecode = (raw) => { try { return decodeURIComponent(raw); } catch { return raw; } };
    // Welche Präfixe eine Route sind, steht an einer Stelle: `getRoute` liest
    // daraus, und der Scanner prüft daran, ob ein fremder Code (jede Adresse
    // hat ein Fragment: `#section`) überhaupt für diese App gedacht ist.
    // Steht ein zweites Mal im Skript im <head> (Rand oben) — dort mitändern.
    const ROUTE_KEYS = ['v', 'demo', 'local', 'edit', 'new'];
    const isRoutePart = (x) => ROUTE_KEYS.includes(x.split('=')[0]);
    const getRoute = () => {
      const hash = routePart();
      if (hash.startsWith('v=')) return { type: 'data', data: hash.slice(2) };
      if (hash.startsWith('demo=')) return { type: 'demo', id: hash.slice(5) };
      if (hash.startsWith('local=')) return { type: 'local', id: hash.slice(6) };
      if (hash.startsWith('edit=')) return { type: 'edit', id: hash.slice(5) };
      if (hash.startsWith('new=')) return { type: 'new', dir: safeDecode(hash.slice(4)) };
      return null;
    };

    // Schlüssel aus einem Weitergabe-Link (`#k=`, s. keysLink) übernehmen —
    // beim Laden, bevor die App die Route liest, und sofort wieder aus der
    // Adresse streichen: sie sollen im Verlauf nicht stehen bleiben.
    const takeKeys = (part) => {
      try {
        const [app, hmac] = new TextDecoder().decode(b64urlDecode(part.slice(2))).split('\n');
        return !!(app && hmac) && writeLocal(MYSCRIPT_KEY, { app, hmac });
      } catch { return false; }
    };
    const takeKeysFromHash = () => {
      const part = hashParts().find((x) => x.startsWith('k='));
      if (!part) return;
      keysArrived = takeKeys(part);
      const rest = hashParts().filter((x) => x !== part);
      try { history.replaceState(null, '', location.pathname + location.search + (rest.length ? '#' + rest.join('&') : '')); } catch {}
    };
    takeKeysFromHash();

    const shuffleArray = (array) => {
      const out = [...array];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };

    // ---------- Automatische Korrektur ----------
    // Kein Modell, nur Regeln: normalisieren, Alternativen und Klammern
    // durchprobieren, dann abgestuft vergleichen. Zurück kommt
    // { status: 'right'|'almost'|'wrong', solution, note }.
    const ARTICLES = {
      de: ['der', 'die', 'das', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines', 'dem', 'den', 'des'],
      fr: ['le', 'la', 'les', "l'", 'un', 'une', 'des', 'du', 'de la', "de l'"],
      en: ['the', 'a', 'an', 'to'],
      it: ['il', 'lo', 'la', 'i', 'gli', 'le', "l'", 'un', 'una', 'uno', "un'"],
      es: ['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas'],
      pt: ['o', 'a', 'os', 'as', 'um', 'uma'],
    };
    const stripAccents = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    // Zeichengleich (gleiche Länge): darf auch dort laufen, wo hinterher noch
    // Positionen im Originaltext gebraucht werden — s. splitSentence.
    const straightQuotes = (s) => s.replace(/[’‘`´]/g, "'");
    const baseNorm = (s) => straightQuotes(s)
      .replace(/ß/g, 'ss').replace(/\s*'\s*/g, "'")
      .replace(/\s+/g, ' ').replace(/[.!?…]+$/, '').trim();
    const stripArticle = (s, lang) => {
      for (const art of ARTICLES[lang] || []) {
        if (s === art) continue;
        if (art.endsWith("'") ? s.startsWith(art) : s.startsWith(art + ' ')) return s.slice(art.length).trim();
      }
      return s;
    };
    // «aller / marcher» → zwei Lösungen; «(la) maison» → mit und ohne Klammerteil.
    // Jeder Punkt einer Liste zählt wie eine Alternative.
    const variants = (solution) => {
      const out = [];
      for (const alt of listItems(solution).flatMap((x) => x.split(/\s*\/\s*/))) {
        if (!alt.trim()) continue;
        let forms = [alt];
        while (forms.some((f) => /\([^()]*\)/.test(f))) {
          forms = forms.flatMap((f) => (/\([^()]*\)/.test(f)
            ? [f.replace(/\(([^()]*)\)/, '$1'), f.replace(/\s*\([^()]*\)\s*/, ' ')] : [f]));
        }
        for (const f of forms) { const v = baseNorm(f); if (v && !out.includes(v)) out.push(v); }
      }
      return out.length ? out : [baseNorm(solution)];
    };
    const levenshtein = (a, b) => {
      if (a === b) return 0;
      if (!a.length || !b.length) return Math.max(a.length, b.length);
      let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i];
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[b.length];
    };

    // `forms`: Formen abfragen (s. formSet) — dort ist ein Buchstabe die
    // Grammatik: «amat» statt «amant» ist die falsche Person, «dem Hund» statt
    // «des Hundes» der falsche Fall. Also weder Artikel- noch Tippfehler-Toleranz;
    // Gross/klein und Akzente folgen weiter der Stufe.
    const checkAnswer = (input, solution, { level = 'normal', lang, others = [], forms = false } = {}) => {
      const art = (x) => (forms ? x : stripArticle(x, lang));
      const inp = baseNorm(input || '');
      const vars = variants(solution);
      const wrong = () => {
        let best = vars[0], bestD = Infinity;
        for (const v of vars) {
          const d = levenshtein(inp.toLowerCase(), v.toLowerCase());
          if (d < bestD) { best = v; bestD = d; }
        }
        return { status: 'wrong', solution: best };
      };
      if (!inp) return wrong();
      for (const v of vars) if (inp === v) return { status: 'right', solution: v };
      for (const v of vars) if (inp.toLowerCase() === v.toLowerCase()) {
        return level === 'strict' ? { status: 'almost', solution: v, note: 'noteCase' } : { status: 'right', solution: v };
      }
      if (level === 'strict') return wrong();
      const lo = inp.toLowerCase();
      for (const v of vars) if (stripAccents(lo) === stripAccents(v.toLowerCase())) {
        return level === 'loose' ? { status: 'right', solution: v } : { status: 'almost', solution: v, note: 'noteAccent' };
      }
      if (level === 'loose') {
        for (const v of vars) {
          if (art(stripAccents(lo)) === art(stripAccents(v.toLowerCase()))) return { status: 'right', solution: v };
        }
      } else if (!forms) {
        for (const v of vars) {
          if (art(lo) === art(v.toLowerCase())) return { status: 'almost', solution: v, note: 'noteArticle' };
        }
      }
      // Ein Tippfehler bei Wörtern ab vier Zeichen: fast richtig. Wer aber
      // exakt ein ANDERES Wort desselben Sets tippt, hat sich nicht vertippt,
      // sondern verwechselt (vous/nous, kein/sein) — das darf nicht durchgehen.
      if (others.some((o) => variants(o).some((v) => v.toLowerCase() === lo))) return wrong();
      if (forms) return wrong();
      for (const v of vars) {
        const a = level === 'loose' ? art(stripAccents(lo)) : lo;
        const b = level === 'loose' ? art(stripAccents(v.toLowerCase())) : v.toLowerCase();
        if (b.length >= 4 && levenshtein(a, b) <= 1) return { status: 'almost', solution: v, note: 'noteTypo' };
      }
      return wrong();
    };

    // Liste ganz verlangt: jede Eingabe sucht sich ihren Punkt, die
    // Reihenfolge ist egal. Zurück kommt dasselbe wie bei checkAnswer, dazu
    // `rows` — pro Punkt die Eingabe, die darauf fiel, und ihr Ergebnis.
    const checkAll = (typed, solution, o) => {
      const items = listItems(solution);
      const rows = items.map((item) => ({ item, input: '', r: null }));
      // Erst die exakten Treffer, dann die Tippfehler: sonst schnappt sich
      // «apetere» den Punkt «petere», und das richtige «petere» geht leer aus.
      let rest = typed.map((x) => x.trim()).filter(Boolean);
      for (const want of ['right', 'almost']) {
        rest = rest.filter((inp) => {
          for (const row of rows) {
            if (row.r) continue;
            const r = checkAnswer(inp, row.item, o);
            if (r.status === want) { row.input = inp; row.r = r; return false; }
          }
          return true;
        });
      }
      // Was nichts traf, steht beim ähnlichsten offenen Punkt — als Fehler
      // sichtbar, verglichen mit dessen nächstliegender Alternative
      const gap = (inp, row) => Math.min(...variants(row.item).map((v) => levenshtein(baseNorm(inp).toLowerCase(), v.toLowerCase())));
      // Paarweise, das engste Paar zuerst — sonst nimmt «xyz» als erste
      // Eingabe einem Tippfehler weiter hinten seinen Punkt weg
      const pairs = rest.flatMap((inp, k) => rows.filter((row) => !row.r).map((row) => ({ inp, k, row, d: gap(inp, row) })))
        .sort((x, y) => x.d - y.d);
      const used = new Set(); // Stelle der Eingabe — zweimal dasselbe Wort sind zwei Eingaben
      for (const { inp, k, row } of pairs) {
        if (row.r || used.has(k)) continue;
        used.add(k);
        row.input = inp;
        row.r = { status: 'wrong', solution: checkAnswer(inp, row.item, o).solution };
      }
      for (const row of rows) if (!row.r) row.r = { status: 'wrong', solution: variants(row.item)[0] };
      const status = rows.every((x) => x.r.status === 'right') ? 'right'
        : rows.some((x) => x.r.status === 'wrong') ? 'wrong' : 'almost';
      const note = status === 'almost' ? (rows.find((x) => x.r.note) || { r: {} }).r.note : undefined;
      return { status, solution, rows, ...(note ? { note } : {}) };
    };

    // Zeichenweiser Vergleich (längste gemeinsame Teilfolge): was in der Eingabe
    // zu viel ist, wird rot durchgestrichen, was in der Lösung fehlt, grün.
    const charDiff = (a, b) => {
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i].toLowerCase() === b[j].toLowerCase() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
      const A = [], B = [];
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (a[i].toLowerCase() === b[j].toLowerCase()) { A.push([a[i], true]); B.push([b[j], true]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) A.push([a[i++], false]);
        else B.push([b[j++], false]);
      }
      while (i < n) A.push([a[i++], false]);
      while (j < m) B.push([b[j++], false]);
      return [A, B];
    };
    const DiffText = ({ parts, cls }) => (
      <span>{parts.map(([ch, same], i) => (same ? <span key={i}>{ch}</span> : <span key={i} className={cls}>{ch}</span>))}</span>
    );

    // Das Wort im Satz hervorheben (Wortstamm reicht: «marchons» zu «marcher»)
    // Gesucht wird der Wortstamm ohne Artikel und ohne typische Endung, am
    // Wortanfang; zurück kommt die Form im Satz («marchons»). Vollständige
    // Treffer gewinnen vor Stamm-Treffern («la maison» vor «mais…»).
    const stripAnyArticle = (s) => Object.keys(ARTICLES).reduce((acc, l) => stripArticle(acc, l), s);
    // Zerlegt einen Satz in {before, form, after}. Steht im Satz eine Markierung
    // «*vais*», gilt genau die (für Formen, die kein Stamm findet); sonst wird
    // gesucht. Ohne Treffer null — der Satz wird dann nur angezeigt.
    const splitSentence = (sentence, word) => {
      const star = sentence.match(/\*([^*]+)\*/);
      if (star) {
        const clean = sentence.replace(/\*/g, '');
        return { before: clean.slice(0, star.index), form: star[1], after: clean.slice(star.index + star[1].length) };
      }
      const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const forms = variants(word).map((v) => stripAnyArticle(v.toLowerCase())).filter((v) => v.length >= 2);
      const stems = forms.map((v) => v.replace(/(er|ir|re|en|e|s)$/i, '')).filter((v) => v.length >= 3);
      // Gesucht wird in einer Fassung mit geraden Apostrophen — genau wie das
      // Wort, das durch `variants` schon normalisiert ist. Der Ersatz ist
      // zeichengleich, die gefundenen Stellen passen also auf das Original.
      const hay = straightQuotes(sentence);
      for (const list of [forms, stems]) {
        if (!list.length) continue;
        // Kein Lookbehind: das Zeichen davor wird mitgelesen und wieder
        // abgezogen — Safari kennt `(?<!…)` erst ab 16.4 und wirft sonst beim
        // Bauen des Ausdrucks, mitten im Aufbau der Set-Seite.
        const m = hay.match(new RegExp(`(^|[^\\p{L}])(${list.map(esc).join('|')})[\\p{L}]*`, 'iu'));
        if (!m) continue;
        const at = m.index + m[1].length, form = m[0].slice(m[1].length);
        return { before: sentence.slice(0, at), form: sentence.substr(at, form.length), after: sentence.slice(at + form.length) };
      }
      return null;
    };
    const markWord = (sentence, word) => {
      const m = splitSentence(sentence, word);
      if (!m) return sentence.replace(/\*/g, '');
      return <>{m.before}<b>{m.form}</b>{m.after}</>;
    };
    // Lückentext: der erste Satz, in dem das Wort (Sprache B) vorkommt
    const gapFor = (word) => {
      for (const s of word.s || []) {
        const m = splitSentence(s, word.b);
        if (m) return m;
      }
      return null;
    };

    // ---------- Vorlesen ----------
    const canSpeak = (lang) => !!(window.speechSynthesis && TTS_LOCALE[lang]);
    const speak = (text, lang) => {
      if (!canSpeak(lang)) return;
      try {
        window.speechSynthesis.cancel();
        // Pro Listenpunkt die erste Alternative, ohne die Zeichen «1.» / «-»
        const said = listItems(text).map((x) => x.replace(/\s*\/.*$/, '')).join(', ');
        const u = new SpeechSynthesisUtterance(said.replace(/[()]/g, ''));
        u.lang = TTS_LOCALE[lang];
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch {}
    };

    // ---------- Spracherkennung (Modus Sprechen) ----------
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const canRecognize = (lang) => !!(SpeechRec && TTS_LOCALE[lang]);
    // Hört einmal zu und liefert die Alternativen (beste zuerst) — oder wirft
    // 'denied' / 'nothing'. Einmalig, kein Dauerlauschen.
    const recognizeOnce = (lang) => new Promise((resolve, reject) => {
      const rec = new SpeechRec();
      rec.lang = TTS_LOCALE[lang];
      rec.maxAlternatives = 5;
      rec.interimResults = false;
      let done = false;
      // Ein offener Mikrofon-Dialog oder ein hängender Dienst melden nichts —
      // nach zehn Sekunden brechen wir selber ab, sonst bliebe der Knopf grau.
      const timer = setTimeout(() => { try { rec.abort(); } catch {} }, 10000);
      const finish = (fn) => { if (done) return; done = true; clearTimeout(timer); fn(); };
      rec.onresult = (e) => finish(() => resolve([...e.results[0]].map((r) => r.transcript)));
      rec.onerror = (e) => finish(() => reject(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied' : 'nothing'));
      rec.onend = () => finish(() => reject('nothing'));
      try { rec.start(); } catch { finish(() => reject('nothing')); }
    });

    // ---------- Vollbild ----------
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const canFullscreen = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    const toggleFullscreen = () => {
      const el = document.documentElement;
      // Beides darf scheitern (kein Vollbild auf dem iPhone, keine Geste) —
      // auch als abgelehntes Promise, darum beide Fänge.
      try {
        const r = fsElement()
          ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
          : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (r && r.catch) r.catch(() => {});
      } catch {}
    };

    // ---------- Gemeinsame Bausteine ----------
    const SCREEN = 'min-h-screen'; // Hintergrund: `body` (var(--grund))
    const PAGE = `${SCREEN} p-4 sm:p-8 pt-14 sm:pt-20`; // Startseite mit Rand oben: der Titel beginnt darunter
    // Bausteine des Designsystems, Klassen im <head> (wie MyMemory)
    const BTN_PRIMARY = 'knopf knopf-1';
    const BTN_SECONDARY = 'knopf knopf-2';
    const BTN_NEUTRAL = 'knopf knopf-n';
    const CARD = 'kachel';
    const LABEL = 'kopf';
    const INPUT = 'feld';

    // Safari lässt `writeText` nur in derselben Aufgabe wie der Tap zu — nach
    // einem `await` (der Link wird ja erst komprimiert) lehnt es jedes Mal ab.
    // Der dokumentierte Ausweg ist `ClipboardItem` mit einem Versprechen als
    // Wert: der Zugriff wird sofort beantragt, der Inhalt kommt nach.
    const copyLater = async (makeText) => {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        try {
          await navigator.clipboard.write([new ClipboardItem({
            'text/plain': Promise.resolve(makeText()).then((s) => new Blob([s], { type: 'text/plain' })),
          })]);
          return true;
        } catch {}
      }
      try { await navigator.clipboard.writeText(await makeText()); return true; } catch { return false; }
    };

    // `max-h`/`overflow` für alle: die Anleitung ist länger als ein iPhone hoch,
    // und auch der Scanner passte auf kleinen Schirmen knapp nicht.
    const Modal = ({ children, onClose, wide }) => (
      <div data-modal className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ background: 'var(--schleier)' }} onClick={onClose}>
        <div className={`kachel p-6 sm:p-8 ${wide ? 'max-w-2xl' : 'max-w-md'} w-full max-h-[85vh] overflow-y-auto schatten`} onClick={(e) => e.stopPropagation()}>
          {children}
        </div>
      </div>
    );

    const AskModal = ({ dialog, onClose }) => {
      const [value, setValue] = useState(dialog.preset || '');
      const isPrompt = dialog.kind === 'prompt';
      const submit = () => {
        if (isPrompt) { if (!value.trim()) return; dialog.onOk(value.trim()); }
        else dialog.onYes();
        onClose();
      };
      return (
        <Modal onClose={onClose}>
          <p className="text-text mb-4">{isPrompt ? dialog.label : dialog.text}</p>
          {isPrompt && (
            <input
              autoFocus type="text" value={value}
              onChange={(e) => setValue(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
              className={`w-full mb-4 ${INPUT}`}
            />
          )}
          <div className="flex gap-3">
            <button onClick={onClose} className={`flex-1 px-4 py-2 ${BTN_NEUTRAL}`}>{t('cancel')}</button>
            <button onClick={submit} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>{dialog.ok || 'OK'}</button>
          </div>
        </Modal>
      );
    };

    // Symbolknopf (DESIGN.md): quadratisch, ruhig bis zum Darüberfahren;
    // deckend (`auf-rand`), weil er oben auf dem Rand stehen kann
    const IconButton = ({ onClick, title, hover = '', extra = '', children }) => (
      <button onClick={onClick} title={title} aria-label={title}
        className={`symbol auf-rand ${hover} ${extra}`}>
        {children}
      </button>
    );

    // Schlanke Symbolknöpfe der Listenzeilen (wie .row-tool in MyKahoot):
    // transparent, nur Hover getönt — eine Zeile bleibt eine Zeile, keine
    // Reihe weisser Kacheln pro Set. Fängt den Klick selbst ab: die ganze
    // Zeile öffnet das Set bzw. klappt den Ordner.
    const RowTool = ({ onClick, title, hover = '', extra = '', children }) => (
      <button onClick={(e) => { e.stopPropagation(); onClick(e); }} title={title} aria-label={title}
        className={`symbol ${hover} ${extra}`}>
        {children}
      </button>
    );

    const Icon = ({ children, size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
    );
    const LinkIcon = () => (
      <Icon>
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </Icon>
    );
    const QrIcon = () => (
      <Icon>
        <rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14.5h3.5V18H14z" /><path d="M18.5 18.5H21V21h-2.5z" />
      </Icon>
    );
    const PenIcon = () => <Icon><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>;
    const EraserIcon = () => (
      <Icon><path d="m7 21-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></Icon>
    );
    // Sucher-Rahmen, nicht Kamera: der Knopf nimmt einen Code auf (gescannt
    // oder eingefügt) — eine Kamera verspräche ein Foto und liesse das
    // Einfügen aussen vor. `QrIcon` bleibt fürs Zeigen eines Codes.
    const ScanIcon = () => (
      <Icon>
        <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9" /><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9" />
        <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15" /><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" />
        <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
      </Icon>
    );
    const HelpIcon = () => (
      <Icon><circle cx="12" cy="12" r="9" /><path d="M9.6 9.4a2.5 2.5 0 1 1 2.9 2.9v1.2" /><path d="M12.5 16.6h.01" /></Icon>
    );
    const ChevronIcon = () => <Icon><path d="M9 6l6 6-6 6" /></Icon>;
    const SettingsIcon = () => (
      <Icon><path d="M4 8h10M18 8h2M4 16h4M12 16h8" /><circle cx="16" cy="8" r="2" /><circle cx="10" cy="16" r="2" /></Icon>
    );
    const InboxIcon = () => (
      <Icon><path d="M12 3v9" /><path d="M8 8.5 12 12.5l4-4" /><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" /></Icon>
    );
    const DownloadIcon = () => <Icon><path d="M12 3v12" /><path d="M7.5 10.5 12 15l4.5-4.5" /><path d="M4 20h16" /></Icon>;
    const PlusIcon = () => <Icon><path d="M12 5v14" /><path d="M5 12h14" /></Icon>;
    const FolderIcon = () => <Icon><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></Icon>;
    const TrashIcon = () => (

    );
    const SpeakerIcon = () => (
      <Icon><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16 9a4 4 0 0 1 0 6" /><path d="M18.5 6.5a8 8 0 0 1 0 11" /></Icon>
    );
    const MicIcon = () => (
      <Icon><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v3" /><path d="M8 21h8" /></Icon>
    );
    const ExpandIcon = () => (
      <Icon><path d="M4 9V4h5" /><path d="M20 9V4h-5" /><path d="M4 15v5h5" /><path d="M20 15v5h-5" /></Icon>
    );

    const QrModal = ({ title, hint, url, onClose, onCopy }) => {
      const svg = useMemo(() => {
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
        } catch { return null; }
      }, [url]);
      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4 text-text">{title}</h2>
          {hint && <p className="text-sm text-text-2 text-center mb-4">{hint}</p>}
          {svg ? (
            <div className="flex justify-center mb-4 [&>svg]:w-56 [&>svg]:h-56" dangerouslySetInnerHTML={{ __html: svg }} />
          ) : <div className="text-center text-rot mb-4">{t('qrTooBig')}</div>}
          <div className="text-xs text-text-3 break-all max-h-16 overflow-y-auto mb-4">{url}</div>
          <div className="flex gap-2">
            <button onClick={onCopy} className={`flex-1 ${BTN_PRIMARY} px-4 py-2`}>{t('copyLinkBtn')}</button>
            <button onClick={onClose} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('close')}</button>
          </div>
        </Modal>
      );
    };

    // ---------- QR-Code in der App scannen ----------
    // Ein mit der Kamera-App gescannter Code öffnet auf dem iPad immer Safari.
    // Die Home-Screen-Webapp hat aber einen eigenen Speicher und bekäme so
    // weder Set noch Schlüssel. Darum liest die App den Code selbst: Kamera
    // per getUserMedia, Bild für Bild durch jsQR (bei Bedarf nachgeladen).
    const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    const scanSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    // Was ein gescannter Code für die App bedeutet: nur das Fragment zählt,
    // die Adresse davor darf eine andere Fassung der App sein (localhost,
    // Pages). Zurück kommt der Schlüsselteil und die Route mit ihren Optionen.
    const scanned = (text) => {
      const i = text.indexOf('#');
      if (i < 0) return null;
      const parts = hashParts(text.slice(i));
      const keyPart = parts.find((x) => x.startsWith('k='));
      const rest = parts.filter((x) => x !== keyPart);
      // Nur eine Route, die `getRoute` auch kennt — sonst schluckte der
      // Scanner jeden Anker-Link und täte danach still gar nichts.
      const route = rest.some(isRoutePart);
      if (!keyPart && !route) return null;
      return { keyPart, hash: route ? rest.join('&') : '' };
    };
    const Scanner = ({ onClose, onCode }) => {
      const videoRef = useRef(null);
      const [error, setError] = useState(null);
      const [pasted, setPasted] = useState(''); // ohne Kamera: Link von Hand einfügen
      const openPasted = () => { if (pasted.trim()) onCode(pasted.trim()); };
      // Fehlt die Kamera ganz, sagt das dasselbe wie ein gescheiterter Zugriff
      const note = error || (!scanSupported && t('scanNoCam'));
      useEffect(() => {
        if (!scanSupported) return;
        let stream = null, stop = false, timer = 0;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const stopCam = () => stream && stream.getTracks().forEach((track) => track.stop());
        (async () => {
          let jsQR;
          try { jsQR = await loadScript(JSQR_URL, () => window.jsQR); }
          catch { setError(t('scanNoLib')); return; }
          // Die Bibliothek ist 257 KB; wer in der Zeit schliesst, soll nicht
          // hinterher noch nach der Kamera gefragt werden.
          if (stop) return;
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
          catch { setError(t('scanNoCam')); return; }
          if (stop) { stopCam(); return; }
          const video = videoRef.current;
          video.srcObject = stream;
          try { await video.play(); } catch {}
          // Auf 640 px verkleinert reicht für einen QR-Code und schont das iPad
          const tick = () => {
            if (stop) return;
            if (video.readyState >= 2 && video.videoWidth) {
              // Zuweisen an `width` verwirft den Bildspeicher — nur bei
              // echter Änderung, sonst siebenmal pro Sekunde umsonst.
              const k = Math.min(1, 640 / video.videoWidth);
              const w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
              if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
              ctx.drawImage(video, 0, 0, w, h);
              const img = ctx.getImageData(0, 0, w, h);
              const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (code && code.data) { stop = true; stopCam(); onCode(code.data); return; }
            }
            timer = setTimeout(tick, 150);
          };
          tick();
        })();
        return () => { stop = true; clearTimeout(timer); stopCam(); };
      }, []);
      return (
        <Modal onClose={onClose}>
          <h2 className="text-xl font-bold text-center mb-4 text-text">{t('scan')}</h2>
          <p className="text-sm text-text-2 text-center mb-4">{t('scanHint')}</p>
          {scanSupported && (
            <div className="rounded-lg overflow-hidden bg-black aspect-square mb-4">
              <video ref={videoRef} playsInline muted autoPlay className="w-full h-full object-cover" />
            </div>
          )}
          {note && <p className="text-sm text-orange text-center mb-4">{note}</p>}
          <p className="text-sm text-text-2 mb-2">{t('scanPaste')}</p>
          <div className="flex gap-2 mb-4">
            <input type="text" value={pasted} placeholder={t('scanPastePh')} autoCapitalize="none" autoCorrect="off" spellCheck={false}
              onChange={(e) => setPasted(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') openPasted(); }}
              className={`flex-1 min-w-0 ${INPUT}`} />
            <button onClick={openPasted} disabled={!pasted.trim()} className={`px-4 py-2 ${BTN_PRIMARY}`}>{t('scanOpen')}</button>
          </div>
          <button onClick={onClose} className={`w-full px-4 py-2 ${BTN_NEUTRAL}`}>{t('close')}</button>
        </Modal>
      );
    };

    // ---------- Anleitung ----------
    // Die langen Erklärtexte standen verstreut: Handschrift und Ordner in den
    // Einstellungen, «Üben auf dem iPad» als Kasten zuunterst. Hier stehen sie
    // zusammen, hinter dem ?-Knopf; in den Einstellungen bleiben die
    // Bedienelemente und eine Zeile mit Verweis hierher.
    // `only` zeigt einen einzelnen Abschnitt: die Schlüsselfelder stehen auf
    // jeder Seite, von der aus geübt wird (auch nach einem geteilten Link),
    // die Übersicht mit dem ?-Knopf sieht dort aber niemand.
    const HELP_SECTIONS = ['ipad', 'ink', 'dir', 'names', 'forms', 'move', 'scan'];
    const HELP_TITLE = { ipad: 'ipadTitle', ink: 'helpInkTitle', dir: 'dirTitle', names: 'helpNamesTitle', forms: 'helpFormsTitle', move: 'helpMoveTitle', scan: 'scan' };
    const HELP_STEPS = { ipad: 'ipadSteps', ink: 'helpInkSteps', dir: 'helpDirSteps', names: 'helpNamesSteps', forms: 'helpFormsSteps', move: 'helpMoveSteps', scan: 'helpScanSteps' };
    const Help = ({ only, onClose }) => (
      <Modal wide onClose={onClose}>
        <h2 className="text-xl font-bold text-text mb-4">{only ? t(HELP_TITLE[only]) : t('helpTitle')}</h2>
        {(only ? [only] : HELP_SECTIONS).map((id) => (
          <div key={id} className="mb-6">
            {!only && <h3 className="font-semibold text-text mb-2">{t(HELP_TITLE[id])}</h3>}
            <ol className="list-decimal list-outside pl-5 text-sm text-text-2 space-y-2">{t(HELP_STEPS[id])}</ol>
          </div>
        ))}
        <button onClick={onClose} className={`w-full px-4 py-2 ${BTN_NEUTRAL}`}>{t('close')}</button>
      </Modal>
    );
    // Ohne Anmeldung als «dauerhaft» darf iOS die Daten einer Home-Bildschirm-
    // App wegräumen (Speicher knapp, länger nicht benutzt) — die Sets waren
    // dann «immer mal wieder» weg. Angefragt wird nur in der installierten
    // App: Firefox am Computer fragte sonst mit einem Fenster nach, und dort
    // liegen die Sets ohnehin im Ordner. Sonst nur nachsehen, für die Anzeige.
    const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    let persistAsked = null; // eine Anfrage pro Laden, App und Einstellungen teilen sie
    const persistStorage = () => (persistAsked = persistAsked || (async () => {
      try {
        if (!navigator.storage || !navigator.storage.persisted) return null;
        if (await navigator.storage.persisted()) return true;
        return standalone() && navigator.storage.persist ? await navigator.storage.persist() : false;
      } catch { return null; }
    })());
    // Mit verbundenem Ordner liegen die Sets als Dateien dort, im Browser nur
    // der Lernstand — die Zeile sagt dann das (s. storedHintDir).
    const StorageState = ({ count, folder }) => {
      const [persisted, setPersisted] = useState(null);
      useEffect(() => { persistStorage().then(setPersisted); }, []);
      const risk = persisted === true ? ` · ${t('storageKept')}` : persisted === false ? ` · ${t(folder ? 'storageVolatileDir' : 'storageVolatile')}` : '';
      return <p className="text-sm text-text-2 mb-3">{folder ? t('storageHereDir', folder) : t('storageHere', standalone(), count)}{risk}</p>;
    };

    // Verweis von einem Einstellungs-Kasten in den passenden Abschnitt
    const HelpLink = ({ onClick }) => (
      <button onClick={onClick} className="underline font-semibold hover:text-text">{t('guide')} →</button>
    );

    // ---------- Einstellungen (My-Designsystem) ----------
    // Was zur Wahl steht; gespeichert und angewendet wird im <head>
    // (`setLook`/`setModus`), damit beim Laden nichts aufblitzt.
    const SCHEMES = [
      { id: 'fox', name: 'Fantastic Mr. Fox' },
      { id: 'budapest', name: 'Grand Budapest Hotel' },
      { id: 'moonrise', name: 'Moonrise Kingdom' },
      { id: 'zissou', name: 'The Life Aquatic' },
      { id: 'isle', name: 'Isle of Dogs' },
    ];
    const MODI = ['system', 'hell', 'dunkel'];

    // Kästchen oben rechts (DESIGN.md «Einstellungen ohne Leiste», wie MyMemory):
    // ab 1360 px sitzen Knopf und Kästchen fest am rechten Fensterrand neben der
    // Spalte, die dafür schmaler wird (COLUMN: höchstens Fenster − 2 × 22.5rem,
    // damit sie mittig bleibt — bei 1360 px also 640 px, darunter wäre die
    // Übungskarte zu eng). Sonst bleibt der Knopf in der Kopfzeile und das
    // Kästchen klappt über den Inhalt. Nie schiebt es die Spalte nach unten.
    // Zu per Knopf, Klick daneben oder Esc. Die Klassen stehen ausgeschrieben
    // da, sonst erzeugt Tailwind (CDN) sie nicht.
    const SETTINGS_DOCK = 'min-[1360px]:fixed min-[1360px]:top-3 min-[1360px]:right-3.5 z-30';
    const COLUMN = 'max-w-2xl min-[1360px]:max-w-[min(42rem,calc(100vw-45rem))] mx-auto';

    // `extra`: was die Seite zusätzlich einstellen lässt (Schlüssel, Ordner …).
    // Gibt Knopf samt Kästchen als einen Knoten zurück.
    const useSettings = (extra) => {
      const [open, setOpen] = useState(false);
      const box = useRef(null);
      useEffect(() => {
        if (!open) return;
        // Ein Fenster (Anleitung, QR-Code) aus dem Kästchen heraus zählt als
        // «drinnen» — auch das der Seite, das nicht im Kästchen hängt (Anleitung
        // aus «Ordner»/«Sicherung»), sonst klappt das Kästchen dahinter einfach zu
        const away = (e) => { if (!box.current?.contains(e.target) && !e.target.closest('[data-modal]')) setOpen(false); };
        const esc = (e) => { if (e.key === 'Escape' && !document.querySelector('[data-modal]')) setOpen(false); };
        document.addEventListener('pointerdown', away);
        document.addEventListener('keydown', esc);
        return () => { document.removeEventListener('pointerdown', away); document.removeEventListener('keydown', esc); };
      }, [open]);
      const [look, setLook] = useState(window.myLook);
      const [modus, setModus] = useState(window.myModus);
      const pickLook = (next) => { setLook(next); window.setLook(next); };
      const pickModus = (next) => { setModus(next); window.setModus(next); };
      const toggle = (items, active, pick) => (
        <div className="umschalter">
          {items.map(([id, label]) => (
            <button key={id} onClick={() => pick(id)} aria-pressed={id === active}>{label}</button>
          ))}
        </div>
      );
      // Ein Tupfer zeigt seine Farbe über `--tupfer`: der Ton liest das Schema
      // am <html>, der Tupfer «Akzent des Schemas» trägt dessen data-schema.
      const swatch = (key, title, color, active, onClick, schema) => (
        <button key={key} title={title} aria-label={title} aria-pressed={active} onClick={onClick}
          className="farbtupfer" data-schema={schema} style={{ '--tupfer': color }} />
      );
      const scheme = SCHEMES.find((x) => x.id === look.schema) || SCHEMES[2];
      const button = (
        <IconButton onClick={() => setOpen((v) => !v)} title={t('settings')}><SettingsIcon /></IconButton>
      );
      const panel = open && (
        <div className={`${CARD} absolute right-0 top-full mt-2 z-30 w-80 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-6rem)] overflow-y-auto p-5 space-y-5 text-left schatten`}>
          <div>
            <div className={`${LABEL} mb-2`}>{t('language')}</div>
            {toggle(LANGS.map((l) => [l.id, l.name]), currentLang, changeLang)}
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('theme')}</div>
            {toggle(MODI.map((m) => [m, t('modi')[m]]), modus, pickModus)}
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('scheme')}</div>
            <div className="flex flex-wrap gap-2">
              {SCHEMES.map((x) => (
                <button key={x.id} aria-pressed={x.id === look.schema}
                  onClick={() => pickLook({ schema: x.id, ton: window.DEFAULT_LOOK.schema === x.id ? window.DEFAULT_LOOK.ton : null })}
                  className={`flex items-center gap-2 ${x.id === look.schema ? BTN_SECONDARY : BTN_NEUTRAL} px-3 py-1.5 text-sm`}>
                  <span className="punkt" data-schema={x.id} style={{ background: 'var(--akzent)' }} />
                  {x.name}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className={`${LABEL} mb-2`}>{t('tone')}</div>
            <div className="flex flex-wrap items-center gap-2.5">
              {swatch('0', t('toneDefault'), 'var(--akzent)', !look.ton, () => pickLook({ ...look, ton: null }), look.schema)}
              <span className="w-px h-5 bg-linie" />
              {t('tones')[scheme.id].map((name, i) => swatch(i + 1, name, `var(--ton-${i + 1})`, look.ton === i + 1,
                () => pickLook({ ...look, ton: i + 1 })))}
            </div>
          </div>
          {extra}
        </div>
      );
      return <div ref={box} className={`relative shrink-0 ${SETTINGS_DOCK}`}>{button}{panel}</div>;
    };

    // Kurzmeldung unten am Rand. Zwei Seiten brauchen sie (Übersicht und
    // Set-Seite) — eine Stelle bestimmt Dauer und Aussehen.
    const useToast = () => {
      const [toast, setToast] = useState(null);
      const timer = useRef(0);
      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(timer.current); // sonst räumt der Timer der ersten Meldung die zweite ab
        timer.current = setTimeout(() => setToast(null), 2500);
      };
      useEffect(() => () => clearTimeout(timer.current), []);
      const node = toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-text text-grund px-6 py-3 rounded-lg schatten z-50">{toast}</div>
      );
      return [showToast, node];
    };

    // Die zwei MyScript-Schlüssel. Stehen in den Einstellungen jeder Seite,
    // von der aus geübt wird — der Hinweis unter der Moduswahl zeigt dorthin,
    // und wer über einen geteilten Link kommt, sieht die Übersicht nie.
    // Geschrieben wird beim Verlassen des Feldes, nicht bei jedem Zeichen.
    const MyScriptKeys = ({ onSaved }) => {
      const [keys, setKeys] = useState(() => readLocal(MYSCRIPT_KEY, null) || { app: '', hmac: '' });
      const [qr, setQr] = useState(false);
      const [help, setHelp] = useState(false);
      const [showToast, toastNode] = useToast();
      const filled = !!(keys.app.trim() && keys.hmac.trim());
      const link = filled ? keysLink({ app: keys.app.trim(), hmac: keys.hmac.trim() }) : '';
      const copy = async () => showToast(t((await copyLater(() => link)) ? 'linkCopied' : 'copyFailed'));
      const field = (part, label) => (
        <label className="block">
          <span className={LABEL}>{label}</span>
          <input type="text" value={keys[part]} autoCapitalize="none" autoCorrect="off" spellCheck={false}
            onChange={(e) => setKeys({ ...keys, [part]: e.target.value })}
            onBlur={() => { writeLocal(MYSCRIPT_KEY, { app: keys.app.trim(), hmac: keys.hmac.trim() }); onSaved && onSaved(); }}
            className={`w-full mt-1 ${INPUT}`} />
        </label>
      );
      return (
        <div>
          <div className={`${LABEL} mb-2`}>{t('myscriptTitle')}</div>
          <p className="text-sm text-text-2 mb-3">{t('myscriptShort')} <HelpLink onClick={() => setHelp(true)} /></p>
          <div className="grid sm:grid-cols-2 gap-3">
            {field('app', t('myscriptApp'))}
            {field('hmac', t('myscriptHmac'))}
          </div>
          {filled && (
            <div className="flex flex-wrap items-center gap-3 mt-3">
              <p className="text-sm text-akzent-text">{t('myscriptOn')}</p>
              <button onClick={() => setQr(true)} className={`px-4 py-2 ${BTN_NEUTRAL}`}>{t('myscriptShare')}</button>
            </div>
          )}
          {qr && <QrModal title={t('myscriptShareTitle')} hint={t('myscriptShareHint')} url={link} onClose={() => setQr(false)} onCopy={copy} />}
          {help && <Help only="ink" onClose={() => setHelp(false)} />}
          {toastNode}
        </div>
      );
    };

    // Sichtbarer Hinweis statt stiller Datenverlust (s. writeLocal).
    const StorageWarning = () => storageBroken && (
      <div className="mb-6 rounded-lg border-2 border-orange-linie bg-orange-weich px-4 py-3 text-sm text-orange">{t('storageBroken')}</div>
    );

    const Collapsible = ({ id, title, open, onToggle, children }) => (
      <div id={id} className={`${CARD} mb-6 scroll-mt-4`}>
